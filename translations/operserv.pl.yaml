  unknown_command:  "\x0307✗ Nieznana komenda\x03\x0F \x02\x0303%command%\x03\x0F. Użyj \x0303/msg %bot% HELP\x03\x0F."
  ircop_header: "\x02 ■ Dostępne komendy dla operatorów IRC:\x02"

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <nick> <powód>"
  short:            "Wymuś rozłączenie użytkownika z sieci."
  help:             "Rozłącza użytkownika z sieci IRC.\nIRCops i użytkownicy Root nie mogą być zabici.\nTa komenda wymaga uprawnienia operserv.kill."
  example:          "/msg %bot% KILL ZlyUzytkownik Zalewanie kanałów"
  user_not_online:  "\x0304✗\x03 Nick \x02%nickname%\x02 nie jest połączony."
  protected_root:   "\x0304✗\x03 Nie można zabić użytkownika Root \x02%nickname%\x02."
  protected_ircop:  "\x0304✗\x03 Nie można zabić operatora IRC \x02%nickname%\x02."
  done:             "\x0303✓\x03 Użytkownik \x02%nickname%\x02 został zabity (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST|CLEAR} [maska] [wygaśnięcie] [powód]"
  short:            "Zarządzaj globalnymi G-line'ami w sieci."
  help:             "Zarządzaj sieciowymi G-line'ami (globalne bany).\nADD dodaje nowy G-line z maską, wygaśnięciem i powodem.\nDEL usuwa G-line według maski lub numeru wpisu.\nLIST pokazuje wszystkie G-line'y, opcjonalnie filtrowane po masce.\nCLEAR — Usuwa naraz wszystkie aktywne G-Lines, z usług i z IRCd.\n\nFormat wygaśnięcia: 0=stałe, lub użyj przyrostka d, h, m (np., 7d, 12h, 30m).\nGLINE'y pasujące do użytkowników Root lub IRCop są odrzucane.\nTa komenda wymaga uprawnienia operserv.gline."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Masowa reklama"
  unknown_sub:      "\x0304✗\x03 Nieznana podkomenda \x02%sub%\x02. Użyj ADD, DEL, LIST lub CLEAR."
  invalid_mask:     "\x0304✗\x03 Nieprawidłowy format maski. Musi być w formacie user@host (np., *@192.168.*)."
  global_mask:      "\x0304✗\x03 Maska G-line \x02%mask%\x02 jest zbyt szeroka. Maski globalne nie są dozwolone."
  dangerous_mask:   "\x0304✗\x03 Maska G-line \x02%mask%\x02 jest zbyt szeroka. Część hosta potrzebuje co najmniej 4 znaków alfanumerycznych."
  protected_user:   "\x0304✗\x03 Nie można nadać G-line chronionemu użytkownikowi \x02%nickname%\x02."
  invalid_expiry:   "\x0304✗\x03 Nieprawidłowy format wygaśnięcia. Użyj 0 dla stałego, lub wartości jak 7d, 12h, 30m."
  already_exists:   "\x0304✗\x03 G-line dla \x02%mask%\x02 już istnieje."
  max_entries:      "\x0304✗\x03 Osiągnięto maksymalną liczbę G-line'ów (%max%)."
  not_found:        "\x0304✗\x03 G-line \x02%mask%\x02 nie znaleziony."
  user_not_found:   "\x0304✗\x03 Nick \x02%nickname%\x02 nie jest online."
  permanent:        "stały"

  add:
    syntax:         "GLINE ADD <maska> <wygaśnięcie> <powód>"
    short:          "Dodaj sieciowy G-line."
    help:           "Dodaje sieciowy G-line (globalny ban).\nMaska musi być w formacie user@host.\nWygaśnięcie: 0=stałe, lub użyj przyrostka d, h, m (np., 7d, 12h, 30m).\nGLINE'y pasujące do użytkowników Root lub IRCop są odrzucane.\nTa komenda wymaga uprawnienia operserv.gline."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Masowa reklama"
    done:           "\x0303✓\x03 G-line dodany: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <maska|numer>"
    short:          "Usuń G-line."
    help:           "Usuwa G-line z listy.\nMożesz podać maskę lub numer wpisu z LIST.\nTa komenda wymaga uprawnienia operserv.gline."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 G-line \x02%mask%\x02 usunięty."

  list:
    syntax:         "GLINE LIST [maska]"
    short:          "Lista wszystkich G-line'ów."
    help:           "Wyświetla wszystkie G-line'y. Opcjonalnie filtruj według wzorca maski.\nTa komenda wymaga uprawnienia operserv.gline."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-line'y (%count%) \x0307---\x03"
    empty:          "Brak G-line'ów."
    no_reason:      "Brak powodu"
    never_expires:  "Stały"
    unknown_creator: "nieznany"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, wygasa: %expiration%)"
    ircd_header:    "\x0307---\x03 \x02G-line'y IRCd: ataki na hasła (%count%)\x02 \x0307---\x03"

  clear:
    syntax:         "GLINE CLEAR"
    short:          "Usuwa wszystkie G-Lines."
    help:           "Usuwa naraz wszystkie aktywne G-Lines, z usług i z IRCd."
    example:        "/msg %bot% GLINE CLEAR"
    done:           "\x0303✓\x03 Usunięto G-Lines: \x02%count%\x02."

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [kraj] [powód]"
  short:            "Zarządzaj listą zablokowanych krajów."
  help:             "Zarządzaj krajami zablokowanymi przy bramce sieciowej.\nDemon IRC ustala kraj każdego podłączającego się klienta, więc zablokowany kraj jest odrzucany już w momencie połączenia.\nADD rejestruje kod kraju wraz z powodem.\nDEL usuwa kraj z listy.\nLIST pokazuje zablokowane kraje z powodem i datą rejestracji.\nTa komenda wymaga uprawnienia operserv.geoip."
  example:          "/msg %bot% GEOIP ADD ES Niewolno w tej sieci"
  unknown_sub:      "\x0304✗\x03 Nieznana podkomenda \x02%sub%\x02. Użyj ADD, DEL lub LIST."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 nie jest prawidłowym kodem kraju ISO 3166-1 alpha-2."
  already_exists:   "\x0304✗\x03 Kraj \x02%country%\x03 jest już zablokowany."
  not_found:        "\x0304✗\x03 Kraj \x02%country%\x03 nie jest zablokowany."
  default_reason:   "Kraj zablokowany przez politykę sieci"

  add:
    syntax:         "GEOIP ADD <kraj> [powód]"
    short:          "Zablokuj kraj przy bramce sieciowej."
    help:           "Blokuje wszystkich klientów łączących się z podanego kraju.\nKod kraju musi być kodem ISO 3166-1 alpha-2.\nPowód jest pokazywany odrzucanym klientom i może zostać pominięty.\nTa komenda wymaga uprawnienia operserv.geoip."
    example:        "/msg %bot% GEOIP ADD ES Niewolno w tej sieci"
    done:           "\x0303✓\x03 Kraj \x02%country%\x03 zablokowany - %reason%"

  del:
    syntax:         "GEOIP DEL <kraj>"
    short:          "Odblokuj kraj."
    help:           "Usuwa kraj z listy zablokowanych krajów.\nTa komenda wymaga uprawnienia operserv.geoip."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 Kraj \x02%country%\x03 odblokowany."

  list:
    syntax:         "GEOIP LIST"
    short:          "Pokaż zablokowane kraje."
    help:           "Pokazuje wszystkie zablokowane kraje z powodem i datą rejestracji.\nTa komenda wymaga uprawnienia operserv.geoip."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Zablokowane kraje (%count%)\x02 \x0307---\x03"
    empty:          "Nie ma zablokowanych krajów."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, zarejestrowano: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <linia>"
  short:            "Wyślij surową linię protokołu do IRCd."
  help:             "Wysyła podaną linię bezpośrednio do gniazda uplink IRCd.\nUżywaj z najwyższą ostrożnością. Nieprawidłowe linie protokołu mogą uszkodzić sieć.\nTa komenda wymaga uprawnienia operserv.raw."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Musisz podać niepustą linię do wysłania."
  too_long:         "\x0304✗\x03 Linia jest za długa. Maksymalnie 510 znaków."
  not_connected:    "\x0304✗\x03 Brak połączenia z IRCd."
  done:             "\x0303✓\x03 Surowa linia wysłana."
  protocol:
    syntax: "\x0304✗\x03 Aktywny protokół odrzucił składnię komendy RAW."
    done: "\x0303✓\x03 Wykonano komendę RAW obsługiwaną przez protokół."
    target: "\x0304✗\x03 Aktywny protokół odrzucił cel %target%."
    unsupported: "\x0304✗\x03 Aktywny protokół nie obsługuje tej komendy RAW."
    invalid_resource_type: "\x0304✗\x03 Nieznany typ zasobu protokołu: %resource_type%."
    invalid_resource: "\x0304✗\x03 Nieprawidłowy zasób protokołu: %resource%."
    invalid_value: "\x0304✗\x03 Nieprawidłowa wartość zasobu protokołu: %resource%."
    error: "\x0304✗\x03 Aktywny protokół nie mógł wykonać komendy RAW."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator% wykonuje komendę %command% na %target%. %reason%"
  actionWithDuration: "%operator% wykonuje komendę %command% na %target%. Czas trwania: %duration%. %reason%"
  prefix_reason:    "Powód: %reason%"
  prefix_message:   "Wiadomość: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Zarządzaj wiadomościami MOTD wysyłanymi użytkownikom przy połączeniu."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [args]"
  help:             "Zarządzaj wpisami Message Of The Day, które są wysyłane do użytkowników gdy łączą się z siecią.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Witamy w sieci!"
  unknown_sub:      "\x0304✗\x03 Nieznana podkomenda. Użyj: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {serwis|nick!ident@vhost} {PRIVMSG|NOTICE} <wygaśnięcie> <wiadomość>"
    syntax_hint:    "\x0304✗\x03 Użycie: \x02%syntax%\x02"
    short:          "Dodaj wpis MOTD."
    help:           "Dodaje nową wiadomość MOTD, która będzie wysyłana do każdego użytkownika gdy łączy się z siecią.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Witamy w sieci!"
    done:           "\x0303✓\x03 Wpis MOTD #%id% dodany."
    invalid_type:   "\x0304✗\x03 Nieprawidłowy typ wiadomości. Musi być \x02PRIVMSG\x02 lub \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Nieprawidłowy format wygaśnięcia. Użyj: \x02<liczba><s|m|h|d>\x02 (np., 30s, 5m, 24h, 7d)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Użycie: \x02%syntax%\x02"
    short:          "Usuń wpis MOTD."
    help:           "Usuwa wpis MOTD według jego ID.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 Wpis MOTD #%id% usunięty."
    not_found:      "\x0304✗\x03 Wpis MOTD nie znaleziony."
  list:
    syntax:         "MOTD LIST"
    short:          "Lista wszystkich wpisów MOTD."
    help:           "Wyświetla wszystkie skonfigurowane wpisy MOTD.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Brak skonfigurowanych wpisów MOTD."
    header:         "Wpisy MOTD:"
    status_enabled: "\x0303włączone\x03"
    status_disabled: "\x0304wyłączone\x03"
    expired:        "\x0304wygasłe\x03"
    no_bot:         "(brak bota)"
    never:          "nigdy"
    shown_count:    "pokazano %count% razy"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Usuń wszystkie wygasłe wpisy MOTD."
    help:           "Usuwa wszystkie wpisy MOTD, których czas wygaśnięcia minął.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 Usunięto %count% wygasłych wpisów MOTD."
    none:           "\x0303✓\x03 Brak wygasłych wpisów MOTD do usunięcia."
  debug:
    finalized:      "Wiadomość MOTD #%id% zakończyła się: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 nie jest prawidłową nazwą kanału; musi zaczynać się od \x02#\x02."
  not_found:            "\x0304✗\x03 Kanał \x02%channel%\x02 nie istnieje w sieci."
  user_not_online:      "\x0304✗\x03 Nick \x02%nickname%\x02 nie jest połączony."
  user_not_on_channel:  "\x0304✗\x03 Nick \x02%nickname%\x02 nie przebywa na \x02%channel%\x02."
  protected_root:       "\x0304✗\x03 Odmowa dostępu: \x02%nickname%\x02 jest użytkownikiem Root."
  protected_ircop:      "\x0304✗\x03 Odmowa dostępu: \x02%nickname%\x02 jest operatorem IRC."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#kanał> <nick> [powód]"
  short:    "Wyrzuca użytkownika z kanału."
  help:     "Wyrzuca użytkownika z kanału jako operator sieci.\nGdy nie podano powodu, używany jest powód domyślny.\nUżytkowników Root i IRCopów z rolą nie można wyrzucić.\nTo polecenie wymaga uprawnienia operserv.kick."
  example:  "/msg %bot% KICK #pomoc BadUser Przestań floodować"
  done:     "\x0303✓\x03 \x02%nickname%\x02 został wyrzucony z \x02%channel%\x02. Powód: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#kanał> <nick>"
  short:    "Nadaje użytkownikowi status operatora kanału."
  help:     "Nadaje użytkownikowi kanału status operatora (+o), nawet jeśli kanał nie jest zarejestrowany.\nTo polecenie wymaga uprawnienia operserv.op."
  example:  "/msg %bot% OP #pomoc Użytkownik"
  done:     "\x0303✓\x03 \x02%nickname%\x02 jest teraz operatorem na \x02%channel%\x02."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#kanał> <nick>"
  short:    "Odbiera użytkownikowi status operatora kanału."
  help:     "Odbiera użytkownikowi kanału status operatora (-o).\nUżytkownikom Root i IRCopom z rolą nie można go odebrać.\nTo polecenie wymaga uprawnienia operserv.op."
  example:  "/msg %bot% DEOP #pomoc Użytkownik"
  done:     "\x0303✓\x03 \x02%nickname%\x02 nie jest już operatorem na \x02%channel%\x02."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#kanał> <tryby> [argumenty]"
  short:          "Ustawia tryby na kanale."
  help:           "Ustawia podane tryby na kanale, wraz z ich argumentami, jeśli są potrzebne.\nTryby muszą zaczynać się od + lub -.\nTo polecenie wymaga uprawnienia operserv.mode."
  example:        "/msg %bot% MODE #pomoc +mk sekret"
  done:           "\x0303✓\x03 Tryby kanału \x02%channel%\x02 ustawiono na \x02%modes%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 nie jest prawidłową zmianą trybów. Użyj +tryby lub -tryby."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#kanał>"
  short:    "Usuwa restrykcyjne tryby z kanału."
  help:     "Usuwa tryby -imnpst z kanału, aby go odblokować.\nKlucze (+k) i limity (+l) pozostają bez zmian.\nTo polecenie wymaga uprawnienia operserv.mode."
  example:  "/msg %bot% LIMPIA #pomoc"
  done:     "\x0303✓\x03 Kanał \x02%channel%\x02 został wyczyszczony (tryby %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#kanał>"
  short:               "Zaprasza cię na kanał."
  help:                "Zaprasza cię na podany kanał, nawet jeśli jest tylko dla zaproszonych (+i).\nTo polecenie wymaga uprawnienia operserv.invite."
  example:             "/msg %bot% INVITE #pomoc"
  done:                "\x0303✓\x03 Zaproszenie na \x02%channel%\x02 wysłane."
  already_on_channel:  "\x0304✗\x03 Już jesteś na \x02%channel%\x02."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Pokaż statystyki sieci."
  help:     "Pokazuje liczbę użytkowników aktualnie połączonych z siecią.\nDostępne dla wszystkich operatorów IRC."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Użytkownicy online: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Wyświetl połączonych operatorów IRC."
  help:     "Wyświetla, według nicka, operatorów IRC aktualnie połączonych z siecią.\nDostępne dla wszystkich operatorów IRC."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Połączeni operatorzy IRC (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Koniec listy."
  empty:    "\x0310ℹ\x03 Żaden operator IRC nie jest połączony."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <nick>"
  short:    "Wyświetl klony nicka."
  help:     "Pokazuje host, z którego połączony jest nick, oraz inne nicki połączone z tego samego hosta.\nPołączenia są grupowane według prawdziwego IP, gdy jest znane, w przeciwnym razie według nazwy hosta.\nTa komenda wymaga uprawnienia operserv.clones."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "Klony \x02%nickname%\x02 (\x02%host%\x02), połączeń: %count%:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Koniec listy."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 nie ma klonów (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <nick> [powód]"
  short:    "Usuń klony nicka za pomocą 1-godzinnej G-Line."
  help:     "Nakłada 1-godzinną G-Line na *@host podanego nicka, rozłączając wszystkie połączenia z tego hosta.\nG-Line pojawia się w GLINE LIST i można ją usunąć przez GLINE DEL.\nLocalhost i hosty współdzielone z użytkownikami Root lub IRCopami z rolą nigdy nie dostają G-Line.\nTa komenda wymaga uprawnienia operserv.clones."
  example:  "/msg %bot% KILLCLONES BadUser Klony są zabronione"
  done:     "\x0303✓\x03 Klony \x02%nickname%\x02 zostały usunięte: G-Line \x02%mask%\x02 na %duration% (połączeń: %count%). Powód: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <nick> [SPAM|BADUSER|ILEGAL|powód]"
  short:    "Zablokuj host nicka za pomocą 5-godzinnej G-Line."
  help:     "Nakłada 5-godzinną G-Line na *@host podanego nicka, rozłączając wszystkie połączenia z tego hosta.\nG-Line pojawia się w GLINE LIST i można ją usunąć przez GLINE DEL.\nLocalhost i hosty współdzielone z użytkownikami Root lub IRCopami z rolą nigdy nie dostają G-Line.\nSPAM, BADUSER i ILEGAL używają predefiniowanych powodów; bez powodu używane jest „Bloqueado por <bot>”.\nTa komenda wymaga uprawnienia operserv.clones."
  example:  "/msg %bot% BLOCK BadUser Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 został zablokowany: G-Line \x02%mask%\x02 na %duration% (połączeń: %count%). Powód: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Odmowa dostępu: \x02%host%\x02 to host lokalny i nigdy nie dostaje G-Line."
  failed:         "\x0304✗\x03 Nie udało się nałożyć G-Line \x02%mask%\x02."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <minimum|host>"
  short:    "Pokaż jednoczesne połączenia na IP."
  help:     "Pokazuje, ile jednoczesnych połączeń jest aktywnych z każdego IP (lub nazwy hosta, gdy IP jest nieznane).\nTa komenda wymaga uprawnienia operserv.conexiones."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "Wyświetl IP z co najmniej <minimum> połączeniami."
    help:             "Wyświetla IP z co najmniej <minimum> jednoczesnymi aktywnymi połączeniami, od największej liczby.\nMinimum musi być liczbą całkowitą większą niż 1."
    syntax:           "CONEXIONES LIST <minimum>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "IP z co najmniej \x02%minimum%\x02 jednoczesnymi aktywnymi połączeniami:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Koniec listy."
    empty:            "\x0310ℹ\x03 Żadne IP nie ma co najmniej \x02%minimum%\x02 jednoczesnych połączeń."
    invalid_minimum:  "\x0304✗\x03 Nieprawidłowe minimum: musi to być liczba całkowita większa niż 1."
  view:
    short:      "Pokaż połączenia jednego IP."
    help:       "Pokazuje, ile jednoczesnych połączeń jest aktywnych z IP lub nazwy hosta."
    syntax:     "CONEXIONES VIEW <host>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 Jednoczesne aktywne połączenia z \x02%host%\x02: \x02%count%\x02."
    not_found:  "\x0304✗\x03 Nie znaleziono połączeń dla \x02%host%\x02."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <nick> <+/-tryby>"
  short:          "Zmienia tryby użytkownika nicka."
  help:           "Ustawia lub usuwa tryby użytkownika połączonemu nickowi.\nMożesz używać tylko trybów swojej rangi lub niższych: każdy IRCop tryby użytkownika, Operator także s i W, Administrator także H, q i o; Root dowolne.\nTrybów r i h nie można ustawić ani usunąć.\nTo polecenie wymaga uprawnienia operserv.umode."
  example:        "/msg %bot% UMODE Użytkownik +R"
  done:           "\x0303✓\x03 Tryby \x02%modes%\x02 zastosowano dla \x02%nickname%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 nie jest prawidłową zmianą trybów. Użyj +tryby lub -tryby."
  forbidden:      "\x0304✗\x03 Nie możesz ustawić ani usunąć trybów r i h."
  above_rank:     "\x0304✗\x03 Twoja ranga nie pozwala na użycie trybów \x02%modes%\x02."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <nick>"
  short:    "Zamyka użytkownika w kanale więzienia."
  help:     "Usuwa użytkownika ze wszystkich jego kanałów i umieszcza go w kanale więzienia (%channel%).\nDopóki jest uwięziony, wejście na inny kanał kończy się usunięciem, a opuszczenie więzienia ponownym umieszczeniem w nim.\nZostaje uwolniony poleceniem UNJAIL lub po rozłączeniu.\nUżytkowników Root i IRCopów z rolą nie można uwięzić.\nTo polecenie wymaga uprawnienia operserv.jail."
  example:  "/msg %bot% JAIL Użytkownik"
  done:     "\x0303✓\x03 \x02%nickname%\x02 został uwięziony w \x02%channel%\x02."
  already:  "\x0304✗\x03 \x02%nickname%\x02 jest już uwięziony."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <nick>"
  short:       "Uwalnia uwięzionego użytkownika."
  help:        "Uwalnia użytkownika uwięzionego poleceniem JAIL: może znów wejść na dowolny kanał.\nTo polecenie wymaga uprawnienia operserv.jail."
  example:     "/msg %bot% UNJAIL Użytkownik"
  done:        "\x0303✓\x03 \x02%nickname%\x02 został uwolniony z \x02%channel%\x02."
  not_jailed:  "\x0304✗\x03 \x02%nickname%\x02 nie jest uwięziony."

# --- ELINE -----------------------------------------------------------------------
eline:
  syntax:          "ELINE {ADD|DEL|LIST|VIEW|COUNT|CLEAR} ..."
  short:           "Zarządza wyjątkami od banów według IP (E-Lines)."
  help:            "E-Lines zwalniają IP z banów sieci (G-Lines, Z-Lines, shun, limit połączeń na IP, czarne listy...). Przydatne dla VPS z ZNC IRCopów.\nADD dodaje jedną, DEL usuwa, LIST i VIEW wyświetlają, a COUNT liczy.\nTo polecenie wymaga uprawnienia operserv.eline."
  example:         "/msg %bot% ELINE ADD +30d *@203.0.113.10 ZNC IRCops"
  added:           "\x0303✓\x03 Dodano E-Line dla \x02%mask%\x02 (wygasa: %expiration%)."
  already_exists:  "\x0304✗\x03 Istnieje już E-Line dla \x02%mask%\x02."
  invalid_mask:    "\x0304✗\x03 \x02%mask%\x02 jest nieprawidłowa: użyj użytkownik@IP lub IP (IP może być zakresem CIDR)."
  invalid_expiry:  "\x0304✗\x03 \x02%expiry%\x02 nie jest prawidłowym czasem wygaśnięcia: użyj +0 (stała) lub wartości jak +30d, +12h, +30m."
  deleted:         "\x0303✓\x03 Usunięto E-Lines: \x02%masks%\x02."
  not_found:       "\x0304✗\x03 Nie ma E-Line \x02%item%\x02."
  never_expires:   "nigdy"
  add:
    syntax:   "ELINE ADD [+wygaśnięcie] <użytkownik@IP|IP> <powód>"
    short:    "Dodaje E-Line."
    help:     "Dodaje wyjątek od bana dla IP lub zakresu CIDR, opcjonalnie z czasem wygaśnięcia (+30d, +12h, +30m; bez niego jest stała). Bez użytkownika używane jest *."
    example:  "/msg %bot% ELINE ADD +30d 203.0.113.10 ZNC IRCops"
  del:
    syntax:   "ELINE DEL <maska|numer|lista>"
    short:    "Usuwa E-Lines."
    help:     "Usuwa E-Line według maski, numeru w LIST lub listy numerów i zakresów (1,3-5)."
    example:  "/msg %bot% ELINE DEL 1,3-5"
  list:
    syntax:   "ELINE LIST"
    short:    "Wyświetla E-Lines."
    help:     "Pokazuje aktywne E-Lines, ponumerowane, z czasem wygaśnięcia."
    example:  "/msg %bot% ELINE LIST"
    header:   "\x0307---\x03 \x02E-Lines (%count%)\x02 \x0307---\x03"
    entry:    "  \x02%number%.\x02 %mask% \x0314(wygasa: %expiration%)\x03"
    empty:    "Brak aktywnych E-Lines."
  view:
    syntax:   "ELINE VIEW"
    short:    "Pokazuje szczegóły E-Lines."
    help:     "Pokazuje aktywne E-Lines z autorem, datą, czasem wygaśnięcia i powodem."
    example:  "/msg %bot% ELINE VIEW"
    entry:    "  \x02%number%.\x02 %mask% \x0314ustawiona przez %setby% dnia %created%, wygasa: %expiration% - %reason%\x03"
  count:
    syntax:   "ELINE COUNT"
    short:    "Liczy E-Lines."
    help:     "Pokazuje, ile E-Lines jest aktywnych."
    example:  "/msg %bot% ELINE COUNT"
    result:   "\x0310ℹ\x03 Aktywne E-Lines: \x02%count%\x02."
  clear:
    syntax:   "ELINE CLEAR"
    short:    "Usuwa wszystkie E-Lines."
    help:     "Usuwa naraz wszystkie aktywne E-Lines, z usług i z IRCd."
    example:  "/msg %bot% ELINE CLEAR"
    done:     "\x0303✓\x03 Usunięto E-Lines: \x02%count%\x02."

# --- SET -------------------------------------------------------------------------
set:
  syntax:       "SET PASSPROTECT <próby:sekundy>"
  short:        "Zmienia ustawienia całej sieci."
  help:         "Zmienia ustawienia obowiązujące w całej sieci.\nWymaga uprawnienia operserv.set (ranga ROOT)."
  example:      "/msg %bot% SET PASSPROTECT 5:60"
  unknown_sub:  "\x0304✗\x03 Nieznane podpolecenie. Użyj: \x02PASSPROTECT\x02"
  passprotect:
    syntax:     "SET PASSPROTECT <próby:sekundy>"
    short:      "Ustawia limit błędnych haseł."
    help:       "Ustawia, ile błędnych haseł IRCd toleruje z jednego IP w danym okresie. Po przekroczeniu blokuje próby i, jeśli włączono to w IRCd, nakłada G-Line na IP.\nPrzykład: 5:60 = 5 błędów w 60 sekund."
    example:    "/msg %bot% SET PASSPROTECT 5:60"
    done:       "\x0303✓\x03 Limit błędnych haseł: \x02%value%\x02."
    invalid:    "\x0304✗\x03 Nieprawidłowa wartość. Użyj \x02próby:sekundy\x02, obie większe od zera (np. \x025:60\x02)."
    rejected:   "\x0304✗\x03 Sieć odrzuciła wartość."

# --- Staff ranks (PREOPER, OPER, ADMIN, ROOT) ----------------------------------
staff:
  title:
    preoper: "Pre-Operator"
    oper: "Operator"
    admin: "Administrator"
    root: "Root"
  added:            "\x0303✓\x03 \x02%nickname%\x02 dodany jako %rank% sieci."
  deleted:          "\x0303✓\x03 \x02%nickname%\x02 usunięty z rangi %rank% sieci."
  already_rank:     "\x0304✗\x03 \x02%nickname%\x02 jest już %rank% sieci. Najpierw usuń go z tej rangi."
  already_staff:    "\x0304✗\x03 \x02%nickname%\x02 należy już do staffu."
  not_this_rank:    "\x0304✗\x03 \x02%nickname%\x02 nie jest %rank% sieci."
  nick_not_active:  "\x0304✗\x03 Nick \x02%nickname%\x02 nie jest aktywnym zarejestrowanym nickiem."
  unavailable:      "\x0304✗\x03 Rangi nie są jeszcze gotowe. Spróbuj ponownie za kilka sekund."
  list:
    header:         "--- %rank% (%count%) ---"
    empty:          "\x0310ℹ\x03 Brak: %rank%."
  preoper:
    syntax:         "PREOPER {ADD|DEL|LIST} [<nick>]"
    short:          "Zarządza Pre-Operatorów sieci."
    help:           "Zarządza Pre-Operatorów sieci.\nADD nadaje nickowi rangę z jej uprawnieniami, operclass locop i vhostem nick.preoper.<domena>; DEL odbiera wszystko i usuwa go z bazy danych; LIST ich wyświetla.\nNick musi być zarejestrowany i nie należeć jeszcze do staffu.\nWymaga uprawnienia operserv.staff."
    example:        "/msg %bot% PREOPER ADD Pedro"
  oper:
    syntax:         "OPER {ADD|DEL|LIST} [<nick>]"
    short:          "Zarządza Operatorów sieci."
    help:           "Zarządza Operatorów sieci.\nADD nadaje nickowi rangę z jej uprawnieniami, operclass globop i vhostem nick.oper.<domena>; DEL odbiera wszystko i usuwa go z bazy danych; LIST ich wyświetla.\nNick musi być zarejestrowany i nie należeć jeszcze do staffu.\nWymaga uprawnienia operserv.staff."
    example:        "/msg %bot% OPER ADD Pedro"
  admin:
    syntax:         "ADMIN {ADD|DEL|LIST} [<nick>]"
    short:          "Zarządza Administratorów sieci."
    help:           "Zarządza Administratorów sieci.\nADD nadaje nickowi rangę z jej uprawnieniami, operclass admin i vhostem nick.admin.<domena>; DEL odbiera wszystko i usuwa go z bazy danych; LIST ich wyświetla.\nNick musi być zarejestrowany i nie należeć jeszcze do staffu.\nWymaga uprawnienia operserv.staff.admin."
    example:        "/msg %bot% ADMIN ADD Pedro"
  root:
    syntax:         "ROOT {ADD|DEL|LIST} [<nick>]"
    short:          "Zarządza Rootów sieci."
    help:           "Zarządza Rootów sieci.\nADD nadaje nickowi rangę z jej uprawnieniami, operclass netadmin i vhostem nick.root.<domena>; DEL odbiera wszystko i usuwa go z bazy danych; LIST ich wyświetla.\nNick musi być zarejestrowany i nie należeć jeszcze do staffu.\nMoże go używać tylko główny Root (konfiguracja)."
    example:        "/msg %bot% ROOT ADD Pedro"
