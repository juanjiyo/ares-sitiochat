  not_identified:   "\x0304✗\x03 Nie jesteś zidentyfikowany. Użyj \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Nie masz wystarczających uprawnień do wykonania tej komendy."
  root_only:        "\x0304✗\x03 Ta komenda jest dostępna tylko dla administratorów root sieci."
  nick_not_registered: "\x0304✗\x03 Nick \x02%nickname%\x02 nie jest zarejestrowany."

