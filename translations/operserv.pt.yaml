# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax:           "IRCOP {ADD|DEL|LIST} [nickname] [cargo]"
  short:            "Gerir operadores de IRC da rede."
  help:             "Gere os operadores de IRC da rede. ADD adiciona um nickname registado\ncomo operador com o cargo especificado.\nDEL remove um operador. LIST mostra todos os operadores.\nUse ROLE LIST para ver os cargos disponíveis.\nEste comando é restrito a utilizadores Root configurados nos serviços."
  example:          "/msg %bot% IRCOP ADD Alice helper"

  unknown_sub:      "\x0304✗\x03 Subcomando desconhecido \x02%sub%\x02. Use ADD, DEL ou LIST."
  unknown_role:     "\x0304✗\x03 O cargo \x02%role%\x02 não existe. Use \x0303/msg %bot% ROLE LIST\x03 para ver os cargos disponíveis."
  already_admin:    "\x0304✗\x03 \x02%nickname%\x02 já é um operador de IRC (cargo: %role%)."
  not_admin:       "\x0304✗\x03 \x02%nickname%\x02 não é um operador de IRC."
  role_changed:     "\x0303✓\x03 Cargo alterado para \x02%nickname%\x02 de %old% para %new%."

  add:
    syntax:         "IRCOP ADD <nickname> <cargo>"
    short:          "Adicionar um operador de IRC da rede."
    help:           "Adiciona um nickname registado como operador de IRC da rede.\nUse ROLE LIST para ver os cargos disponíveis.\nEste comando é restrito a utilizadores Root."
    example:        "/msg %bot% IRCOP ADD Alice helper"
    done:           "\x0303✓\x03 Adicionado \x02%nickname%\x02 como \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 O nickname \x02%nickname%\x02 não é um nickname registado ativo."

  del:
    syntax:         "IRCOP DEL <nickname>"
    short:          "Remover um operador de IRC da rede."
    help:            "Remove um operador de IRC da rede da lista.\nEste comando é restrito a utilizadores Root."
    example:         "/msg %bot% IRCOP DEL Alice"
    done:           "\x0303✓\x03 Removido \x02%nickname%\x02 dos operadores de IRC."

  list:
    syntax:         "IRCOP LIST"
    short:          "Listar todos os operadores de IRC da rede."
    help:            "Lista todos os operadores de IRC da rede com os seus cargos e data de registo.\nEste comando é restrito a utilizadores Root."
    example:         "/msg %bot% IRCOP LIST"
    header:         "\x0307---\x03 \x02Operadores de IRC da Rede\x02 \x0307---\x03"
    empty:          "Não existem operadores de IRC."

# --- ROLE --------------------------------------------------------------------
role:
  operclass:
    syntax: "ROLE OPERCLASS {LIST|<funcao>} [{VIEW|SET}] [operclass]"
    short: "Gere a operclass Unreal da funcao."
    help: "LIST mostra as operclasses disponiveis na rede.\nVIEW mostra a operclass da funcao e as disponiveis.\nSET atribui-a ao identificar (OFF para remover).\nDisponivel apenas em protocolos UnrealIRCd."
    example: "/msg %bot% ROLE OPERCLASS LIST"
    list:
      header: "\x0307---\x03 \x02Operclasses Disponiveis na Rede\x02 \x0307---\x03"
      empty: "Nao ha operclasses disponiveis na rede."
      not_supported: "\x0304✗\x03 O protocolo atual nao suporta listar operclasses disponiveis."
    view:
      empty: "A funcao %role% nao tem operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Operclasses disponiveis: \x0310%available%\x03"
    set:
      done: "Operclass definida para %role%."
      cleared: "Operclass removida de %role%."
      not_available: "\x0304✗\x03 A operclass \x02%operclass%\x02 nao esta disponivel na rede. Operclasses disponiveis: %available%."
  syntax:           "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <nome> ..."
  short:            "Gerir cargos de operador."
  help:             "Gere cargos de operador. ADD cria um novo cargo, DEL remove-o,\nLIST mostra todos os cargos, PERMS gere permissões para um cargo, MODES gere modos IRCOP,\nVHOST gere o padrão de vhost forçado para um cargo.\nCargos protegidos (ADMIN, OPER, PREOPER) não podem ser eliminados.\nEste comando é restrito a utilizadores Root."
  example:          "/msg %bot% ROLE ADD helper"
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <nome> ..."
  help_operclass:   "Gere cargos de operador. ADD cria um novo cargo, DEL remove-o,\nLIST mostra todos os cargos, PERMS gere permissões para um cargo, MODES gere modos IRCOP,\nVHOST gere o padrão de vhost forçado para um cargo, OPERCLASS gere a operclass Unreal.\nCargos protegidos (ADMIN, OPER, PREOPER) não podem ser eliminados.\nEste comando é restrito a utilizadores Root."

  unknown_sub:      "\x0304✗\x03 Subcomando desconhecido \x02%sub%\x02. Use ADD, DEL, LIST, PERMS, MODES ou VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Subcomando desconhecido \x02%sub%\x02. Use ADD, DEL, LIST, PERMS, MODES, VHOST ou OPERCLASS."
  not_found:        "\x0304✗\x03 O cargo \x02%role%\x02 não existe."
  already_exists:   "\x0304✗\x03 O cargo \x02%role%\x02 já existe."
  protected:        "\x0304✗\x03 O cargo \x02%role%\x02 é protegido e não pode ser eliminado."

  add:
    syntax:         "ROLE ADD <nome> [descrição]"
    short:          "Criar um novo cargo."
    help:            "Cria um novo cargo personalizado. A descrição é opcional.\nEste comando é restrito a utilizadores Root."
    example:         "/msg %bot% ROLE ADD helper"
    done:           "\x0303✓\x03 Criado cargo \x02%role%\x02."

  del:
    syntax:         "ROLE DEL <nome>"
    short:          "Eliminar um cargo."
    help:            "Elimina um cargo personalizado. Cargos protegidos (ADMIN, OPER, PREOPER)\nnão podem ser eliminados. Se o cargo tiver operadores atribuídos,\ndeve reatribuí-los primeiro.\nEste comando é restrito a utilizadores Root."
    example:         "/msg %bot% ROLE DEL helper"
    done:           "\x0303✓\x03 Eliminado cargo \x02%role%\x02."

  list:
    syntax:         "ROLE LIST"
    short:          "Listar todos os cargos."
    help:            "Lista todos os cargos. Os cargos protegidos são marcados com [PROTEGIDO].\nEste comando é restrito a utilizadores Root."
    example:         "/msg %bot% ROLE LIST"
    header:         "\x0307---\x03 \x02Cargos de Operador\x02 \x0307---\x03"
    empty:          "Não existem cargos de operador."

  perms:
    syntax:         "ROLE PERMS <cargo> {LIST|ADD|DEL|CLEAR} [permissão|ALL]"
    short:          "Gerir permissões do cargo."
    help:            "Gere permissões atribuídas a um cargo.\nLIST mostra todas as permissões do cargo.\nADD atribui uma permissão ao cargo.\nDEL remove uma permissão do cargo (não para cargos protegidos).\nCLEAR remove todas as permissões do cargo.\nUse ALL para adicionar todas as permissões disponíveis de uma vez.\nEste comando é restrito a utilizadores Root."
    example:         "/msg %bot% ROLE PERMS helper ADD operserv.kill"
    not_found:       "\x0304✗\x03 A permissão \x02%perm%\x02 não existe."
    already_has:     "\x0304✗\x03 O cargo \x02%role%\x02 já tem a permissão \x02%perm%\x02."
    does_not_have:   "\x0304✗\x03 O cargo \x02%role%\x02 não tem a permissão \x02%perm%\x02."

    list:
      header:        "\x0307---\x03 \x02Permissões para %role%\x02 \x0307---\x03"

    add:
      done:         "\x0303✓\x03 Adicionada permissão \x02%perm%\x02 ao cargo \x02%role%\x02."
      all_done:     "\x0303✓\x03 Adicionadas \x02%count%\x02 permissões ao cargo \x02%role%\x02."

    del:
      done:         "\x0303✓\x03 Removida permissão \x02%perm%\x02 do cargo \x02%role%\x02."

    clear:
      done:         "\x0303✓\x03 Removidas \x02%count%\x02 permissões do cargo \x02%role%\x02."
      empty:        "\x0304✗\x03 O cargo \x02%role%\x02 não tem permissões atribuídas."

  modes:
    syntax:         "ROLE MODES <cargo> {VIEW|SET} [modos]"
    short:          "Gerir modos de utilizador IRCOP para o cargo."
    help:            "Gere modos de utilizador IRCOP atribuídos a um cargo.\nVIEW mostra os modos atuais do cargo.\nSET define os modos IRCOP (ex: oH para +oH).\nUtilizadores com este cargo receberão estes modos ao identificar-se.\nModos disponíveis por IRCD: UnrealIRCd (H, q, s, W), InspIRCd (s).\nEste comando é restrito a utilizadores Root."
    example:         "/msg %bot% ROLE MODES helper SET oH"

    view:
      header:        "\x0307---\x03 \x02Modos para %role%\x02 \x0307---\x03"
      empty:        "O cargo \x02%role%\x02 não tem modos atribuídos."
      line:         "  Modos: \x0303%modes%\x03"

    set:
      done:         "\x0303✓\x03 Definidos modos \x02%modes%\x02 para o cargo \x02%role%\x02."
      cleared:      "\x0303✓\x03 Removidos todos os modos do cargo \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 O modo \x02%mode%\x02 não é um modo IRCOP válido."
      invalid_modes: "\x0304✗\x03 Modos inválidos: %invalid%. Modos válidos: %valid%."
      no_irc_user_modes: "\x0304✗\x03 O IRCD atual não tem modos IRCOP configurados."

  vhost:
    syntax:         "ROLE VHOST <cargo> {VIEW|SET} [padrão]"
    short:          "Gerir padrão de vhost forçado para um cargo."
    help:           "Gere o vhost forçado atribuído a um cargo.\nVIEW mostra o padrão de vhost forçado atual.\nSET atribui um padrão de vhost forçado (utilizadores com este cargo\nreceberão este vhost ao identificar-se, substituindo o vhost pessoal).\nO padrão é acrescentado após o nickname limpo, ex:\n  Nick: _davidlig_ → Padrão: admin.ares → VHost: davidlig.admin.ares\nCaracteres válidos: a-z, A-Z, 0-9, hífen (-) e ponto (.).\nDeve ter pelo menos um ponto, não pode começar/terminar com - ou . nem ter ..\nUse OFF para limpar o padrão de vhost forçado.\nEste comando é restrito a utilizadores Root."
    example:        "/msg %bot% ROLE VHOST helper SET staff.example.com"

    view:
      header:        "\x0307---\x03 \x02Vhost forçado para %role%\x02 \x0307---\x03"
      empty:        "O cargo \x02%role%\x02 não tem um padrão de vhost forçado definido."
      line:         "  Padrão: \x0303%pattern%\x03"
      example:      "  Exemplo: \x02nickname\x02.%pattern%"

    set:
      done:         "\x0303✓\x03 Definido padrão de vhost forçado para o cargo \x02%role%\x02."
      cleared:      "\x0303✓\x03 Removido padrão de vhost forçado do cargo \x02%role%\x02."
      invalid:      "\x0304✗\x03 Padrão de vhost inválido. Caracteres válidos: a-z, A-Z, 0-9, - e .. Deve ter pelo menos um ponto, não pode começar/terminar com - ou . nem ter .."

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <nickname> <motivo>"
  short:            "Desligar forçadamente um utilizador da rede."
  help:             "Desliga um utilizador da rede IRC.\nIRCops e utilizadores Root não podem ser mortos.\nEste comando requer a permissão operserv.kill."
  example:          "/msg %bot% KILL BadUser Flood de canais"
  user_not_online:  "\x0304✗\x03 O nick \x02%nickname%\x02 não está ligado."
  protected_root:   "\x0304✗\x03 Não é possível matar o utilizador Root \x02%nickname%\x02."
  protected_ircop:  "\x0304✗\x03 Não é possível matar o operador de IRC \x02%nickname%\x02."
  done:             "\x0303✓\x03 O utilizador \x02%nickname%\x02 foi morto (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST} [máscara] [expiração] [motivo]"
  short:            "Gerir G-lines globais da rede."
  help:             "Gere G-lines globais da rede (bans globais).\nADD adiciona uma nova G-line com máscara, expiração e motivo.\nDEL remove uma G-line por máscara ou número de entrada.\nLIST mostra todas as G-lines, opcionalmente filtradas por máscara.\n\nFormato de expiração: 0=permanente, ou use sufixo d, h, m (ex: 7d, 12h, 30m).\nGLINEs que correspondam a utilizadores Root ou IRCop são rejeitadas.\nEste comando requer a permissão operserv.gline."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Publicidade em massa"
  unknown_sub:      "\x0304✗\x03 Subcomando desconhecido \x02%sub%\x02. Use ADD, DEL ou LIST."
  invalid_mask:     "\x0304✗\x03 Formato de máscara inválido. Deve estar no formato user@host (ex: *@192.168.*)."
  global_mask:      "\x0304✗\x03 A máscara de G-line \x02%mask%\x02 é demasiado ampla. Máscaras globais não são permitidas."
  dangerous_mask:   "\x0304✗\x03 A máscara de G-line \x02%mask%\x02 é demasiado ampla. A parte do host precisa de pelo menos 4 caracteres alfanuméricos."
  protected_user:   "\x0304✗\x03 Não é possível aplicar G-line ao utilizador protegido \x02%nickname%\x02."
  invalid_expiry:   "\x0304✗\x03 Formato de expiração inválido. Use 0 para permanente, ou um valor como 7d, 12h, 30m."
  already_exists:   "\x0304✗\x03 G-line para \x02%mask%\x02 já existe."
  max_entries:      "\x0304✗\x03 Número máximo de G-lines (%max%) atingido."
  not_found:        "\x0304✗\x03 G-line \x02%mask%\x02 não encontrada."
  user_not_found:   "\x0304✗\x03 O nickname \x02%nickname%\x02 não está online."
  permanent:        "permanente"

  add:
    syntax:         "GLINE ADD <máscara> <expiração> <motivo>"
    short:          "Adicionar uma G-line global na rede."
    help:           "Adiciona uma G-line global na rede (ban global).\nA máscara deve estar no formato user@host.\nExpiração: 0=permanente, ou use sufixo d, h, m (ex: 7d, 12h, 30m).\nGLINEs que correspondam a utilizadores Root ou IRCop são rejeitadas.\nEste comando requer a permissão operserv.gline."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Publicidade em massa"
    done:           "\x0303✓\x03 G-line adicionada: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <máscara|número>"
    short:          "Remover uma G-line."
    help:           "Remove uma G-line da lista.\nPode especificar a máscara ou o número da entrada de LIST.\nEste comando requer a permissão operserv.gline."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 G-line \x02%mask%\x02 removida."

  list:
    syntax:         "GLINE LIST [máscara]"
    short:          "Listar todas as G-lines."
    help:           "Lista todas as G-lines. Opcionalmente filtra por padrão de máscara.\nEste comando requer a permissão operserv.gline."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-lines (%count%) \x0307---\x03"
    empty:          "Não existem G-lines."
    no_reason:      "Sem motivo"
    never_expires:  "Permanente"
    unknown_creator: "desconhecido"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, expira: %expiration%)"

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [país] [motivo]"
  short:            "Gerir a lista de países bloqueados."
  help:             "Gere os países bloqueados no portão da rede.\nO daemon IRC resolve o país de cada cliente que se liga, pelo que um país bloqueado é recusado logo na ligação.\nADD regista um código de país com o respetivo motivo.\nDEL remove um país da lista.\nLIST mostra os países bloqueados com o motivo e a data de registo.\nEste comando requer a permissão operserv.geoip."
  example:          "/msg %bot% GEOIP ADD ES Não é permitido nesta rede"
  unknown_sub:      "\x0304✗\x03 Subcomando desconhecido \x02%sub%\x02. Use ADD, DEL ou LIST."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 não é um código de país ISO 3166-1 alpha-2 válido."
  already_exists:   "\x0304✗\x03 O país \x02%country%\x03 já está bloqueado."
  not_found:        "\x0304✗\x03 O país \x02%country%\x03 não está bloqueado."
  default_reason:   "País bloqueado pela política da rede"

  add:
    syntax:         "GEOIP ADD <país> [motivo]"
    short:          "Bloquear um país no portão da rede."
    help:           "Bloqueia todos os clientes que se ligam a partir do país indicado.\nO código de país tem de ser um código ISO 3166-1 alpha-2.\nO motivo é mostrado aos clientes recusados e pode ser omitido.\nEste comando requer a permissão operserv.geoip."
    example:        "/msg %bot% GEOIP ADD ES Não é permitido nesta rede"
    done:           "\x0303✓\x03 País \x02%country%\x03 bloqueado - %reason%"

  del:
    syntax:         "GEOIP DEL <país>"
    short:          "Desbloquear um país."
    help:           "Remove um país da lista de países bloqueados.\nEste comando requer a permissão operserv.geoip."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 País \x02%country%\x03 desbloqueado."

  list:
    syntax:         "GEOIP LIST"
    short:          "Listar os países bloqueados."
    help:           "Mostra todos os países bloqueados com o motivo e a data de registo.\nEste comando requer a permissão operserv.geoip."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Países bloqueados (%count%)\x02 \x0307---\x03"
    empty:          "Não há países bloqueados."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, registado: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <linha>"
  short:            "Enviar uma linha de protocolo raw para o IRCd."
  help:             "Envia a linha fornecida diretamente para o socket do uplink IRCd.\nUse com extrema cautela. Linhas de protocolo inválidas podem derrubar a rede.\nEste comando requer a permissão operserv.raw."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Deve especificar uma linha não vazia para enviar."
  too_long:         "\x0304✗\x03 A linha é demasiado longa. Máximo 510 caracteres."
  not_connected:    "\x0304✗\x03 Não está ligado ao IRCd."
  done:             "\x0303✓\x03 Linha raw enviada."
  protocol:
    syntax: "\x0304✗\x03 O protocolo ativo rejeitou a sintaxe do comando RAW."
    done: "\x0303✓\x03 Comando RAW gerido pelo protocolo executado."
    target: "\x0304✗\x03 O protocolo ativo rejeitou o destino %target%."
    unsupported: "\x0304✗\x03 O protocolo ativo não suporta este comando RAW."
    invalid_resource_type: "\x0304✗\x03 Tipo de recurso de protocolo desconhecido: %resource_type%."
    invalid_resource: "\x0304✗\x03 Recurso de protocolo inválido: %resource%."
    invalid_value: "\x0304✗\x03 Valor inválido para o recurso de protocolo: %resource%."
    error: "\x0304✗\x03 O protocolo ativo não conseguiu executar o comando RAW."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator% executa o comando %command% em %target%. %reason%"
  actionWithDuration: "%operator% executa o comando %command% em %target%. Duração: %duration%. %reason%"
  prefix_reason:    "Motivo: %reason%"
  prefix_message:   "Mensagem: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Gerir mensagens MOTD enviadas aos utilizadores ao ligar."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [args]"
  help:             "Gere entradas Message Of The Day que são enviadas aos utilizadores quando se ligam à rede.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Bem-vindo à rede!"
  unknown_sub:      "\x0304✗\x03 Subcomando desconhecido. Use: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {serviço|nick!ident@vhost} {PRIVMSG|NOTICE} <expiração> <mensagem>"
    syntax_hint:    "\x0304✗\x03 Uso: \x02%syntax%\x02"
    short:          "Adicionar uma entrada MOTD."
    help:           "Adiciona uma nova mensagem MOTD que será enviada a cada utilizador quando se ligar à rede.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Bem-vindo à rede!"
    done:           "\x0303✓\x03 Entrada MOTD #%id% adicionada."
    invalid_type:   "\x0304✗\x03 Tipo de mensagem inválido. Deve ser \x02PRIVMSG\x02 ou \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Formato de expiração inválido. Use: \x02<número><s|m|h|d>\x02 (ex: 30s, 5m, 24h, 7d)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Uso: \x02%syntax%\x02"
    short:          "Eliminar uma entrada MOTD."
    help:           "Elimina uma entrada MOTD pelo seu ID.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 Entrada MOTD #%id% eliminada."
    not_found:      "\x0304✗\x03 Entrada MOTD não encontrada."
  list:
    syntax:         "MOTD LIST"
    short:          "Listar todas as entradas MOTD."
    help:           "Lista todas as entradas MOTD configuradas.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Nenhuma entrada MOTD configurada."
    header:         "Entradas MOTD:"
    status_enabled: "\x0303ativada\x03"
    status_disabled: "\x0304desativada\x03"
    expired:        "\x0304expirada\x03"
    no_bot:         "(sem bot)"
    never:          "nunca"
    shown_count:    "mostrado %count% vezes"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Remover todas as entradas MOTD expiradas."
    help:           "Remove todas as entradas MOTD cujo tempo de expiração já passou.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 Removidas %count% entradas MOTD expiradas."
    none:           "\x0303✓\x03 Nenhuma entrada MOTD expirada para remover."
  debug:
    finalized:      "A mensagem MOTD #%id% terminou: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 não é um nome de canal válido; deve começar por \x02#\x02."
  not_found:            "\x0304✗\x03 O canal \x02%channel%\x02 não existe na rede."
  user_not_online:      "\x0304✗\x03 O nick \x02%nickname%\x02 não está conectado."
  user_not_on_channel:  "\x0304✗\x03 O nick \x02%nickname%\x02 não está no canal \x02%channel%\x02."
  protected_root:       "\x0304✗\x03 Permissão negada: \x02%nickname%\x02 é um utilizador Root."
  protected_ircop:      "\x0304✗\x03 Permissão negada: \x02%nickname%\x02 é um operador de rede."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#canal> <nick> [motivo]"
  short:    "Expulsa um utilizador de um canal."
  help:     "Expulsa um utilizador de um canal como operador de rede.\nSe não for indicado um motivo, é usado um por defeito.\nOs utilizadores Root e os IRCops com função não podem ser expulsos.\nEste comando requer a permissão operserv.kick."
  example:  "/msg %bot% KICK #ajuda BadUser Para de fazer flood"
  done:     "\x0303✓\x03 \x02%nickname%\x02 foi expulso de \x02%channel%\x02. Motivo: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#canal> <nick>"
  short:    "Dá o estado de operador a um utilizador num canal."
  help:     "Dá OP (+o) a um utilizador presente num canal, mesmo que o canal não esteja registado.\nEste comando requer a permissão operserv.op."
  example:  "/msg %bot% OP #ajuda Utilizador"
  done:     "\x0303✓\x03 Foi dado OP a \x02%nickname%\x02 em \x02%channel%\x02."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#canal> <nick>"
  short:    "Retira o estado de operador a um utilizador num canal."
  help:     "Retira o OP (-o) a um utilizador presente num canal.\nAos utilizadores Root e aos IRCops com função não é possível retirar o OP.\nEste comando requer a permissão operserv.op."
  example:  "/msg %bot% DEOP #ajuda Utilizador"
  done:     "\x0303✓\x03 Foi feito DEOP a \x02%nickname%\x02 em \x02%channel%\x02."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#canal> <+/-modos> [argumentos]"
  short:          "Define modos num canal."
  help:           "Define os modos indicados num canal, seguidos dos seus argumentos quando necessários.\nOs modos devem começar por + ou -.\nEste comando requer a permissão operserv.mode."
  example:        "/msg %bot% MODE #ajuda +mk chave"
  done:           "\x0303✓\x03 Os modos de \x02%channel%\x02 foram definidos como \x02%modes%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 não é uma alteração de modos válida. Usa +modos ou -modos."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#canal>"
  short:    "Retira os modos restritivos de um canal."
  help:     "Retira os modos -imnpst de um canal para o desbloquear.\nAs chaves (+k) e os limites (+l) não são alterados.\nEste comando requer a permissão operserv.mode."
  example:  "/msg %bot% LIMPIA #ajuda"
  done:     "\x0303✓\x03 O canal \x02%channel%\x02 foi limpo (modos %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#canal>"
  short:               "Convida-te para um canal."
  help:                "Convida-te para o canal indicado, mesmo que seja apenas para convidados (+i).\nEste comando requer a permissão operserv.invite."
  example:             "/msg %bot% INVITE #ajuda"
  done:                "\x0303✓\x03 Convite para o canal \x02%channel%\x02 enviado."
  already_on_channel:  "\x0304✗\x03 Já estás no canal \x02%channel%\x02."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Mostra as estatísticas da rede."
  help:     "Mostra o número de utilizadores atualmente ligados à rede.\nDisponível para todos os operadores de rede."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Utilizadores no IRC: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Lista os operadores de rede ligados."
  help:     "Lista, por nick, os operadores de rede atualmente ligados.\nDisponível para todos os operadores de rede."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Operadores ligados (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Fim da lista."
  empty:    "\x0310ℹ\x03 Não há operadores de rede ligados."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <nick>"
  short:    "Lista os clones de um nick."
  help:     "Mostra o host a partir do qual um nick está ligado e os outros nicks ligados a partir do mesmo host.\nAs ligações são agrupadas pelo IP real quando é conhecido e, caso contrário, pelo host.\nEste comando requer a permissão operserv.clones."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "Clones de \x02%nickname%\x02 (\x02%host%\x02), %count% ligações:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Fim da lista."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 não tem clones (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <nick> [motivo]"
  short:    "Expulsa os clones de um nick com uma G-Line de 1 hora."
  help:     "Aplica uma G-Line de 1 hora sobre *@host do nick indicado, desligando todas as ligações desse host.\nA G-Line aparece em GLINE LIST e pode ser removida com GLINE DEL.\nNunca é aplicada a localhost nem a hosts partilhados com utilizadores Root ou IRCops com papel.\nEste comando requer a permissão operserv.clones."
  example:  "/msg %bot% KILLCLONES Utilizador Clones não permitidos"
  done:     "\x0303✓\x03 Os clones de \x02%nickname%\x02 foram expulsos: G-Line \x02%mask%\x02 durante %duration% (%count% ligações). Motivo: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <nick> [motivo]"
  short:    "Bloqueia o host de um nick com uma G-Line de 5 horas."
  help:     "Aplica uma G-Line de 5 horas sobre *@host do nick indicado, desligando todas as ligações desse host.\nA G-Line aparece em GLINE LIST e pode ser removida com GLINE DEL.\nNunca é aplicada a localhost nem a hosts partilhados com utilizadores Root ou IRCops com papel.\nEste comando requer a permissão operserv.clones."
  example:  "/msg %bot% BLOCK Utilizador Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 foi bloqueado: G-Line \x02%mask%\x02 durante %duration% (%count% ligações). Motivo: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Permissão negada: \x02%host%\x02 é um host local e nunca recebe uma G-Line."
  failed:         "\x0304✗\x03 Não foi possível aplicar a G-Line \x02%mask%\x02."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <limite|IP>"
  short:    "Mostra as ligações simultâneas por IP."
  help:     "Mostra quantas ligações simultâneas estão ativas a partir de cada IP (ou de cada host se o IP não for conhecido).\nEste comando requer a permissão operserv.conexiones."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "Lista os IP com pelo menos <limite> ligações."
    help:             "Lista os IP com pelo menos <limite> ligações simultâneas ativas, das mais para as menos ligações.\nO limite deve ser um número inteiro maior que 1."
    syntax:           "CONEXIONES LIST <limite>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "IP com pelo menos \x02%minimum%\x02 ligações simultâneas ativas:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Fim da lista."
    empty:            "\x0310ℹ\x03 Nenhum IP tem pelo menos \x02%minimum%\x02 ligações simultâneas."
    invalid_minimum:  "\x0304✗\x03 O limite indicado não é válido; deve ser um número inteiro maior que 1."
  view:
    short:      "Mostra as ligações de um IP."
    help:       "Mostra quantas ligações simultâneas estão ativas a partir de um IP ou host."
    syntax:     "CONEXIONES VIEW <IP>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 Ligações simultâneas ativas do IP \x02%host%\x02: \x02%count%\x02."
    not_found:  "\x0304✗\x03 Não foram encontradas ligações para \x02%host%\x02."
