  not_identified:   "\x0304✗\x03 Não está identificado. Use \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Não tem permissões suficientes para executar este comando."
  root_only:        "\x0304✗\x03 Este comando é restrito a administradores root da rede."
  nick_not_registered: "\x0304✗\x03 O nickname \x02%nickname%\x02 não está registado."

