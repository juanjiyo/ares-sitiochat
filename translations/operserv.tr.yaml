# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax:           "IRCOP {ADD|DEL|LIST} [nickname] [rol]"
  short:            "Ağ IRC operatörlerini yönetin."
  help:             "Ağ IRC operatörlerini yönetin. ADD, kayıtlı bir rumuzu\nbelirtilen rolle operatör olarak ekler.\nDEL bir operatörü kaldırır. LIST tüm operatörleri gösterir.\nMevcut rolleri görmek için ROLE LIST kullanın.\nBu komut yalnızca hizmetlerde yapılandırılmış Root kullanıcıları içindir."
  example:          "/msg %bot% IRCOP ADD Alice helper"

  unknown_sub:      "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL veya LIST kullanın."
  unknown_role:     "\x0304✗\x03 \x02%role%\x02 rolü mevcut değil. Kullanılabilir rolleri görmek için \x0303/msg %bot% ROLE LIST\x03 kullanın."
  already_admin:    "\x0304✗\x03 \x02%nickname%\x02 zaten bir IRC operatörüdür (rol: %role%)."
  not_admin:       "\x0304✗\x03 \x02%nickname%\x02 bir IRC operatörü değil."
  role_changed:     "\x0303✓\x03 \x02%nickname%\x02 için rol %old% yerine %new% olarak değiştirildi."

  add:
    syntax:         "IRCOP ADD <nickname> <rol>"
    short:          "Bir ağ IRC operatörü ekleyin."
    help:           "Kayıtlı bir rumuzu ağ IRC operatörü olarak ekler.\nMevcut rolleri görmek için ROLE LIST kullanın.\nBu komut yalnızca Root kullanıcıları içindir."
    example:        "/msg %bot% IRCOP ADD Alice helper"
    done:           "\x0303✓\x03 \x02%nickname%\x02, \x02%role%\x02 olarak eklendi."
    nick_not_active: "\x0304✗\x03 \x02%nickname%\x02 rumuzu etkin bir kayıtlı rumuz değil."

  del:
    syntax:         "IRCOP DEL <nickname>"
    short:          "Bir ağ IRC operatörünü kaldırın."
    help:            "Listeden bir ağ IRC operatörünü kaldırır.\nBu komut yalnızca Root kullanıcıları içindir."
    example:         "/msg %bot% IRCOP DEL Alice"
    done:           "\x0303✓\x03 \x02%nickname%\x02 IRC operatörlerinden kaldırıldı."

  list:
    syntax:         "IRCOP LIST"
    short:          "Tüm ağ IRC operatörlerini listeleyin."
    help:            "Tüm ağ IRC operatörlerini rolleri ve kayıt tarihleriyle listeler.\nBu komut yalnızca Root kullanıcıları içindir."
    example:         "/msg %bot% IRCOP LIST"
    header:         "\x0307---\x03 \x02Ağ IRC Operatörleri\x02 \x0307---\x03"
    empty:          "IRC operatörü bulunmamaktadır."

# --- ROLE --------------------------------------------------------------------
role:
  operclass:
    syntax: "ROLE OPERCLASS {LIST|<rol>} [{VIEW|SET}] [operclass]"
    short: "Rolun Unreal operclass degerini yonetir."
    help: "LIST agdaki kullanilabilir operclass'lari gosterir.\nVIEW rolun operclass'ini ve kullanilabilir olanlari gosterir.\nSET kimlik dogrulamada atar (OFF kaldirmak icin).\nYalnizca UnrealIRCd protokollerinde kullanilabilir."
    example: "/msg %bot% ROLE OPERCLASS LIST"
    list:
      header: "\x0307---\x03 \x02Agdaki Kullanilabilir Operclass'lar\x02 \x0307---\x03"
      empty: "Agda kullanilabilir operclass yok."
      not_supported: "\x0304✗\x03 Gecerli protokol kullanilabilir operclass'lari listelemeyi desteklemiyor."
    view:
      empty: "%role% rolunun operclass degeri yok."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Kullanilabilir operclass'lar: \x0310%available%\x03"
    set:
      done: "%role% icin operclass ayarlandi."
      cleared: "%role% icin operclass kaldirildi."
      not_available: "\x0304✗\x03 \x02%operclass%\x02 operclass'i agda mevcut degil. Mevcut operclass'lar: %available%."
  syntax:           "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <ad> ..."
  short:            "Operatör rollerini yönetin."
  help:             "Operatör rollerini yönetin. ADD yeni bir rol oluşturur, DEL siler,\nLIST tüm rolleri gösterir, PERMS bir rolün izinlerini yönetir, MODES IRCOP modlarını yönetir,\nVHOST bir rol için zorunlu vhost kalıbını yönetir.\nKorumalı roller (ADMIN, OPER, PREOPER) silinemez.\nBu komut yalnızca Root kullanıcıları içindir."
  example:          "/msg %bot% ROLE ADD helper"
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <ad> ..."
  help_operclass:   "Operatör rollerini yönetin. ADD yeni bir rol oluşturur, DEL siler,\nLIST tüm rolleri gösterir, PERMS bir rolün izinlerini yönetir, MODES IRCOP modlarını yönetir,\nVHOST bir rol için zorunlu vhost kalıbını yönetir, OPERCLASS Unreal operclass değerini yönetir.\nKorumalı roller (ADMIN, OPER, PREOPER) silinemez.\nBu komut yalnızca Root kullanıcıları içindir."

  unknown_sub:      "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL, LIST, PERMS, MODES veya VHOST kullanın."
  unknown_sub_operclass: "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL, LIST, PERMS, MODES, VHOST veya OPERCLASS kullanın."
  not_found:        "\x0304✗\x03 \x02%role%\x02 rolü mevcut değil."
  already_exists:   "\x0304✗\x03 \x02%role%\x02 rolü zaten mevcut."
  protected:        "\x0304✗\x03 \x02%role%\x02 rolü korumalıdır ve silinemez."

  add:
    syntax:         "ROLE ADD <ad> [açıklama]"
    short:          "Yeni bir rol oluşturun."
    help:            "Yeni bir özel rol oluşturur. Açıklama isteğe bağlıdır.\nBu komut yalnızca Root kullanıcıları içindir."
    example:         "/msg %bot% ROLE ADD helper"
    done:           "\x0303✓\x03 \x02%role%\x02 rolü oluşturuldu."

  del:
    syntax:         "ROLE DEL <ad>"
    short:          "Bir rolü silin."
    help:            "Özel bir rolü siler. Korumalı roller (ADMIN, OPER, PREOPER)\nsilinemez. Rolde atanmış operatörler varsa,\nönce onları yeniden atamanız gerekir.\nBu komut yalnızca Root kullanıcıları içindir."
    example:         "/msg %bot% ROLE DEL helper"
    done:           "\x0303✓\x03 \x02%role%\x02 rolü silindi."

  list:
    syntax:         "ROLE LIST"
    short:          "Tüm rolleri listeleyin."
    help:            "Tüm rolleri listeler. Korumalı roller [PROTECTED] ile işaretlenir.\nBu komut yalnızca Root kullanıcıları içindir."
    example:         "/msg %bot% ROLE LIST"
    header:         "\x0307---\x03 \x02Operatör Rolleri\x02 \x0307---\x03"
    empty:          "Operatör rolü bulunmamaktadır."

  perms:
    syntax:         "ROLE PERMS <rol> {LIST|ADD|DEL|CLEAR} [izin|ALL]"
    short:          "Rol izinlerini yönetin."
    help:            "Bir role atanmış izinleri yönetin.\nLIST, rolün tüm izinlerini gösterir.\nADD, role bir izin atar.\nDEL, rolden bir izni kaldırır (korumalı roller için geçerli değil).\nCLEAR, roldeki tüm izinleri kaldırır.\nMevcut tüm izinleri tek seferde eklemek için ALL kullanın.\nBu komut yalnızca Root kullanıcıları içindir."
    example:         "/msg %bot% ROLE PERMS helper ADD operserv.kill"
    not_found:       "\x0304✗\x03 \x02%perm%\x02 izni mevcut değil."
    already_has:     "\x0304✗\x03 \x02%role%\x02 rolü zaten \x02%perm%\x02 iznine sahip."
    does_not_have:   "\x0304✗\x03 \x02%role%\x02 rolü \x02%perm%\x02 iznine sahip değil."

    list:
      header:        "\x0307---\x03 \x02%role% için İzinler\x02 \x0307---\x03"

    add:
      done:         "\x0303✓\x03 \x02%perm%\x02 izni \x02%role%\x02 rolüne eklendi."
      all_done:     "\x0303✓\x03 \x02%role%\x02 rolüne \x02%count%\x02 izin eklendi."

    del:
      done:         "\x0303✓\x03 \x02%perm%\x02 izni \x02%role%\x02 rolünden kaldırıldı."

    clear:
      done:         "\x0303✓\x03 \x02%role%\x02 rolünden \x02%count%\x02 izin kaldırıldı."
      empty:        "\x0304✗\x03 \x02%role%\x02 rolüne atanmış izin yok."

  modes:
    syntax:         "ROLE MODES <rol> {VIEW|SET} [modlar]"
    short:          "Rol için IRCOP kullanıcı modlarını yönetin."
    help:            "Bir role atanmış IRCOP kullanıcı modlarını yönetin.\nVIEW, rolün mevcut modlarını gösterir.\nSET, IRCOP modlarını ayarlar (örn., oH için +oH).\nBu role sahip kullanıcılar kimlik doğrulamada bu modları alır.\nHer IRCD'ye göre kullanılabilir modlar: UnrealIRCd (H, q, s, W), InspIRCd (s).\nBu komut yalnızca Root kullanıcıları içindir."
    example:         "/msg %bot% ROLE MODES helper SET oH"

    view:
      header:        "\x0307---\x03 \x02%role% için Modlar\x02 \x0307---\x03"
      empty:        "\x02%role%\x02 rolüne atanmış mod yok."
      line:         "  Modlar: \x0303%modes%\x03"

    set:
      done:         "\x0303✓\x03 \x02%role%\x02 rolü için modlar \x02%modes%\x02 olarak ayarlandı."
      cleared:      "\x0303✓\x03 \x02%role%\x02 rolünden tüm modlar kaldırıldı."
      invalid_mode: "\x0304✗\x03 \x02%mode%\x02 modu geçerli bir IRCOP modu değil."
      invalid_modes: "\x0304✗\x03 Geçersiz modlar: %invalid%. Geçerli modlar: %valid%."
      no_irc_user_modes: "\x0304✗\x03 Mevcut IRCD'de yapılandırılmış IRCOP modu yok."

  vhost:
    syntax:         "ROLE VHOST <rol> {VIEW|SET} [kalıp]"
    short:          "Bir rol için zorunlu vhost kalıbını yönetin."
    help:           "Bir role atanmış zorunlu vhost'u yönetin.\nVIEW, mevcut zorunlu vhost kalıbını gösterir.\nSET bir zorunlu vhost kalıbı atar (bu role sahip kullanıcılar\nkimlik doğrulamada bu vhost'u alır, kişisel vhost'u geçersiz kılar).\nKalıp temizlenmiş rumuzun sonuna eklenir, örn.:\n  Rumuz: _davidlig_ → Kalıp: admin.ares → VHost: davidlig.admin.ares\nGeçerli karakterler: a-z, A-Z, 0-9, tire (-) ve nokta (.).\nEn az bir nokta olmalı, - veya . ile başlayamaz/bitemez veya .. içeremez.\nZorunlu vhost kalıbını temizlemek için OFF kullanın.\nBu komut yalnızca Root kullanıcıları içindir."
    example:        "/msg %bot% ROLE VHOST helper SET staff.example.com"

    view:
      header:        "\x0307---\x03 \x02%role% için Zorunlu vhost\x02 \x0307---\x03"
      empty:        "\x02%role%\x02 rolü için zorunlu vhost kalıbı ayarlanmamış."
      line:         "  Kalıp: \x0303%pattern%\x03"
      example:      "  Örnek: \x02rumuz\x02.%pattern%"

    set:
      done:         "\x0303✓\x03 \x02%role%\x02 rolü için zorunlu vhost kalıbı ayarlandı."
      cleared:      "\x0303✓\x03 \x02%role%\x02 rolünden zorunlu vhost kalıbı kaldırıldı."
      invalid:      "\x0304✗\x03 Geçersiz vhost kalıbı. Geçerli karakterler: a-z, A-Z, 0-9, - ve .. En az bir nokta olmalı, - veya . ile başlayamaz/bitemez veya .. içeremez."

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <nickname> <sebep>"
  short:            "Bir kullanıcıyı ağdan zorla ayırın."
  help:             "Bir kullanıcıyı IRC ağından ayırır.\nIRCop'ler ve Root kullanıcıları kill'lenemez.\nBu komut operserv.kill iznini gerektirir."
  example:          "/msg %bot% KILL KtUye Kanalları floodlama"
  user_not_online:  "\x0304✗\x03 \x02%nickname%\x02 rumuzu bağlı değil."
  protected_root:   "\x0304✗\x03 Root kullanıcı \x02%nickname%\x02 kill'lenemez."
  protected_ircop:  "\x0304✗\x03 IRC operatörü \x02%nickname%\x02 kill'lenemez."
  done:             "\x0303✓\x03 \x02%nickname%\x02 kullanıcısı kill'lendi (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST} [maske] [süre] [sebep]"
  short:            "Ağ genelindeki G-line'ları yönetin."
  help:             "Ağ genelindeki G-line'ları (genel yasaklamalar) yönetin.\nADD maske, süre ve sebep ile yeni bir G-line ekler.\nDEL bir G-line'ı maske veya giriş numarasıyla kaldırır.\nLIST maske filtresi ile isteğe bağlı olarak tüm G-line'ları gösterir.\n\nSüre formatı: 0=kalıcı, veya d, s, d son ekini kullanın (örn., 7g, 12s, 30d).\nRoot veya IRCop kullanıcılarıyla eşleşen GLINE'lar reddedilir.\nBu komut operserv.gline iznini gerektirir."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Kitlesel reklam"
  unknown_sub:      "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL veya LIST kullanın."
  invalid_mask:     "\x0304✗\x03 Geçersiz maske formatı. user@host formatında olmalıdır (örn., *@192.168.*)."
  global_mask:      "\x0304✗\x03 G-line maskesi \x02%mask%\x02 çok geniş. Genel maskeler kullanılamaz."
  dangerous_mask:   "\x0304✗\x03 G-line maskesi \x02%mask%\x02 çok geniş. Host kısmı en az 4 alfanümerik karakter içermelidir."
  protected_user:   "\x0304✗\x03 Korumalı kullanıcı \x02%nickname%\x02 G-line ile engellenemez."
  invalid_expiry:   "\x0304✗\x03 Geçersiz süre formatı. Kalıcı için 0 veya 7g, 12s, 30d gibi bir değer kullanın."
  already_exists:   "\x0304✗\x03 \x02%mask%\x02 için G-line zaten mevcut."
  max_entries:      "\x0304✗\x03 Maksimum G-line sayısına (%max%) ulaşıldı."
  not_found:        "\x0304✗\x03 G-line \x02%mask%\x02 bulunamadı."
  user_not_found:   "\x0304✗\x03 \x02%nickname%\x02 rumuzu çevrimiçi değil."
  permanent:        "kalıcı"

  add:
    syntax:         "GLINE ADD <maske> <süre> <sebep>"
    short:          "Ağ genelinde bir G-line ekleyin."
    help:           "Ağ genelinde bir G-line (genel yasaklama) ekler.\nMaske user@host formatında olmalıdır.\nSüre: 0=kalıcı, veya d, s, d son ekini kullanın (örn., 7g, 12s, 30d).\nRoot veya IRCop kullanıcılarıyla eşleşen GLINE'lar reddedilir.\nBu komut operserv.gline iznini gerektirir."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Kitlesel reklam"
    done:           "\x0303✓\x03 G-line eklendi: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <maske|numara>"
    short:          "Bir G-line'ı kaldırın."
    help:           "Listeden bir G-line'ı kaldırır.\nMaskeyi veya LIST'teki giriş numarasını belirtebilirsiniz.\nBu komut operserv.gline iznini gerektirir."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 G-line \x02%mask%\x02 kaldırıldı."

  list:
    syntax:         "GLINE LIST [maske]"
    short:          "Tüm G-line'ları listeleyin."
    help:           "Tüm G-line'ları listeler. İsteğe bağlı olarak maske kalıbı ile filtreleyin.\nBu komut operserv.gline iznini gerektirir."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-line'lar (%count%) \x0307---\x03"
    empty:          "G-line bulunmamaktadır."
    no_reason:      "Sebep yok"
    never_expires:  "Kalıcı"
    unknown_creator: "bilinmiyor"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, bitiş: %expiration%)"

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [ülke] [gerekçe]"
  short:            "Engelli ülke listesini yönetin."
  help:             "Ağ kapısında engellenen ülkeleri yönetin.\nIRC sunucusu, bağlanan her istemcinin ülkesini çözer; bu nedenle engelli bir ülke bağlantı anında reddedilir.\nADD bir ülke kodunu ve gerekçesini kaydeder.\nDEL bir ülkeyi listeden kaldırır.\nLIST engellenen ülkeleri gerekçeleri ve kayıt tarihleriyle gösterir.\nBu komut operserv.geoip iznini gerektirir."
  example:          "/msg %bot% GEOIP ADD ES Bu ağda izin verilmiyor"
  unknown_sub:      "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL veya LIST kullanın."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 geçerli bir ISO 3166-1 alpha-2 ülke kodu değil."
  already_exists:   "\x0304✗\x03 \x02%country%\x03 ülkesi zaten engelli."
  not_found:        "\x0304✗\x03 \x02%country%\x03 ülkesi engelli değil."
  default_reason:   "Ağ politikası gereği engelli ülke"

  add:
    syntax:         "GEOIP ADD <ülke> [gerekçe]"
    short:          "Ağ kapısında bir ülkeyi engelleyin."
    help:           "Belirtilen ülkeden bağlanan tüm istemcileri engeller.\nÜlke kodu ISO 3166-1 alpha-2 olmalıdır.\nGerekçe reddedilen istemcilere gösterilir ve isteğe bağlıdır.\nBu komut operserv.geoip iznini gerektirir."
    example:        "/msg %bot% GEOIP ADD ES Bu ağda izin verilmiyor"
    done:           "\x0303✓\x03 \x02%country%\x03 ülkesi engellendi - %reason%"

  del:
    syntax:         "GEOIP DEL <ülke>"
    short:          "Bir ülkenin engelini kaldırın."
    help:           "Bir ülkeyi engelli ülkeler listesinden kaldırır.\nBu komut operserv.geoip iznini gerektirir."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 \x02%country%\x03 ülkesinin engeli kaldırıldı."

  list:
    syntax:         "GEOIP LIST"
    short:          "Engelli ülkeleri listeleyin."
    help:           "Engelli ülkeleri gerekçeleri ve kayıt tarihleriyle listeler.\nBu komut operserv.geoip iznini gerektirir."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Engelli Ülkeler (%count%)\x02 \x0307---\x03"
    empty:          "Engelli ülke bulunmuyor."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, kayıt: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <satır>"
  short:            "IRCd'ye ham bir protokol satırı gönderin."
  help:             "Verilen satırı doğrudan uplink IRCd soketine gönderir.\nSon derece dikkatli kullanın. Geçersiz protokol satırları ağı çökertebilir.\nBu komut operserv.raw iznini gerektirir."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Göndermek için boş olmayan bir satır belirtmelisiniz."
  too_long:         "\x0304✗\x03 Satır çok uzun. Maksimum 510 karakter."
  not_connected:    "\x0304✗\x03 IRCd'ye bağlı değil."
  done:             "\x0303✓\x03 Ham satır gönderildi."
  protocol:
    syntax: "\x0304✗\x03 Etkin protokol RAW komutunun sözdizimini reddetti."
    done: "\x0303✓\x03 Protokol tarafından yönetilen RAW komutu yürütüldü."
    target: "\x0304✗\x03 Etkin protokol %target% hedefini reddetti."
    unsupported: "\x0304✗\x03 Etkin protokol bu RAW komutunu desteklemiyor."
    invalid_resource_type: "\x0304✗\x03 Bilinmeyen protokol kaynak türü: %resource_type%."
    invalid_resource: "\x0304✗\x03 Geçersiz protokol kaynağı: %resource%."
    invalid_value: "\x0304✗\x03 Protokol kaynağı için geçersiz değer: %resource%."
    error: "\x0304✗\x03 Etkin protokol RAW komutunu yürütemedi."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator%, %target% üzerinde %command% komutunu çalıştırıyor. %reason%"
  actionWithDuration: "%operator%, %target% üzerinde %command% komutunu çalıştırıyor. Süre: %duration%. %reason%"
  prefix_reason:    "Sebep: %reason%"
  prefix_message:   "Mesaj: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Bağlantıda kullanıcılara gönderilen MOTD mesajlarını yönetin."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [argümanlar]"
  help:             "Kullanıcılar ağa bağlandığında gönderilen Günün Mesajı girişlerini yönetin.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Ağa hoş geldiniz!"
  unknown_sub:      "\x0304✗\x03 Bilinmeyen alt komut. Kullanın: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <süre> <mesaj>"
    syntax_hint:    "\x0304✗\x03 Kullanım: \x02%syntax%\x02"
    short:          "Bir MOTD girişi ekleyin."
    help:           "Her kullanıcı ağa bağlandığında gönderilecek yeni bir MOTD mesajı ekler.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Ağa hoş geldiniz!"
    done:           "\x0303✓\x03 MOTD girişi #%id% eklendi."
    invalid_type:   "\x0304✗\x03 Geçersiz mesaj türü. \x02PRIVMSG\x02 veya \x02NOTICE\x02 olmalıdır."
    invalid_expiry: "\x0304✗\x03 Geçersiz süre formatı. Kullanın: \x02<sayı><s|d|s|g>\x02 (örn., 30s, 5d, 24s, 7g)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Kullanım: \x02%syntax%\x02"
    short:          "Bir MOTD girişini silin."
    help:           "Bir MOTD girişini ID'sine göre siler.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 MOTD girişi #%id% silindi."
    not_found:      "\x0304✗\x03 MOTD girişi bulunamadı."
  list:
    syntax:         "MOTD LIST"
    short:          "Tüm MOTD girişlerini listeleyin."
    help:           "Tüm yapılandırılmış MOTD girişlerini listeler.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Yapılandırılmış MOTD girişi yok."
    header:         "MOTD girişleri:"
    status_enabled: "\x0303etkin\x03"
    status_disabled: "\x0304devre dışı\x03"
    expired:        "\x0304süresi dolmuş\x03"
    no_bot:         "(bot yok)"
    never:          "hiçbir zaman"
    shown_count:    "%count% kez gösterildi"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Süresi dolmuş tüm MOTD girişlerini kaldırın."
    help:           "Süresi geçmiş tüm MOTD girişlerini kaldırır.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 %count% süresi dolmuş MOTD girişi kaldırıldı."
    none:           "\x0303✓\x03 Kaldırılacak süresi dolmuş MOTD girişi yok."
  debug:
    finalized:      "MOTD mesajı #%id% sona erdi: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 geçerli bir kanal adı değil; \x02#\x02 ile başlamalıdır."
  not_found:            "\x0304✗\x03 \x02%channel%\x02 kanalı ağda mevcut değil."
  user_not_online:      "\x0304✗\x03 \x02%nickname%\x02 rumuzu bağlı değil."
  user_not_on_channel:  "\x0304✗\x03 \x02%nickname%\x02 rumuzu \x02%channel%\x02 kanalında değil."
  protected_root:       "\x0304✗\x03 İzin reddedildi: \x02%nickname%\x02 bir Root kullanıcısı."
  protected_ircop:      "\x0304✗\x03 İzin reddedildi: \x02%nickname%\x02 bir IRC operatörü."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#kanal> <rumuz> [sebep]"
  short:    "Bir kullanıcıyı kanaldan atar."
  help:     "Bir kullanıcıyı ağ operatörü olarak kanaldan atar.\nSebep verilmezse varsayılan bir sebep kullanılır.\nRoot kullanıcılar ve rolü olan IRCop'lar atılamaz.\nBu komut operserv.kick iznini gerektirir."
  example:  "/msg %bot% KICK #yardim BadUser Flood yapmayı bırak"
  done:     "\x0303✓\x03 \x02%nickname%\x02 \x02%channel%\x02 kanalından atıldı. Sebep: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#kanal> <rumuz>"
  short:    "Bir kullanıcıya kanal operatörü yetkisi verir."
  help:     "Bir kanaldaki kullanıcıya operatör yetkisi (+o) verir, kanal kayıtlı olmasa bile.\nBu komut operserv.op iznini gerektirir."
  example:  "/msg %bot% OP #yardim Kullanici"
  done:     "\x0303✓\x03 \x02%nickname%\x02 artık \x02%channel%\x02 kanalında operatör."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#kanal> <rumuz>"
  short:    "Bir kullanıcının kanal operatörü yetkisini alır."
  help:     "Bir kanaldaki kullanıcının operatör yetkisini (-o) alır.\nRoot kullanıcıların ve rolü olan IRCop'ların yetkisi alınamaz.\nBu komut operserv.op iznini gerektirir."
  example:  "/msg %bot% DEOP #yardim Kullanici"
  done:     "\x0303✓\x03 \x02%nickname%\x02 artık \x02%channel%\x02 kanalında operatör değil."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#kanal> <modlar> [argümanlar]"
  short:          "Bir kanalda mod ayarlar."
  help:           "Belirtilen modları, gerekiyorsa argümanlarıyla birlikte bir kanalda ayarlar.\nModlar + veya - ile başlamalıdır.\nBu komut operserv.mode iznini gerektirir."
  example:        "/msg %bot% MODE #yardim +mk gizli"
  done:           "\x0303✓\x03 \x02%channel%\x02 kanalının modları \x02%modes%\x02 olarak ayarlandı."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 geçerli bir mod değişikliği değil. +modlar veya -modlar kullan."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#kanal>"
  short:    "Bir kanaldaki kısıtlayıcı modları kaldırır."
  help:     "Kanalın kilidini açmak için -imnpst modlarını kaldırır.\nAnahtarlar (+k) ve limitler (+l) değiştirilmez.\nBu komut operserv.mode iznini gerektirir."
  example:  "/msg %bot% LIMPIA #yardim"
  done:     "\x0303✓\x03 \x02%channel%\x02 kanalı temizlendi (modlar %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#kanal>"
  short:               "Seni bir kanala davet eder."
  help:                "Seni belirtilen kanala davet eder, kanal yalnızca davetliler için (+i) olsa bile.\nBu komut operserv.invite iznini gerektirir."
  example:             "/msg %bot% INVITE #yardim"
  done:                "\x0303✓\x03 \x02%channel%\x02 kanalı için davet gönderildi."
  already_on_channel:  "\x0304✗\x03 Zaten \x02%channel%\x02 kanalındasın."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Ağ istatistiklerini gösterir."
  help:     "Şu anda ağa bağlı olan kullanıcı sayısını gösterir.\nTüm IRC operatörleri kullanabilir."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Çevrimiçi kullanıcılar: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Bağlı IRC operatörlerini listeler."
  help:     "Şu anda ağa bağlı olan IRC operatörlerini rumuza göre listeler.\nTüm IRC operatörleri kullanabilir."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Bağlı IRC operatörleri (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Listenin sonu."
  empty:    "\x0310ℹ\x03 Bağlı IRC operatörü yok."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <rumuz>"
  short:    "Bir rumuzun klonlarını listeler."
  help:     "Bir rumuzun bağlandığı hostu ve aynı hosttan bağlanan diğer rumuzları gösterir.\nBağlantılar biliniyorsa gerçek IP'ye, aksi halde host adına göre gruplanır.\nBu komut operserv.clones iznini gerektirir."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "\x02%nickname%\x02 klonları (\x02%host%\x02), %count% bağlantı:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Listenin sonu."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 rumuzunun klonu yok (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <rumuz> [sebep]"
  short:    "Bir rumuzun klonlarını 1 saatlik G-Line ile kaldırır."
  help:     "Belirtilen rumuzun *@host adresine 1 saatlik G-Line koyar ve o hosttan gelen tüm bağlantıları keser.\nG-Line, GLINE LIST içinde görünür ve GLINE DEL ile kaldırılabilir.\nLocalhost ve Root kullanıcıları ya da rolü olan IRCop'larla paylaşılan hostlara asla G-Line uygulanmaz.\nBu komut operserv.clones iznini gerektirir."
  example:  "/msg %bot% KILLCLONES BadUser Klonlara izin verilmez"
  done:     "\x0303✓\x03 \x02%nickname%\x02 klonları kaldırıldı: G-Line \x02%mask%\x02, süre %duration% (%count% bağlantı). Sebep: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <rumuz> [sebep]"
  short:    "Bir rumuzun hostunu 5 saatlik G-Line ile engeller."
  help:     "Belirtilen rumuzun *@host adresine 5 saatlik G-Line koyar ve o hosttan gelen tüm bağlantıları keser.\nG-Line, GLINE LIST içinde görünür ve GLINE DEL ile kaldırılabilir.\nLocalhost ve Root kullanıcıları ya da rolü olan IRCop'larla paylaşılan hostlara asla G-Line uygulanmaz.\nBu komut operserv.clones iznini gerektirir."
  example:  "/msg %bot% BLOCK BadUser Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 engellendi: G-Line \x02%mask%\x02, süre %duration% (%count% bağlantı). Sebep: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 İzin reddedildi: \x02%host%\x02 yerel bir hosttur ve asla G-Line almaz."
  failed:         "\x0304✗\x03 \x02%mask%\x02 G-Line'ı uygulanamadı."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <en_az|host>"
  short:    "IP başına eşzamanlı bağlantıları gösterir."
  help:     "Her IP'den (IP bilinmiyorsa host adından) kaç eşzamanlı bağlantının etkin olduğunu gösterir.\nBu komut operserv.conexiones iznini gerektirir."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "En az <en_az> bağlantısı olan IP'leri listeler."
    help:             "En az <en_az> eşzamanlı etkin bağlantısı olan IP'leri, en çok bağlantısı olandan başlayarak listeler.\nEn az değeri 1'den büyük bir tam sayı olmalıdır."
    syntax:           "CONEXIONES LIST <en_az>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "En az \x02%minimum%\x02 eşzamanlı etkin bağlantısı olan IP'ler:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Listenin sonu."
    empty:            "\x0310ℹ\x03 En az \x02%minimum%\x02 eşzamanlı bağlantısı olan IP yok."
    invalid_minimum:  "\x0304✗\x03 Geçersiz en az değeri: 1'den büyük bir tam sayı olmalıdır."
  view:
    short:      "Bir IP'nin bağlantılarını gösterir."
    help:       "Bir IP veya host adından kaç eşzamanlı bağlantının etkin olduğunu gösterir."
    syntax:     "CONEXIONES VIEW <host>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 \x02%host%\x02 adresinden eşzamanlı etkin bağlantılar: \x02%count%\x02."
    not_found:  "\x0304✗\x03 \x02%host%\x02 için bağlantı bulunamadı."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <nick> <+/-modlar>"
  short:          "Bir nick'in kullanıcı modlarını değiştirir."
  help:           "Bağlı bir nick'e kullanıcı modu ekler veya kaldırır.\nYalnızca kendi rütbendeki veya daha alttaki modları kullanabilirsin: her IRCop kullanıcı modlarını, bir Operatör ayrıca s ve W'yi, bir Yönetici ayrıca H, q ve o'yu; Root ise hepsini.\nr ve h modları eklenemez veya kaldırılamaz.\nBu komut operserv.umode iznini gerektirir."
  example:        "/msg %bot% UMODE Kullanıcı +R"
  done:           "\x0303✓\x03 \x02%modes%\x02 modları \x02%nickname%\x02 kullanıcısına uygulandı."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 geçerli bir mod değişikliği değil. +modlar veya -modlar kullan."
  forbidden:      "\x0304✗\x03 r ve h modlarını ekleyemez veya kaldıramazsın."
  above_rank:     "\x0304✗\x03 Rütben \x02%modes%\x02 modlarını kullanmana izin vermiyor."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <nick>"
  short:    "Bir kullanıcıyı hapis kanalına kapatır."
  help:     "Bir kullanıcıyı tüm kanallarından çıkarır ve hapis kanalına (%channel%) koyar.\nHapisteyken başka bir kanala girerse çıkarılır, hapisten çıkarsa geri konur.\nUNJAIL ile veya bağlantısı kesildiğinde serbest kalır.\nRoot kullanıcıları ve rolü olan IRCop'lar hapsedilemez.\nBu komut operserv.jail iznini gerektirir."
  example:  "/msg %bot% JAIL Kullanıcı"
  done:     "\x0303✓\x03 \x02%nickname%\x02, \x02%channel%\x02 kanalına hapsedildi."
  already:  "\x0304✗\x03 \x02%nickname%\x02 zaten hapiste."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <nick>"
  short:       "Hapsedilmiş bir kullanıcıyı serbest bırakır."
  help:        "JAIL ile hapsedilmiş bir kullanıcıyı serbest bırakır: yeniden istediği kanala girebilir.\nBu komut operserv.jail iznini gerektirir."
  example:     "/msg %bot% UNJAIL Kullanıcı"
  done:        "\x0303✓\x03 \x02%nickname%\x02, \x02%channel%\x02 kanalından serbest bırakıldı."
  not_jailed:  "\x0304✗\x03 \x02%nickname%\x02 hapiste değil."
