# CReG translations — Romanian
# Domain: cregserv

unknown_command: "\x0304✗\x03 Comandă necunoscută \x02%command%\x02. Folosește \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Sintaxă incorectă. Utilizare: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Această comandă este rezervată operatorilor IRC."
  not_identified: "\x0304✗\x03 Nu ești identificat. Folosește \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permisiune refuzată. Nu ai acces la această comandă."

registra:
  syntax: "REGISTRA <#canal> <descriere>"
  short: "Cere aprobarea înregistrării unui canal."
  help: "Cere înregistrarea unui canal nou. Un operator de servicii verifică cererea și o aprobă sau o respinge; canalul se înregistrează doar după aprobare. Trebuie să fii identificat cu %nickserv%.\n\n\x02#canal:\x02 Canalul de înregistrat. Trebuie să înceapă cu #, să nu fie deja înregistrat (verifică-l cu comanda ESTADO) și să aibă cel mult 64 de caractere inclusiv #.\n\n\x02descriere:\x02 Tema sau scopul canalului, până la 255 de caractere. Aceasta este ceea ce operatorul ia în considerare la verificarea cererii.\n\nDupă trimitere, cererea rămâne în așteptare până când un operator de servicii o aprobă sau o respinge. Poți trimite o singură cerere la 24 de ore."
  example: "/msg CReG REGISTRA #mychannel un loc de conversație"
  requested: "\x0303✔\x03 Ai cerut înregistrarea canalului \x02%channel%\x02. Un operator de servicii va evalua cererea."
  invalid_channel: "\x0304✗\x03 Numele canalului trebuie să înceapă cu un \x02#\x02."
  channel_too_long: "\x0304✗\x03 Numele canalului este prea lung: cel mult \x0264\x02 caractere, inclusiv \x02#\x02."
  description_too_long: "\x0304✗\x03 Descrierea este prea lungă: cel mult \x02255\x02 caractere."
  already_registered: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja înregistrat."
  pending_deletion: "\x0304✗\x03 Canalul \x02%channel%\x02 este în curs de ștergere și nu poate fi înregistrat până la finalizarea ștergerii."
  duplicate: "\x0304✗\x03 Există deja o cerere de înregistrare pentru \x02%channel%\x02 în așteptarea aprobării. Folosește \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 Cererea de înregistrare pentru \x02%channel%\x02 a fost respinsă."
  throttled: "\x0304✗\x03 Trebuie să aștepți \x02%minutes%\x02 minut(e) înainte de a cere alt canal."

estado:
  syntax: "ESTADO <#canal>"
  short: "Arată starea de înregistrare a unui canal."
  help: "Indică în ce punct se află un canal în procesul de înregistrare.\n\nStările posibile sunt:\n    \x02ÎNREGISTRAT\x02: canalul este deja înregistrat la %chanserv%.\n    \x02ÎN VERIFICARE\x02: o cerere de înregistrare așteaptă ca un operator de servicii să o aprobe sau să o respingă.\n    \x02RESPINS\x02: cererea de înregistrare a fost respinsă.\n    \x02ÎN CURS DE ȘTERGERE\x02: canalul a fost dezafiliat și se află în perioada de grație a ștergerii; nu poate fi înregistrat din nou până la finalizarea ștergerii.\n    \x02FĂRĂ PROCES\x02: canalul nu are niciun proces de înregistrare."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 Canalul \x02%channel%\x02 este deja înregistrat."
  pending_deletion: "\x0304✗\x03 Canalul \x02%channel%\x02 este în curs de ștergere și nu poate fi înregistrat până la finalizarea ștergerii."
  pending: "\x0303◌\x03 Canalul \x02%channel%\x02 este în curs, în așteptarea verificării de către un operator de servicii (cerut la %date%)."
  denied: "\x0304✗\x03 Canalul \x02%channel%\x02 este respins din %date%. Motiv: %reason%"
  no_request: "\x0304✗\x03 Canalul \x02%channel%\x02 nu are niciun proces de înregistrare."

cancel:
  syntax: "CANCEL <#canal>"
  short: "Anulează cererea ta de înregistrare în așteptare pentru un canal."
  help: "Anulează o cerere de înregistrare a unui canal care nu a fost încă aprobată sau respinsă. Poți anula doar cererile tale proprii în așteptare.\n\n\x02#canal:\x02 Canalul a cărui cerere vrei să o anulezi. Cererea trebuie să fie cea pe care ai trimis-o tu și trebuie să fie încă în așteptare.\n\nDupă anulare, cererea este eliminată, iar numele canalului devine liber."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 Cererea ta de înregistrare pentru canalul \x02%channel%\x02 a fost anulată, iar numele canalului este din nou liber."
  invalid_channel: "\x0304✗\x03 Numele canalului trebuie să înceapă cu \x02#\x02."
  no_request: "\x0304✗\x03 Canalul \x02%channel%\x02 nu are niciun proces de înregistrare."
  not_yours: "\x0304✗\x03 Cererea de înregistrare pentru \x02%channel%\x02 nu îți aparține."
  not_pending: "\x0304✗\x03 Cererea de înregistrare pentru \x02%channel%\x02 a fost deja aprobată sau respinsă și nu poate fi anulată."

aprobar:
  syntax: "APROBAR <#canal>"
  short: "Aprobă o cerere de înregistrare a unui canal în așteptare."
  help: "Înregistrează un canal a cărui cerere așteaptă verificarea. Canalul se înregistrează pe numele utilizatorului care l-a cerut; niciunul dintre voi nu trebuie să fie înăuntru. Ai nevoie de permisiunea \x02cregserv.aprobar\x02.\n\n\x02#canal:\x02 Canalul cu cererea în așteptare. Folosește PENDIENTES pentru a vedea coada.\n\nOdată aprobat, canalul este înregistrat la \x02%chanserv%\x02, iar cererea este închisă."
  example: "/msg CReG APROBAR #canal"
  approved: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost înregistrat cu succes pentru \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 Numele canalului trebuie să înceapă cu un \x02#\x02."
  no_pending: "\x0304✗\x03 Canalul \x02%channel%\x02 nu se află într-un proces de înregistrare."
  already_registered: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja înregistrat la \x02%chanserv%\x02."
  already_approved: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja înregistrat."
  already_denied: "\x0304✗\x03 Canalul \x02%channel%\x02 nu poate fi înregistrat deoarece este marcat ca \x0304RESPINS\x03."
  failed: "\x0304✗\x03 Înregistrarea canalului \x02%channel%\x02 nu a putut fi finalizată."

denegar:
  syntax: "DENEGAR <#canal> <motiv>"
  short: "Respinge o cerere de înregistrare a unui canal în așteptare."
  help: "Respinge o cerere de înregistrare, lăsând numele canalului liber. Motivul este obligatoriu și este afișat de DENEGADOS. Ai nevoie de permisiunea \x02cregserv.denegar\x02.\n\n\x02#canal:\x02 Canalul cu cererea în așteptare.\n\x02motiv:\x02 De ce este respinsă cererea; este salvat și afișat oricui consultă DENEGADOS.\n\nNumele canalului rămâne liber pentru a fi cerut din nou după respingere."
  example: "/msg CReG DENEGAR #canal în afara subiectului"
  denied: "\x0303✔\x03 Înregistrarea canalului \x02%channel%\x02 a fost respinsă."
  invalid_channel: "\x0304✗\x03 Numele canalului trebuie să înceapă cu un \x02#\x02."
  no_pending: "\x0304✗\x03 Canalul \x02%channel%\x02 nu are niciun proces de înregistrare."
  already_approved: "\x0304✗\x03 Canalele deja înregistrate și aprobate nu pot fi respinse."
  already_denied: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja respins."

pendientes:
  syntax: "PENDIENTES"
  short: "Listează cererile de înregistrare a canalelor în așteptarea verificării."
  help: "Listează fiecare cerere de înregistrare așteptând evaluarea unui operator de servicii, arătând canalul, cine a cerut, data și descrierea. Ai nevoie de permisiunea \x02cregserv.pendientes\x02.\n\nAceastă comandă nu acceptă parametri."
  example: "/msg CReG PENDIENTES"
  empty: "Nu există canale în așteptarea verificării."
  line: "\x02Canal:\x02 %channel%, \x02Cerut de:\x02 %requester%, \x02Data:\x02 %date%, \x02Descriere:\x02 %description%"
  end: "Sfârșitul listei."

denegados:
  syntax: "DENEGADOS"
  short: "Listează cererile de înregistrare a canalelor care au fost respinse."
  help: "Listează fiecare cerere de înregistrare respinsă împreună cu motivul pentru care a fost respinsă. Ai nevoie de permisiunea \x02cregserv.denegados\x02.\n\nAceastă comandă nu acceptă parametri."
  example: "/msg CReG DENEGADOS"
  empty: "Nu există canale respinse."
  line: "\x02Canal:\x02 %channel%, \x02Motiv:\x02 %reason%"
  end: "Sfârșitul listei."

drop:
  syntax: "DROP <#canal>"
  short: "Elimină înregistrarea pe care \x02%bot%\x02 o păstrează pentru un canal."
  help: "Elimină înregistrarea pe care \x02%bot%\x02 o păstrează pentru un canal și, dacă acesta este înregistrat acolo, îl scoate și din \x02%chanserv%\x02. Ai nevoie de permisiunea \x02cregserv.drop\x02.\n\n\x02#canal:\x02 Canalul pe care vrei să-l elimini.\n\nScoaterea din \x02%chanserv%\x02 este una blândă: canalul intră într-o perioadă de grație a ștergerii în loc să fie șters imediat."
  example: "/msg CReG DROP #canal"
  dropped: "\x0303✔\x03 Înregistrarea canalului \x02%channel%\x02 a fost eliminată din \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost eliminat și intră acum în perioada de grație a ștergerii."
  invalid_channel: "\x0304✗\x03 Numele canalului trebuie să înceapă cu un \x02#\x02."
  no_request: "\x0304✗\x03 Canalul \x02%channel%\x02 nu este înregistrat la \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#canal> [descriere]"
  short: "Înregistrează un canal fără a fi înăuntru."
  help: "Înregistrează un canal la cererea staff-ului, fără a trece prin fluxul de cerere și aprobare. Nu trebuie să fii în canal și canalul nu trebuie să existe încă. Ai nevoie de permisiunea \x02cregserv.saregister\x02.\n\n\x02#canal:\x02 Canalul pe care vrei să-l înregistrezi.\n\x02descriere:\x02 Descriere opțională salvată cu înregistrarea."
  example: "/msg CReG SAREGISTER #canal un canal al staff-ului"
  done: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost înregistrat."
  invalid_channel: "\x0304✗\x03 Numele canalului trebuie să înceapă cu un \x02#\x02."
  pending_deletion: "\x0304✗\x03 Canalul \x02%channel%\x02 este în așteptarea ștergerii și nu poate fi înregistrat."
  already_registered: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja înregistrat."
  failed: "\x0304✗\x03 Înregistrarea canalului \x02%channel%\x02 nu a putut fi finalizată."

help:
  syntax:           "HELP [command]"
  short:            "Listează comenzile sau afișează ajutorul unei comenzi."
  help:             "Fără argumente listează toate comenzile. Folosește \x0303HELP <command>\x03 pentru ajutorul complet al unei comenzi."
  header_general:   "\x02\x0303%bot%\x03\x0F - \x0307%network%\x03"
  command_header:   "\x02\x0303%command%\x03\x0F - Ajutor pentru comanda %command%"
  intro: "%bot% se ocupă de preînregistrarea canalelor: îți primește cererea, o pune în analiză și, dacă administrația rețelei o aprobă, înregistrează canalul pe numele tău.\n\nComenzile se folosesc prin mesaj privat și fără prefix: scrie /msg %bot% comandă. Pentru mai multe informații despre o comandă anume, scrie /msg %bot% HELP comandă."
  general_header:   "\x02Comenzi pentru utilizatori:\x02"
  ircop_header:     "\x02Comenzi pentru operatori:\x02"
  command_line:     "   \x0303%command%\x03\x0F%description%"
  subcommand_line:  "   \x0303%command%\x03\x0F%description%"
  options_header:   "\x02Opțiuni:\x02"
  set_sub_footer:   "Folosește /msg %bot% HELP %command% <opțiune> pentru mai multe informații."
  syntax_label:     "\x02Sintaxă:\x02\n    \x0303/msg %bot% %syntax%\x03"
  example_label:    "\x02Exemplu:\x02\n    \x0303%example%\x03"
  warning: "\x02\x0304ATENȚIE:\x03\x0F %bot% face doar preînregistrarea canalelor. Fiecare cerere este analizată de administrația rețelei, care poate refuza înregistrarea dacă respectivul canal nu respectă regulile."
  footer_general:   "\x02SFÂRȘITUL AJUTORULUI pentru %bot%\x02"
  footer_command:   "\x02SFÂRȘITUL ajutorului pentru comanda %command%\x02"
  unknown_command:  "\x0307✗\x03 Comandă necunoscută \x02%command%\x02. Folosiți \x0303/msg %bot% HELP\x03."

ig:
  syntax: "IG {ADD|DEL|LIST} [#canal]"
  short: "Gestionează canalele de Interes General (IG)."
  help: "Marchează sau demarchează un canal înregistrat ca fiind de Interes General (IG). Înregistrarea canalului nu se schimbă: se salvează doar marcajul. Pentru a le prelua, folosește APODERA IG. Ai nevoie de permisiunea \x02cregserv.ig\x02."
  example: "/msg CReG IG ADD #Madrid"
  not_registered: "\x0304✗\x03 Canalul \x02%channel%\x02 nu este înregistrat."
  add:
    syntax: "IG ADD <#canal>"
    short: "Marchează un canal ca IG."
    help: "Marchează canalul înregistrat indicat ca fiind de Interes General."
    done: "\x0303✔\x03 Canalul \x02%channel%\x02 este acum de Interes General."
    already: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja de Interes General."
  del:
    syntax: "IG DEL <#canal>"
    short: "Elimină marcajul IG al unui canal."
    help: "Elimină marcajul de Interes General de pe canalul indicat."
    done: "\x0303✔\x03 Canalul \x02%channel%\x02 nu mai este de Interes General."
    not_marked: "\x0304✗\x03 Canalul \x02%channel%\x02 nu este de Interes General."
  list:
    syntax: "IG LIST"
    short: "Listează canalele IG."
    help: "Afișează toate canalele marcate ca fiind de Interes General."
    channels: "\x02Canale de Interes General:\x02 %channels%"
    empty: "Nu există canale de Interes General."

apodera:
  syntax: "APODERA [IG] <#canal> [nick]"
  short: "Preia un canal pentru administrație."
  help: "Schimbă fondatorul canalului cu nick-ul indicat sau, fără nick, cu tine, și scoate +q, +a, +o și +h tuturor, în afară de boți. Folosește APODERA pentru canalele obișnuite și APODERA IG pentru cele de Interes General (vezi IG). Servește pentru a interveni într-un canal sau pentru a-l recupera când nick-ul fondatorului expiră și ignoră limita de canale per nick. Ai nevoie de permisiunea \x02cregserv.apodera\x02."
  example: "/msg CReG APODERA IG #Madrid SitioChat"
  done: "\x0303✔\x03 Canalul \x02%channel%\x02 are acum ca fondator pe \x02%nickname%\x02."
  already_founder: "\x0304✗\x03 \x02%nickname%\x02 este deja fondatorul \x02%channel%\x02."
  not_registered: "\x0304✗\x03 Canalul \x02%channel%\x02 nu este înregistrat."
  not_ig: "\x0304✗\x03 Canalul \x02%channel%\x02 nu este de Interes General: folosește APODERA %channel%."
  is_ig: "\x0304✗\x03 Canalul \x02%channel%\x02 este de Interes General: folosește APODERA IG %channel%."
  founder_not_registered: "\x0304✗\x03 Nick-ul \x02%nickname%\x02 nu este înregistrat."
  founder_suspended: "\x0304✗\x03 Nick-ul \x02%nickname%\x02 este suspendat."

oficial:
  syntax: "OFICIAL <#canal> [fondator] [descriere]"
  short: "Înregistrează un canal oficial al rețelei."
  help: "Înregistrează un canal al rețelei înseși și îl marchează ca oficial; CHaN INFO îl afișează. Fără fondator, fondatorul este nickul rețelei; fără descriere, primește „Canal OFICIAL al rețelei”. Activează NOEXPIRE, iar limita de canale per nick nu se aplică. Fondatorul trebuie să fie înregistrat și nesuspendat. Ai nevoie de permisiunea \x02cregserv.oficial\x02."
  example: "/msg CReG OFICIAL #Ajutor"
  default_description: "Canal OFICIAL al rețelei"
  done: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost înregistrat ca oficial, cu \x02%nickname%\x02 ca fondator."
  invalid_channel: "\x0304✗\x03 Numele canalului trebuie să înceapă cu un \x02#\x02."
  already_registered: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja înregistrat."
  pending_deletion: "\x0304✗\x03 Canalul \x02%channel%\x02 este în așteptarea ștergerii și nu poate fi înregistrat."
  failed: "\x0304✗\x03 Înregistrarea canalului \x02%channel%\x02 nu a putut fi finalizată."
  founder_not_registered: "\x0304✗\x03 Nick-ul \x02%nickname%\x02 nu este înregistrat."
  founder_suspended: "\x0304✗\x03 Nick-ul \x02%nickname%\x02 este suspendat."
