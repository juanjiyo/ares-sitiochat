# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax:           "IRCOP {ADD|DEL|LIST} [nickname] [role]"
  short:            "Διαχείριση IRC operators του δικτύου."
  help:             "Διαχείριση IRC operators του δικτύου. ADD προσθέτει ένα καταχωρημένο\nψευδώνυμο ως operator με τον καθορισμένο ρόλο.\nDEL αφαιρεί έναν operator. LIST εμφανίζει όλους τους operators.\nΧρησιμοποιήστε ROLE LIST για να δείτε τους διαθέσιμους ρόλους.\nΑυτή η εντολή περιορίζεται σε Root χρήστες που έχουν διαμορφωθεί στις υπηρεσίες."
  example:          "/msg %bot% IRCOP ADD Alice helper"

  unknown_sub:      "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL, ή LIST."
  unknown_role:     "\x0304✗\x03 Ο ρόλος \x02%role%\x02 δεν υπάρχει. Χρησιμοποιήστε \x0303/msg %bot% ROLE LIST\x03 για να δείτε τους διαθέσιμους ρόλους."
  already_admin:    "\x0304✗\x03 Ο/Η \x02%nickname%\x02 είναι ήδη IRC operator (ρόλος: %role%)."
  not_admin:       "\x0304✗\x03 Ο/Η \x02%nickname%\x02 δεν είναι IRC operator."
  role_changed:     "\x0303✓\x03 Άλλαξε ο ρόλος για \x02%nickname%\x02 από %old% σε %new%."

  add:
    syntax:         "IRCOP ADD <nickname> <role>"
    short:          "Προσθήκη IRC operator δικτύου."
    help:           "Προσθέτει ένα καταχωρημένο ψευδώνυμο ως IRC operator δικτύου.\nΧρησιμοποιήστε ROLE LIST για να δείτε τους διαθέσιμους ρόλους.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:        "/msg %bot% IRCOP ADD Alice helper"
    done:           "\x0303✓\x03 Προστέθηκε ο/η \x02%nickname%\x02 ως \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι ενεργό καταχωρημένο ψευδώνυμο."

  del:
    syntax:         "IRCOP DEL <nickname>"
    short:          "Αφαίρεση IRC operator δικτύου."
    help:            "Αφαιρεί έναν IRC operator δικτύου από τη λίστα.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:         "/msg %bot% IRCOP DEL Alice"
    done:           "\x0303✓\x03 Αφαιρέθηκε ο/η \x02%nickname%\x02 από τους IRC operators."

  list:
    syntax:         "IRCOP LIST"
    short:          "Λίστα όλων των IRC operators δικτύου."
    help:            "Εμφανίζει όλους τους IRC operators δικτύου με τους ρόλους και την ημερομηνία καταχώρησης.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:         "/msg %bot% IRCOP LIST"
    header:         "\x0307---\x03 \x02IRC Operators Δικτύου\x02 \x0307---\x03"
    empty:          "Δεν υπάρχουν IRC operators."

# --- ROLE --------------------------------------------------------------------
role:
  operclass:
    syntax: "ROLE OPERCLASS {LIST|<role>} [{VIEW|SET}] [operclass]"
    short: "Manage Unreal operclass."
    help: "LIST εμφανίζει τις διαθέσιμες operclasses στο δίκτυο.\nVIEW εμφανίζει την operclass του ρόλου και τις διαθέσιμες.\nSET την αναθέτει κατά την ταυτοποίηση (OFF για αφαίρεση).\nΔιαθέσιμο μόνο σε πρωτόκολλα UnrealIRCd."
    example: "/msg %bot% ROLE OPERCLASS LIST"
    list:
      header: "\x0307---\x03 \x02Διαθέσιμες Operclasses στο Δίκτυο\x02 \x0307---\x03"
      empty: "Δεν υπάρχουν διαθέσιμες operclasses στο δίκτυο."
      not_supported: "\x0304✗\x03 Το τρέχον πρωτόκολλο δεν υποστηρίζει εμφάνιση διαθέσιμων operclasses."
    view:
      empty: "Ο ρόλος %role% δεν έχει operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Διαθέσιμες operclasses: \x0310%available%\x03"
    set:
      done: "Η operclass ορίστηκε για τον ρόλο %role%."
      cleared: "Η operclass αφαιρέθηκε από τον ρόλο %role%."
      not_available: "\x0304✗\x03 Η operclass \x02%operclass%\x02 δεν είναι διαθέσιμη στο δίκτυο. Διαθέσιμες operclasses: %available%."
  syntax:           "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <name> ..."
  short:            "Διαχείριση ρόλων operator."
  help:             "Διαχείριση ρόλων operator. ADD δημιουργεί νέο ρόλο, DEL τον αφαιρεί,\nLIST εμφανίζει όλους τους ρόλους, PERMS διαχειρίζεται άδειες για έναν ρόλο,\nMODES διαχειρίζεται λειτουργίες IRCOP, VHOST διαχειρίζεται μοτίβο\nαναγκαστικού vhost για έναν ρόλο.\nΟι προστατευμένοι ρόλοι (ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
  example:          "/msg %bot% ROLE ADD helper"
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <name> ..."
  help_operclass:   "Διαχείριση ρόλων operator. ADD δημιουργεί νέο ρόλο, DEL τον αφαιρεί,\nLIST εμφανίζει όλους τους ρόλους, PERMS διαχειρίζεται άδειες για έναν ρόλο,\nMODES διαχειρίζεται λειτουργίες IRCOP, VHOST διαχειρίζεται μοτίβο αναγκαστικού vhost,\nOPERCLASS διαχειρίζεται την Unreal operclass ενός ρόλου.\nΟι προστατευμένοι ρόλοι (ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."

  unknown_sub:      "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL, LIST, PERMS, MODES, ή VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL, LIST, PERMS, MODES, VHOST ή OPERCLASS."
  not_found:        "\x0304✗\x03 Ο ρόλος \x02%role%\x02 δεν υπάρχει."
  already_exists:   "\x0304✗\x03 Ο ρόλος \x02%role%\x02 υπάρχει ήδη."
  protected:        "\x0304✗\x03 Ο ρόλος \x02%role%\x02 είναι προστατευμένος και δεν μπορεί να διαγραφεί."

  add:
    syntax:         "ROLE ADD <name> [description]"
    short:          "Δημιουργία νέου ρόλου."
    help:            "Δημιουργεί έναν νέο προσαρμοσμένο ρόλο. Η περιγραφή είναι προαιρετική.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:         "/msg %bot% ROLE ADD helper"
    done:           "\x0303✓\x03 Δημιουργήθηκε ο ρόλος \x02%role%\x02."

  del:
    syntax:         "ROLE DEL <name>"
    short:          "Διαγραφή ρόλου."
    help:            "Διαγράφει έναν προσαρμοσμένο ρόλο. Οι προστατευμένοι ρόλοι\n(ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.\nΑν ο ρόλος έχει ανατεθειμένους operators,\nπρέπει να τους επανατοποθετήσετε πρώτα.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:         "/msg %bot% ROLE DEL helper"
    done:           "\x0303✓\x03 Διαγράφηκε ο ρόλος \x02%role%\x02."

  list:
    syntax:         "ROLE LIST"
    short:          "Λίστα όλων των ρόλων."
    help:            "Εμφανίζει όλους τους ρόλους. Οι προστατευμένοι ρόλοι\nσημειώνονται με [ΠΡΟΣΤΑΤΕΥΜΕΝΟΣ].\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:         "/msg %bot% ROLE LIST"
    header:         "\x0307---\x03 \x02Ρόλοι Operator\x02 \x0307---\x03"
    empty:          "Δεν υπάρχουν ρόλοι operator."

  perms:
    syntax:         "ROLE PERMS <role> {LIST|ADD|DEL|CLEAR} [permission|ALL]"
    short:          "Διαχείριση αδειών ρόλου."
    help:            "Διαχείριση αδειών που ανατίθενται σε έναν ρόλο.\nLIST εμφανίζει όλες τις άδειες για τον ρόλο.\nADD αναθέτει μια άδεια στον ρόλο.\nDEL αφαιρεί μια άδεια από τον ρόλο (όχι για προστατευμένους ρόλους).\nCLEAR αφαιρεί όλες τις άδειες από τον ρόλο.\nΧρησιμοποιήστε ALL για να προσθέσετε όλες τις διαθέσιμες άδειες ταυτόχρονα.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:         "/msg %bot% ROLE PERMS helper ADD operserv.kill"
    not_found:       "\x0304✗\x03 Η άδεια \x02%perm%\x02 δεν υπάρχει."
    already_has:     "\x0304✗\x03 Ο ρόλος \x02%role%\x02 έχει ήδη την άδεια \x02%perm%\x02."
    does_not_have:   "\x0304✗\x03 Ο ρόλος \x02%role%\x02 δεν έχει την άδεια \x02%perm%\x02."

    list:
      header:        "\x0307---\x03 \x02Άδειες για %role%\x02 \x0307---\x03"

    add:
      done:         "\x0303✓\x03 Προστέθηκε η άδεια \x02%perm%\x02 στον ρόλο \x02%role%\x02."
      all_done:     "\x0303✓\x03 Προστέθηκαν \x02%count%\x02 άδειες στον ρόλο \x02%role%\x02."

    del:
      done:         "\x0303✓\x03 Αφαιρέθηκε η άδεια \x02%perm%\x02 από τον ρόλο \x02%role%\x02."

    clear:
      done:         "\x0303✓\x03 Αφαιρέθηκαν \x02%count%\x02 άδειες από τον ρόλο \x02%role%\x02."
      empty:        "\x0304✗\x03 Ο ρόλος \x02%role%\x02 δεν έχει ανατεθειμένες άδειες."

  modes:
    syntax:         "ROLE MODES <role> {VIEW|SET} [modes]"
    short:          "Διαχείριση λειτουργιών χρήστη IRCOP για τον ρόλο."
    help:            "Διαχείριση λειτουργιών χρήστη IRCOP που ανατίθενται σε έναν ρόλο.\nVIEW εμφανίζει τις τρέχουσες λειτουργίες του ρόλου.\nSET ορίζει τις λειτουργίες IRCOP (π.χ., oH για +oH).\nΟι χρήστες με αυτόν τον ρόλο θα λαμβάνουν αυτές τις λειτουργίες κατά την ταυτοποίηση.\nΔιαθέσιμες λειτουργίες ανά IRCD: UnrealIRCd (H, q, s, W), InspIRCd (s).\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:         "/msg %bot% ROLE MODES helper SET oH"

    view:
      header:        "\x0307---\x03 \x02Λειτουργίες για %role%\x02 \x0307---\x03"
      empty:        "Ο ρόλος \x02%role%\x02 δεν έχει ανατεθειμένες λειτουργίες."
      line:         "  Λειτουργίες: \x0303%modes%\x03"

    set:
      done:         "\x0303✓\x03 Ορίστηκαν οι λειτουργίες \x02%modes%\x02 για τον ρόλο \x02%role%\x02."
      cleared:      "\x0303✓\x03 Αφαιρέθηκαν όλες οι λειτουργίες από τον ρόλο \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 Η λειτουργία \x02%mode%\x02 δεν είναι έγκυρη λειτουργία IRCOP."
      invalid_modes: "\x0304✗\x03 Μη έγκυρες λειτουργίες: %invalid%. Έγκυρες λειτουργίες: %valid%."
      no_irc_user_modes: "\x0304✗\x03 Το τρέχον IRCD δεν έχει διαμορφωμένες λειτουργίες IRCOP."

  vhost:
    syntax:         "ROLE VHOST <role> {VIEW|SET} [pattern]"
    short:          "Διαχείριση μοτίβου αναγκαστικού vhost για έναν ρόλο."
    help:           "Διαχείριση αναγκαστικού vhost που ανατίθεται σε έναν ρόλο.\nVIEW εμφανίζει το τρέχον μοτίβο αναγκαστικού vhost.\nSET αναθέτει ένα μοτίβο αναγκαστικού vhost (οι χρήστες με αυτόν τον ρόλο\nθα λαμβάνουν αυτό το vhost κατά την ταυτοποίηση,\nπαρακάμπτοντας το προσωπικό vhost).\nΤο μοτίβο προσαρτάται μετά το καθαρισμένο ψευδώνυμο, π.χ.:\n  Nick: _davidlig_ → Μοτίβο: admin.ares → VHost: davidlig.admin.ares\nΈγκυροι χαρακτήρες: a-z, A-Z, 0-9, παύλα (-) και τελεία (.).\nΠρέπει να έχει τουλάχιστον μία τελεία, δεν μπορεί να ξεκινά/τελειώνει\nμε - ή . ή να έχει ..\nΧρησιμοποιήστε OFF για εκκαθάριση του μοτίβου αναγκαστικού vhost.\nΑυτή η εντολή περιορίζεται σε Root χρήστες."
    example:        "/msg %bot% ROLE VHOST helper SET staff.example.com"

    view:
      header:        "\x0307---\x03 \x02Αναγκαστικό vhost για %role%\x02 \x0307---\x03"
      empty:        "Ο ρόλος \x02%role%\x02 δεν έχει ορισμένο μοτίβο αναγκαστικού vhost."
      line:         "  Μοτίβο: \x0303%pattern%\x03"
      example:      "  Παράδειγμα: \x02nickname\x02.%pattern%"

    set:
      done:         "\x0303✓\x03 Ορίστηκε μοτίβο αναγκαστικού vhost για τον ρόλο \x02%role%\x02."
      cleared:      "\x0303✓\x03 Αφαιρέθηκε το μοτίβο αναγκαστικού vhost από τον ρόλο \x02%role%\x02."
      invalid:      "\x0304✗\x03 Μη έγκυρο μοτίβο vhost. Έγκυροι χαρακτήρες: a-z, A-Z, 0-9, - και .. Πρέπει να έχει τουλάχιστον μία τελεία, δεν μπορεί να ξεκινά/τελειώνει με - ή . ή να έχει .."

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <nickname> <reason>"
  short:            "Αναγκαστική αποσύνδεση χρήστη από το δίκτυο."
  help:             "Αποσυνδέει έναν χρήστη από το δίκτυο IRC.\nΟι IRCops και οι Root χρήστες δεν μπορούν να γίνουν kill.\nΑυτή η εντολή απαιτεί την άδεια operserv.kill."
  example:          "/msg %bot% KILL BadUser Flooding σε κανάλια"
  user_not_online:  "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι συνδεδεμένο."
  protected_root:   "\x0304✗\x03 Δεν μπορεί να γίνει kill ο Root χρήστης \x02%nickname%\x02."
  protected_ircop:  "\x0304✗\x03 Δεν μπορεί να γίνει kill ο IRC operator \x02%nickname%\x02."
  done:             "\x0303✓\x03 Ο χρήστης \x02%nickname%\x02 έχει γίνει kill (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST} [mask] [expiry] [reason]"
  short:            "Διαχείριση G-lines σε όλο το δίκτυο."
  help:             "Διαχείριση G-lines σε όλο το δίκτυο (καθολικοί αποκλεισμοί).\nADD προσθέτει νέο G-line με μάσκα, λήξη και αιτία.\nDEL αφαιρεί ένα G-line με μάσκα ή αριθμό καταχώρησης.\nLIST εμφανίζει όλα τα G-lines, προαιρετικά φιλτραρισμένα κατά μάσκα.\n\nΜορφή λήξης: 0=μόνιμο, ή χρήση κατάληξης d, h, m (π.χ., 7d, 12h, 30m).\nΤα GLINE που ταιριάζουν με Root ή IRCop χρήστες απορρίπτονται.\nΑυτή η εντολή απαιτεί την άδεια operserv.gline."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Μαζική διαφήμιση"
  unknown_sub:      "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL, ή LIST."
  invalid_mask:     "\x0304✗\x03 Μη έγκυρη μορφή μάσκας. Πρέπει να είναι στη μορφή user@host (π.χ., *@192.168.*)."
  global_mask:      "\x0304✗\x03 Η μάσκα G-line \x02%mask%\x02 είναι πολύ ευρεία. Οι καθολικές μάσκες δεν επιτρέπονται."
  dangerous_mask:   "\x0304✗\x03 Η μάσκα G-line \x02%mask%\x02 είναι πολύ ευρεία. Το τμήμα host χρειάζεται τουλάχιστον 4 αλφαριθμητικούς χαρακτήρες."
  protected_user:   "\x0304✗\x03 Δεν μπορεί να μπει G-line σε προστατευμένο χρήστη \x02%nickname%\x02."
  invalid_expiry:   "\x0304✗\x03 Μη έγκυρη μορφή λήξης. Χρησιμοποιήστε 0 για μόνιμο, ή τιμή όπως 7d, 12h, 30m."
  already_exists:   "\x0304✗\x03 Το G-line για \x02%mask%\x02 υπάρχει ήδη."
  max_entries:      "\x0304✗\x03 Επιτεύχθηκε ο μέγιστος αριθμός G-lines (%max%)."
  not_found:        "\x0304✗\x03 Το G-line \x02%mask%\x02 δεν βρέθηκε."
  user_not_found:   "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι online."
  permanent:        "μόνιμο"

  add:
    syntax:         "GLINE ADD <mask> <expiry> <reason>"
    short:          "Προσθήκη G-line σε όλο το δίκτυο."
    help:           "Προσθέτει ένα G-line σε όλο το δίκτυο (καθολικός αποκλεισμός).\nΗ μάσκα πρέπει να είναι στη μορφή user@host.\nΛήξη: 0=μόνιμο, ή χρήση κατάληξης d, h, m (π.χ., 7d, 12h, 30m).\nΤα GLINE που ταιριάζουν με Root ή IRCop χρήστες απορρίπτονται.\nΑυτή η εντολή απαιτεί την άδεια operserv.gline."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Μαζική διαφήμιση"
    done:           "\x0303✓\x03 Προστέθηκε G-line: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <mask|number>"
    short:          "Αφαίρεση G-line."
    help:           "Αφαιρεί ένα G-line από τη λίστα.\nΜπορείτε να καθορίσετε τη μάσκα ή τον αριθμό καταχώρησης από το LIST.\nΑυτή η εντολή απαιτεί την άδεια operserv.gline."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 Το G-line \x02%mask%\x02 αφαιρέθηκε."

  list:
    syntax:         "GLINE LIST [mask]"
    short:          "Λίστα όλων των G-lines."
    help:           "Εμφανίζει όλα τα G-lines. Προαιρετικά φιλτράρισμα κατά μοτίβο μάσκας.\nΑυτή η εντολή απαιτεί την άδεια operserv.gline."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-lines (%count%) \x0307---\x03"
    empty:          "Δεν υπάρχουν G-lines."
    no_reason:      "Χωρίς αιτία"
    never_expires:  "Μόνιμο"
    unknown_creator: "άγνωστος"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, λήγει: %expiration%)"

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [χώρα] [λόγος]"
  short:            "Διαχείριση λίστας απαγορευμένων χωρών."
  help:             "Διαχείριση των χωρών που απαγορεύονται στην πύλη του δικτύου.\nΟ δαίμωνας IRC προσδιορίζει τη χώρα κάθε συνδεόμενου πελάτη, οπότε μια απαγορευμένη χώρα απορρίπτεται ήδη κατά τη σύνδεση.\nADD καταχωρεί έναν κωδικό χώρας με τον λόγο του.\nDEL αφαιρεί μια χώρα από τη λίστα.\nLIST δείχνει τις απαγορευμένες χώρες με τον λόγο και την ημερομηνία καταχώρησης.\nΑυτή η εντολή απαιτεί την άδεια operserv.geoip."
  example:          "/msg %bot% GEOIP ADD ES Δεν επιτρέπεται σε αυτό το δίκτυο"
  unknown_sub:      "\x0304✗\x03 Άγνωστη υποεντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL ή LIST."
  unknown_country:  "\x0304✗\x03 Ο κωδικός χώρας \x02%country%\x03 δεν είναι έγκυρος κωδικός ISO 3166-1 alpha-2."
  already_exists:   "\x0304✗\x03 Η χώρα \x02%country%\x03 είναι ήδη απαγορευμένη."
  not_found:        "\x0304✗\x03 Η χώρα \x02%country%\x03 δεν είναι απαγορευμένη."
  default_reason:   "Χώρα απαγορευμένη από την πολιτική του δικτύου"

  add:
    syntax:         "GEOIP ADD <χώρα> [λόγος]"
    short:          "Απαγόρευση χώρας στην πύλη του δικτύου."
    help:           "Απαγορεύει κάθε πελάτη που συνδέεται από τη δεδομένη χώρα.\nΟ κωδικός χώρας πρέπει να είναι κωδικός ISO 3166-1 alpha-2.\nΟ λόγος εμφανίζεται στους απορριπτόμενους πελάτες και μπορεί να παραλειφθεί.\nΑυτή η εντολή απαιτεί την άδεια operserv.geoip."
    example:        "/msg %bot% GEOIP ADD ES Δεν επιτρέπεται σε αυτό το δίκτυο"
    done:           "\x0303✓\x03 Η χώρα \x02%country%\x03 απαγορεύτηκε - %reason%"

  del:
    syntax:         "GEOIP DEL <χώρα>"
    short:          "Κατάργηση απαγόρευσης χώρας."
    help:           "Αφαιρεί μια χώρα από τη λίστα απαγορευμένων χωρών.\nΑυτή η εντολή απαιτεί την άδεια operserv.geoip."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 Η απαγόρευση της χώρας \x02%country%\x03 καταργήθηκε."

  list:
    syntax:         "GEOIP LIST"
    short:          "Λίστα απαγορευμένων χωρών."
    help:           "Δείχνει όλες τις απαγορευμένες χώρες με τον λόγο και την ημερομηνία καταχώρησης.\nΑυτή η εντολή απαιτεί την άδεια operserv.geoip."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Απαγορευμένες χώρες (%count%)\x02 \x0307---\x03"
    empty:          "Δεν υπάρχουν απαγορευμένες χώρες."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, καταχωρήθηκε: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <line>"
  short:            "Αποστολή ακατέργαστης γραμμής πρωτοκόλλου στο IRCd."
  help:             "Στέλνει τη δοσμένη γραμμή απευθείας στο socket του uplink IRCd.\nΧρησιμοποιήστε με εξαιρετική προσοχή. Μη έγκυρες γραμμές πρωτοκόλλου\nμπορεί να καταρρεύσουν το δίκτυο.\nΑυτή η εντολή απαιτεί την άδεια operserv.raw."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Πρέπει να καθορίσετε μια μη κενή γραμμή για αποστολή."
  too_long:         "\x0304✗\x03 Η γραμμή είναι πολύ μεγάλη. Μέγιστο 510 χαρακτήρες."
  not_connected:    "\x0304✗\x03 Δεν υπάρχει σύνδεση με το IRCd."
  done:             "\x0303✓\x03 Ακατέργαστη γραμμή στάλθηκε."
  protocol:
    syntax: "\x0304✗\x03 Το ενεργό πρωτόκολλο απέρριψε τη σύνταξη της εντολής RAW."
    done: "\x0303✓\x03 Η εντολή RAW του πρωτοκόλλου εκτελέστηκε."
    target: "\x0304✗\x03 Το ενεργό πρωτόκολλο απέρριψε τον στόχο %target%."
    unsupported: "\x0304✗\x03 Το ενεργό πρωτόκολλο δεν υποστηρίζει αυτή την εντολή RAW."
    invalid_resource_type: "\x0304✗\x03 Άγνωστος τύπος πόρου πρωτοκόλλου: %resource_type%."
    invalid_resource: "\x0304✗\x03 Μη έγκυρος πόρος πρωτοκόλλου: %resource%."
    invalid_value: "\x0304✗\x03 Μη έγκυρη τιμή για τον πόρο πρωτοκόλλου: %resource%."
    error: "\x0304✗\x03 Το ενεργό πρωτόκολλο δεν μπόρεσε να εκτελέσει την εντολή RAW."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator% εκτελεί την εντολή %command% σε %target%. %reason%"
  actionWithDuration: "%operator% εκτελεί την εντολή %command% σε %target%. Διάρκεια: %duration%. %reason%"
  prefix_reason:    "Αιτία: %reason%"
  prefix_message:   "Μήνυμα: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Διαχείριση μηνυμάτων MOTD που στέλνονται στους χρήστες κατά τη σύνδεση."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [args]"
  help:             "Διαχείριση καταχωρήσεων Message Of The Day που στέλνονται στους χρήστες όταν συνδέονται στο δίκτυο.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Καλώς ήρθες στο δίκτυο!"
  unknown_sub:      "\x0304✗\x03 Άγνωστη υπο-εντολή. Χρησιμοποιήστε: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <expiry> <message>"
    syntax_hint:    "\x0304✗\x03 Χρήση: \x02%syntax%\x02"
    short:          "Προσθήκη καταχώρησης MOTD."
    help:           "Προσθέτει ένα νέο μήνυμα MOTD που θα στέλνεται σε κάθε χρήστη όταν συνδέεται στο δίκτυο.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Καλώς ήρθες στο δίκτυο!"
    done:           "\x0303✓\x03 Προστέθηκε καταχώρηση MOTD #%id%."
    invalid_type:   "\x0304✗\x03 Μη έγκυρος τύπος μηνύματος. Πρέπει να είναι \x02PRIVMSG\x02 ή \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Μη έγκυρη μορφή λήξης. Χρησιμοποιήστε: \x02<number><s|m|h|d>\x02 (π.χ., 30s, 5m, 24h, 7d)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Χρήση: \x02%syntax%\x02"
    short:          "Διαγραφή καταχώρησης MOTD."
    help:           "Διαγράφει μια καταχώρηση MOTD με το ID της.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 Διαγράφηκε η καταχώρηση MOTD #%id%."
    not_found:      "\x0304✗\x03 Η καταχώρηση MOTD δεν βρέθηκε."
  list:
    syntax:         "MOTD LIST"
    short:          "Λίστα όλων των καταχωρήσεων MOTD."
    help:           "Εμφανίζει όλες τις διαμορφωμένες καταχωρήσεις MOTD.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Δεν υπάρχουν διαμορφωμένες καταχωρήσεις MOTD."
    header:         "Καταχωρήσεις MOTD:"
    status_enabled: "\x0303ενεργή\x03"
    status_disabled: "\x0304ανενεργή\x03"
    expired:        "\x0304έληξε\x03"
    no_bot:         "(χωρίς bot)"
    never:          "ποτέ"
    shown_count:    "εμφανίστηκε %count% φορές"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Αφαίρεση όλων των ληγμένων καταχωρήσεων MOTD."
    help:           "Αφαιρεί όλες τις καταχωρήσεις MOTD των οποίων ο χρόνος λήξης έχει παρέλθει.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 Αφαιρέθηκαν %count% ληγμένες καταχωρήσεις MOTD."
    none:           "\x0303✓\x03 Δεν υπάρχουν ληγμένες καταχωρήσεις MOTD προς αφαίρεση."
  debug:
    finalized:      "Το μήνυμα MOTD #%id% ολοκληρώθηκε: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 Το \x02%channel%\x02 δεν είναι έγκυρο όνομα καναλιού· πρέπει να ξεκινά με \x02#\x02."
  not_found:            "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν υπάρχει στο δίκτυο."
  user_not_online:      "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι συνδεδεμένο."
  user_not_on_channel:  "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν βρίσκεται στο \x02%channel%\x02."
  protected_root:       "\x0304✗\x03 Δεν επιτρέπεται: ο \x02%nickname%\x02 είναι χρήστης Root."
  protected_ircop:      "\x0304✗\x03 Δεν επιτρέπεται: ο \x02%nickname%\x02 είναι διαχειριστής IRC."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#κανάλι> <ψευδώνυμο> [αιτία]"
  short:    "Αποβολή χρήστη από κανάλι."
  help:     "Αποβάλλει έναν χρήστη από κανάλι ως διαχειριστής δικτύου.\nΑν δεν δοθεί αιτία, χρησιμοποιείται μια προεπιλεγμένη.\nΟι χρήστες Root και οι IRCops με ρόλο δεν μπορούν να αποβληθούν.\nΑυτή η εντολή απαιτεί την άδεια operserv.kick."
  example:  "/msg %bot% KICK #help BadUser Σταμάτα το flood"
  done:     "\x0303✓\x03 Ο \x02%nickname%\x02 αποβλήθηκε από το \x02%channel%\x02. Αιτία: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#κανάλι> <ψευδώνυμο>"
  short:    "Δίνει κατάσταση διαχειριστή καναλιού σε χρήστη."
  help:     "Δίνει κατάσταση διαχειριστή (+o) σε χρήστη ενός καναλιού, ακόμη κι αν το κανάλι δεν είναι καταχωρημένο.\nΑυτή η εντολή απαιτεί την άδεια operserv.op."
  example:  "/msg %bot% OP #help Χρήστης"
  done:     "\x0303✓\x03 Ο \x02%nickname%\x02 είναι πλέον διαχειριστής στο \x02%channel%\x02."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#κανάλι> <ψευδώνυμο>"
  short:    "Αφαιρεί την κατάσταση διαχειριστή καναλιού από χρήστη."
  help:     "Αφαιρεί την κατάσταση διαχειριστή (-o) από χρήστη ενός καναλιού.\nΣτους χρήστες Root και στους IRCops με ρόλο δεν μπορεί να αφαιρεθεί.\nΑυτή η εντολή απαιτεί την άδεια operserv.op."
  example:  "/msg %bot% DEOP #help Χρήστης"
  done:     "\x0303✓\x03 Ο \x02%nickname%\x02 δεν είναι πλέον διαχειριστής στο \x02%channel%\x02."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#κανάλι> <λειτουργίες> [ορίσματα]"
  short:          "Ορίζει λειτουργίες σε κανάλι."
  help:           "Ορίζει τις δοσμένες λειτουργίες σε κανάλι, ακολουθούμενες από τα ορίσματά τους όταν χρειάζονται.\nΟι λειτουργίες πρέπει να ξεκινούν με + ή -.\nΑυτή η εντολή απαιτεί την άδεια operserv.mode."
  example:        "/msg %bot% MODE #help +mk μυστικό"
  done:           "\x0303✓\x03 Οι λειτουργίες του \x02%channel%\x02 ορίστηκαν σε \x02%modes%\x02."
  invalid_modes:  "\x0304✗\x03 Το \x02%modes%\x02 δεν είναι έγκυρη αλλαγή λειτουργιών. Χρησιμοποίησε +λειτουργίες ή -λειτουργίες."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#κανάλι>"
  short:    "Αφαιρεί τις περιοριστικές λειτουργίες από κανάλι."
  help:     "Αφαιρεί τις λειτουργίες -imnpst από κανάλι για να το ξεκλειδώσει.\nΤα κλειδιά (+k) και τα όρια (+l) δεν αλλάζουν.\nΑυτή η εντολή απαιτεί την άδεια operserv.mode."
  example:  "/msg %bot% LIMPIA #help"
  done:     "\x0303✓\x03 Το κανάλι \x02%channel%\x02 καθαρίστηκε (λειτουργίες %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#κανάλι>"
  short:               "Σε προσκαλεί σε κανάλι."
  help:                "Σε προσκαλεί στο δοσμένο κανάλι, ακόμη κι αν είναι μόνο με πρόσκληση (+i).\nΑυτή η εντολή απαιτεί την άδεια operserv.invite."
  example:             "/msg %bot% INVITE #help"
  done:                "\x0303✓\x03 Η πρόσκληση στο \x02%channel%\x02 στάλθηκε."
  already_on_channel:  "\x0304✗\x03 Βρίσκεσαι ήδη στο \x02%channel%\x02."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Εμφάνιση στατιστικών του δικτύου."
  help:     "Εμφανίζει τον αριθμό των χρηστών που είναι συνδεδεμένοι στο δίκτυο αυτή τη στιγμή.\nΔιαθέσιμη σε όλους τους IRC operators."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Συνδεδεμένοι χρήστες: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Λίστα των συνδεδεμένων IRC operators."
  help:     "Εμφανίζει, ανά ψευδώνυμο, τους IRC operators που είναι συνδεδεμένοι αυτή τη στιγμή.\nΔιαθέσιμη σε όλους τους IRC operators."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Συνδεδεμένοι IRC operators (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Τέλος λίστας."
  empty:    "\x0310ℹ\x03 Δεν υπάρχουν συνδεδεμένοι IRC operators."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <ψευδώνυμο>"
  short:    "Λίστα των κλώνων ενός ψευδωνύμου."
  help:     "Εμφανίζει το host από το οποίο συνδέεται ένα ψευδώνυμο και τα άλλα ψευδώνυμα που συνδέονται από το ίδιο host.\nΟι συνδέσεις ομαδοποιούνται κατά πραγματική IP όταν είναι γνωστή, αλλιώς κατά hostname.\nΑυτή η εντολή απαιτεί την άδεια operserv.clones."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "Κλώνοι του \x02%nickname%\x02 (\x02%host%\x02), %count% συνδέσεις:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Τέλος λίστας."
  none:     "\x0310ℹ\x03 Ο \x02%nickname%\x02 δεν έχει κλώνους (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <ψευδώνυμο> [αιτία]"
  short:    "Αφαιρεί τους κλώνους ενός ψευδωνύμου με G-Line 1 ώρας."
  help:     "Ορίζει G-Line 1 ώρας στο *@host του ψευδωνύμου, αποσυνδέοντας όλες τις συνδέσεις από αυτό το host.\nΗ G-Line εμφανίζεται στο GLINE LIST και αφαιρείται με GLINE DEL.\nΤο localhost και τα hosts που μοιράζονται με χρήστες Root ή IRCops με ρόλο δεν δέχονται ποτέ G-Line.\nΑυτή η εντολή απαιτεί την άδεια operserv.clones."
  example:  "/msg %bot% KILLCLONES BadUser Δεν επιτρέπονται κλώνοι"
  done:     "\x0303✓\x03 Οι κλώνοι του \x02%nickname%\x02 αφαιρέθηκαν: G-Line \x02%mask%\x02 για %duration% (%count% συνδέσεις). Αιτία: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <ψευδώνυμο> [αιτία]"
  short:    "Αποκλείει το host ενός ψευδωνύμου με G-Line 5 ωρών."
  help:     "Ορίζει G-Line 5 ωρών στο *@host του ψευδωνύμου, αποσυνδέοντας όλες τις συνδέσεις από αυτό το host.\nΗ G-Line εμφανίζεται στο GLINE LIST και αφαιρείται με GLINE DEL.\nΤο localhost και τα hosts που μοιράζονται με χρήστες Root ή IRCops με ρόλο δεν δέχονται ποτέ G-Line.\nΑυτή η εντολή απαιτεί την άδεια operserv.clones."
  example:  "/msg %bot% BLOCK BadUser Spam"
  done:     "\x0303✓\x03 Ο \x02%nickname%\x02 αποκλείστηκε: G-Line \x02%mask%\x02 για %duration% (%count% συνδέσεις). Αιτία: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Δεν επιτρέπεται: το \x02%host%\x02 είναι τοπικό host και δεν δέχεται ποτέ G-Line."
  failed:         "\x0304✗\x03 Δεν ήταν δυνατή η εφαρμογή της G-Line \x02%mask%\x02."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <ελάχιστο|host>"
  short:    "Εμφανίζει τις ταυτόχρονες συνδέσεις ανά IP."
  help:     "Εμφανίζει πόσες ταυτόχρονες συνδέσεις είναι ενεργές από κάθε IP (ή hostname όταν η IP είναι άγνωστη).\nΑυτή η εντολή απαιτεί την άδεια operserv.conexiones."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "Λίστα των IP με τουλάχιστον <ελάχιστο> συνδέσεις."
    help:             "Εμφανίζει τις IP με τουλάχιστον <ελάχιστο> ταυτόχρονες ενεργές συνδέσεις, πρώτα όσες έχουν τις περισσότερες.\nΤο ελάχιστο πρέπει να είναι ακέραιος μεγαλύτερος από 1."
    syntax:           "CONEXIONES LIST <ελάχιστο>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "IP με τουλάχιστον \x02%minimum%\x02 ταυτόχρονες ενεργές συνδέσεις:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Τέλος λίστας."
    empty:            "\x0310ℹ\x03 Καμία IP δεν έχει τουλάχιστον \x02%minimum%\x02 ταυτόχρονες συνδέσεις."
    invalid_minimum:  "\x0304✗\x03 Μη έγκυρο ελάχιστο: πρέπει να είναι ακέραιος μεγαλύτερος από 1."
  view:
    short:      "Εμφανίζει τις συνδέσεις μιας IP."
    help:       "Εμφανίζει πόσες ταυτόχρονες συνδέσεις είναι ενεργές από μια IP ή ένα hostname."
    syntax:     "CONEXIONES VIEW <host>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 Ταυτόχρονες ενεργές συνδέσεις του \x02%host%\x02: \x02%count%\x02."
    not_found:  "\x0304✗\x03 Δεν βρέθηκαν συνδέσεις για το \x02%host%\x02."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <nick> <+/-modes>"
  short:          "Αλλάζει τα modes χρήστη ενός nick."
  help:           "Ορίζει ή αφαιρεί modes χρήστη σε ένα συνδεδεμένο nick.\nΜπορείς να χρησιμοποιήσεις μόνο τα modes της βαθμίδας σου ή κατώτερης: κάθε IRCop τα modes χρήστη, ένας Operator επίσης τα s και W, ένας Administrator επίσης τα H, q και o· ο Root οποιοδήποτε.\nΤα modes r και h δεν μπορούν να οριστούν ή να αφαιρεθούν.\nΑυτή η εντολή απαιτεί το δικαίωμα operserv.umode."
  example:        "/msg %bot% UMODE Χρήστης +R"
  done:           "\x0303✓\x03 Τα modes \x02%modes%\x02 εφαρμόστηκαν στο \x02%nickname%\x02."
  invalid_modes:  "\x0304✗\x03 Το \x02%modes%\x02 δεν είναι έγκυρη αλλαγή modes. Χρησιμοποίησε +modes ή -modes."
  forbidden:      "\x0304✗\x03 Δεν μπορείς να ορίσεις ή να αφαιρέσεις τα modes r και h."
  above_rank:     "\x0304✗\x03 Η βαθμίδα σου δεν σου επιτρέπει τα modes \x02%modes%\x02."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <nick>"
  short:    "Φυλακίζει έναν χρήστη στο κανάλι φυλακής."
  help:     "Βγάζει έναν χρήστη από όλα τα κανάλια του και τον βάζει στο κανάλι φυλακής (%channel%).\nΌσο είναι φυλακισμένος, αν μπει σε άλλο κανάλι βγαίνει, και αν φύγει από τη φυλακή ξαναμπαίνει.\nΑπελευθερώνεται με UNJAIL ή όταν αποσυνδεθεί.\nΟι χρήστες Root και οι IRCops με ρόλο δεν μπορούν να φυλακιστούν.\nΑυτή η εντολή απαιτεί το δικαίωμα operserv.jail."
  example:  "/msg %bot% JAIL Χρήστης"
  done:     "\x0303✓\x03 Ο \x02%nickname%\x02 φυλακίστηκε στο \x02%channel%\x02."
  already:  "\x0304✗\x03 Ο \x02%nickname%\x02 είναι ήδη φυλακισμένος."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <nick>"
  short:       "Απελευθερώνει έναν φυλακισμένο χρήστη."
  help:        "Απελευθερώνει έναν χρήστη φυλακισμένο με JAIL: μπορεί ξανά να μπει σε οποιοδήποτε κανάλι.\nΑυτή η εντολή απαιτεί το δικαίωμα operserv.jail."
  example:     "/msg %bot% UNJAIL Χρήστης"
  done:        "\x0303✓\x03 Ο \x02%nickname%\x02 απελευθερώθηκε από το \x02%channel%\x02."
  not_jailed:  "\x0304✗\x03 Ο \x02%nickname%\x02 δεν είναι φυλακισμένος."

# --- ELINE -----------------------------------------------------------------------
eline:
  syntax:          "ELINE {ADD|DEL|LIST|VIEW|COUNT|CLEAR} ..."
  short:           "Διαχειρίζεται τις εξαιρέσεις ban ανά IP (E-Lines)."
  help:            "Οι E-Lines εξαιρούν μια IP από τα ban του δικτύου (G-Lines, Z-Lines, shun, όριο συνδέσεων ανά IP, μαύρες λίστες...). Χρήσιμο για τα VPS με ZNC των IRCops.\nΤο ADD προσθέτει μία, το DEL τις διαγράφει, τα LIST και VIEW τις εμφανίζουν και το COUNT τις μετρά.\nΑυτή η εντολή απαιτεί το δικαίωμα operserv.eline."
  example:         "/msg %bot% ELINE ADD +30d *@203.0.113.10 ZNC IRCops"
  added:           "\x0303✓\x03 Προστέθηκε E-Line για το {B}%mask%{B} (λήγει: %expiration%)."
  already_exists:  "\x0304✗\x03 Υπάρχει ήδη E-Line για το {B}%mask%{B}."
  invalid_mask:    "\x0304✗\x03 Το {B}%mask%{B} δεν είναι έγκυρο: χρησιμοποίησε χρήστης@IP ή IP (η IP μπορεί να είναι εύρος CIDR)."
  invalid_expiry:  "\x0304✗\x03 Το {B}%expiry%{B} δεν είναι έγκυρη λήξη: χρησιμοποίησε +0 (μόνιμη) ή τιμή όπως +30d, +12h, +30m."
  deleted:         "\x0303✓\x03 Διαγράφηκαν οι E-Lines: {B}%masks%{B}."
  not_found:       "\x0304✗\x03 Δεν υπάρχει E-Line {B}%item%{B}."
  never_expires:   "ποτέ"
  add:
    syntax:   "ELINE ADD [+λήξη] <χρήστης@IP|IP> <αιτία>"
    short:    "Προσθέτει μια E-Line."
    help:     "Προσθέτει εξαίρεση ban για μια IP ή ένα εύρος CIDR, προαιρετικά με λήξη (+30d, +12h, +30m· χωρίς λήξη είναι μόνιμη). Χωρίς χρήστη χρησιμοποιείται *."
    example:  "/msg %bot% ELINE ADD +30d 203.0.113.10 ZNC IRCops"
  del:
    syntax:   "ELINE DEL <μάσκα|αριθμός|λίστα>"
    short:    "Διαγράφει E-Lines."
    help:     "Διαγράφει μια E-Line με τη μάσκα της, τον αριθμό της στο LIST ή μια λίστα αριθμών και ευρών (1,3-5)."
    example:  "/msg %bot% ELINE DEL 1,3-5"
  list:
    syntax:   "ELINE LIST"
    short:    "Εμφανίζει τις E-Lines."
    help:     "Εμφανίζει τις ενεργές E-Lines αριθμημένες με τη λήξη τους."
    example:  "/msg %bot% ELINE LIST"
    header:   "\x0307---\x03 \x02E-Lines (%count%)\x02 \x0307---\x03"
    entry:    "  \x02%number%.\x02 %mask% \x0314(λήγει: %expiration%)\x03"
    empty:    "Δεν υπάρχουν ενεργές E-Lines."
  view:
    syntax:   "ELINE VIEW"
    short:    "Εμφανίζει τις E-Lines αναλυτικά."
    help:     "Εμφανίζει τις ενεργές E-Lines με το ποιος τις έβαλε, πότε, τη λήξη και την αιτία."
    example:  "/msg %bot% ELINE VIEW"
    entry:    "  \x02%number%.\x02 %mask% \x0314από %setby% στις %created%, λήγει: %expiration% - %reason%\x03"
  count:
    syntax:   "ELINE COUNT"
    short:    "Μετρά τις E-Lines."
    help:     "Εμφανίζει πόσες E-Lines είναι ενεργές."
    example:  "/msg %bot% ELINE COUNT"
    result:   "Υπάρχουν {B}%count%{B} ενεργές E-Lines."
  clear:
    syntax:   "ELINE CLEAR"
    short:    "Διαγράφει όλες τις E-Lines."
    help:     "Διαγράφει μονομιάς όλες τις ενεργές E-Lines, από τις υπηρεσίες και από τον IRCd."
    example:  "/msg %bot% ELINE CLEAR"
    done:     "\x0303✓\x03 Διαγράφηκαν \x02%count%\x02 E-Lines."
