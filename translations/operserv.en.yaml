  permission_denied: "\x0304✗\x03 You do not have sufficient permissions to execute this command."
  root_only:        "\x0304✗\x03 This command is restricted to network root administrators."
  nick_not_registered: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not registered."

# --- HELP --------------------------------------------------------------------
