  syntax:           "HELP [command [sub-option]]"
  short:            "List commands or show help for a command."
  help:             "Without arguments lists all commands. Use \x0303HELP <command>\x03\x0F for full help, or \x0303HELP <command> <option>\x03\x0F for sub-options."
  header_title:     "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro:            "Network management service for operators."
  general_header: "\x02 ■ Available commands:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Options:\x02"
  general_footer: "\x0310ℹ\x03\x0F Use /msg %bot% \x02\x0303HELP <command>\x03\x0F for more information."
  set_sub_footer: "\x0310ℹ\x03\x0F Use /msg %bot% \x02\x0303HELP %command% <option>\x03\x0F for more information."
  syntax_label: "Syntax: \x02\x0303%syntax%\x03\x0F"
  example_label: "Example: \x02\x0303%example%\x03\x0F"
  footer:           "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0307⚠\x03\x0F NOTE: Nicknames unused for more than %days% days are automatically removed."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    operators_roles: "Operators and roles"
    network_security: "Network security"
    communication: "Communication"
    low_level: "Low level"
    channels: "Channels"
    information: "Network information"
  unknown_command:  "\x0307✗ Unknown command\x03\x0F \x02\x0303%command%\x03\x0F. Use \x0303/msg %bot% HELP\x03\x0F."
  ircop_header: "\x02 ■ Available commands for IRC Operators:\x02"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax:           "IRCOP {ADD|DEL|LIST} [nickname] [role]"
  short:            "Manage network IRC operators."
  help:             "Manage network IRC operators. ADD adds a registered nickname\nas an operator with the specified role.\nDEL removes an operator. LIST shows all operators.\nUse ROLE LIST to see available roles.\nThis command is restricted to Root users configured in services."
  example:          "/msg %bot% IRCOP ADD Alice helper"

  unknown_sub:      "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use ADD, DEL, or LIST."
  unknown_role:     "\x0304✗\x03 Role \x02%role%\x02 does not exist. Use \x0303/msg %bot% ROLE LIST\x03 to see available roles."
  already_admin:    "\x0304✗\x03 \x02%nickname%\x02 is already an IRC operator (role: %role%)."
  not_admin:       "\x0304✗\x03 \x02%nickname%\x02 is not an IRC operator."
  role_changed:     "\x0303✓\x03 Changed role for \x02%nickname%\x02 from %old% to %new%."

  add:
    syntax:         "IRCOP ADD <nickname> <role>"
    short:          "Add a network IRC operator."
    help:           "Adds a registered nickname as a network IRC operator.\nUse ROLE LIST to see available roles.\nThis command is restricted to Root users."
    example:        "/msg %bot% IRCOP ADD Alice helper"
    done:           "\x0303✓\x03 Added \x02%nickname%\x02 as \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not an active registered nickname."

  del:
    syntax:         "IRCOP DEL <nickname>"
    short:          "Remove a network IRC operator."
    help:            "Removes a network IRC operator from the list.\nThis command is restricted to Root users."
    example:         "/msg %bot% IRCOP DEL Alice"
    done:           "\x0303✓\x03 Removed \x02%nickname%\x02 from IRC operators."

  list:
    syntax:         "IRCOP LIST"
    short:          "List all network IRC operators."
    help:            "Lists all network IRC operators with their roles and registration date.\nThis command is restricted to Root users."
    example:         "/msg %bot% IRCOP LIST"
    header:         "\x0307---\x03 \x02Network IRC Operators\x02 \x0307---\x03"
    empty:          "There are no IRC operators."

# --- ROLE --------------------------------------------------------------------
role:
  operclass:
    syntax:         "ROLE OPERCLASS {LIST|<role>} [{VIEW|SET}] [operclass]"
    short:          "Manage the Unreal operclass for a role."
    help:           "LIST shows available operclasses on the network.\nVIEW shows the operclass assigned to a role and available operclasses.\nSET assigns the operclass to IRCOPs on identify (OFF to clear).\nAvailable only on UnrealIRCd protocols."
    example:        "/msg %bot% ROLE OPERCLASS LIST"
    list:
      header:       "\x0307---\x03 \x02Available Operclasses on the Network\x02 \x0307---\x03"
      empty:        "There are no operclasses available on the network."
      not_supported: "\x0304✗\x03 The current protocol does not support listing available operclasses."
    view:
      empty:        "The role \x02%role%\x02 has no operclass assigned."
      line:         "  Operclass: \x0303%operclass%\x03"
      available:    "  Available operclasses: \x0310%available%\x03"
    set:
      done:         "\x0303✓\x03 Set operclass for role \x02%role%\x02."
      cleared:      "\x0303✓\x03 Removed operclass from role \x02%role%\x02."
      not_available: "\x0304✗\x03 Operclass \x02%operclass%\x02 is not available on the network. Available operclasses: %available%."
  syntax:           "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <name> ..."
  short:            "Manage operator roles."
  help:             "Manage operator roles. ADD creates a new role, DEL removes it,\nLIST shows all roles, PERMS manages permissions for a role, MODES manages IRCOP modes,\nVHOST manages forced vhost pattern for a role.\nProtected roles (ADMIN, OPER, PREOPER) cannot be deleted.\nThis command is restricted to Root users."
  example:          "/msg %bot% ROLE ADD helper"
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <name> ..."
  help_operclass:   "Manage operator roles. ADD creates a new role, DEL removes it,\nLIST shows all roles, PERMS manages permissions for a role, MODES manages IRCOP modes,\nVHOST manages forced vhost pattern for a role, OPERCLASS manages the Unreal operclass.\nProtected roles (ADMIN, OPER, PREOPER) cannot be deleted.\nThis command is restricted to Root users."

  unknown_sub:      "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use ADD, DEL, LIST, PERMS, MODES, or VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use ADD, DEL, LIST, PERMS, MODES, VHOST, or OPERCLASS."
  not_found:        "\x0304✗\x03 Role \x02%role%\x02 does not exist."
  already_exists:   "\x0304✗\x03 Role \x02%role%\x02 already exists."
  protected:        "\x0304✗\x03 Role \x02%role%\x02 is protected and cannot be deleted."

  add:
    syntax:         "ROLE ADD <name> [description]"
    short:          "Create a new role."
    help:            "Creates a new custom role. Description is optional.\nThis command is restricted to Root users."
    example:         "/msg %bot% ROLE ADD helper"
    done:           "\x0303✓\x03 Created role \x02%role%\x02."

  del:
    syntax:         "ROLE DEL <name>"
    short:          "Delete a role."
    help:            "Deletes a custom role. Protected roles (ADMIN, OPER, PREOPER)\ncannot be deleted. If the role has operators assigned,\nyou must reassign them first.\nThis command is restricted to Root users."
    example:         "/msg %bot% ROLE DEL helper"
    done:           "\x0303✓\x03 Deleted role \x02%role%\x02."

  list:
    syntax:         "ROLE LIST"
    short:          "List all roles."
    help:            "Lists all roles. Protected roles are marked with [PROTECTED].\nThis command is restricted to Root users."
    example:         "/msg %bot% ROLE LIST"
    header:         "\x0307---\x03 \x02Operator Roles\x02 \x0307---\x03"
    empty:          "There are no operator roles."

  perms:
    syntax:         "ROLE PERMS <role> {LIST|ADD|DEL|CLEAR} [permission|ALL]"
    short:          "Manage role permissions."
    help:            "Manage permissions assigned to a role.\nLIST shows all permissions for the role.\nADD assigns a permission to the role.\nDEL removes a permission from the role (not for protected roles).\nCLEAR removes all permissions from the role.\nUse ALL to add all available permissions at once.\nThis command is restricted to Root users."
    example:         "/msg %bot% ROLE PERMS helper ADD operserv.kill"
    not_found:       "\x0304✗\x03 Permission \x02%perm%\x02 does not exist."
    already_has:     "\x0304✗\x03 Role \x02%role%\x02 already has permission \x02%perm%\x02."
    does_not_have:   "\x0304✗\x03 Role \x02%role%\x02 does not have permission \x02%perm%\x02."

    list:
      header:        "\x0307---\x03 \x02Permissions for %role%\x02 \x0307---\x03"

    add:
      done:         "\x0303✓\x03 Added permission \x02%perm%\x02 to role \x02%role%\x02."
      all_done:     "\x0303✓\x03 Added \x02%count%\x02 permissions to role \x02%role%\x02."

    del:
      done:         "\x0303✓\x03 Removed permission \x02%perm%\x02 from role \x02%role%\x02."

    clear:
      done:         "\x0303✓\x03 Removed \x02%count%\x02 permissions from role \x02%role%\x02."
      empty:        "\x0304✗\x03 Role \x02%role%\x02 has no permissions assigned."

  modes:
    syntax:         "ROLE MODES <role> {VIEW|SET} [modes]"
    short:          "Manage IRCOP user modes for the role."
    help:            "Manage IRCOP user modes assigned to a role.\nVIEW shows the role's current modes.\nSET sets the IRCOP modes (e.g., oH for +oH).\nUsers with this role will receive these modes on identify.\nAvailable modes per IRCD: UnrealIRCd (H, q, s, W), InspIRCd (s).\nThis command is restricted to Root users."
    example:         "/msg %bot% ROLE MODES helper SET oH"

    view:
      header:        "\x0307---\x03 \x02Modes for %role%\x02 \x0307---\x03"
      empty:        "The role \x02%role%\x02 has no modes assigned."
      line:         "  Modes: \x0303%modes%\x03"

    set:
      done:         "\x0303✓\x03 Set modes \x02%modes%\x02 for role \x02%role%\x02."
      cleared:      "\x0303✓\x03 Removed all modes from role \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 The mode \x02%mode%\x02 is not a valid IRCOP mode."
      invalid_modes: "\x0304✗\x03 Invalid modes: %invalid%. Valid modes: %valid%."
      no_irc_user_modes: "\x0304✗\x03 The current IRCD has no IRCOP modes configured."

  vhost:
    syntax:         "ROLE VHOST <role> {VIEW|SET} [pattern]"
    short:          "Manage forced vhost pattern for a role."
    help:           "Manage forced vhost assigned to a role.\nVIEW shows the current forced vhost pattern.\nSET assigns a forced vhost pattern (users with this role will\nreceive this vhost on identify, overriding personal vhost).\nThe pattern is appended after the cleaned nickname, e.g.:\n  Nick: _davidlig_ → Pattern: admin.ares → VHost: davidlig.admin.ares\nValid characters: a-z, A-Z, 0-9, hyphen (-), and dot (.).\nMust have at least one dot, cannot start/end with - or . or have ..\nUse OFF to clear the forced vhost pattern.\nThis command is restricted to Root users."
    example:        "/msg %bot% ROLE VHOST helper SET staff.example.com"

    view:
      header:        "\x0307---\x03 \x02Forced vhost for %role%\x02 \x0307---\x03"
      empty:        "The role \x02%role%\x02 has no forced vhost pattern set."
      line:         "  Pattern: \x0303%pattern%\x03"
      example:      "  Example: \x02nickname\x02.%pattern%"

    set:
      done:         "\x0303✓\x03 Set forced vhost pattern for role \x02%role%\x02."
      cleared:      "\x0303✓\x03 Removed forced vhost pattern from role \x02%role%\x02."
      invalid:      "\x0304✗\x03 Invalid vhost pattern. Valid characters: a-z, A-Z, 0-9, - and .. Must have at least one dot, cannot start/end with - or . or have .."

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <nickname> <reason>"
  short:            "Forcefully disconnect a user from the network."
  help:             "Disconnects a user from the IRC network.\nIRCops and Root users cannot be killed.\nThis command requires the operserv.kill permission."
  example:          "/msg %bot% KILL BadUser Flooding channels"
  user_not_online:  "\x0304✗\x03 Nick \x02%nickname%\x02 is not connected."
  protected_root:   "\x0304✗\x03 Cannot kill Root user \x02%nickname%\x02."
  protected_ircop:  "\x0304✗\x03 Cannot kill IRC operator \x02%nickname%\x02."
  done:             "\x0303✓\x03 User \x02%nickname%\x02 has been killed (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST|CLEAR} [mask] [expiry] [reason]"
  short:            "Manage network-wide G-lines."
  help:             "Manage network-wide G-lines (global bans).\nADD adds a new G-line with mask, expiry and reason.\nDEL removes a G-line by mask or entry number.\nLIST shows all G-lines, optionally filtered by mask.\nCLEAR — Removes every active G-Line at once, from the services and from the IRCd.\n\nExpiry format: 0=permanent, or use d, h, m suffix (e.g., 7d, 12h, 30m).\nGLINEs matching Root or IRCop users are rejected.\nThis command requires the operserv.gline permission."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Mass advertising"
  unknown_sub:      "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use ADD, DEL, LIST or CLEAR."
  invalid_mask:     "\x0304✗\x03 Invalid mask format. Must be in format user@host (e.g., *@192.168.*)."
  global_mask:      "\x0304✗\x03 G-line mask \x02%mask%\x02 is too broad. Global masks are not allowed."
  dangerous_mask:   "\x0304✗\x03 G-line mask \x02%mask%\x02 is too broad. Host part needs at least 4 alphanumeric characters."
  protected_user:   "\x0304✗\x03 Cannot G-line protected user \x02%nickname%\x02."
  invalid_expiry:   "\x0304✗\x03 Invalid expiry format. Use 0 for permanent, or a value like 7d, 12h, 30m."
  already_exists:   "\x0304✗\x03 G-line for \x02%mask%\x02 already exists."
  max_entries:      "\x0304✗\x03 Maximum number of G-lines (%max%) reached."
  not_found:        "\x0304✗\x03 G-line \x02%mask%\x02 not found."
  user_not_found:   "\x0304✗\x03 Nickname \x02%nickname%\x02 is not online."
  permanent:        "permanent"

  add:
    syntax:         "GLINE ADD <mask> <expiry> <reason>"
    short:          "Add a network-wide G-line."
    help:           "Adds a network-wide G-line (global ban).\nThe mask must be in format user@host.\nExpiry: 0=permanent, or use d, h, m suffix (e.g., 7d, 12h, 30m).\nGLINEs matching Root or IRCop users are rejected.\nThis command requires the operserv.gline permission."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Mass advertising"
    done:           "\x0303✓\x03 G-line added: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <mask|number>"
    short:          "Remove a G-line."
    help:           "Removes a G-line from the list.\nYou can specify the mask or the entry number from LIST.\nThis command requires the operserv.gline permission."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 G-line \x02%mask%\x02 removed."

  list:
    syntax:         "GLINE LIST [mask]"
    short:          "List all G-lines."
    help:           "Lists all G-lines. Optionally filter by mask pattern.\nThis command requires the operserv.gline permission."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-lines (%count%) \x0307---\x03"
    empty:          "There are no G-lines."
    no_reason:      "No reason"
    never_expires:  "Permanent"
    unknown_creator: "unknown"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, expires: %expiration%)"

  clear:
    syntax:         "GLINE CLEAR"
    short:          "Removes every G-Line."
    help:           "Removes every active G-Line at once, from the services and from the IRCd."
    example:        "/msg %bot% GLINE CLEAR"
    done:           "\x0303✓\x03 G-Lines removed: \x02%count%\x02."

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [country] [reason]"
  short:            "Manage the country block list."
  help:             "Manage the countries blocked at the network gate.\nThe IRC daemon resolves the country of every connecting client, so a blocked country is rejected at connection time.\nADD registers a country code with its reason.\nDEL removes a country from the list.\nLIST shows the blocked countries with their reason and registration date.\nThis command requires the operserv.geoip permission."
  example:          "/msg %bot% GEOIP ADD ES Not allowed in this network"
  unknown_sub:      "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use ADD, DEL, or LIST."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 is not a valid ISO 3166-1 alpha-2 country code."
  already_exists:   "\x0304✗\x03 Country \x02%country%\x03 is already blocked."
  not_found:        "\x0304✗\x03 Country \x02%country%\x03 is not blocked."
  default_reason:   "Country blocked by network policy"

  add:
    syntax:         "GEOIP ADD <country> [reason]"
    short:          "Block a country at the network gate."
    help:           "Blocks every client connecting from the given country.\nThe country code must be an ISO 3166-1 alpha-2 code.\nThe reason is shown to the rejected clients and may be omitted.\nThis command requires the operserv.geoip permission."
    example:        "/msg %bot% GEOIP ADD ES Not allowed in this network"
    done:           "\x0303✓\x03 Country \x02%country%\x03 blocked - %reason%"

  del:
    syntax:         "GEOIP DEL <country>"
    short:          "Unblock a country."
    help:           "Removes a country from the blocked list.\nThis command requires the operserv.geoip permission."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 Country \x02%country%\x03 unblocked."

  list:
    syntax:         "GEOIP LIST"
    short:          "List the blocked countries."
    help:           "Lists every blocked country with its reason and registration date.\nThis command requires the operserv.geoip permission."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Blocked Countries (%count%)\x02 \x0307---\x03"
    empty:          "There are no blocked countries."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, registered: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <line>"
  short:            "Send a raw protocol line to the IRCd."
  help:             "Sends the given line directly to the uplink IRCd socket.\nUse with extreme caution. Invalid protocol lines may crash the network.\nThis command requires the operserv.raw permission."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 You must specify a non-empty line to send."
  too_long:         "\x0304✗\x03 Line is too long. Maximum 510 characters."
  not_connected:    "\x0304✗\x03 Not connected to IRCd."
  done:             "\x0303✓\x03 Raw line sent."
  protocol:
    syntax: "\x0304✗\x03 The active protocol rejected the RAW command syntax."
    done: "\x0303✓\x03 Protocol-owned RAW command executed."
    target: "\x0304✗\x03 The active protocol rejected target %target%."
    unsupported: "\x0304✗\x03 The active protocol does not support this RAW command."
    invalid_resource_type: "\x0304✗\x03 Unknown protocol resource type: %resource_type%."
    invalid_resource: "\x0304✗\x03 Invalid protocol resource: %resource%."
    invalid_value: "\x0304✗\x03 Invalid value for protocol resource: %resource%."
    error: "\x0304✗\x03 The active protocol could not execute the RAW command."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator% executes command %command% on %target%. %reason%"
  actionWithDuration: "%operator% executes command %command% on %target%. Duration: %duration%. %reason%"
  prefix_reason:    "Reason: %reason%"
  prefix_message:   "Message: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Manage connect MOTD messages sent to users on connect."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [args]"
  help:             "Manage Message Of The Day entries that are sent to users when they connect to the network.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Welcome to the network!"
  unknown_sub:      "\x0304✗\x03 Unknown subcommand. Use: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <expiry> <message>"
    syntax_hint:    "\x0304✗\x03 Usage: \x02%syntax%\x02"
    short:          "Add a MOTD entry."
    help:           "Adds a new MOTD message that will be sent to each user when they connect to the network.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Welcome to the network!"
    done:           "\x0303✓\x03 MOTD entry #%id% added."
    invalid_type:   "\x0304✗\x03 Invalid message type. Must be \x02PRIVMSG\x02 or \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Invalid expiry format. Use: \x02<number><s|m|h|d>\x02 (e.g., 30s, 5m, 24h, 7d)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Usage: \x02%syntax%\x02"
    short:          "Delete a MOTD entry."
    help:           "Deletes a MOTD entry by its ID.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 MOTD entry #%id% deleted."
    not_found:      "\x0304✗\x03 MOTD entry not found."
  list:
    syntax:         "MOTD LIST"
    short:          "List all MOTD entries."
    help:           "Lists all configured MOTD entries.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "No MOTD entries configured."
    header:         "MOTD entries:"
    status_enabled: "\x0303enabled\x03"
    status_disabled: "\x0304disabled\x03"
    expired:        "\x0304expired\x03"
    no_bot:         "(no bot)"
    never:          "never"
    shown_count:    "shown %count% times"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Remove all expired MOTD entries."
    help:           "Removes all MOTD entries whose expiry time has passed.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 Removed %count% expired MOTD entries."
    none:           "\x0303✓\x03 No expired MOTD entries to remove."
  debug:
    finalized:      "MOTD message #%id% has ended: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 is not a valid channel name; it must start with \x02#\x02."
  not_found:            "\x0304✗\x03 Channel \x02%channel%\x02 does not exist on the network."
  user_not_online:      "\x0304✗\x03 Nick \x02%nickname%\x02 is not connected."
  user_not_on_channel:  "\x0304✗\x03 Nick \x02%nickname%\x02 is not on \x02%channel%\x02."
  protected_root:       "\x0304✗\x03 Permission denied: \x02%nickname%\x02 is a Root user."
  protected_ircop:      "\x0304✗\x03 Permission denied: \x02%nickname%\x02 is an IRC operator."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#channel> <nickname> [reason]"
  short:    "Kick a user from a channel."
  help:     "Kicks a user from a channel as a network operator.\nA default reason is used when none is given.\nRoot users and IRCops with a role cannot be kicked.\nThis command requires the operserv.kick permission."
  example:  "/msg %bot% KICK #help BadUser Stop flooding"
  done:     "\x0303✓\x03 \x02%nickname%\x02 has been kicked from \x02%channel%\x02. Reason: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#channel> <nickname>"
  short:    "Give channel operator status to a user."
  help:     "Gives operator status (+o) to a user on a channel, even when the channel is not registered.\nThis command requires the operserv.op permission."
  example:  "/msg %bot% OP #help SomeUser"
  done:     "\x0303✓\x03 \x02%nickname%\x02 is now an operator on \x02%channel%\x02."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#channel> <nickname>"
  short:    "Remove channel operator status from a user."
  help:     "Removes operator status (-o) from a user on a channel.\nRoot users and IRCops with a role cannot be deopped.\nThis command requires the operserv.op permission."
  example:  "/msg %bot% DEOP #help SomeUser"
  done:     "\x0303✓\x03 \x02%nickname%\x02 is no longer an operator on \x02%channel%\x02."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#channel> <modes> [arguments]"
  short:          "Set modes on a channel."
  help:           "Sets the given modes on a channel, followed by their arguments when needed.\nModes must start with + or -.\nThis command requires the operserv.mode permission."
  example:        "/msg %bot% MODE #help +mk secret"
  done:           "\x0303✓\x03 Modes of \x02%channel%\x02 set to \x02%modes%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 is not a valid mode change. Use +modes or -modes."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#channel>"
  short:    "Remove restrictive modes from a channel."
  help:     "Removes the modes -imnpst from a channel to unlock it.\nKeys (+k) and limits (+l) are left untouched.\nThis command requires the operserv.mode permission."
  example:  "/msg %bot% LIMPIA #help"
  done:     "\x0303✓\x03 Channel \x02%channel%\x02 has been cleaned (modes %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#channel>"
  short:               "Invite yourself to a channel."
  help:                "Invites you to the given channel, even when it is invite-only (+i).\nThis command requires the operserv.invite permission."
  example:             "/msg %bot% INVITE #help"
  done:                "\x0303✓\x03 Invitation to \x02%channel%\x02 sent."
  already_on_channel:  "\x0304✗\x03 You are already on \x02%channel%\x02."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Show network statistics."
  help:     "Shows the number of users currently connected to the network.\nAvailable to every IRC operator."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Users online: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "List the IRC operators online."
  help:     "Lists, by nickname, the IRC operators currently connected to the network.\nAvailable to every IRC operator."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02IRC operators online (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "End of list."
  empty:    "\x0310ℹ\x03 No IRC operators are online."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <nickname>"
  short:    "List the clones of a nickname."
  help:     "Shows the host a nickname connects from and the other nicknames connected from the same host.\nSessions are grouped by real IP when it is known, otherwise by hostname.\nThis command requires the operserv.clones permission."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "Clones of \x02%nickname%\x02 (\x02%host%\x02), %count% sessions:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "End of list."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 has no clones (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <nickname> [reason]"
  short:    "Remove the clones of a nickname with a 1-hour G-Line."
  help:     "Sets a 1-hour G-Line on *@host of the given nickname, disconnecting every session from that host.\nThe G-Line is listed by GLINE LIST and can be removed with GLINE DEL.\nLocalhost and hosts shared with Root users or IRCops with a role are never G-Lined.\nThis command requires the operserv.clones permission."
  example:  "/msg %bot% KILLCLONES BadUser Clones are not allowed"
  done:     "\x0303✓\x03 The clones of \x02%nickname%\x02 have been removed: G-Line \x02%mask%\x02 for %duration% (sessions: %count%). Reason: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <nickname> [reason]"
  short:    "Block the host of a nickname with a 5-hour G-Line."
  help:     "Sets a 5-hour G-Line on *@host of the given nickname, disconnecting every session from that host.\nThe G-Line is listed by GLINE LIST and can be removed with GLINE DEL.\nLocalhost and hosts shared with Root users or IRCops with a role are never G-Lined.\nThis command requires the operserv.clones permission."
  example:  "/msg %bot% BLOCK BadUser Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 has been blocked: G-Line \x02%mask%\x02 for %duration% (sessions: %count%). Reason: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Permission denied: \x02%host%\x02 is a local host and is never G-Lined."
  failed:         "\x0304✗\x03 The G-Line \x02%mask%\x02 could not be applied."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <minimum|host>"
  short:    "Show simultaneous sessions per IP."
  help:     "Shows how many simultaneous sessions are active from each IP (or hostname when the IP is unknown).\nThis command requires the operserv.conexiones permission."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "List the IPs with at least <minimum> sessions."
    help:             "Lists the IPs with at least <minimum> simultaneous active sessions, most sessions first.\nThe minimum must be an integer greater than 1."
    syntax:           "CONEXIONES LIST <minimum>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "IPs with at least \x02%minimum%\x02 simultaneous active sessions:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "End of list."
    empty:            "\x0310ℹ\x03 No IP has at least \x02%minimum%\x02 simultaneous sessions."
    invalid_minimum:  "\x0304✗\x03 Invalid minimum: it must be an integer greater than 1."
  view:
    short:      "Show the sessions of one IP."
    help:       "Shows how many simultaneous sessions are active from an IP or hostname."
    syntax:     "CONEXIONES VIEW <host>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 Simultaneous active sessions from \x02%host%\x02: \x02%count%\x02."
    not_found:  "\x0304✗\x03 No sessions found for \x02%host%\x02."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <nick> <+/-modes>"
  short:          "Changes the user modes of a nick."
  help:           "Sets or unsets user modes on a connected nick.\nYou may only use the modes of your rank or below: any IRCop the user modes, an Operator also s and W, an Administrator also H, q and o; Root, any of them.\nThe r and h modes cannot be set or unset.\nThis command requires the operserv.umode permission."
  example:        "/msg %bot% UMODE User +R"
  done:           "\x0303✓\x03 Modes \x02%modes%\x02 applied to \x02%nickname%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 is not a valid mode change. Use +modes or -modes."
  forbidden:      "\x0304✗\x03 You cannot set or unset the r and h modes."
  above_rank:     "\x0304✗\x03 Your rank does not allow you to use the modes \x02%modes%\x02."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <nick>"
  short:    "Jails a user in the jail channel."
  help:     "Moves a user out of all their channels into the jail channel (%channel%).\nWhile jailed, joining another channel gets them parted, and leaving the jail gets them back in.\nThey are freed with UNJAIL or when they disconnect.\nRoot users and role IRCops cannot be jailed.\nThis command requires the operserv.jail permission."
  example:  "/msg %bot% JAIL User"
  done:     "\x0303✓\x03 \x02%nickname%\x02 has been jailed in \x02%channel%\x02."
  already:  "\x0304✗\x03 \x02%nickname%\x02 is already jailed."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <nick>"
  short:       "Frees a jailed user."
  help:        "Frees a user jailed with JAIL: they may join any channel again.\nThis command requires the operserv.jail permission."
  example:     "/msg %bot% UNJAIL User"
  done:        "\x0303✓\x03 \x02%nickname%\x02 has been freed from \x02%channel%\x02."
  not_jailed:  "\x0304✗\x03 \x02%nickname%\x02 is not jailed."

# --- ELINE -----------------------------------------------------------------------
eline:
  syntax:          "ELINE {ADD|DEL|LIST|VIEW|COUNT|CLEAR} ..."
  short:           "Manages the ban exceptions by IP (E-Lines)."
  help:            "E-Lines exempt an IP from the network bans (G-Lines, Z-Lines, shun, the per-IP connection limit, blacklists...). Useful for the IRCops' ZNC boxes.\nADD adds one, DEL removes them, LIST and VIEW show them and COUNT counts them.\nThis command requires the operserv.eline permission."
  example:         "/msg %bot% ELINE ADD +30d *@203.0.113.10 ZNC IRCops"
  added:           "\x0303✓\x03 E-Line added for \x02%mask%\x02 (expires: %expiration%)."
  already_exists:  "\x0304✗\x03 There is already an E-Line for \x02%mask%\x02."
  invalid_mask:    "\x0304✗\x03 \x02%mask%\x02 is not valid: use user@IP or IP (the IP may be a CIDR range)."
  invalid_expiry:  "\x0304✗\x03 \x02%expiry%\x02 is not a valid expiry: use +0 (permanent) or a value like +30d, +12h, +30m."
  deleted:         "\x0303✓\x03 E-Lines removed: \x02%masks%\x02."
  not_found:       "\x0304✗\x03 There is no E-Line \x02%item%\x02."
  never_expires:   "never"
  add:
    syntax:   "ELINE ADD [+expiry] <user@IP|IP> <reason>"
    short:    "Adds an E-Line."
    help:     "Adds a ban exception for an IP or a CIDR range, optionally with an expiry (+30d, +12h, +30m; without one it is permanent). Without a user part, * is used."
    example:  "/msg %bot% ELINE ADD +30d 203.0.113.10 ZNC IRCops"
  del:
    syntax:   "ELINE DEL <mask|number|list>"
    short:    "Removes E-Lines."
    help:     "Removes an E-Line by its mask, by its LIST number, or by a list of numbers and ranges (1,3-5)."
    example:  "/msg %bot% ELINE DEL 1,3-5"
  list:
    syntax:   "ELINE LIST"
    short:    "Lists the E-Lines."
    help:     "Shows the active E-Lines, numbered, with their expiry."
    example:  "/msg %bot% ELINE LIST"
    header:   "\x0307---\x03 \x02E-Lines (%count%)\x02 \x0307---\x03"
    entry:    "  \x02%number%.\x02 %mask% \x0314(expires: %expiration%)\x03"
    empty:    "There are no active E-Lines."
  view:
    syntax:   "ELINE VIEW"
    short:    "Shows the E-Lines in detail."
    help:     "Shows the active E-Lines with who set them, when, their expiry and the reason."
    example:  "/msg %bot% ELINE VIEW"
    entry:    "  \x02%number%.\x02 %mask% \x0314set by %setby% on %created%, expires: %expiration% - %reason%\x03"
  count:
    syntax:   "ELINE COUNT"
    short:    "Counts the E-Lines."
    help:     "Shows how many E-Lines are active."
    example:  "/msg %bot% ELINE COUNT"
    result:   "There are \x02%count%\x02 active E-Lines."
  clear:
    syntax:   "ELINE CLEAR"
    short:    "Removes every E-Line."
    help:     "Removes every active E-Line at once, from the services and from the IRCd."
    example:  "/msg %bot% ELINE CLEAR"
    done:     "\x0303✓\x03 E-Lines removed: \x02%count%\x02."
