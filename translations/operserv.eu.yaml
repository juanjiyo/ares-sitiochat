# OperServ itzulpenak — Euskara
# Eremua: operserv

unknown_command: "\x0304✗\x03 Komando ezezaguna \x02%command%\x02. Erabili \x0303/msg %bot% HELP\x03."

error:
  syntax:           "\x0304✗\x03 Sintaxi okerra. Erabilera: \x02%syntax%\x02"
  oper_only:        "\x0304✗\x03 Komando hau IRC Operadoreentzat mugatuta dago."
  not_identified:   "\x0304✗\x03 Ez zaude identifikatuta. Erabili \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Ez duzu nahikoa baimen komando hau exekutatzeko."
  root_only:        "\x0304✗\x03 Komando hau sareko root administratzaileentzat mugatuta dago."
  nick_not_registered: "\x0304✗\x03 \x02%nickname%\x02 ezizena ez dago erregistratuta."

# --- HELP --------------------------------------------------------------------
help:
  syntax:           "HELP [komandoa [azpi-aukera]]"
  short:            "Zerrendatu komandoak edo erakutsi komando baten laguntza."
  help:             "Argumenturik gabe komando guztiak zerrendatzen ditu. Erabili \x0303HELP <komandoa>\x03 laguntza osorako, edo \x0303HELP <komandoa> <aukera>\x03 azpi-aukertarako."
  header_title:     "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro:            "Operadoreentzako sare kudeaketa zerbitzua."
  general_header: "\x02 ■ Komando erabilgarriak:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Aukerak:\x02"
  general_footer: "\x0310ℹ\x03\x0F Erabili /msg %bot% \x02\x0303HELP <komandoa>\x03\x0F informazio gehiago lortzeko."
  set_sub_footer: "\x0310ℹ\x03\x0F Erabili /msg %bot% \x02\x0303HELP %command% <aukera>\x03\x0F informazio gehiago lortzeko."
  syntax_label: "Sintaxia: \x02\x0303%syntax%\x03\x0F"
  example_label: "Adibidea: \x02\x0303%example%\x03\x0F"
  footer:           "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0307⚠\x03\x0F OHARRA: %days% egun baino gehiagoz erabiltzen ez diren ezizenak automatikoki ezabatuko dira."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    operators_roles: "Operadoreak eta rolak"
    network_security: "Sareko segurtasuna"
    communication: "Komunikazioa"
    low_level: "Behe-maila"
    channels: "Kanalak"
    information: "Sareko informazioa"
  unknown_command:  "\x0307✗ Komando ezezaguna\x03\x0F \x02\x0303%command%\x03\x0F. Erabili \x0303/msg %bot% HELP\x03\x0F."
  ircop_header: "\x02 ■ IRC operadoreentzako komando erabilgarriak:\x02"

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <ezizena> <arrazoia>"
  short:            "Behartu erabiltzaile bat saretik deskonektatzera."
  help:             "Erabiltzaile bat IRC saretik deskonektatzen du.\nIRCop-ak eta Root erabiltzaileak ezin dira kill bidez deskonektatu.\nKomando honek operserv.kill baimena behar du."
  example:          "/msg %bot% KILL ErabiltzaileGaiztoa Flood egiten kanaletan"
  user_not_online:  "\x0304✗\x03 \x02%nickname%\x02 ezizena ez dago konektatuta."
  protected_root:   "\x0304✗\x03 Ezin da Root erabiltzaile \x02%nickname%\x02 kill bidez deskonektatu."
  protected_ircop:  "\x0304✗\x03 Ezin da IRC operadore \x02%nickname%\x02 kill bidez deskonektatu."
  done:             "\x0303✓\x03 \x02%nickname%\x02 erabiltzailea kill bidez deskonektatu da (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST|CLEAR} [maskara] [iraungitzea] [arrazoia]"
  short:            "Kudeatu sare osoko G-lineak."
  help:             "Sare osoko G-lineak (debeku globalak) kudeatzen ditu.\nADDek G-line berri bat gehitzen du maskara, iraungitze eta arrazoiarekin.\nDELek G-line bat kentzen du maskara edo sarrera zenbakiaren arabera.\nLISTek G-line guztiak erakusten ditu, aukeran maskararekin iragazita.\nCLEAR — G-Line aktibo guztiak batera ezabatzen ditu, zerbitzuetatik eta IRCdtik.\n\nIraungitze formatua: 0=iraunkorra, edo erabili d, o, m atzizkia (adib., 7d, 12o, 30m).\nRoot edo IRCop erabiltzaileekin bat datozen GLINEak baztertzen dira.\nKomando honek operserv.gline baimena behar du."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Publizitate masiboa"
  unknown_sub:      "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili ADD, DEL, LIST edo CLEAR."
  invalid_mask:     "\x0304✗\x03 Maskara formatu baliogabea. Formatua user@host izan behar du (adib., *@192.168.*)."
  global_mask:      "\x0304✗\x03 \x02%mask%\x02 G-line maskara zabalegia da. Maskara globalak ez dira onartzen."
  dangerous_mask:   "\x0304✗\x03 \x02%mask%\x02 G-line maskara zabalegia da. Ostalari zatiak gutxienez 4 karaktere alfanumeriko behar ditu."
  protected_user:   "\x0304✗\x03 Ezin da babestutako \x02%nickname%\x02 erabiltzailea G-line bidez debekatu."
  invalid_expiry:   "\x0304✗\x03 Iraungitze formatu baliogabea. Erabili 0 iraunkorrerako, edo balio bat nola 7d, 12o, 30m."
  already_exists:   "\x0304✗\x03 \x02%mask%\x02 maskararen G-linea jada existitzen da."
  max_entries:      "\x0304✗\x03 G-lineen gehieneko kopurua (%max%) iritsi da."
  not_found:        "\x0304✗\x03 \x02%mask%\x02 G-linea ez da aurkitu."
  user_not_found:   "\x0304✗\x03 \x02%nickname%\x02 ezizena ez dago online."
  permanent:        "iraunkorra"

  add:
    syntax:         "GLINE ADD <maskara> <iraungitzea> <arrazoia>"
    short:          "Gehitu sare osoko G-line bat."
    help:           "Sare osoko G-line bat (debeku globala) gehitzen du.\nMaskarak user@host formatuan egon behar du.\nIraungitzea: 0=iraunkorra, edo erabili d, o, m atzizkia (adib., 7d, 12o, 30m).\nRoot edo IRCop erabiltzaileekin bat datozen GLINEak baztertzen dira.\nKomando honek operserv.gline baimena behar du."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Publizitate masiboa"
    done:           "\x0303✓\x03 G-linea gehitu da: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <maskara|zenbakia>"
    short:          "Kendu G-line bat."
    help:           "G-line bat zerrendatik kentzen du.\nMaskara edo LISTeko sarrera zenbakia zehaztu dezakezu.\nKomando honek operserv.gline baimena behar du."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 \x02%mask%\x02 G-linea kendu da."

  list:
    syntax:         "GLINE LIST [maskara]"
    short:          "Zerrendatu G-line guztiak."
    help:           "G-line guztiak zerrendatzen ditu. Aukeran maskara ereduarekin iragazi.\nKomando honek operserv.gline baimena behar du."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-lineak (%count%) \x0307---\x03"
    empty:          "Ez dago G-linearik."
    no_reason:      "Arrazoirik ez"
    never_expires:  "Iraunkorra"
    unknown_creator: "ezezaguna"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, iraungitzea: %expiration%)"
    ircd_header:    "\x0307---\x03 \x02IRCd-ren G-lineak: indar gordina (%count%)\x02 \x0307---\x03"

  clear:
    syntax:         "GLINE CLEAR"
    short:          "G-Line guztiak ezabatzen ditu."
    help:           "G-Line aktibo guztiak batera ezabatzen ditu, zerbitzuetatik eta IRCdtik."
    example:        "/msg %bot% GLINE CLEAR"
    done:           "\x0303✓\x03 Ezabatutako G-Lineak: \x02%count%\x02."

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [herrialdea] [arrazela]"
  short:            "Kudeatu herrialde debekatuen zerrenda."
  help:             "Kudeatu sarearen atean debekatuen dauden herrialdeak.\nIRC zerbitzariak konektatzen den bezeroaren herrialdea zehazten du, beraz debekatutako herrialde bat konektatzean bertan ukitzen da.\nADD herrialde kodea eta arrazela gaitzen ditu.\nDEL herrialde bat zerrendatik kentzen du.\nLIST debekatutako herrialdeak arrazela eta erregistratze datarekin erakusten ditu.\nKomando honek operserv.geoip baimena behar du."
  example:          "/msg %bot% GEOIP ADD ES Sare honetan ez da baimatzen"
  unknown_sub:      "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili ADD, DEL edo LIST."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 ez da ISO 3166-1 alpha-2 herrialde kode baliozkoa."
  already_exists:   "\x0304✗\x03 \x02%country%\x03 herrialdea dagoeneko debekatuta dago."
  not_found:        "\x0304✗\x03 \x02%country%\x03 herrialdea ez dago debekatuta."
  default_reason:   "Herrialdea sarearen politikagatik debekatuta"

  add:
    syntax:         "GEOIP ADD <herrialdea> [arrazela]"
    short:          "Debekatu herrialde bat sarearen atean."
    help:           "Ematen den herrialdetik konektatzen diren bezero guztiak debekatzen ditu.\nHerrialde kodea ISO 3166-1 alpha-2 kodea izan behar du.\nArrazela uko den bezeroei erakusten zaie eta hutsik utzi daiteke.\nKomando honek operserv.geoip baimena behar du."
    example:        "/msg %bot% GEOIP ADD ES Sare honetan ez da baimatzen"
    done:           "\x0303✓\x03 \x02%country%\x03 herrialdea debekatuta - %reason%"

  del:
    syntax:         "GEOIP DEL <herrialdea>"
    short:          "Desblokeatu herrialde bat."
    help:           "Herrialde bat debekatuen zerrendatik kentzen du.\nKomando honek operserv.geoip baimena behar du."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 \x02%country%\x03 herrialdea desblokeatuta."

  list:
    syntax:         "GEOIP LIST"
    short:          "Zerrendatu debekatutako herrialdeak."
    help:           "Debekatutako herrialde guztiak arrazela eta erregistratze datarekin erakusten ditu.\nKomando honek operserv.geoip baimena behar du."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Debekatutako herrialdeak (%count%)\x02 \x0307---\x03"
    empty:          "Ez dago herrialde debekaturik."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, erregistratua: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <lerroa>"
  short:            "Bidali protokolo lerro gordin bat IRCd-ra."
  help:             "Emandako lerroa zuzenean goiko IRCd socket-era bidaltzen du.\nMuturreko kontuz erabili. Protokolo lerro baliogabeek sarea kraskatu dezakete.\nKomando honek operserv.raw baimena behar du."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Hutsik ez dagoen lerro bat zehaztu behar duzu bidaltzeko."
  too_long:         "\x0304✗\x03 Lerroa luzeegia da. Gehienez 510 karaktere."
  not_connected:    "\x0304✗\x03 Ez dago IRCd-ra konektatuta."
  done:             "\x0303✓\x03 Lerro gordina bidali da."
  protocol:
    syntax: "\x0304✗\x03 Protokolo aktiboak RAW komandoaren sintaxia baztertu du."
    done: "\x0303✓\x03 Protokoloak kudeatutako RAW komandoa exekutatu da."
    target: "\x0304✗\x03 Protokolo aktiboak %target% helburua baztertu du."
    unsupported: "\x0304✗\x03 Protokolo aktiboak ez du RAW komando hau onartzen."
    invalid_resource_type: "\x0304✗\x03 Protokolo-baliabide mota ezezaguna: %resource_type%."
    invalid_resource: "\x0304✗\x03 Protokolo-baliabide baliogabea: %resource%."
    invalid_value: "\x0304✗\x03 Protokolo-baliabidearen balio baliogabea: %resource%."
    error: "\x0304✗\x03 Protokolo aktiboak ezin izan du RAW komandoa exekutatu."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator%(e)k %command% komandoa exekutatzen du %target% helburuan. %reason%"
  actionWithDuration: "%operator%(e)k %command% komandoa exekutatzen du %target% helburuan. Iraupena: %duration%. %reason%"
  prefix_reason:    "Arrazoia: %reason%"
  prefix_message:   "Mezua: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Kudeatu konexio MOTD mezuak, erabiltzaileei konektatzean bidaliak."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [arg]"
  help:             "Kudeatu Eguneko Mezua sarrerak, erabiltzaileei sarera konektatzean bidaltzen zaizkienak.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Ongi etorri sarera!"
  unknown_sub:      "\x0304✗\x03 Azpikomando ezezaguna. Erabili: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {zerbitzua|nick!ident@vhost} {PRIVMSG|NOTICE} <iraungitzea> <mezua>"
    syntax_hint:    "\x0304✗\x03 Erabilera: \x02%syntax%\x02"
    short:          "Gehitu MOTD sarrera bat."
    help:           "MOTD mezu berri bat gehitzen du, erabiltzaile bakoitzari sarera konektatzean bidaliko zaiona.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Ongi etorri sarera!"
    done:           "\x0303✓\x03 #%id% MOTD sarrera gehitu da."
    invalid_type:   "\x0304✗\x03 Mezu mota baliogabea. \x02PRIVMSG\x02 edo \x02NOTICE\x02 izan behar du."
    invalid_expiry: "\x0304✗\x03 Iraungitze formatu baliogabea. Erabili: \x02<zenbakia><s|m|o|e>\x02 (adib., 30s, 5m, 24o, 7e)."
  del:
    syntax:         "MOTD DEL <ida>"
    syntax_hint:    "\x0304✗\x03 Erabilera: \x02%syntax%\x02"
    short:          "Ezabatu MOTD sarrera bat."
    help:           "MOTD sarrera bat ezabatzen du bere IDaren arabera.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 #%id% MOTD sarrera ezabatu da."
    not_found:      "\x0304✗\x03 MOTD sarrera ez da aurkitu."
  list:
    syntax:         "MOTD LIST"
    short:          "Zerrendatu MOTD sarrera guztiak."
    help:           "Konfiguratutako MOTD sarrera guztiak zerrendatzen ditu.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Ez dago MOTD sarrerarik konfiguratuta."
    header:         "MOTD sarrerak:"
    status_enabled: "\x0303gaituta\x03"
    status_disabled: "\x0304desgaituta\x03"
    expired:        "\x0304iraungia\x03"
    no_bot:         "(botik ez)"
    never:          "inoiz ez"
    shown_count:    "%count% aldiz erakutsia"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Kendu iraungitako MOTD sarrera guztiak."
    help:           "Bere iraungitze denbora igaro den MOTD sarrera guztiak kentzen ditu.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 %count% iraungitako MOTD sarrera kendu dira."
    none:           "\x0303✓\x03 Ez dago kentzeko iraungitako MOTD sarrerarik."
  debug:
    finalized:      "#%id% MOTD mezua amaitu da: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 ez da kanal-izen baliozkoa; \x02#\x02 ikurrarekin hasi behar du."
  not_found:            "\x0304✗\x03 \x02%channel%\x02 kanala ez dago sarean."
  user_not_online:      "\x0304✗\x03 \x02%nickname%\x02 nick-a ez dago konektatuta."
  user_not_on_channel:  "\x0304✗\x03 \x02%nickname%\x02 nick-a ez dago \x02%channel%\x02 kanalean."
  protected_root:       "\x0304✗\x03 Baimena ukatuta: \x02%nickname%\x02 Root erabiltzailea da."
  protected_ircop:      "\x0304✗\x03 Baimena ukatuta: \x02%nickname%\x02 sare-operadorea da."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#kanala> <nick> [arrazoia]"
  short:    "Erabiltzaile bat kanal batetik kanporatzen du."
  help:     "Erabiltzaile bat kanal batetik kanporatzen du sare-operadore gisa.\nArrazoirik ematen ez bada, lehenetsitako bat erabiltzen da.\nRoot erabiltzaileak eta rola duten IRCopak ezin dira kanporatu.\nAgindu honek operserv.kick baimena behar du."
  example:  "/msg %bot% KICK #laguntza BadUser Utzi flood egiteari"
  done:     "\x0303✓\x03 \x02%nickname%\x02 \x02%channel%\x02 kanaletik kanporatu da. Arrazoia: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#kanala> <nick>"
  short:    "Kanal-operadore egoera ematen dio erabiltzaile bati."
  help:     "OP (+o) ematen dio kanal bateko erabiltzaile bati, kanala erregistratuta ez badago ere.\nAgindu honek operserv.op baimena behar du."
  example:  "/msg %bot% OP #laguntza Erabiltzailea"
  done:     "\x0303✓\x03 \x02%nickname%\x02 operadorea da orain \x02%channel%\x02 kanalean."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#kanala> <nick>"
  short:    "Kanal-operadore egoera kentzen dio erabiltzaile bati."
  help:     "OP (-o) kentzen dio kanal bateko erabiltzaile bati.\nRoot erabiltzaileei eta rola duten IRCopei ezin zaie OP kendu.\nAgindu honek operserv.op baimena behar du."
  example:  "/msg %bot% DEOP #laguntza Erabiltzailea"
  done:     "\x0303✓\x03 \x02%nickname%\x02 ez da jada operadorea \x02%channel%\x02 kanalean."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#kanala> <+/-moduak> [argumentuak]"
  short:          "Moduak ezartzen ditu kanal batean."
  help:           "Adierazitako moduak ezartzen ditu kanal batean, behar dituzten argumentuekin.\nModuak + edo - ikurrarekin hasi behar dira.\nAgindu honek operserv.mode baimena behar du."
  example:        "/msg %bot% MODE #laguntza +mk gakoa"
  done:           "\x0303✓\x03 \x02%channel%\x02 kanalaren moduak \x02%modes%\x02 gisa ezarri dira."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 ez da modu-aldaketa baliozkoa. Erabili +moduak edo -moduak."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#kanala>"
  short:    "Kanal bateko modu murriztaileak kentzen ditu."
  help:     "-imnpst moduak kentzen ditu kanal batetik desblokeatzeko.\nGakoak (+k) eta mugak (+l) ez dira aldatzen.\nAgindu honek operserv.mode baimena behar du."
  example:  "/msg %bot% LIMPIA #laguntza"
  done:     "\x0303✓\x03 \x02%channel%\x02 kanala garbitu da (%modes% moduak)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#kanala>"
  short:               "Kanal batera gonbidatzen zaitu."
  help:                "Adierazitako kanalera gonbidatzen zaitu, gonbidatuentzat soilik bada ere (+i).\nAgindu honek operserv.invite baimena behar du."
  example:             "/msg %bot% INVITE #laguntza"
  done:                "\x0303✓\x03 \x02%channel%\x02 kanalerako gonbidapena bidali da."
  already_on_channel:  "\x0304✗\x03 Dagoeneko \x02%channel%\x02 kanalean zaude."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Sareko estatistikak erakusten ditu."
  help:     "Une honetan sarera konektatuta dauden erabiltzaileen kopurua erakusten du.\nIRC operadore guztientzat erabilgarri."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Konektatutako erabiltzaileak: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Konektatutako IRC operadoreak zerrendatzen ditu."
  help:     "Une honetan konektatuta dauden IRC operadoreak zerrendatzen ditu, nick-aren arabera.\nIRC operadore guztientzat erabilgarri."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Konektatutako operadoreak (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Zerrendaren amaiera."
  empty:    "\x0310ℹ\x03 Ez dago IRC operadorerik konektatuta."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <nick>"
  short:    "Nick baten klonak zerrendatzen ditu."
  help:     "Nick bat konektatuta dagoen hosta eta host beretik konektatutako beste nickak erakusten ditu.\nKonexioak IP errealaren arabera taldekatzen dira ezaguna denean, bestela hostaren arabera.\nKomando honek operserv.clones baimena behar du."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "\x02%nickname%\x02 nick-aren klonak (\x02%host%\x02), %count% konexio:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Zerrendaren amaiera."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 nick-ak ez du klonik (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <nick> [arrazoia]"
  short:    "Nick baten klonak kanporatzen ditu ordubeteko G-Line batekin."
  help:     "Ordubeteko G-Line bat jartzen du adierazitako nick-aren *@host gainean, eta host horretako konexio guztiak deskonektatzen ditu.\nG-Line-a GLINE LIST-en agertzen da eta GLINE DEL bidez ken daiteke.\nEz zaie inoiz aplikatzen localhost-i edo Root erabiltzaileekin edo rola duten IRCopekin partekatutako hostei.\nKomando honek operserv.clones baimena behar du."
  example:  "/msg %bot% KILLCLONES Erabiltzailea Klonak ez daude baimenduta"
  done:     "\x0303✓\x03 \x02%nickname%\x02 nick-aren klonak kanporatu dira: G-Line \x02%mask%\x02 %duration% (%count% konexio). Arrazoia: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <nick> [arrazoia]"
  short:    "Nick baten hosta blokeatzen du 5 orduko G-Line batekin."
  help:     "5 orduko G-Line bat jartzen du adierazitako nick-aren *@host gainean, eta host horretako konexio guztiak deskonektatzen ditu.\nG-Line-a GLINE LIST-en agertzen da eta GLINE DEL bidez ken daiteke.\nEz zaie inoiz aplikatzen localhost-i edo Root erabiltzaileekin edo rola duten IRCopekin partekatutako hostei.\nKomando honek operserv.clones baimena behar du."
  example:  "/msg %bot% BLOCK Erabiltzailea Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 blokeatu da: G-Line \x02%mask%\x02 %duration% (%count% konexio). Arrazoia: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Baimena ukatuta: \x02%host%\x02 host lokala da eta ez du inoiz G-Line-rik jasotzen."
  failed:         "\x0304✗\x03 Ezin izan da \x02%mask%\x02 G-Line-a aplikatu."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <gutxienekoa|host>"
  short:    "IP bakoitzeko aldibereko konexioak erakusten ditu."
  help:     "IP bakoitzetik (edo hostetik, IPa ezezaguna bada) zenbat aldibereko konexio aktibo dauden erakusten du.\nKomando honek operserv.conexiones baimena behar du."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "Gutxienez <gutxienekoa> konexio dituzten IPak zerrendatzen ditu."
    help:             "Gutxienez <gutxienekoa> aldibereko konexio aktibo dituzten IPak zerrendatzen ditu, konexio gehien dituztenak lehenik.\nGutxienekoak 1 baino handiagoa den zenbaki osoa izan behar du."
    syntax:           "CONEXIONES LIST <gutxienekoa>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "Gutxienez \x02%minimum%\x02 aldibereko konexio aktibo dituzten IPak:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Zerrendaren amaiera."
    empty:            "\x0310ℹ\x03 Ez dago gutxienez \x02%minimum%\x02 aldibereko konexio dituen IPrik."
    invalid_minimum:  "\x0304✗\x03 Gutxieneko baliogabea: 1 baino handiagoa den zenbaki osoa izan behar du."
  view:
    short:      "IP baten konexioak erakusten ditu."
    help:       "IP edo host batetik zenbat aldibereko konexio aktibo dauden erakusten du."
    syntax:     "CONEXIONES VIEW <host>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 \x02%host%\x02 hostaren aldibereko konexio aktiboak: \x02%count%\x02."
    not_found:  "\x0304✗\x03 Ez da konexiorik aurkitu \x02%host%\x02 hostarentzat."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <nick> <+/-moduak>"
  short:          "Nick baten erabiltzaile-moduak aldatzen ditu."
  help:           "Konektatutako nick bati erabiltzaile-moduak jarri edo kentzen dizkio.\nZure mailako edo beheragoko moduak bakarrik erabil ditzakezu: edozein IRCopek erabiltzaile-moduak, Operadore batek s eta W ere, Administratzaile batek H, q eta o ere; Rootek, edozein.\nr eta h moduak ezin dira jarri ezta kendu ere.\nAgindu honek operserv.umode baimena behar du."
  example:        "/msg %bot% UMODE Erabiltzailea +R"
  done:           "\x0303✓\x03 \x02%modes%\x02 moduak \x02%nickname%\x02 nickari aplikatu zaizkio."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 ez da modu-aldaketa baliozkoa. Erabili +moduak edo -moduak."
  forbidden:      "\x0304✗\x03 Ezin dituzu r eta h moduak jarri ezta kendu ere."
  above_rank:     "\x0304✗\x03 Zure mailak ez dizu \x02%modes%\x02 moduak erabiltzen uzten."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <nick>"
  short:    "Erabiltzaile bat kartzela-kanalean sartzen du."
  help:     "Erabiltzaile bat bere kanal guztietatik ateratzen du eta kartzela-kanalean sartzen du (%channel%).\nKartzelan dagoen bitartean, beste kanal batean sartzen bada atera egiten da, eta kartzelatik ateratzen bada berriro sartzen da.\nUNJAIL bidez edo deskonektatzean geratzen da aske.\nRoot erabiltzaileak eta rola duten IRCopak ezin dira kartzelatu.\nAgindu honek operserv.jail baimena behar du."
  example:  "/msg %bot% JAIL Erabiltzailea"
  done:     "\x0303✓\x03 \x02%nickname%\x02 \x02%channel%\x02 kanalean kartzelatu da."
  already:  "\x0304✗\x03 \x02%nickname%\x02 dagoeneko kartzelan dago."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <nick>"
  short:       "Kartzelatutako erabiltzaile bat askatzen du."
  help:        "JAIL bidez kartzelatutako erabiltzaile bat askatzen du: edozein kanaletan sar daiteke berriro.\nAgindu honek operserv.jail baimena behar du."
  example:     "/msg %bot% UNJAIL Erabiltzailea"
  done:        "\x0303✓\x03 \x02%nickname%\x02 \x02%channel%\x02 kanaletik askatu da."
  not_jailed:  "\x0304✗\x03 \x02%nickname%\x02 ez dago kartzelan."

# --- ELINE -----------------------------------------------------------------------
eline:
  syntax:          "ELINE {ADD|DEL|LIST|VIEW|COUNT|CLEAR} ..."
  short:           "IP bidezko ban-salbuespenak (E-Lines) kudeatzen ditu."
  help:            "E-Lineek IP bat sareko banetatik salbuesten dute (G-Lines, Z-Lines, shun, IP bakoitzeko konexio-muga, zerrenda beltzak...). Erabilgarria IRCopen ZNC dituzten VPSetarako.\nADD-ek bat gehitzen du, DEL-ek ezabatzen ditu, LIST eta VIEW-ek erakusten dituzte eta COUNT-ek zenbatzen ditu.\nAgindu honek operserv.eline baimena behar du."
  example:         "/msg %bot% ELINE ADD +30d *@203.0.113.10 ZNC IRCops"
  added:           "\x0303✓\x03 E-Line gehitu da \x02%mask%\x02 maskararako (iraungitzea: %expiration%)."
  already_exists:  "\x0304✗\x03 Dagoeneko badago E-Line bat \x02%mask%\x02 maskararako."
  invalid_mask:    "\x0304✗\x03 \x02%mask%\x02 ez da baliozkoa: erabili erabiltzailea@IP edo IP (IPa CIDR tartea izan daiteke)."
  invalid_expiry:  "\x0304✗\x03 \x02%expiry%\x02 ez da iraungitze baliozkoa: erabili +0 (iraunkorra) edo +30d, +12h, +30m bezalako balio bat."
  deleted:         "\x0303✓\x03 Ezabatutako E-Lineak: \x02%masks%\x02."
  not_found:       "\x0304✗\x03 Ez dago \x02%item%\x02 E-Linerik."
  never_expires:   "inoiz ez"
  add:
    syntax:   "ELINE ADD [+iraungitzea] <erabiltzailea@IP|IP> <arrazoia>"
    short:    "E-Line bat gehitzen du."
    help:     "Ban-salbuespen bat gehitzen du IP edo CIDR tarte baterako, aukeran iraungitzearekin (+30d, +12h, +30m; gabe, iraunkorra da). Erabiltzailerik adierazten ez bada * erabiltzen da."
    example:  "/msg %bot% ELINE ADD +30d 203.0.113.10 ZNC IRCops"
  del:
    syntax:   "ELINE DEL <maskara|zenbakia|zerrenda>"
    short:    "E-Lineak ezabatzen ditu."
    help:     "E-Line bat ezabatzen du bere maskararen, LISTeko zenbakiaren edo zenbaki eta tarteen zerrenda baten bidez (1,3-5)."
    example:  "/msg %bot% ELINE DEL 1,3-5"
  list:
    syntax:   "ELINE LIST"
    short:    "E-Lineak zerrendatzen ditu."
    help:     "E-Line aktiboak erakusten ditu, zenbakituta, iraungitzearekin."
    example:  "/msg %bot% ELINE LIST"
    header:   "\x0307---\x03 \x02E-Lineak (%count%)\x02 \x0307---\x03"
    entry:    "  \x02%number%.\x02 %mask% \x0314(iraungitzea: %expiration%)\x03"
    empty:    "Ez dago E-Line aktiborik."
  view:
    syntax:   "ELINE VIEW"
    short:    "E-Lineak xehetasunez erakusten ditu."
    help:     "E-Line aktiboak erakusten ditu, nork eta noiz jarri zituen, iraungitzea eta arrazoia."
    example:  "/msg %bot% ELINE VIEW"
    entry:    "  \x02%number%.\x02 %mask% \x0314%setby%-(e)k jarria %created%(e)an, iraungitzea: %expiration% - %reason%\x03"
  count:
    syntax:   "ELINE COUNT"
    short:    "E-Lineak zenbatzen ditu."
    help:     "Zenbat E-Line aktibo dauden erakusten du."
    example:  "/msg %bot% ELINE COUNT"
    result:   "\x0310ℹ\x03 E-Line aktiboak: \x02%count%\x02."
  clear:
    syntax:   "ELINE CLEAR"
    short:    "E-Line guztiak ezabatzen ditu."
    help:     "E-Line aktibo guztiak batera ezabatzen ditu, zerbitzuetatik eta IRCdtik."
    example:  "/msg %bot% ELINE CLEAR"
    done:     "\x0303✓\x03 Ezabatutako E-Lineak: \x02%count%\x02."

# --- SET -------------------------------------------------------------------------
set:
  syntax:       "SET PASSPROTECT <aldiz:segundo>"
  short:        "Sare osoko ezarpenak aldatzen ditu."
  help:         "Sare osoari aplikatzen zaizkion ezarpenak aldatzen ditu.\noperserv.set baimena behar du (ROOT maila)."
  example:      "/msg %bot% SET PASSPROTECT 5:60"
  unknown_sub:  "\x0304✗\x03 Azpikomando ezezaguna. Erabili: \x02PASSPROTECT\x02"
  passprotect:
    syntax:     "SET PASSPROTECT <aldiz:segundo>"
    short:      "Pasahitz okerren muga ezartzen du."
    help:       "IRCdak IP batetik epe batean onartzen dituen pasahitz oker kopurua ezartzen du. Hori gaindituz gero saiakerak blokeatzen ditu eta, IRCdan aktibatuta badago, G-Line bat jartzen dio IPari.\nAdibidea: 5:60 = 5 hutsegite 60 segundotan."
    example:    "/msg %bot% SET PASSPROTECT 5:60"
    done:       "\x0303✓\x03 Pasahitz okerren muga: \x02%value%\x02."
    invalid:    "\x0304✗\x03 Balio baliogabea. Erabili \x02aldiz:segundo\x02, biak zero baino handiagoak (adib. \x025:60\x02)."
    rejected:   "\x0304✗\x03 Sareak balioa baztertu du."

# --- Staff ranks (PREOPER, OPER, ADMIN, ROOT) ----------------------------------
staff:
  title:
    preoper: "Pre-Operadore"
    oper: "Operadore"
    admin: "Administratzaile"
    root: "Root"
  added:            "\x0303✓\x03 \x02%nickname%\x02 sareko %rank% gisa gehitu da."
  deleted:          "\x0303✓\x03 \x02%nickname%\x02 sareko %rank% izateari utzi dio."
  already_rank:     "\x0304✗\x03 \x02%nickname%\x02 sareko %rank% da jada. Kendu lehenik maila horretatik."
  already_staff:    "\x0304✗\x03 \x02%nickname%\x02 staffeko kidea da jada."
  not_this_rank:    "\x0304✗\x03 \x02%nickname%\x02 ez da sareko %rank%."
  nick_not_active:  "\x0304✗\x03 \x02%nickname%\x02 ezizena ez da ezizen erregistratu aktibo bat."
  unavailable:      "\x0304✗\x03 Mailak ez daude prest oraindik. Saiatu berriro segundo batzuk barru."
  list:
    header:         "--- %rank% (%count%) ---"
    empty:          "\x0310ℹ\x03 Ez dago %rank%-rik."
  preoper:
    syntax:         "PREOPER {ADD|DEL|LIST} [<ezizena>]"
    short:          "Sareko Pre-Operadoreak kudeatzen ditu."
    help:           "Sareko Pre-Operadoreak kudeatzen ditu.\nADD-ek ezizenari maila ematen dio bere baimenekin, locop operclass-arekin eta ezizena.preoper.<domeinua> vhost-arekin; DEL-ek dena kentzen dio eta datu-basetik ezabatzen du; LIST-ek erakusten ditu.\nEzizenak erregistratuta egon behar du eta ez staffeko kide izan.\noperserv.staff baimena behar du."
    example:        "/msg %bot% PREOPER ADD Pedro"
  oper:
    syntax:         "OPER {ADD|DEL|LIST} [<ezizena>]"
    short:          "Sareko Operadoreak kudeatzen ditu."
    help:           "Sareko Operadoreak kudeatzen ditu.\nADD-ek ezizenari maila ematen dio bere baimenekin, globop operclass-arekin eta ezizena.oper.<domeinua> vhost-arekin; DEL-ek dena kentzen dio eta datu-basetik ezabatzen du; LIST-ek erakusten ditu.\nEzizenak erregistratuta egon behar du eta ez staffeko kide izan.\noperserv.staff baimena behar du."
    example:        "/msg %bot% OPER ADD Pedro"
  admin:
    syntax:         "ADMIN {ADD|DEL|LIST} [<ezizena>]"
    short:          "Sareko Administratzaileak kudeatzen ditu."
    help:           "Sareko Administratzaileak kudeatzen ditu.\nADD-ek ezizenari maila ematen dio bere baimenekin, admin operclass-arekin eta ezizena.admin.<domeinua> vhost-arekin; DEL-ek dena kentzen dio eta datu-basetik ezabatzen du; LIST-ek erakusten ditu.\nEzizenak erregistratuta egon behar du eta ez staffeko kide izan.\noperserv.staff.admin baimena behar du."
    example:        "/msg %bot% ADMIN ADD Pedro"
  root:
    syntax:         "ROOT {ADD|DEL|LIST} [<ezizena>]"
    short:          "Sareko Root-ak kudeatzen ditu."
    help:           "Sareko Root-ak kudeatzen ditu.\nADD-ek ezizenari maila ematen dio bere baimenekin, netadmin operclass-arekin eta ezizena.root.<domeinua> vhost-arekin; DEL-ek dena kentzen dio eta datu-basetik ezabatzen du; LIST-ek erakusten ditu.\nEzizenak erregistratuta egon behar du eta ez staffeko kide izan.\nRoot nagusiak (konfigurazioa) bakarrik erabil dezake."
    example:        "/msg %bot% ROOT ADD Pedro"
