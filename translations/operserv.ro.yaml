  header_title:     "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro:            "Serviciu de administrare a rețelei pentru operatori."
  general_header: "\x02 ■ Comenzi disponibile:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opțiuni:\x02"
  general_footer: "\x0310ℹ\x03\x0F Folosește /msg %bot% \x02\x0303HELP <comandă>\x03\x0F pentru mai multe informații."
  set_sub_footer: "\x0310ℹ\x03\x0F Folosește /msg %bot% \x02\x0303HELP %command% <opțiune>\x03\x0F pentru mai multe informații."
  syntax_label: "Sintaxă: \x02\x0303%syntax%\x03\x0F"
  example_label: "Exemplu: \x02\x0303%example%\x03\x0F"
  footer:           "\x0314─────────────────────────────\x03\x0F"
