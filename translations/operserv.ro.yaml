error:
  syntax:           "\x0304✗\x03 Sintaxă incorectă. Utilizare: \x02%syntax%\x02"
  oper_only:        "\x0304✗\x03 Această comandă este rezervată operatorilor IRC."
  not_identified:   "\x0304✗\x03 Nu sunteți identificat. Folosiți \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Nu aveți permisiuni suficiente pentru a executa această comandă."
  root_only:        "\x0304✗\x03 Această comandă este rezervată administratorilor root ai rețelei."
  nick_not_registered: "\x0304✗\x03 Porecla \x02%nickname%\x02 nu este înregistrată."

