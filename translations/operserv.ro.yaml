  ircop_header: "\x02 ■ Comenzi disponibile pentru IRCops:\x02"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax:           "IRCOP {ADD|DEL|LIST} [poreclă] [rol]"
  short:            "Gestionați operatorii IRC ai rețelei."
  help:             "Gestionează operatorii IRC ai rețelei. ADD adaugă o poreclă înregistrată\nca operator cu rolul specificat.\nDEL elimină un operator. LIST afișează toți operatorii.\nFolosiți ROLE LIST pentru a vedea rolurile disponibile.\nAceastă comandă este rezervată utilizatorilor Root configurați în servicii."
  example:          "/msg %bot% IRCOP ADD Alice helper"

  unknown_sub:      "\x0304✗\x03 Subcomandă necunoscută \x02%sub%\x02. Folosiți ADD, DEL sau LIST."
  unknown_role:     "\x0304✗\x03 Rolul \x02%role%\x02 nu există. Folosiți \x0303/msg %bot% ROLE LIST\x03 pentru a vedea rolurile disponibile."
  already_admin:    "\x0304✗\x03 \x02%nickname%\x02 este deja operator IRC (rol: %role%)."
  not_admin:       "\x0304✗\x03 \x02%nickname%\x02 nu este operator IRC."
  role_changed:     "\x0303✓\x03 Rol schimbat pentru \x02%nickname%\x02 din %old% în %new%."

  add:
    syntax:         "IRCOP ADD <poreclă> <rol>"
    short:          "Adăugați un operator IRC al rețelei."
    help:           "Adaugă o poreclă înregistrată ca operator IRC al rețelei.\nFolosiți ROLE LIST pentru a vedea rolurile disponibile.\nAceastă comandă este rezervată utilizatorilor Root."
    example:        "/msg %bot% IRCOP ADD Alice helper"
    done:           "\x0303✓\x03 Adăugat \x02%nickname%\x02 ca \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 Porecla \x02%nickname%\x02 nu este o poreclă înregistrată activă."

  del:
    syntax:         "IRCOP DEL <poreclă>"
    short:          "Eliminați un operator IRC al rețelei."
    help:            "Elimină un operator IRC al rețelei din listă.\nAceastă comandă este rezervată utilizatorilor Root."
    example:         "/msg %bot% IRCOP DEL Alice"
    done:           "\x0303✓\x03 Eliminat \x02%nickname%\x02 din operatorii IRC."

  list:
    syntax:         "IRCOP LIST"
    short:          "Listați toți operatorii IRC ai rețelei."
    help:            "Listează toți operatorii IRC ai rețelei cu rolurile și data înregistrării.\nAceastă comandă este rezervată utilizatorilor Root."
    example:         "/msg %bot% IRCOP LIST"
    header:         "\x0307---\x03 \x02Operatori IRC ai rețelei\x02 \x0307---\x03"
    empty:          "Nu există operatori IRC."

# --- ROLE --------------------------------------------------------------------
role:
  operclass:
    syntax: "ROLE OPERCLASS {LIST|<rol>} [{VIEW|SET}] [operclass]"
    short: "Gestioneaza operclass Unreal a rolului."
    help: "LIST arata operclasses disponibile in retea.\nVIEW arata operclass a rolului si cele disponibile.\nSET o atribuie la identificare (OFF pentru a o elimina).\nDisponibil doar pe protocoalele UnrealIRCd."
    example: "/msg %bot% ROLE OPERCLASS LIST"
    list:
      header: "\x0307---\x03 \x02Operclasses Disponibile in Retea\x02 \x0307---\x03"
      empty: "Nu exista operclasses disponibile in retea."
      not_supported: "\x0304✗\x03 Protocolul curent nu suporta listarea operclasses disponibile."
    view:
      empty: "Rolul %role% nu are operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Operclasses disponibile: \x0310%available%\x03"
    set:
      done: "Operclass setata pentru %role%."
      cleared: "Operclass eliminata din %role%."
      not_available: "\x0304✗\x03 Operclass \x02%operclass%\x02 nu este disponibila in retea. Operclasses disponibile: %available%."
  syntax:           "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <nume> ..."
  short:            "Gestionați rolurile de operator."
  help:             "Gestionează rolurile de operator. ADD creează un nou rol, DEL îl șterge,\nLIST afișează toate rolurile, PERMS gestionează permisiunile unui rol, MODES gestionează modurile IRCOP,\nVHOST gestionează modelul de vhost forțat al unui rol.\nRolurile protejate (ADMIN, OPER, PREOPER) nu pot fi șterse.\nAceastă comandă este rezervată utilizatorilor Root."
  example:          "/msg %bot% ROLE ADD helper"
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <nume> ..."
  help_operclass:   "Gestionează rolurile de operator. ADD creează un nou rol, DEL îl șterge,\nLIST afișează toate rolurile, PERMS gestionează permisiunile unui rol, MODES gestionează modurile IRCOP,\nVHOST gestionează modelul de vhost forțat al unui rol, OPERCLASS gestionează operclass Unreal.\nRolurile protejate (ADMIN, OPER, PREOPER) nu pot fi șterse.\nAceastă comandă este rezervată utilizatorilor Root."

  unknown_sub:      "\x0304✗\x03 Subcomandă necunoscută \x02%sub%\x02. Folosiți ADD, DEL, LIST, PERMS, MODES sau VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Subcomandă necunoscută \x02%sub%\x02. Folosiți ADD, DEL, LIST, PERMS, MODES, VHOST sau OPERCLASS."
  not_found:        "\x0304✗\x03 Rolul \x02%role%\x02 nu există."
  already_exists:   "\x0304✗\x03 Rolul \x02%role%\x02 există deja."
  protected:        "\x0304✗\x03 Rolul \x02%role%\x02 este protejat și nu poate fi șters."

  add:
    syntax:         "ROLE ADD <nume> [descriere]"
    short:          "Creați un nou rol."
    help:            "Creează un nou rol personalizat. Descrierea este opțională.\nAceastă comandă este rezervată utilizatorilor Root."
    example:         "/msg %bot% ROLE ADD helper"
    done:           "\x0303✓\x03 Rol creat \x02%role%\x02."

  del:
    syntax:         "ROLE DEL <nume>"
    short:          "Ștergeți un rol."
    help:            "Șterge un rol personalizat. Rolurile protejate (ADMIN, OPER, PREOPER)\nnu pot fi șterse. Dacă rolul are operatori alocați,\ntrebuie să îi realocați mai întâi.\nAceastă comandă este rezervată utilizatorilor Root."
    example:         "/msg %bot% ROLE DEL helper"
    done:           "\x0303✓\x03 Rol șters \x02%role%\x02."

  list:
    syntax:         "ROLE LIST"
    short:          "Listați toate rolurile."
    help:            "Listează toate rolurile. Rolurile protejate sunt marcate cu [PROTECTED].\nAceastă comandă este rezervată utilizatorilor Root."
    example:         "/msg %bot% ROLE LIST"
    header:         "\x0307---\x03 \x02Roluri de operator\x02 \x0307---\x03"
    empty:          "Nu există roluri de operator."

  perms:
    syntax:         "ROLE PERMS <rol> {LIST|ADD|DEL|CLEAR} [permisiune|ALL]"
    short:          "Gestionați permisiunile rolului."
    help:            "Gestionează permisiunile atribuite unui rol.\nLIST afișează toate permisiunile rolului.\nADD atribuie o permisiune rolului.\nDEL elimină o permisiune din rol (nu pentru rolurile protejate).\nCLEAR elimină toate permisiunile din rol.\nFolosiți ALL pentru a adăuga toate permisiunile disponibile deodată.\nAceastă comandă este rezervată utilizatorilor Root."
    example:         "/msg %bot% ROLE PERMS helper ADD operserv.kill"
    not_found:       "\x0304✗\x03 Permisiunea \x02%perm%\x02 nu există."
    already_has:     "\x0304✗\x03 Rolul \x02%role%\x02 are deja permisiunea \x02%perm%\x02."
    does_not_have:   "\x0304✗\x03 Rolul \x02%role%\x02 nu are permisiunea \x02%perm%\x02."

    list:
      header:        "\x0307---\x03 \x02Permisiuni pentru %role%\x02 \x0307---\x03"

    add:
      done:         "\x0303✓\x03 Permisiunea \x02%perm%\x02 adăugată rolului \x02%role%\x02."
      all_done:     "\x0303✓\x03 Adăugate \x02%count%\x02 permisiuni rolului \x02%role%\x02."

    del:
      done:         "\x0303✓\x03 Permisiunea \x02%perm%\x02 eliminată din rolul \x02%role%\x02."

    clear:
      done:         "\x0303✓\x03 Eliminate \x02%count%\x02 permisiuni din rolul \x02%role%\x02."
      empty:        "\x0304✗\x03 Rolul \x02%role%\x02 nu are permisiuni atribuite."

  modes:
    syntax:         "ROLE MODES <rol> {VIEW|SET} [moduri]"
    short:          "Gestionați modurile de utilizator IRCOP pentru rol."
    help:            "Gestionează modurile de utilizator IRCOP atribuite unui rol.\nVIEW afișează modurile actuale ale rolului.\nSET setează modurile IRCOP (de ex. oH pentru +oH).\nUtilizatorii cu acest rol vor primi aceste moduri la identificare.\nModuri disponibile per IRCD: UnrealIRCd (H, q, s, W), InspIRCd (s).\nAceastă comandă este rezervată utilizatorilor Root."
    example:         "/msg %bot% ROLE MODES helper SET oH"

    view:
      header:        "\x0307---\x03 \x02Moduri pentru %role%\x02 \x0307---\x03"
      empty:        "Rolul \x02%role%\x02 nu are moduri atribuite."
      line:         "  Moduri: \x0303%modes%\x03"

    set:
      done:         "\x0303✓\x03 Moduri setate \x02%modes%\x02 pentru rolul \x02%role%\x02."
      cleared:      "\x0303✓\x03 Toate modurile au fost eliminate din rolul \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 Modul \x02%mode%\x02 nu este un mod IRCOP valid."
      invalid_modes: "\x0304✗\x03 Moduri invalide: %invalid%. Moduri valide: %valid%."
      no_irc_user_modes: "\x0304✗\x03 IRCd-ul actual nu are moduri IRCOP configurate."

  vhost:
    syntax:         "ROLE VHOST <rol> {VIEW|SET} [model]"
    short:          "Gestionați modelul de vhost forțat pentru un rol."
    help:           "Gestionează vhostul forțat atribuit unui rol.\nVIEW afișează modelul actual de vhost forțat.\nSET atribuie un model de vhost forțat (utilizatorii cu acest rol vor\nprimi acest vhost la identificare, anulând vhostul personal).\nModelul este adăugat după porecla curățată, de ex.:\n  Poreclă: _davidlig_ → Model: admin.ares → VHost: davidlig.admin.ares\nCaractere valide: a-z, A-Z, 0-9, cratimă (-) și punct (.).\nTrebuie să aibă cel puțin un punct, nu poate începe/termina cu - sau . sau să aibă ..\nFolosiți OFF pentru a șterge modelul de vhost forțat.\nAceastă comandă este rezervată utilizatorilor Root."
    example:        "/msg %bot% ROLE VHOST helper SET staff.example.com"

    view:
      header:        "\x0307---\x03 \x02Vhost forțat pentru %role%\x02 \x0307---\x03"
      empty:        "Rolul \x02%role%\x02 nu are un model de vhost forțat setat."
      line:         "  Model: \x0303%pattern%\x03"
      example:      "  Exemplu: \x02poreclă\x02.%pattern%"

    set:
      done:         "\x0303✓\x03 Model de vhost forțat setat pentru rolul \x02%role%\x02."
      cleared:      "\x0303✓\x03 Modelul de vhost forțat a fost eliminat din rolul \x02%role%\x02."
      invalid:      "\x0304✗\x03 Model de vhost invalid. Caractere valide: a-z, A-Z, 0-9, - și .. Trebuie să aibă cel puțin un punct, nu poate începe/termina cu - sau . sau să aibă .."

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <poreclă> <motiv>"
  short:            "Deconectați forțat un utilizator din rețea."
  help:             "Deconectează un utilizator din rețeaua IRC.\nIRCopii și utilizatorii Root nu pot primi kill.\nAceastă comandă necesită permisiunea operserv.kill."
  example:          "/msg %bot% KILL UtilizatorRău Flood pe canale"
  user_not_online:  "\x0304✗\x03 Porecla \x02%nickname%\x02 nu este conectată."
  protected_root:   "\x0304✗\x03 Nu se poate da kill utilizatorului Root \x02%nickname%\x02."
  protected_ircop:  "\x0304✗\x03 Nu se poate da kill operatorului IRC \x02%nickname%\x02."
  done:             "\x0303✓\x03 Utilizatorul \x02%nickname%\x02 a primit kill (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST|CLEAR} [mască] [expirare] [motiv]"
  short:            "Gestionați G-line-urile la nivel de rețea."
  help:             "Gestionează G-line-urile la nivel de rețea (interdicții globale).\nADD adaugă un nou G-line cu mască, expirare și motiv.\nDEL elimină un G-line după mască sau numărul intrării.\nLIST afișează toate G-line-urile, opțional filtrate după mască.\nCLEAR — Șterge deodată toate G-Lines active, din servicii și din IRCd.\n\nFormat de expirare: 0=permanent, sau folosiți sufixul d, h, m (de ex. 7d, 12h, 30m).\nGLINE-urile care corespund utilizatorilor Root sau IRCop sunt respinse.\nAceastă comandă necesită permisiunea operserv.gline."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Reclamă în masă"
  unknown_sub:      "\x0304✗\x03 Subcomandă necunoscută \x02%sub%\x02. Folosiți ADD, DEL, LIST sau CLEAR."
  invalid_mask:     "\x0304✗\x03 Format de mască invalid. Trebuie să fie în format utilizator@host (de ex. *@192.168.*)."
  global_mask:      "\x0304✗\x03 Masca G-line \x02%mask%\x02 este prea largă. Măștile globale nu sunt permise."
  dangerous_mask:   "\x0304✗\x03 Masca G-line \x02%mask%\x02 este prea largă. Partea de host necesită cel puțin 4 caractere alfanumerice."
  protected_user:   "\x0304✗\x03 Nu se poate seta G-line pentru utilizatorul protejat \x02%nickname%\x02."
  invalid_expiry:   "\x0304✗\x03 Format de expirare invalid. Folosiți 0 pentru permanent sau o valoare precum 7d, 12h, 30m."
  already_exists:   "\x0304✗\x03 G-line pentru \x02%mask%\x02 există deja."
  max_entries:      "\x0304✗\x03 Numărul maxim de G-line-uri (%max%) a fost atins."
  not_found:        "\x0304✗\x03 G-line \x02%mask%\x02 nu a fost găsit."
  user_not_found:   "\x0304✗\x03 Porecla \x02%nickname%\x02 nu este online."
  permanent:        "permanent"

  add:
    syntax:         "GLINE ADD <mască> <expirare> <motiv>"
    short:          "Adăugați un G-line la nivel de rețea."
    help:           "Adaugă un G-line la nivel de rețea (interdicție globală).\nMasca trebuie să fie în format utilizator@host.\nExpirare: 0=permanent, sau folosiți sufixul d, h, m (de ex. 7d, 12h, 30m).\nGLINE-urile care corespund utilizatorilor Root sau IRCop sunt respinse.\nAceastă comandă necesită permisiunea operserv.gline."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Reclamă în masă"
    done:           "\x0303✓\x03 G-line adăugat: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <mască|număr>"
    short:          "Eliminați un G-line."
    help:           "Elimină un G-line din listă.\nPuteți specifica masca sau numărul intrării din LIST.\nAceastă comandă necesită permisiunea operserv.gline."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 G-line \x02%mask%\x02 eliminat."

  list:
    syntax:         "GLINE LIST [mască]"
    short:          "Listați toate G-line-urile."
    help:           "Listează toate G-line-urile. Opțional, filtrați după modelul de mască.\nAceastă comandă necesită permisiunea operserv.gline."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-line-uri (%count%) \x0307---\x03"
    empty:          "Nu există G-line-uri."
    no_reason:      "Fără motiv"
    never_expires:  "Permanent"
    unknown_creator: "necunoscut"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, expiră: %expiration%)"

  clear:
    syntax:         "GLINE CLEAR"
    short:          "Șterge toate G-Lines."
    help:           "Șterge deodată toate G-Lines active, din servicii și din IRCd."
    example:        "/msg %bot% GLINE CLEAR"
    done:           "\x0303✓\x03 G-Lines șterse: \x02%count%\x02."

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [țară] [motiv]"
  short:            "Gestionați lista țărilor blocate."
  help:             "Gestionați țările blocate la poarta rețelei.\nDemonul IRC determină țara fiecărui client care se conectează, astfel o țară blocată este respinsă chiar la conectare.\nADD înregistrează un cod de țară împreună cu motivul.\nDEL elimină o țară din listă.\nLIST afișează țările blocate cu motivul și data înregistrării.\nAceastă comandă necesită permisiunea operserv.geoip."
  example:          "/msg %bot% GEOIP ADD ES Nu este permis în această rețea"
  unknown_sub:      "\x0304✗\x03 Subcomandă necunoscută \x02%sub%\x02. Folosiți ADD, DEL sau LIST."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 nu este un cod de țară ISO 3166-1 alpha-2 valid."
  already_exists:   "\x0304✗\x03 Țara \x02%country%\x03 este deja blocată."
  not_found:        "\x0304✗\x03 Țara \x02%country%\x03 nu este blocată."
  default_reason:   "Țară blocată conform politicii rețelei"

  add:
    syntax:         "GEOIP ADD <țară> [motiv]"
    short:          "Blocați o țară la poarta rețelei."
    help:           "Blochează toți clienții care se conectează din țara indicată.\nCodul de țară trebuie să fie un cod ISO 3166-1 alpha-2.\nMotivul este afișat clienților respinși și poate fi omis.\nAceastă comandă necesită permisiunea operserv.geoip."
    example:        "/msg %bot% GEOIP ADD ES Nu este permis în această rețea"
    done:           "\x0303✓\x03 Țara \x02%country%\x03 a fost blocată - %reason%"

  del:
    syntax:         "GEOIP DEL <țară>"
    short:          "Deblocați o țară."
    help:           "Elimină o țară din lista țărilor blocate.\nAceastă comandă necesită permisiunea operserv.geoip."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 Țara \x02%country%\x03 a fost deblocată."

  list:
    syntax:         "GEOIP LIST"
    short:          "Afișați țările blocate."
    help:           "Afișează toate țările blocate cu motivul și data înregistrării.\nAceastă comandă necesită permisiunea operserv.geoip."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Țări blocate (%count%)\x02 \x0307---\x03"
    empty:          "Nu există țări blocate."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, înregistrat: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <linie>"
  short:            "Trimiteți o linie de protocol brută către IRCd."
  help:             "Trimite linia specificată direct la socketul IRCd uplink.\nFolosiți cu extremă precauție. Liniile de protocol invalide pot provoca căderea rețelei.\nAceastă comandă necesită permisiunea operserv.raw."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Trebuie să specificați o linie nevidă de trimis."
  too_long:         "\x0304✗\x03 Linia este prea lungă. Maxim 510 caractere."
  not_connected:    "\x0304✗\x03 Neconectat la IRCd."
  done:             "\x0303✓\x03 Linie brută trimisă."
  protocol:
    syntax: "\x0304✗\x03 Protocolul activ a respins sintaxa comenzii RAW."
    done: "\x0303✓\x03 Comanda RAW gestionată de protocol a fost executată."
    target: "\x0304✗\x03 Protocolul activ a respins ținta %target%."
    unsupported: "\x0304✗\x03 Protocolul activ nu acceptă această comandă RAW."
    invalid_resource_type: "\x0304✗\x03 Tip necunoscut de resursă de protocol: %resource_type%."
    invalid_resource: "\x0304✗\x03 Resursă de protocol invalidă: %resource%."
    invalid_value: "\x0304✗\x03 Valoare invalidă pentru resursa de protocol: %resource%."
    error: "\x0304✗\x03 Protocolul activ nu a putut executa comanda RAW."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator% execută comanda %command% asupra %target%. %reason%"
  actionWithDuration: "%operator% execută comanda %command% asupra %target%. Durată: %duration%. %reason%"
  prefix_reason:    "Motiv: %reason%"
  prefix_message:   "Mesaj: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Gestionați mesajele MOTD de conectare trimise utilizatorilor la conectare."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [arg]"
  help:             "Gestionează intrările Message Of The Day care sunt trimise utilizatorilor când se conectează la rețea.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Bun venit în rețea!"
  unknown_sub:      "\x0304✗\x03 Subcomandă necunoscută. Folosiți: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {serviciu|poreclă!ident@vhost} {PRIVMSG|NOTICE} <expirare> <mesaj>"
    syntax_hint:    "\x0304✗\x03 Utilizare: \x02%syntax%\x02"
    short:          "Adăugați o intrare MOTD."
    help:           "Adaugă un nou mesaj MOTD care va fi trimis fiecărui utilizator când se conectează la rețea.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Bun venit în rețea!"
    done:           "\x0303✓\x03 Intrarea MOTD #%id% adăugată."
    invalid_type:   "\x0304✗\x03 Tip de mesaj invalid. Trebuie să fie \x02PRIVMSG\x02 sau \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Format de expirare invalid. Folosiți: \x02<număr><s|m|h|z>\x02 (de ex. 30s, 5m, 24h, 7z)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Utilizare: \x02%syntax%\x02"
    short:          "Ștergeți o intrare MOTD."
    help:           "Șterge o intrare MOTD după ID-ul său.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 Intrarea MOTD #%id% ștearsă."
    not_found:      "\x0304✗\x03 Intrarea MOTD nu a fost găsită."
  list:
    syntax:         "MOTD LIST"
    short:          "Listați toate intrările MOTD."
    help:           "Listează toate intrările MOTD configurate.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Nu există intrări MOTD configurate."
    header:         "Intrări MOTD:"
    status_enabled: "\x0303activată\x03"
    status_disabled: "\x0304dezactivată\x03"
    expired:        "\x0304expirată\x03"
    no_bot:         "(fără bot)"
    never:          "niciodată"
    shown_count:    "afișat de %count% ori"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Eliminați toate intrările MOTD expirate."
    help:           "Elimină toate intrările MOTD a căror dată de expirare a trecut.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 Eliminate %count% intrări MOTD expirate."
    none:           "\x0303✓\x03 Nu există intrări MOTD expirate de eliminat."
  debug:
    finalized:      "Mesajul MOTD #%id% s-a încheiat: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 nu este un nume de canal valid; trebuie să înceapă cu \x02#\x02."
  not_found:            "\x0304✗\x03 Canalul \x02%channel%\x02 nu există în rețea."
  user_not_online:      "\x0304✗\x03 Nickul \x02%nickname%\x02 nu este conectat."
  user_not_on_channel:  "\x0304✗\x03 Nickul \x02%nickname%\x02 nu este pe \x02%channel%\x02."
  protected_root:       "\x0304✗\x03 Permisiune refuzată: \x02%nickname%\x02 este un utilizator Root."
  protected_ircop:      "\x0304✗\x03 Permisiune refuzată: \x02%nickname%\x02 este un operator IRC."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#canal> <nick> [motiv]"
  short:    "Elimină un utilizator dintr-un canal."
  help:     "Elimină un utilizator dintr-un canal ca operator de rețea.\nDacă nu se indică un motiv, se folosește unul implicit.\nUtilizatorii Root și IRCop-ii cu rol nu pot fi eliminați.\nAceastă comandă necesită permisiunea operserv.kick."
  example:  "/msg %bot% KICK #ajutor BadUser Oprește floodul"
  done:     "\x0303✓\x03 \x02%nickname%\x02 a fost eliminat din \x02%channel%\x02. Motiv: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#canal> <nick>"
  short:    "Acordă statut de operator de canal unui utilizator."
  help:     "Acordă statut de operator (+o) unui utilizator dintr-un canal, chiar dacă acesta nu este înregistrat.\nAceastă comandă necesită permisiunea operserv.op."
  example:  "/msg %bot% OP #ajutor Utilizator"
  done:     "\x0303✓\x03 \x02%nickname%\x02 este acum operator pe \x02%channel%\x02."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#canal> <nick>"
  short:    "Retrage statutul de operator de canal unui utilizator."
  help:     "Retrage statutul de operator (-o) unui utilizator dintr-un canal.\nUtilizatorilor Root și IRCop-ilor cu rol nu li se poate retrage.\nAceastă comandă necesită permisiunea operserv.op."
  example:  "/msg %bot% DEOP #ajutor Utilizator"
  done:     "\x0303✓\x03 \x02%nickname%\x02 nu mai este operator pe \x02%channel%\x02."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#canal> <moduri> [argumente]"
  short:          "Setează moduri pe un canal."
  help:           "Setează modurile indicate pe un canal, urmate de argumentele lor când este nevoie.\nModurile trebuie să înceapă cu + sau -.\nAceastă comandă necesită permisiunea operserv.mode."
  example:        "/msg %bot% MODE #ajutor +mk secret"
  done:           "\x0303✓\x03 Modurile pentru \x02%channel%\x02 au fost setate la \x02%modes%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 nu este o schimbare de moduri validă. Folosește +moduri sau -moduri."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#canal>"
  short:    "Elimină modurile restrictive ale unui canal."
  help:     "Elimină modurile -imnpst ale unui canal pentru a-l debloca.\nCheile (+k) și limitele (+l) rămân neschimbate.\nAceastă comandă necesită permisiunea operserv.mode."
  example:  "/msg %bot% LIMPIA #ajutor"
  done:     "\x0303✓\x03 Canalul \x02%channel%\x02 a fost curățat (moduri %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#canal>"
  short:               "Te invită pe un canal."
  help:                "Te invită pe canalul indicat, chiar dacă este doar pe bază de invitație (+i).\nAceastă comandă necesită permisiunea operserv.invite."
  example:             "/msg %bot% INVITE #ajutor"
  done:                "\x0303✓\x03 Invitația pentru \x02%channel%\x02 a fost trimisă."
  already_on_channel:  "\x0304✗\x03 Ești deja pe \x02%channel%\x02."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Afișează statisticile rețelei."
  help:     "Afișează numărul de utilizatori conectați în prezent la rețea.\nDisponibilă pentru toți operatorii IRC."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Utilizatori online: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Listează operatorii IRC conectați."
  help:     "Listează, după nick, operatorii IRC conectați în prezent la rețea.\nDisponibilă pentru toți operatorii IRC."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Operatori IRC conectați (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Sfârșitul listei."
  empty:    "\x0310ℹ\x03 Niciun operator IRC nu este conectat."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <nick>"
  short:    "Listează clonele unui nick."
  help:     "Afișează hostul de pe care este conectat un nick și celelalte nickuri conectate de pe același host.\nConexiunile sunt grupate după IP-ul real când este cunoscut, altfel după hostname.\nAceastă comandă necesită permisiunea operserv.clones."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "Clonele lui \x02%nickname%\x02 (\x02%host%\x02), %count% conexiuni:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Sfârșitul listei."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 nu are clone (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <nick> [motiv]"
  short:    "Elimină clonele unui nick cu un G-Line de 1 oră."
  help:     "Pune un G-Line de 1 oră pe *@host al nickului indicat, deconectând toate conexiunile de pe acel host.\nG-Line-ul apare în GLINE LIST și poate fi eliminat cu GLINE DEL.\nLocalhost și hosturile partajate cu utilizatori Root sau IRCops cu rol nu primesc niciodată G-Line.\nAceastă comandă necesită permisiunea operserv.clones."
  example:  "/msg %bot% KILLCLONES BadUser Clonele nu sunt permise"
  done:     "\x0303✓\x03 Clonele lui \x02%nickname%\x02 au fost eliminate: G-Line \x02%mask%\x02 pentru %duration% (conexiuni: %count%). Motiv: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <nick> [motiv]"
  short:    "Blochează hostul unui nick cu un G-Line de 5 ore."
  help:     "Pune un G-Line de 5 ore pe *@host al nickului indicat, deconectând toate conexiunile de pe acel host.\nG-Line-ul apare în GLINE LIST și poate fi eliminat cu GLINE DEL.\nLocalhost și hosturile partajate cu utilizatori Root sau IRCops cu rol nu primesc niciodată G-Line.\nAceastă comandă necesită permisiunea operserv.clones."
  example:  "/msg %bot% BLOCK BadUser Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 a fost blocat: G-Line \x02%mask%\x02 pentru %duration% (conexiuni: %count%). Motiv: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Permisiune refuzată: \x02%host%\x02 este un host local și nu primește niciodată G-Line."
  failed:         "\x0304✗\x03 G-Line-ul \x02%mask%\x02 nu a putut fi aplicat."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <minim|host>"
  short:    "Afișează conexiunile simultane pe IP."
  help:     "Afișează câte conexiuni simultane sunt active de pe fiecare IP (sau hostname când IP-ul nu este cunoscut).\nAceastă comandă necesită permisiunea operserv.conexiones."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "Listează IP-urile cu cel puțin <minim> conexiuni."
    help:             "Listează IP-urile cu cel puțin <minim> conexiuni simultane active, în ordinea descrescătoare a conexiunilor.\nMinimul trebuie să fie un număr întreg mai mare decât 1."
    syntax:           "CONEXIONES LIST <minim>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "IP-uri cu cel puțin \x02%minimum%\x02 conexiuni simultane active:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Sfârșitul listei."
    empty:            "\x0310ℹ\x03 Niciun IP nu are cel puțin \x02%minimum%\x02 conexiuni simultane."
    invalid_minimum:  "\x0304✗\x03 Minim invalid: trebuie să fie un număr întreg mai mare decât 1."
  view:
    short:      "Afișează conexiunile unui IP."
    help:       "Afișează câte conexiuni simultane sunt active de pe un IP sau hostname."
    syntax:     "CONEXIONES VIEW <host>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 Conexiuni simultane active de la \x02%host%\x02: \x02%count%\x02."
    not_found:  "\x0304✗\x03 Nu s-au găsit conexiuni pentru \x02%host%\x02."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <nick> <+/-moduri>"
  short:          "Schimbă modurile de utilizator ale unui nick."
  help:           "Setează sau elimină moduri de utilizator pentru un nick conectat.\nPoți folosi doar modurile rangului tău sau inferioare: orice IRCop modurile de utilizator, un Operator și s și W, un Administrator și H, q și o; Root, oricare.\nModurile r și h nu pot fi setate sau eliminate.\nAceastă comandă necesită permisiunea operserv.umode."
  example:        "/msg %bot% UMODE Utilizator +R"
  done:           "\x0303✓\x03 Modurile \x02%modes%\x02 au fost aplicate lui \x02%nickname%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 nu este o schimbare de moduri validă. Folosește +moduri sau -moduri."
  forbidden:      "\x0304✗\x03 Nu poți seta sau elimina modurile r și h."
  above_rank:     "\x0304✗\x03 Rangul tău nu îți permite să folosești modurile \x02%modes%\x02."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <nick>"
  short:    "Închide un utilizator în canalul închisoare."
  help:     "Scoate un utilizator din toate canalele sale și îl pune în canalul închisoare (%channel%).\nCât timp este închis, dacă intră în alt canal este scos, iar dacă iese din închisoare este pus înapoi.\nEste eliberat cu UNJAIL sau la deconectare.\nUtilizatorii Root și IRCop-ii cu rol nu pot fi închiși.\nAceastă comandă necesită permisiunea operserv.jail."
  example:  "/msg %bot% JAIL Utilizator"
  done:     "\x0303✓\x03 \x02%nickname%\x02 a fost închis în \x02%channel%\x02."
  already:  "\x0304✗\x03 \x02%nickname%\x02 este deja închis."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <nick>"
  short:       "Eliberează un utilizator închis."
  help:        "Eliberează un utilizator închis cu JAIL: poate intra din nou în orice canal.\nAceastă comandă necesită permisiunea operserv.jail."
  example:     "/msg %bot% UNJAIL Utilizator"
  done:        "\x0303✓\x03 \x02%nickname%\x02 a fost eliberat din \x02%channel%\x02."
  not_jailed:  "\x0304✗\x03 \x02%nickname%\x02 nu este închis."

# --- ELINE -----------------------------------------------------------------------
eline:
  syntax:          "ELINE {ADD|DEL|LIST|VIEW|COUNT|CLEAR} ..."
  short:           "Gestionează excepțiile de ban după IP (E-Lines)."
  help:            "E-Lines scutesc un IP de banurile rețelei (G-Lines, Z-Lines, shun, limita de conexiuni per IP, liste negre...). Util pentru VPS-urile cu ZNC ale IRCop-ilor.\nADD adaugă una, DEL le șterge, LIST și VIEW le afișează, iar COUNT le numără.\nAceastă comandă necesită permisiunea operserv.eline."
  example:         "/msg %bot% ELINE ADD +30d *@203.0.113.10 ZNC IRCops"
  added:           "\x0303✓\x03 E-Line adăugată pentru \x02%mask%\x02 (expiră: %expiration%)."
  already_exists:  "\x0304✗\x03 Există deja o E-Line pentru \x02%mask%\x02."
  invalid_mask:    "\x0304✗\x03 \x02%mask%\x02 nu este validă: folosește utilizator@IP sau IP (IP-ul poate fi un interval CIDR)."
  invalid_expiry:  "\x0304✗\x03 \x02%expiry%\x02 nu este o expirare validă: folosește +0 (permanentă) sau o valoare ca +30d, +12h, +30m."
  deleted:         "\x0303✓\x03 E-Lines șterse: \x02%masks%\x02."
  not_found:       "\x0304✗\x03 Nu există nicio E-Line \x02%item%\x02."
  never_expires:   "niciodată"
  add:
    syntax:   "ELINE ADD [+expirare] <utilizator@IP|IP> <motiv>"
    short:    "Adaugă o E-Line."
    help:     "Adaugă o excepție de ban pentru un IP sau un interval CIDR, opțional cu expirare (+30d, +12h, +30m; fără, este permanentă). Fără utilizator se folosește *."
    example:  "/msg %bot% ELINE ADD +30d 203.0.113.10 ZNC IRCops"
  del:
    syntax:   "ELINE DEL <mască|număr|listă>"
    short:    "Șterge E-Lines."
    help:     "Șterge o E-Line după mască, după numărul din LIST sau după o listă de numere și intervale (1,3-5)."
    example:  "/msg %bot% ELINE DEL 1,3-5"
  list:
    syntax:   "ELINE LIST"
    short:    "Listează E-Lines."
    help:     "Afișează E-Lines active, numerotate, cu expirarea lor."
    example:  "/msg %bot% ELINE LIST"
    header:   "\x0307---\x03 \x02E-Lines (%count%)\x02 \x0307---\x03"
    entry:    "  \x02%number%.\x02 %mask% \x0314(expiră: %expiration%)\x03"
    empty:    "Nu există E-Lines active."
  view:
    syntax:   "ELINE VIEW"
    short:    "Afișează E-Lines în detaliu."
    help:     "Afișează E-Lines active cu cine le-a pus, când, expirarea și motivul."
    example:  "/msg %bot% ELINE VIEW"
    entry:    "  \x02%number%.\x02 %mask% \x0314pusă de %setby% la %created%, expiră: %expiration% - %reason%\x03"
  count:
    syntax:   "ELINE COUNT"
    short:    "Numără E-Lines."
    help:     "Afișează câte E-Lines sunt active."
    example:  "/msg %bot% ELINE COUNT"
    result:   "Există \x02%count%\x02 E-Lines active."
  clear:
    syntax:   "ELINE CLEAR"
    short:    "Șterge toate E-Lines."
    help:     "Șterge deodată toate E-Lines active, din servicii și din IRCd."
    example:  "/msg %bot% ELINE CLEAR"
    done:     "\x0303✓\x03 E-Lines șterse: \x02%count%\x02."
