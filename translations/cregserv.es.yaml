# CReG translations — Español
# Domain: cregserv

unknown_command: "\x0304✗\x03 Comando desconocido \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Sintaxis incorrecta. Uso: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Este comando está restringido a operadores IRC."
  not_identified: "\x0304✗\x03 No estás identificado. Usa \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permiso denegado. No tienes acceso a este comando."

registra:
  syntax: "REGISTRA <#canal> <descripción>"
  short: "Solicita la aprobación del registro de un canal."
  help: "Solicita el registro de un canal nuevo. Un operador de servicios revisa la solicitud y la aprueba o la deniega; el canal solo se registra una vez aprobada. Debes estar identificado con %nickserv%.\n\n\x02#canal:\x02 El canal a registrar. Debe empezar por #, no debe estar ya registrado (compruébalo con el comando ESTADO) y debe tener como máximo 64 caracteres incluyendo el #.\n\n\x02descripción:\x02 El tema o el propósito del canal, hasta 255 caracteres. Es lo que el operador tiene en cuenta al revisar la solicitud.\n\nUna vez enviada, la solicitud queda pendiente hasta que un operador de servicios la apruebe o la deniegue. Solo puedes enviar una solicitud cada 24 horas."
  example: "/msg CReG REGISTRA #mychannel un lugar para charlar"
  requested: "\x0303✔\x03 Has solicitado el registro del canal \x02%channel%\x02. Un operador de servicios evaluará la solicitud."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  channel_too_long: "\x0304✗\x03 El nombre del canal es demasiado largo: como máximo \x0264\x02 caracteres incluido el \x02#\x02."
  description_too_long: "\x0304✗\x03 La descripción es demasiado larga: como máximo \x02255\x02 caracteres."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 se está eliminando y no puede registrarse hasta que se complete la eliminación."
  duplicate: "\x0304✗\x03 Ya existe una solicitud de registro para \x02%channel%\x02 a la espera de aprobación. Usa \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 La solicitud de registro de \x02%channel%\x02 fue denegada."
  throttled: "\x0304✗\x03 Debes esperar \x02%minutes%\x02 minuto(s) antes de solicitar otro canal."

estado:
  syntax: "ESTADO <#canal>"
  short: "Muestra el estado de registro de un canal."
  help: "Indica en qué punto se encuentra un canal dentro del proceso de registro.\n\nLos estados posibles son:\n    \x02REGISTRADO\x02: el canal ya está registrado con %chanserv%.\n    \x02EN REVISIÓN\x02: una solicitud de registro espera a que un operador de servicios la apruebe o la deniegue.\n    \x02DENEGADO\x02: la solicitud de registro fue denegada.\n    \x02EN ELIMINACIÓN\x02: el canal fue dado de baja y está en su periodo de gracia de eliminación; no puede registrarse de nuevo hasta que la eliminación termine.\n    \x02SIN PROCESO\x02: el canal no tiene ningún proceso de registro."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 se está eliminando y no puede registrarse hasta que se complete la eliminación."
  pending: "\x0303◌\x03 El canal \x02%channel%\x02 se encuentra en proceso, a la espera de la revisión de un operador de servicios (solicitado el %date%)."
  denied: "\x0304✗\x03 El canal \x02%channel%\x02 está denegado desde el %date%. Motivo: %reason%"
  no_request: "\x0304✗\x03 El canal \x02%channel%\x02 no tiene ningún proceso de registro."

cancel:
  syntax: "CANCEL <#canal>"
  short: "Cancela tu solicitud de registro pendiente de un canal."
  help: "Cancela una solicitud de registro de canal que aún no ha sido aprobada ni denegada. Solo puedes cancelar tus propias solicitudes pendientes.\n\n\x02#canal:\x02 El canal cuya solicitud quieres cancelar. La solicitud debe ser la que tú enviaste y debe seguir pendiente.\n\nUna vez cancelada, la solicitud se elimina y el nombre del canal queda libre."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 Tu solicitud de registro del canal \x02%channel%\x02 ha sido cancelada y el nombre del canal vuelve a estar libre."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por \x02#\x02."
  no_request: "\x0304✗\x03 El canal \x02%channel%\x02 no tiene ningún proceso de registro."
  not_yours: "\x0304✗\x03 La solicitud de registro de \x02%channel%\x02 no te pertenece."
  not_pending: "\x0304✗\x03 La solicitud de registro de \x02%channel%\x02 ya fue aprobada o denegada y no puede cancelarse."

aprobar:
  syntax: "APROBAR <#canal>"
  short: "Aprueba una solicitud de registro de canal pendiente."
  help: "Registra un canal cuya solicitud de registro está a la espera de revisión. El canal se registra a nombre del usuario que la solicitó; ninguno de los dos necesita estar dentro. Necesitas el permiso \x02cregserv.aprobar\x02.\n\n\x02#canal:\x02 El canal con la solicitud pendiente. Usa PENDIENTES para ver la cola.\n\nUna vez aprobada, el canal queda registrado en \x02%chanserv%\x02 y la solicitud se cierra."
  example: "/msg CReG APROBAR #canal"
  approved: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido correctamente registrado para \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  no_pending: "\x0304✗\x03 El canal \x02%channel%\x02 no se encuentra en proceso de registro."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado con \x02%chanserv%\x02."
  already_approved: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  already_denied: "\x0304✗\x03 El canal \x02%channel%\x02 no puede ser registrado porque está marcado como \x0304DENEGADO\x03."
  failed: "\x0304✗\x03 No se ha podido completar el registro del canal \x02%channel%\x02."

denegar:
  syntax: "DENEGAR <#canal> <motivo>"
  short: "Deniega una solicitud de registro de canal pendiente."
  help: "Deniega una solicitud de registro dejando libre el nombre del canal. El motivo es obligatorio y lo muestra DENEGADOS. Necesitas el permiso \x02cregserv.denegar\x02.\n\n\x02#canal:\x02 El canal con la solicitud pendiente.\n\x02motivo:\x02 Por qué se deniega la solicitud; se guarda y lo muestra cualquiera que consulte DENEGADOS.\n\nEl nombre del canal queda libre para volver a solicitarlo tras la denegación."
  example: "/msg CReG DENEGAR #canal fuera de tema"
  denied: "\x0303✔\x03 Se ha denegado el registro del canal \x02%channel%\x02."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  no_pending: "\x0304✗\x03 El canal \x02%channel%\x02 no tiene ningún proceso de registro."
  already_approved: "\x0304✗\x03 No se pueden denegar canales ya registrados y aprobados."
  already_denied: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra denegado."

pendientes:
  syntax: "PENDIENTES"
  short: "Lista las solicitudes de registro de canal pendientes de revisión."
  help: "Lista cada solicitud de registro a la espera de que un operador de servicios la evalúe, mostrando el canal, quién la pidió, la fecha y la descripción. Necesitas el permiso \x02cregserv.pendientes\x02.\n\nEste comando no acepta parámetros."
  example: "/msg CReG PENDIENTES"
  empty: "No hay canales pendientes de revisión."
  line: "\x02Canal:\x02 %channel%, \x02Solicitado por:\x02 %requester%, \x02Fecha:\x02 %date%, \x02Descripción:\x02 %description%"
  end: "Fin de la lista."

denegados:
  syntax: "DENEGADOS"
  short: "Lista las solicitudes de registro de canal que han sido denegadas."
  help: "Lista cada solicitud de registro denegada junto con el motivo por el que se denegó. Necesitas el permiso \x02cregserv.denegados\x02.\n\nEste comando no acepta parámetros."
  example: "/msg CReG DENEGADOS"
  empty: "No hay canales denegados."
  line: "\x02Canal:\x02 %channel%, \x02Motivo:\x02 %reason%"
  end: "Fin de la lista."

drop:
  syntax: "DROP <#canal>"
  short: "Elimina el registro de canal que \x02%bot%\x02 guarda para un canal."
  help: "Elimina el registro que \x02%bot%\x02 guarda para un canal y, si el canal está registrado allí, también lo da de baja de \x02%chanserv%\x02. Necesitas el permiso \x02cregserv.drop\x02.\n\n\x02#canal:\x02 El canal que quieres eliminar.\n\nLa baja en \x02%chanserv%\x02 es blanda: el canal entra en un periodo de gracia de eliminación en lugar de borrarse de inmediato."
  example: "/msg CReG DROP #canal"
  dropped: "\x0303✔\x03 El registro del canal \x02%channel%\x02 ha sido eliminado de \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido eliminado y ahora entra en el periodo de gracia de eliminación."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  no_request: "\x0304✗\x03 El canal \x02%channel%\x02 no se encuentra registrado con \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#canal> [descripción]"
  short: "Registra un canal sin estar dentro."
  help: "Registra un canal a petición del staff, sin pasar por el flujo de solicitud y aprobación. No necesitas estar dentro del canal ni que este exista todavía. Necesitas el permiso \x02cregserv.saregister\x02.\n\n\x02#canal:\x02 El canal que quieres registrar.\n\x02descripción:\x02 Descripción opcional que se guarda con el registro."
  example: "/msg CReG SAREGISTER #canal canal del staff"
  done: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido registrado."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 está pendiente de eliminación y no puede ser registrado."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  failed: "\x0304✗\x03 No se ha podido completar el registro del canal \x02%channel%\x02."

help:
  syntax:           "HELP [command]"
  short:            "Lista los comandos o muestra la ayuda de un comando."
  help:             "Sin argumentos lista todos los comandos. Usa \x0303HELP <command>\x03 para ver la ayuda completa de un comando."
  header_general:   "\x02\x0303%bot%\x03\x0F - \x0307%network%\x03"
  command_header:   "\x02\x0303%command%\x03\x0F - Ayuda del comando %command%"
  intro: "CReG gestiona el pre-registro de canales: recibe tu petición, la deja en estudio y, si la administración de la red la aprueba, registra el canal a tu nombre.\n\nLos comandos se usan por privado y sin prefijo: escribe /msg %bot% comando. Para más información sobre un comando concreto, escribe /msg %bot% HELP comando."
  general_header:   "\x02Comandos para los usuarios:\x02"
  ircop_header:     "\x02Comandos para operadores:\x02"
  command_line:     "   \x0303%command%\x03\x0F%description%"
  subcommand_line:  "   \x0303%command%\x03\x0F%description%"
  options_header:   "\x02Opciones:\x02"
  set_sub_footer:   "Usa /msg %bot% HELP %command% <opción> para más información."
  syntax_label:     "\x02Sintaxis:\x02\n    \x0303/msg %bot% %syntax%\x03"
  example_label:    "\x02Ejemplo:\x02\n    \x0303%example%\x03"
  warning: "\x02\x0304AVISO:\x03\x0F %bot% solo realiza funciones de pre-registro de canales. Cada petición la revisa la administración de la red, que puede denegar o rechazar el registro si el canal no cumple las normas."
  footer_general:   "\x02FIN de la AYUDA de %bot%\x02"
  footer_command:   "\x02FIN de la ayuda del comando %command%\x02"
  unknown_command:  "\x0307✗\x03 Comando desconocido \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."

ig:
  syntax: "IG {ADD|DEL} <#canal> | IG LIST"
  short: "Gestiona los canales de Interés General (IG)."
  help: "Marca o desmarca un canal registrado como de Interés General (IG). El registro del canal no cambia: solo se guarda la marca. Los canales IG son los únicos que la administración puede tomar con APODERA. Necesitas el permiso \x02cregserv.ig\x02."
  example: "/msg CReG IG ADD #Madrid"
  not_registered: "\x0304✗\x03 El canal \x02%channel%\x02 no está registrado."
  add:
    syntax: "IG ADD <#canal>"
    short: "Marca un canal como IG."
    help: "Marca el canal registrado indicado como de Interés General."
    done: "\x0303✔\x03 El canal \x02%channel%\x02 es ahora de Interés General."
    already: "\x0304✗\x03 El canal \x02%channel%\x02 ya es de Interés General."
  del:
    syntax: "IG DEL <#canal>"
    short: "Quita la marca IG de un canal."
    help: "Quita la marca de Interés General del canal indicado."
    done: "\x0303✔\x03 El canal \x02%channel%\x02 ya no es de Interés General."
    not_marked: "\x0304✗\x03 El canal \x02%channel%\x02 no es de Interés General."
  list:
    syntax: "IG LIST"
    short: "Lista los canales IG."
    help: "Muestra todos los canales marcados como de Interés General."
    channels: "\x02Canales de Interés General:\x02 %channels%"
    empty: "No hay canales de Interés General."

apodera:
  syntax: "APODERA <#canal> [nick]"
  short: "Toma un canal de Interés General para la administración."
  help: "Cambia el fundador de un canal de Interés General (IG) al nick indicado o, si no lo indicas, a ti. Sirve para intervenir un canal o para recuperarlo cuando al fundador le caduca el nick. Solo funciona con canales IG (ver IG) y no aplica el límite de canales por nick. Necesitas el permiso \x02cregserv.apodera\x02."
  example: "/msg CReG APODERA #Madrid SitioChat"
  done: "\x0303✔\x03 El canal \x02%channel%\x02 tiene ahora como fundador a \x02%nickname%\x02."
  already_founder: "\x0304✗\x03 \x02%nickname%\x02 ya es el fundador de \x02%channel%\x02."
  not_registered: "\x0304✗\x03 El canal \x02%channel%\x02 no está registrado."
  not_ig: "\x0304✗\x03 El canal \x02%channel%\x02 no es de Interés General: APODERA solo se puede usar en canales IG."
  founder_not_registered: "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  founder_suspended: "\x0304✗\x03 El nick \x02%nickname%\x02 está suspendido."
