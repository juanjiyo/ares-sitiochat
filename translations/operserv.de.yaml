error:
  syntax:           "\x0304✗\x03 Falsche Syntax. Verwendung: \x02%syntax%\x02"
  oper_only:        "\x0304✗\x03 Dieser Befehl ist IRC-Operatoren vorbehalten."
  not_identified:   "\x0304✗\x03 Sie sind nicht identifiziert. Verwenden Sie \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Sie haben nicht die erforderlichen Berechtigungen, um diesen Befehl auszuführen."
  root_only:        "\x0304✗\x03 Dieser Befehl ist Netzwerk-Root-Administratoren vorbehalten."
  nick_not_registered: "\x0304✗\x03 Nickname \x02%nickname%\x02 ist nicht registriert."

# --- HELP --------------------------------------------------------------------
help:
  syntax:           "HELP [Befehl [Unteroption]]"
  short:            "Befehle auflisten oder Hilfe für einen Befehl anzeigen."
  help:             "Ohne Argumente werden alle Befehle aufgelistet. Verwenden Sie \x0303HELP <Befehl>\x03 für vollständige Hilfe oder \x0303HELP <Befehl> <Option>\x03 für Unteroptionen."
  header_title:     "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro:            "Netzwerkverwaltungsdienst für Operatoren."
  general_header: "\x02 ■ Verfügbare Befehle:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Optionen:\x02"
  general_footer: "\x0310ℹ\x03\x0F Verwende /msg %bot% \x02\x0303HELP <Befehl>\x03\x0F für weitere Informationen."
  set_sub_footer: "\x0310ℹ\x03\x0F Verwende /msg %bot% \x02\x0303HELP %command% <Option>\x03\x0F für weitere Informationen."
  syntax_label: "Syntax: \x02\x0303%syntax%\x03\x0F"
  example_label: "Beispiel: \x02\x0303%example%\x03\x0F"
  footer:           "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0307⚠\x03\x0F HINWEIS: Nicknamen, die länger als %days% Tage ungenutzt bleiben, werden automatisch entfernt."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    operators_roles: "Operatoren und Rollen"
    network_security: "Netzwerksicherheit"
    communication: "Kommunikation"
    low_level: "Niedrige Ebene"
    channels: "Kanäle"
    information: "Netzwerkinformationen"
  unknown_command:  "\x0307✗ Unbekannter Befehl\x03\x0F \x02\x0303%command%\x03\x0F. Verwenden Sie \x0303/msg %bot% HELP\x03\x0F."
  ircop_header: "\x02 ■ Verfügbare Befehle für IRC-Operatoren:\x02"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax:           "IRCOP {ADD|DEL|LIST} [nickname] [Rolle]"
  short:            "Netzwerk-IRC-Operatoren verwalten."
  help:             "Verwaltet Netzwerk-IRC-Operatoren. ADD fügt einen registrierten Nickname\nals Operator mit der angegebenen Rolle hinzu.\nDEL entfernt einen Operator. LIST zeigt alle Operatoren.\nVerwenden Sie ROLE LIST, um verfügbare Rollen zu sehen.\nDieser Befehl ist Root-Benutzern vorbehalten, die in den Services konfiguriert sind."
  example:          "/msg %bot% IRCOP ADD Alice helper"

  unknown_sub:      "\x0304✗\x03 Unbekannter Unterbefehl \x02%sub%\x02. Verwenden Sie ADD, DEL oder LIST."
  unknown_role:     "\x0304✗\x03 Rolle \x02%role%\x02 existiert nicht. Verwenden Sie \x0303/msg %bot% ROLE LIST\x03, um verfügbare Rollen zu sehen."
  already_admin:    "\x0304✗\x03 \x02%nickname%\x02 ist bereits ein IRC-Operator (Rolle: %role%)."
  not_admin:       "\x0304✗\x03 \x02%nickname%\x02 ist kein IRC-Operator."
  role_changed:     "\x0303✓\x03 Rolle für \x02%nickname%\x02 von %old% auf %new% geändert."

  add:
    syntax:         "IRCOP ADD <nickname> <Rolle>"
    short:          "Einen Netzwerk-IRC-Operator hinzufügen."
    help:           "Fügt einen registrierten Nickname als Netzwerk-IRC-Operator hinzu.\nVerwenden Sie ROLE LIST, um verfügbare Rollen zu sehen.\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:        "/msg %bot% IRCOP ADD Alice helper"
    done:           "\x0303✓\x03 \x02%nickname%\x02 als \x02%role%\x02 hinzugefügt."
    nick_not_active: "\x0304✗\x03 Nickname \x02%nickname%\x02 ist kein aktiver registrierter Nickname."

  del:
    syntax:         "IRCOP DEL <nickname>"
    short:          "Einen Netzwerk-IRC-Operator entfernen."
    help:            "Entfernt einen Netzwerk-IRC-Operator aus der Liste.\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:         "/msg %bot% IRCOP DEL Alice"
    done:           "\x0303✓\x03 \x02%nickname%\x02 aus den IRC-Operatoren entfernt."

  list:
    syntax:         "IRCOP LIST"
    short:          "Alle Netzwerk-IRC-Operatoren auflisten."
    help:            "Listet alle Netzwerk-IRC-Operatoren mit ihren Rollen und Registrierungsdatum.\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:         "/msg %bot% IRCOP LIST"
    header:         "\x0307---\x03 \x02Netzwerk-IRC-Operatoren\x02 \x0307---\x03"
    empty:          "Es gibt keine IRC-Operatoren."

# --- ROLE --------------------------------------------------------------------
role:
  operclass:
    syntax: "ROLE OPERCLASS {LIST|<rolle>} [{VIEW|SET}] [operclass]"
    short: "Verwaltet die Unreal-Operclass einer Rolle."
    help: "LIST zeigt die im Netzwerk verfugbaren Operclasses an.\nVIEW zeigt die Operclass der Rolle und verfugbare Operclasses.\nSET weist sie beim Identifizieren zu (OFF zum Entfernen).\nNur fur UnrealIRCd-Protokolle verfugbar."
    example: "/msg %bot% ROLE OPERCLASS LIST"
    list:
      header: "\x0307---\x03 \x02Verfugbare Operclasses im Netzwerk\x02 \x0307---\x03"
      empty: "Keine Operclasses im Netzwerk verfugbar."
      not_supported: "\x0304✗\x03 Das aktuelle Protokoll unterstutzt das Auflisten verfugbarer Operclasses nicht."
    view:
      empty: "Die Rolle %role% hat keine Operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Verfugbare Operclasses: \x0310%available%\x03"
    set:
      done: "Operclass fur %role% gesetzt."
      cleared: "Operclass von %role% entfernt."
      not_available: "\x0304✗\x03 Die Operclass \x02%operclass%\x02 ist im Netzwerk nicht verfugbar. Verfugbare Operclasses: %available%."
  syntax:           "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <Name> ..."
  short:            "Operator-Rollen verwalten."
  help:             "Verwaltet Operator-Rollen. ADD erstellt eine neue Rolle, DEL löscht sie,\nLIST zeigt alle Rollen, PERMS verwaltet Berechtigungen einer Rolle, MODES verwaltet IRCOP-Modes,\nVHOST verwaltet das erzwungene VHost-Muster einer Rolle.\nGeschützte Rollen (ADMIN, OPER, PREOPER) können nicht gelöscht werden.\nDieser Befehl ist Root-Benutzern vorbehalten."
  example:          "/msg %bot% ROLE ADD helper"
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <Name> ..."
  help_operclass:   "Verwaltet Operator-Rollen. ADD erstellt eine neue Rolle, DEL löscht sie,\nLIST zeigt alle Rollen, PERMS verwaltet Berechtigungen einer Rolle, MODES verwaltet IRCOP-Modes,\nVHOST verwaltet das erzwungene VHost-Muster einer Rolle, OPERCLASS verwaltet die Unreal-Operclass.\nGeschützte Rollen (ADMIN, OPER, PREOPER) können nicht gelöscht werden.\nDieser Befehl ist Root-Benutzern vorbehalten."

  unknown_sub:      "\x0304✗\x03 Unbekannter Unterbefehl \x02%sub%\x02. Verwenden Sie ADD, DEL, LIST, PERMS, MODES oder VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Unbekannter Unterbefehl \x02%sub%\x02. Verwenden Sie ADD, DEL, LIST, PERMS, MODES, VHOST oder OPERCLASS."
  not_found:        "\x0304✗\x03 Rolle \x02%role%\x02 existiert nicht."
  already_exists:   "\x0304✗\x03 Rolle \x02%role%\x02 existiert bereits."
  protected:        "\x0304✗\x03 Rolle \x02%role%\x02 ist geschützt und kann nicht gelöscht werden."

  add:
    syntax:         "ROLE ADD <Name> [Beschreibung]"
    short:          "Eine neue Rolle erstellen."
    help:            "Erstellt eine neue benutzerdefinierte Rolle. Beschreibung ist optional.\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:         "/msg %bot% ROLE ADD helper"
    done:           "\x0303✓\x03 Rolle \x02%role%\x02 erstellt."

  del:
    syntax:         "ROLE DEL <Name>"
    short:          "Eine Rolle löschen."
    help:            "Löscht eine benutzerdefinierte Rolle. Geschützte Rollen (ADMIN, OPER, PREOPER)\nkönnen nicht gelöscht werden. Wenn der Rolle Operatoren zugewiesen sind,\nmüssen diese zuerst neu zugewiesen werden.\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:         "/msg %bot% ROLE DEL helper"
    done:           "\x0303✓\x03 Rolle \x02%role%\x02 gelöscht."

  list:
    syntax:         "ROLE LIST"
    short:          "Alle Rollen auflisten."
    help:            "Listet alle Rollen auf. Geschützte Rollen sind mit [GESCHÜTZT] markiert.\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:         "/msg %bot% ROLE LIST"
    header:         "\x0307---\x03 \x02Operator-Rollen\x02 \x0307---\x03"
    empty:          "Es gibt keine Operator-Rollen."

  perms:
    syntax:         "ROLE PERMS <Rolle> {LIST|ADD|DEL|CLEAR} [Berechtigung|ALL]"
    short:          "Rollen-Berechtigungen verwalten."
    help:            "Verwaltet Berechtigungen, die einer Rolle zugewiesen sind.\nLIST zeigt alle Berechtigungen der Rolle.\nADD weist der Rolle eine Berechtigung zu.\nDEL entfernt eine Berechtigung von der Rolle (nicht für geschützte Rollen).\nCLEAR entfernt alle Berechtigungen der Rolle.\nVerwenden Sie ALL, um alle verfügbaren Berechtigungen auf einmal hinzuzufügen.\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:         "/msg %bot% ROLE PERMS helper ADD operserv.kill"
    not_found:       "\x0304✗\x03 Berechtigung \x02%perm%\x02 existiert nicht."
    already_has:     "\x0304✗\x03 Rolle \x02%role%\x02 hat bereits die Berechtigung \x02%perm%\x02."
    does_not_have:   "\x0304✗\x03 Rolle \x02%role%\x02 hat die Berechtigung \x02%perm%\x02 nicht."

    list:
      header:        "\x0307---\x03 \x02Berechtigungen für %role%\x02 \x0307---\x03"

    add:
      done:         "\x0303✓\x03 Berechtigung \x02%perm%\x02 zu Rolle \x02%role%\x02 hinzugefügt."
      all_done:     "\x0303✓\x03 \x02%count%\x02 Berechtigungen zu Rolle \x02%role%\x02 hinzugefügt."

    del:
      done:         "\x0303✓\x03 Berechtigung \x02%perm%\x02 von Rolle \x02%role%\x02 entfernt."

    clear:
      done:         "\x0303✓\x03 \x02%count%\x02 Berechtigungen von Rolle \x02%role%\x02 entfernt."
      empty:        "\x0304✗\x03 Rolle \x02%role%\x02 hat keine Berechtigungen zugewiesen."

  modes:
    syntax:         "ROLE MODES <Rolle> {VIEW|SET} [Modes]"
    short:          "IRCOP-Benutzer-Modes für die Rolle verwalten."
    help:            "Verwaltet IRCOP-Benutzer-Modes, die einer Rolle zugewiesen sind.\nVIEW zeigt die aktuellen Modes der Rolle.\nSET setzt die IRCOP-Modes (z. B. oH für +oH).\nBenutzer mit dieser Rolle erhalten diese Modes bei der Identifizierung.\nVerfügbare Modes pro IRCD: UnrealIRCd (H, q, s, W), InspIRCd (s).\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:         "/msg %bot% ROLE MODES helper SET oH"

    view:
      header:        "\x0307---\x03 \x02Modes für %role%\x02 \x0307---\x03"
      empty:        "Die Rolle \x02%role%\x02 hat keine Modes zugewiesen."
      line:         "  Modes: \x0303%modes%\x03"

    set:
      done:         "\x0303✓\x03 Modes \x02%modes%\x02 für Rolle \x02%role%\x02 gesetzt."
      cleared:      "\x0303✓\x03 Alle Modes von Rolle \x02%role%\x02 entfernt."
      invalid_mode: "\x0304✗\x03 Der Mode \x02%mode%\x02 ist kein gültiger IRCOP-Mode."
      invalid_modes: "\x0304✗\x03 Ungültige Modes: %invalid%. Gültige Modes: %valid%."
      no_irc_user_modes: "\x0304✗\x03 Der aktuelle IRCD hat keine IRCOP-Modes konfiguriert."

  vhost:
    syntax:         "ROLE VHOST <Rolle> {VIEW|SET} [Muster]"
    short:          "Erzwungenes VHost-Muster für eine Rolle verwalten."
    help:           "Verwaltet den erzwungenen VHost, der einer Rolle zugewiesen ist.\nVIEW zeigt das aktuelle erzwungene VHost-Muster.\nSET weist ein erzwungenes VHost-Muster zu (Benutzer mit dieser Rolle\nerhalten diesen VHost bei der Identifizierung und überschreiben persönliche VHosts).\nDas Muster wird nach dem bereinigten Nickname angehängt, z. B.:\n  Nick: _davidlig_ → Muster: admin.ares → VHost: davidlig.admin.ares\nGültige Zeichen: a-z, A-Z, 0-9, Bindestrich (-) und Punkt (.).\nMuss mindestens einen Punkt haben, darf nicht mit - oder . beginnen/enden oder .. enthalten\nVerwenden Sie OFF, um das erzwungene VHost-Muster zu löschen.\nDieser Befehl ist Root-Benutzern vorbehalten."
    example:        "/msg %bot% ROLE VHOST helper SET staff.example.com"

    view:
      header:        "\x0307---\x03 \x02Erzwungener VHost für %role%\x02 \x0307---\x03"
      empty:        "Die Rolle \x02%role%\x02 hat kein erzwungenes VHost-Muster gesetzt."
      line:         "  Muster: \x0303%pattern%\x03"
      example:      "  Beispiel: \x02nickname\x02.%pattern%"

    set:
      done:         "\x0303✓\x03 Erzwungenes VHost-Muster für Rolle \x02%role%\x02 gesetzt."
      cleared:      "\x0303✓\x03 Erzwungenes VHost-Muster von Rolle \x02%role%\x02 entfernt."
      invalid:      "\x0304✗\x03 Ungültiges VHost-Muster. Gültige Zeichen: a-z, A-Z, 0-9, - und .. Muss mindestens einen Punkt haben, darf nicht mit - oder . beginnen/enden oder .. enthalten"

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <nickname> <Grund>"
  short:            "Einen Benutzer zwangsweise vom Netzwerk trennen."
  help:             "Trennt einen Benutzer vom IRC-Netzwerk.\nIRCops und Root-Benutzer können nicht gekillt werden.\nDieser Befehl erfordert die Berechtigung operserv.kill."
  example:          "/msg %bot% KILL SchlechterBenutzer Flooding in Channels"
  user_not_online:  "\x0304✗\x03 Nick \x02%nickname%\x02 ist nicht verbunden."
  protected_root:   "\x0304✗\x03 Root-Benutzer \x02%nickname%\x02 kann nicht gekillt werden."
  protected_ircop:  "\x0304✗\x03 IRC-Operator \x02%nickname%\x02 kann nicht gekillt werden."
  done:             "\x0303✓\x03 Benutzer \x02%nickname%\x02 wurde gekillt (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST|CLEAR} [Maske] [Ablauf] [Grund]"
  short:            "Netzwerkweite G-Lines verwalten."
  help:             "Verwaltet netzwerkweite G-Lines (globale Sperren).\nADD fügt eine neue G-Line mit Maske, Ablauf und Grund hinzu.\nDEL entfernt eine G-Line anhand der Maske oder Eintragsnummer.\nLIST zeigt alle G-Lines, optional nach Maske gefiltert.\nCLEAR — Entfernt alle aktiven G-Lines auf einmal, aus den Services und aus dem IRCd.\n\nAblauf-Format: 0=dauerhaft, oder Suffix d, h, m verwenden (z. B. 7d, 12h, 30m).\nGLINEs, die Root- oder IRCop-Benutzer treffen, werden abgelehnt.\nDieser Befehl erfordert die Berechtigung operserv.gline."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Massive Werbung"
  unknown_sub:      "\x0304✗\x03 Unbekannter Unterbefehl \x02%sub%\x02. Verwenden Sie ADD, DEL, LIST oder CLEAR."
  invalid_mask:     "\x0304✗\x03 Ungültiges Maskenformat. Muss im Format benutzer@host sein (z. B. *@192.168.*)."
  global_mask:      "\x0304✗\x03 G-Line-Maske \x02%mask%\x02 ist zu allgemein. Globale Masken sind nicht erlaubt."
  dangerous_mask:   "\x0304✗\x03 G-Line-Maske \x02%mask%\x02 ist zu allgemein. Der Host-Teil benötigt mindestens 4 alphanumerische Zeichen."
  protected_user:   "\x0304✗\x03 Geschützter Benutzer \x02%nickname%\x02 kann nicht mit G-Line belegt werden."
  invalid_expiry:   "\x0304✗\x03 Ungültiges Ablauf-Format. Verwenden Sie 0 für dauerhaft oder einen Wert wie 7d, 12h, 30m."
  already_exists:   "\x0304✗\x03 G-Line für \x02%mask%\x02 existiert bereits."
  max_entries:      "\x0304✗\x03 Maximale Anzahl von G-Lines (%max%) erreicht."
  not_found:        "\x0304✗\x03 G-Line \x02%mask%\x02 nicht gefunden."
  user_not_found:   "\x0304✗\x03 Nickname \x02%nickname%\x02 ist nicht online."
  permanent:        "dauerhaft"

  add:
    syntax:         "GLINE ADD <Maske> <Ablauf> <Grund>"
    short:          "Eine netzwerkweite G-Line hinzufügen."
    help:           "Fügt eine netzwerkweite G-Line (globale Sperre) hinzu.\nDie Maske muss im Format benutzer@host sein.\nAblauf: 0=dauerhaft, oder Suffix d, h, m verwenden (z. B. 7d, 12h, 30m).\nGLINEs, die Root- oder IRCop-Benutzer treffen, werden abgelehnt.\nDieser Befehl erfordert die Berechtigung operserv.gline."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Massive Werbung"
    done:           "\x0303✓\x03 G-Line hinzugefügt: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <Maske|Nummer>"
    short:          "Eine G-Line entfernen."
    help:           "Entfernt eine G-Line aus der Liste.\nSie können die Maske oder die Eintragsnummer aus LIST angeben.\nDieser Befehl erfordert die Berechtigung operserv.gline."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 G-Line \x02%mask%\x02 entfernt."

  list:
    syntax:         "GLINE LIST [Maske]"
    short:          "Alle G-Lines auflisten."
    help:           "Listet alle G-Lines auf. Optional nach Maskenmuster filtern.\nDieser Befehl erfordert die Berechtigung operserv.gline."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-Lines (%count%) \x0307---\x03"
    empty:          "Es gibt keine G-Lines."
    no_reason:      "Kein Grund"
    never_expires:  "Dauerhaft"
    unknown_creator: "unbekannt"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, läuft ab: %expiration%)"

  clear:
    syntax:         "GLINE CLEAR"
    short:          "Entfernt alle G-Lines."
    help:           "Entfernt alle aktiven G-Lines auf einmal, aus den Services und aus dem IRCd."
    example:        "/msg %bot% GLINE CLEAR"
    done:           "\x0303✓\x03 Entfernte G-Lines: \x02%count%\x02."

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [Land] [Grund]"
  short:            "Verwalte die Liste gesperrter Länder."
  help:             "Verwaltet die Länder, die an der Netzwerkpforte gesperrt sind.\nDer IRC-Daemon ermittelt das Land jedes Clients, der sich verbindet, daher wird ein gesperrtes Land bereits beim Verbinden abgewiesen.\nADD trägt einen Ländercode mit seinem Grund ein.\nDEL entfernt ein Land aus der Liste.\nLIST zeigt die gesperrten Länder mit Grund und Registrierungsdatum.\nDieser Befehl erfordert die Berechtigung operserv.geoip."
  example:          "/msg %bot% GEOIP ADD ES In diesem Netzwerk nicht erlaubt"
  unknown_sub:      "\x0304✗\x03 Unbekannter Unterbefehl \x02%sub%\x02. Verwenden Sie ADD, DEL oder LIST."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 ist kein gültiger ISO-3166-1-alpha-2-Ländercode."
  already_exists:   "\x0304✗\x03 Land \x02%country%\x03 ist bereits gesperrt."
  not_found:        "\x0304✗\x03 Land \x02%country%\x03 ist nicht gesperrt."
  default_reason:   "Land durch die Netzwerkrichtlinie gesperrt"

  add:
    syntax:         "GEOIP ADD <Land> [Grund]"
    short:          "Sperrt ein Land an der Netzwerkpforte."
    help:           "Sperrt alle Clients, die sich aus dem angegebenen Land verbinden.\nDer Ländercode muss ein ISO-3166-1-alpha-2-Code sein.\nDer Grund wird den abgewiesenen Clients angezeigt und kann weggelassen werden.\nDieser Befehl erfordert die Berechtigung operserv.geoip."
    example:        "/msg %bot% GEOIP ADD ES In diesem Netzwerk nicht erlaubt"
    done:           "\x0303✓\x03 Land \x02%country%\x03 gesperrt - %reason%"

  del:
    syntax:         "GEOIP DEL <Land>"
    short:          "Hebt die Sperre eines Landes auf."
    help:           "Entfernt ein Land aus der Liste gesperrter Länder.\nDieser Befehl erfordert die Berechtigung operserv.geoip."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 Sperre für Land \x02%country%\x03 aufgehoben."

  list:
    syntax:         "GEOIP LIST"
    short:          "Listet gesperrte Länder auf."
    help:           "Zeigt alle gesperrten Länder mit Grund und Registrierungsdatum.\nDieser Befehl erfordert die Berechtigung operserv.geoip."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Gesperrte Länder (%count%)\x02 \x0307---\x03"
    empty:          "Es sind keine Länder gesperrt."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, registriert: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <Zeile>"
  short:            "Eine rohe Protokollzeile an den IRCd senden."
  help:             "Sendet die angegebene Zeile direkt an den Uplink-IRCd-Socket.\nMit äußerster Vorsicht verwenden. Ungültige Protokollzeilen können\ndas Netzwerk zum Absturz bringen.\nDieser Befehl erfordert die Berechtigung operserv.raw."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Sie müssen eine nicht-leere Zeile zum Senden angeben."
  too_long:         "\x0304✗\x03 Zeile ist zu lang. Maximal 510 Zeichen."
  not_connected:    "\x0304✗\x03 Nicht mit IRCd verbunden."
  done:             "\x0303✓\x03 Rohe Zeile gesendet."
  protocol:
    syntax: "\x0304✗\x03 Das aktive Protokoll hat die Syntax des RAW-Befehls abgelehnt."
    done: "\x0303✓\x03 Protokolleigener RAW-Befehl ausgeführt."
    target: "\x0304✗\x03 Das aktive Protokoll hat das Ziel %target% abgelehnt."
    unsupported: "\x0304✗\x03 Das aktive Protokoll unterstützt diesen RAW-Befehl nicht."
    invalid_resource_type: "\x0304✗\x03 Unbekannter Protokoll-Ressourcentyp: %resource_type%."
    invalid_resource: "\x0304✗\x03 Ungültige Protokollressource: %resource%."
    invalid_value: "\x0304✗\x03 Ungültiger Wert für Protokollressource: %resource%."
    error: "\x0304✗\x03 Das aktive Protokoll konnte den RAW-Befehl nicht ausführen."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator% führt Befehl %command% auf %target% aus. %reason%"
  actionWithDuration: "%operator% führt Befehl %command% auf %target% aus. Dauer: %duration%. %reason%"
  prefix_reason:    "Grund: %reason%"
  prefix_message:   "Nachricht: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Connect-MOTD-Nachrichten verwalten, die Benutzern beim Verbinden gesendet werden."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [Argumente]"
  help:             "Verwaltet Message-Of-The-Day-Einträge, die Benutzern beim Verbinden mit dem Netzwerk gesendet werden.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Willkommen im Netzwerk!"
  unknown_sub:      "\x0304✗\x03 Unbekannter Unterbefehl. Verwenden Sie: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {Service|nick!ident@vhost} {PRIVMSG|NOTICE} <Ablauf> <Nachricht>"
    syntax_hint:    "\x0304✗\x03 Verwendung: \x02%syntax%\x02"
    short:          "Einen MOTD-Eintrag hinzufügen."
    help:           "Fügt eine neue MOTD-Nachricht hinzu, die jedem Benutzer beim Verbinden mit dem Netzwerk gesendet wird.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Willkommen im Netzwerk!"
    done:           "\x0303✓\x03 MOTD-Eintrag #%id% hinzugefügt."
    invalid_type:   "\x0304✗\x03 Ungültiger Nachrichtentyp. Muss \x02PRIVMSG\x02 oder \x02NOTICE\x02 sein."
    invalid_expiry: "\x0304✗\x03 Ungültiges Ablauf-Format. Verwenden Sie: \x02<Zahl><s|m|h|d>\x02 (z. B. 30s, 5m, 24h, 7d)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Verwendung: \x02%syntax%\x02"
    short:          "Einen MOTD-Eintrag löschen."
    help:           "Löscht einen MOTD-Eintrag anhand seiner ID.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 MOTD-Eintrag #%id% gelöscht."
    not_found:      "\x0304✗\x03 MOTD-Eintrag nicht gefunden."
  list:
    syntax:         "MOTD LIST"
    short:          "Alle MOTD-Einträge auflisten."
    help:           "Listet alle konfigurierten MOTD-Einträge auf.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Keine MOTD-Einträge konfiguriert."
    header:         "MOTD-Einträge:"
    status_enabled: "\x0303aktiviert\x03"
    status_disabled: "\x0304deaktiviert\x03"
    expired:        "\x0304abgelaufen\x03"
    no_bot:         "(kein Bot)"
    never:          "nie"
    shown_count:    "%count% Mal angezeigt"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Alle abgelaufenen MOTD-Einträge entfernen."
    help:           "Entfernt alle MOTD-Einträge, deren Ablaufzeit überschritten ist.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 %count% abgelaufene MOTD-Einträge entfernt."
    none:           "\x0303✓\x03 Keine abgelaufenen MOTD-Einträge zum Entfernen."
  debug:
    finalized:      "MOTD-Nachricht #%id% wurde beendet: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 ist kein gültiger Kanalname; er muss mit \x02#\x02 beginnen."
  not_found:            "\x0304✗\x03 Der Kanal \x02%channel%\x02 existiert im Netzwerk nicht."
  user_not_online:      "\x0304✗\x03 Nick \x02%nickname%\x02 ist nicht verbunden."
  user_not_on_channel:  "\x0304✗\x03 Nick \x02%nickname%\x02 ist nicht in \x02%channel%\x02."
  protected_root:       "\x0304✗\x03 Zugriff verweigert: \x02%nickname%\x02 ist ein Root-Benutzer."
  protected_ircop:      "\x0304✗\x03 Zugriff verweigert: \x02%nickname%\x02 ist ein IRC-Operator."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#kanal> <nick> [grund]"
  short:    "Einen Benutzer aus einem Kanal werfen."
  help:     "Wirft einen Benutzer als Netzwerkoperator aus einem Kanal.\nOhne Angabe wird ein Standardgrund verwendet.\nRoot-Benutzer und IRCops mit Rolle können nicht hinausgeworfen werden.\nDieser Befehl erfordert die Berechtigung operserv.kick."
  example:  "/msg %bot% KICK #hilfe BadUser Hör auf zu fluten"
  done:     "\x0303✓\x03 \x02%nickname%\x02 wurde aus \x02%channel%\x02 geworfen. Grund: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#kanal> <nick>"
  short:    "Einem Benutzer Kanaloperator-Status geben."
  help:     "Gibt einem Benutzer in einem Kanal Operator-Status (+o), auch wenn der Kanal nicht registriert ist.\nDieser Befehl erfordert die Berechtigung operserv.op."
  example:  "/msg %bot% OP #hilfe Benutzer"
  done:     "\x0303✓\x03 \x02%nickname%\x02 ist jetzt Operator in \x02%channel%\x02."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#kanal> <nick>"
  short:    "Einem Benutzer den Kanaloperator-Status entziehen."
  help:     "Entzieht einem Benutzer in einem Kanal den Operator-Status (-o).\nRoot-Benutzern und IRCops mit Rolle kann der Status nicht entzogen werden.\nDieser Befehl erfordert die Berechtigung operserv.op."
  example:  "/msg %bot% DEOP #hilfe Benutzer"
  done:     "\x0303✓\x03 \x02%nickname%\x02 ist nicht mehr Operator in \x02%channel%\x02."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#kanal> <modi> [argumente]"
  short:          "Modi in einem Kanal setzen."
  help:           "Setzt die angegebenen Modi in einem Kanal, gefolgt von ihren Argumenten, falls nötig.\nModi müssen mit + oder - beginnen.\nDieser Befehl erfordert die Berechtigung operserv.mode."
  example:        "/msg %bot% MODE #hilfe +mk geheim"
  done:           "\x0303✓\x03 Modi von \x02%channel%\x02 auf \x02%modes%\x02 gesetzt."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 ist keine gültige Modusänderung. Verwende +modi oder -modi."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#kanal>"
  short:    "Einschränkende Modi aus einem Kanal entfernen."
  help:     "Entfernt die Modi -imnpst aus einem Kanal, um ihn zu entsperren.\nSchlüssel (+k) und Limits (+l) bleiben unverändert.\nDieser Befehl erfordert die Berechtigung operserv.mode."
  example:  "/msg %bot% LIMPIA #hilfe"
  done:     "\x0303✓\x03 Kanal \x02%channel%\x02 wurde bereinigt (Modi %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#kanal>"
  short:               "Dich selbst in einen Kanal einladen."
  help:                "Lädt dich in den angegebenen Kanal ein, auch wenn er nur für Eingeladene ist (+i).\nDieser Befehl erfordert die Berechtigung operserv.invite."
  example:             "/msg %bot% INVITE #hilfe"
  done:                "\x0303✓\x03 Einladung in \x02%channel%\x02 gesendet."
  already_on_channel:  "\x0304✗\x03 Du bist bereits in \x02%channel%\x02."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Netzwerkstatistiken anzeigen."
  help:     "Zeigt die Anzahl der aktuell mit dem Netzwerk verbundenen Benutzer.\nFür alle IRC-Operatoren verfügbar."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Benutzer online: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Verbundene IRC-Operatoren auflisten."
  help:     "Listet die aktuell verbundenen IRC-Operatoren nach Nick auf.\nFür alle IRC-Operatoren verfügbar."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Verbundene IRC-Operatoren (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Ende der Liste."
  empty:    "\x0310ℹ\x03 Es sind keine IRC-Operatoren online."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <nick>"
  short:    "Klone eines Nicks auflisten."
  help:     "Zeigt den Host, von dem ein Nick verbunden ist, und die anderen Nicks, die vom selben Host verbunden sind.\nVerbindungen werden nach echter IP gruppiert, wenn sie bekannt ist, sonst nach Hostname.\nDieser Befehl erfordert die Berechtigung operserv.clones."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "Klone von \x02%nickname%\x02 (\x02%host%\x02), %count% Verbindungen:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Ende der Liste."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 hat keine Klone (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <nick> [grund]"
  short:    "Klone eines Nicks mit einer 1-stündigen G-Line entfernen."
  help:     "Setzt eine 1-stündige G-Line auf *@host des angegebenen Nicks und trennt damit alle Verbindungen dieses Hosts.\nDie G-Line erscheint in GLINE LIST und kann mit GLINE DEL entfernt werden.\nLocalhost und Hosts, die mit Root-Benutzern oder IRCops mit Rolle geteilt werden, erhalten nie eine G-Line.\nDieser Befehl erfordert die Berechtigung operserv.clones."
  example:  "/msg %bot% KILLCLONES BadUser Klone sind nicht erlaubt"
  done:     "\x0303✓\x03 Die Klone von \x02%nickname%\x02 wurden entfernt: G-Line \x02%mask%\x02 für %duration% (Verbindungen: %count%). Grund: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <nick> [grund]"
  short:    "Host eines Nicks mit einer 5-stündigen G-Line sperren."
  help:     "Setzt eine 5-stündige G-Line auf *@host des angegebenen Nicks und trennt damit alle Verbindungen dieses Hosts.\nDie G-Line erscheint in GLINE LIST und kann mit GLINE DEL entfernt werden.\nLocalhost und Hosts, die mit Root-Benutzern oder IRCops mit Rolle geteilt werden, erhalten nie eine G-Line.\nDieser Befehl erfordert die Berechtigung operserv.clones."
  example:  "/msg %bot% BLOCK BadUser Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 wurde gesperrt: G-Line \x02%mask%\x02 für %duration% (Verbindungen: %count%). Grund: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Zugriff verweigert: \x02%host%\x02 ist ein lokaler Host und erhält nie eine G-Line."
  failed:         "\x0304✗\x03 Die G-Line \x02%mask%\x02 konnte nicht gesetzt werden."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <minimum|host>"
  short:    "Gleichzeitige Verbindungen pro IP anzeigen."
  help:     "Zeigt, wie viele gleichzeitige Verbindungen von jeder IP aktiv sind (oder vom Hostname, wenn die IP unbekannt ist).\nDieser Befehl erfordert die Berechtigung operserv.conexiones."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "IPs mit mindestens <minimum> Verbindungen auflisten."
    help:             "Listet die IPs mit mindestens <minimum> gleichzeitigen aktiven Verbindungen auf, die meisten zuerst.\nDas Minimum muss eine ganze Zahl größer als 1 sein."
    syntax:           "CONEXIONES LIST <minimum>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "IPs mit mindestens \x02%minimum%\x02 gleichzeitigen aktiven Verbindungen:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Ende der Liste."
    empty:            "\x0310ℹ\x03 Keine IP hat mindestens \x02%minimum%\x02 gleichzeitige Verbindungen."
    invalid_minimum:  "\x0304✗\x03 Ungültiges Minimum: Es muss eine ganze Zahl größer als 1 sein."
  view:
    short:      "Verbindungen einer IP anzeigen."
    help:       "Zeigt, wie viele gleichzeitige Verbindungen von einer IP oder einem Hostname aktiv sind."
    syntax:     "CONEXIONES VIEW <host>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 Gleichzeitige aktive Verbindungen von \x02%host%\x02: \x02%count%\x02."
    not_found:  "\x0304✗\x03 Keine Verbindungen für \x02%host%\x02 gefunden."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <Nick> <+/-Modi>"
  short:          "Ändert die Benutzermodi eines Nicks."
  help:           "Setzt oder entfernt Benutzermodi bei einem verbundenen Nick.\nDu darfst nur die Modi deines Rangs oder darunter verwenden: jeder IRCop die Benutzermodi, ein Operator zusätzlich s und W, ein Administrator zusätzlich H, q und o; Root alle.\nDie Modi r und h können weder gesetzt noch entfernt werden.\nDieser Befehl erfordert die Berechtigung operserv.umode."
  example:        "/msg %bot% UMODE Benutzer +R"
  done:           "\x0303✓\x03 Modi \x02%modes%\x02 auf \x02%nickname%\x02 angewendet."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 ist keine gültige Modusänderung. Verwende +Modi oder -Modi."
  forbidden:      "\x0304✗\x03 Die Modi r und h können weder gesetzt noch entfernt werden."
  above_rank:     "\x0304✗\x03 Dein Rang erlaubt dir die Modi \x02%modes%\x02 nicht."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <Nick>"
  short:    "Sperrt einen Benutzer im Gefängniskanal ein."
  help:     "Entfernt einen Benutzer aus all seinen Kanälen und setzt ihn in den Gefängniskanal (%channel%).\nSolange er eingesperrt ist, wird er aus jedem anderen Kanal entfernt und bei Verlassen des Gefängnisses zurückgesetzt.\nEr wird mit UNJAIL oder beim Trennen der Verbindung freigelassen.\nRoot-Benutzer und IRCops mit Rolle können nicht eingesperrt werden.\nDieser Befehl erfordert die Berechtigung operserv.jail."
  example:  "/msg %bot% JAIL Benutzer"
  done:     "\x0303✓\x03 \x02%nickname%\x02 wurde in \x02%channel%\x02 eingesperrt."
  already:  "\x0304✗\x03 \x02%nickname%\x02 ist bereits eingesperrt."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <Nick>"
  short:       "Lässt einen eingesperrten Benutzer frei."
  help:        "Lässt einen mit JAIL eingesperrten Benutzer frei: er kann wieder jeden Kanal betreten.\nDieser Befehl erfordert die Berechtigung operserv.jail."
  example:     "/msg %bot% UNJAIL Benutzer"
  done:        "\x0303✓\x03 \x02%nickname%\x02 wurde aus \x02%channel%\x02 freigelassen."
  not_jailed:  "\x0304✗\x03 \x02%nickname%\x02 ist nicht eingesperrt."

# --- ELINE -----------------------------------------------------------------------
eline:
  syntax:          "ELINE {ADD|DEL|LIST|VIEW|COUNT|CLEAR} ..."
  short:           "Verwaltet die Ban-Ausnahmen nach IP (E-Lines)."
  help:            "E-Lines nehmen eine IP von den Netzwerk-Bans aus (G-Lines, Z-Lines, Shun, Verbindungslimit pro IP, Blacklists...). Nützlich für die ZNC-Server der IRCops.\nADD fügt eine hinzu, DEL entfernt sie, LIST und VIEW zeigen sie an und COUNT zählt sie.\nDieser Befehl erfordert die Berechtigung operserv.eline."
  example:         "/msg %bot% ELINE ADD +30d *@203.0.113.10 ZNC IRCops"
  added:           "\x0303✓\x03 E-Line für \x02%mask%\x02 hinzugefügt (läuft ab: %expiration%)."
  already_exists:  "\x0304✗\x03 Für \x02%mask%\x02 gibt es bereits eine E-Line."
  invalid_mask:    "\x0304✗\x03 \x02%mask%\x02 ist ungültig: verwende Benutzer@IP oder IP (die IP darf ein CIDR-Bereich sein)."
  invalid_expiry:  "\x0304✗\x03 \x02%expiry%\x02 ist keine gültige Ablaufzeit: verwende +0 (dauerhaft) oder einen Wert wie +30d, +12h, +30m."
  deleted:         "\x0303✓\x03 E-Lines entfernt: \x02%masks%\x02."
  not_found:       "\x0304✗\x03 Es gibt keine E-Line \x02%item%\x02."
  never_expires:   "nie"
  add:
    syntax:   "ELINE ADD [+Ablauf] <Benutzer@IP|IP> <Grund>"
    short:    "Fügt eine E-Line hinzu."
    help:     "Fügt eine Ban-Ausnahme für eine IP oder einen CIDR-Bereich hinzu, optional mit Ablaufzeit (+30d, +12h, +30m; ohne ist sie dauerhaft). Ohne Benutzerteil wird * verwendet."
    example:  "/msg %bot% ELINE ADD +30d 203.0.113.10 ZNC IRCops"
  del:
    syntax:   "ELINE DEL <Maske|Nummer|Liste>"
    short:    "Entfernt E-Lines."
    help:     "Entfernt eine E-Line über ihre Maske, ihre Nummer in LIST oder eine Liste von Nummern und Bereichen (1,3-5)."
    example:  "/msg %bot% ELINE DEL 1,3-5"
  list:
    syntax:   "ELINE LIST"
    short:    "Listet die E-Lines auf."
    help:     "Zeigt die aktiven E-Lines nummeriert mit ihrer Ablaufzeit."
    example:  "/msg %bot% ELINE LIST"
    header:   "\x0307---\x03 \x02E-Lines (%count%)\x02 \x0307---\x03"
    entry:    "  \x02%number%.\x02 %mask% \x0314(läuft ab: %expiration%)\x03"
    empty:    "Es gibt keine aktiven E-Lines."
  view:
    syntax:   "ELINE VIEW"
    short:    "Zeigt die E-Lines im Detail."
    help:     "Zeigt die aktiven E-Lines mit Ersteller, Zeitpunkt, Ablaufzeit und Grund."
    example:  "/msg %bot% ELINE VIEW"
    entry:    "  \x02%number%.\x02 %mask% \x0314gesetzt von %setby% am %created%, läuft ab: %expiration% - %reason%\x03"
  count:
    syntax:   "ELINE COUNT"
    short:    "Zählt die E-Lines."
    help:     "Zeigt, wie viele E-Lines aktiv sind."
    example:  "/msg %bot% ELINE COUNT"
    result:   "Es gibt \x02%count%\x02 aktive E-Lines."
  clear:
    syntax:   "ELINE CLEAR"
    short:    "Entfernt alle E-Lines."
    help:     "Entfernt alle aktiven E-Lines auf einmal, aus den Services und aus dem IRCd."
    example:  "/msg %bot% ELINE CLEAR"
    done:     "\x0303✓\x03 Entfernte E-Lines: \x02%count%\x02."
