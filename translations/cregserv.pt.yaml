# CReG translations — Portuguese
# Domain: cregserv

unknown_command: "\x0304✗\x03 Comando desconhecido \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Sintaxe incorreta. Uso: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Este comando está restrito a operadores de IRC."
  not_identified: "\x0304✗\x03 Não estás identificado. Usa \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permissão negada. Não tens acesso a este comando."

registra:
  syntax: "REGISTRA <#canal> <descrição>"
  short: "Pede a aprovação do registo de um canal."
  help: "Pede o registo de um canal novo. Um operador de serviços analisa o pedido e aprova-o ou rejeita-o; o canal só é registado depois de aprovado. Tens de estar identificado com %nickserv%.\n\n\x02#canal:\x02 O canal a registar. Tem de começar por #, não pode já estar registado (verifica com o comando ESTADO) e pode ter no máximo 64 caracteres incluindo o #.\n\n\x02descrição:\x02 O tema ou o propósito do canal, até 255 caracteres. É o que o operador tem em conta ao analisar o pedido.\n\nDepois de enviado, o pedido fica pendente até um operador de serviços o aprovar ou rejeitar. Só podes enviar um pedido a cada 24 horas."
  example: "/msg CReG REGISTRA #mychannel um lugar para conversar"
  requested: "\x0303✔\x03 Pediste o registo do canal \x02%channel%\x02. Um operador de serviços vai avaliar o pedido."
  invalid_channel: "\x0304✗\x03 O nome do canal tem de começar por um \x02#\x02."
  channel_too_long: "\x0304✗\x03 O nome do canal é demasiado longo: no máximo \x0264\x02 caracteres incluindo o \x02#\x02."
  description_too_long: "\x0304✗\x03 A descrição é demasiado longa: no máximo \x02255\x02 caracteres."
  already_registered: "\x0304✗\x03 O canal \x02%channel%\x02 já está registado."
  pending_deletion: "\x0304✗\x03 O canal \x02%channel%\x02 está a ser removido e não pode ser registado até que a remoção termine."
  duplicate: "\x0304✗\x03 Já existe um pedido de registo para \x02%channel%\x02 à espera de aprovação. Usa \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 O pedido de registo de \x02%channel%\x02 foi negado."
  throttled: "\x0304✗\x03 Tens de esperar \x02%minutes%\x02 minuto(s) antes de pedires outro canal."

estado:
  syntax: "ESTADO <#canal>"
  short: "Mostra o estado de registo de um canal."
  help: "Indica em que ponto está um canal no processo de registo.\n\nOs estados possíveis são:\n    \x02REGISTADO\x02: o canal já está registado no %chanserv%.\n    \x02EM ANÁLISE\x02: um pedido de registo espera que um operador de serviços o aprove ou o rejeite.\n    \x02NEGADO\x02: o pedido de registo foi negado.\n    \x02A SER REMOVIDO\x02: o canal foi dado de baixa e está no seu período de carência de remoção; não pode ser registado de novo até a remoção terminar.\n    \x02SEM PROCESSO\x02: o canal não tem processo de registo."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 O canal \x02%channel%\x02 já está registado."
  pending_deletion: "\x0304✗\x03 O canal \x02%channel%\x02 está a ser removido e não pode ser registado até que a remoção termine."
  pending: "\x0303◌\x03 O canal \x02%channel%\x02 está em curso, à espera da revisão de um operador de serviços (pedido a %date%)."
  denied: "\x0304✗\x03 O canal \x02%channel%\x02 está negado desde %date%. Motivo: %reason%"
  no_request: "\x0304✗\x03 O canal \x02%channel%\x02 não tem qualquer processo de registo."

cancel:
  syntax: "CANCEL <#canal>"
  short: "Cancela o teu pedido de registo pendente de um canal."
  help: "Cancela um pedido de registo de canal que ainda não foi aprovado nem negado. Só podes cancelar os teus próprios pedidos pendentes.\n\n\x02#canal:\x02 O canal cujo pedido queres cancelar. O pedido tem de ser o que tu enviaste e tem de continuar pendente.\n\nDepois de cancelado, o pedido é removido e o nome do canal fica livre."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 O teu pedido de registo do canal \x02%channel%\x02 foi cancelado e o nome do canal volta a estar livre."
  invalid_channel: "\x0304✗\x03 O nome do canal tem de começar por \x02#\x02."
  no_request: "\x0304✗\x03 O canal \x02%channel%\x02 não tem processo de registo."
  not_yours: "\x0304✗\x03 O pedido de registo de \x02%channel%\x02 não é teu."
  not_pending: "\x0304✗\x03 O pedido de registo de \x02%channel%\x02 já foi aprovado ou negado e não pode ser cancelado."

aprobar:
  syntax: "APROBAR <#canal>"
  short: "Aprova um pedido de registo de canal pendente."
  help: "Regista um canal cujo pedido está à espera de revisão. O canal é registado em nome de quem o pediu; nenhum de vocês tem de estar lá dentro. Precisas da permissão \x02cregserv.aprobar\x02.\n\n\x02#canal:\x02 O canal com o pedido pendente. Usa PENDIENTES para ver a fila.\n\nDepois de aprovado, o canal fica registado no \x02%chanserv%\x02 e o pedido é encerrado."
  example: "/msg CReG APROBAR #canal"
  approved: "\x0303✔\x03 O canal \x02%channel%\x02 foi corretamente registado para \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 O nome do canal tem de começar por um \x02#\x02."
  no_pending: "\x0304✗\x03 O canal \x02%channel%\x02 não está em processo de registo."
  already_registered: "\x0304✗\x03 O canal \x02%channel%\x02 já está registado no \x02%chanserv%\x02."
  already_approved: "\x0304✗\x03 O canal \x02%channel%\x02 já está registado."
  already_denied: "\x0304✗\x03 O canal \x02%channel%\x02 não pode ser registado porque está marcado como \x0304NEGADO\x03."
  failed: "\x0304✗\x03 Não foi possível concluir o registo do canal \x02%channel%\x02."

denegar:
  syntax: "DENEGAR <#canal> <motivo>"
  short: "Nega um pedido de registo de canal pendente."
  help: "Rejeita um pedido de registo, deixando o nome do canal livre. O motivo é obrigatório e é mostrado por DENEGADOS. Precisas da permissão \x02cregserv.denegar\x02.\n\n\x02#canal:\x02 O canal com o pedido pendente.\n\x02motivo:\x02 Porque é que o pedido é rejeitado; fica guardado e é mostrado a quem consultar DENEGADOS.\n\nO nome do canal fica livre para voltar a ser pedido após a rejeição."
  example: "/msg CReG DENEGAR #canal fora do tema"
  denied: "\x0303✔\x03 O registo do canal \x02%channel%\x02 foi negado."
  invalid_channel: "\x0304✗\x03 O nome do canal tem de começar por um \x02#\x02."
  no_pending: "\x0304✗\x03 O canal \x02%channel%\x02 não tem qualquer processo de registo."
  already_approved: "\x0304✗\x03 Canais já registados e aprovados não podem ser negados."
  already_denied: "\x0304✗\x03 O canal \x02%channel%\x02 já está negado."

pendientes:
  syntax: "PENDIENTES"
  short: "Lista os pedidos de registo de canal à espera de revisão."
  help: "Lista cada pedido de registo à espera de que um operador de serviços o avalie, mostrando o canal, quem o pediu, a data e a descrição. Precisas da permissão \x02cregserv.pendientes\x02.\n\nEste comando não aceita parâmetros."
  example: "/msg CReG PENDIENTES"
  empty: "Não há canais à espera de revisão."
  line: "\x02Canal:\x02 %channel%, \x02Pedido por:\x02 %requester%, \x02Data:\x02 %date%, \x02Descrição:\x02 %description%"
  end: "Fim da lista."

denegados:
  syntax: "DENEGADOS"
  short: "Lista os pedidos de registo de canal que foram negados."
  help: "Lista cada pedido de registo rejeitado com o motivo pelo qual foi rejeitado. Precisas da permissão \x02cregserv.denegados\x02.\n\nEste comando não aceita parâmetros."
  example: "/msg CReG DENEGADOS"
  empty: "Não há canais negados."
  line: "\x02Canal:\x02 %channel%, \x02Motivo:\x02 %reason%"
  end: "Fim da lista."

drop:
  syntax: "DROP <#canal>"
  short: "Remove o registo de canal que \x02%bot%\x02 guarda para um canal."
  help: "Remove o registo que \x02%bot%\x02 guarda para um canal e, se o canal lá estiver registado, também o retira do \x02%chanserv%\x02. Precisas da permissão \x02cregserv.drop\x02.\n\n\x02#canal:\x02 O canal que queres remover.\n\nA remoção do \x02%chanserv%\x02 é suave: o canal entra num período de carência de remoção em vez de ser apagado de imediato."
  example: "/msg CReG DROP #canal"
  dropped: "\x0303✔\x03 O registo do canal \x02%channel%\x02 foi removido do \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 O canal \x02%channel%\x02 foi removido e entra agora no período de carência de remoção."
  invalid_channel: "\x0304✗\x03 O nome do canal tem de começar por um \x02#\x02."
  no_request: "\x0304✗\x03 O canal \x02%channel%\x02 não está registado no \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#canal> [descrição]"
  short: "Regista um canal sem estar dentro dele."
  help: "Regista um canal a pedido do staff, sem passar pelo fluxo de pedido e aprovação. Não precisas de estar no canal nem de o canal já existir. Precisas da permissão \x02cregserv.saregister\x02.\n\n\x02#canal:\x02 O canal que queres registar.\n\x02descrição:\x02 Descrição opcional guardada com o registo."
  example: "/msg CReG SAREGISTER #canal um canal do staff"
  done: "\x0303✔\x03 O canal \x02%channel%\x02 foi registado."
  invalid_channel: "\x0304✗\x03 O nome do canal tem de começar por um \x02#\x02."
  pending_deletion: "\x0304✗\x03 O canal \x02%channel%\x02 está pendente de remoção e não pode ser registado."
  already_registered: "\x0304✗\x03 O canal \x02%channel%\x02 já está registado."
  failed: "\x0304✗\x03 Não foi possível concluir o registo do canal \x02%channel%\x02."

help:
  syntax:           "HELP [command]"
  short:            "Lista os comandos ou mostra a ajuda de um comando."
  help:             "Sem argumentos lista todos os comandos. Use \x0303HELP <command>\x03 para ver a ajuda completa de um comando."
  header_general:   "\x02\x0303%bot%\x03\x0F - \x0307%network%\x03"
  command_header:   "\x02\x0303%command%\x03\x0F - Ajuda do comando %command%"
  intro: "O %bot% gere o pré-registo de canais: recebe o teu pedido, coloca-o em análise e, se a administração da rede o aprovar, regista o canal em teu nome.\n\nOs comandos usam-se por mensagem privada e sem prefixo: escreve /msg %bot% comando. Para mais informação sobre um comando concreto, escreve /msg %bot% HELP comando."
  general_header:   "\x02Comandos para os utilizadores:\x02"
  ircop_header:     "\x02Comandos para os operadores:\x02"
  command_line:     "   \x0303%command%\x03\x0F%description%"
  subcommand_line:  "   \x0303%command%\x03\x0F%description%"
  options_header:   "\x02Opções:\x02"
  set_sub_footer:   "Usa /msg %bot% HELP %command% <opção> para mais informação."
  syntax_label:     "\x02Sintaxe:\x02\n    \x0303/msg %bot% %syntax%\x03"
  example_label:    "\x02Exemplo:\x02\n    \x0303%example%\x03"
  warning: "\x02\x0304AVISO:\x03\x0F O %bot% só faz funções de pré-registo de canais. Cada pedido é revisto pela administração da rede, que pode recusar ou rejeitar o registo se o canal não cumprir as normas."
  footer_general:   "\x02FIM da AJUDA do %bot%\x02"
  footer_command:   "\x02FIM da ajuda do comando %command%\x02"
  unknown_command:  "\x0307✗\x03 Comando desconhecido \x02%command%\x02. Use \x0303/msg %bot% HELP\x03."

ig:
  syntax: "IG {ADD|DEL|LIST} [#canal]"
  short: "Gere os canais de Interesse Geral (IG)."
  help: "Marca ou desmarca um canal registado como de Interesse Geral (IG). O registo do canal não muda: apenas a marca é guardada. Para os tomar, usa APODERA IG. Precisas da permissão \x02cregserv.ig\x02."
  example: "/msg CReG IG ADD #Madrid"
  not_registered: "\x0304✗\x03 O canal \x02%channel%\x02 não está registado."
  add:
    syntax: "IG ADD <#canal>"
    short: "Marca um canal como IG."
    help: "Marca o canal registado indicado como de Interesse Geral."
    done: "\x0303✔\x03 O canal \x02%channel%\x02 é agora de Interesse Geral."
    already: "\x0304✗\x03 O canal \x02%channel%\x02 já é de Interesse Geral."
  del:
    syntax: "IG DEL <#canal>"
    short: "Retira a marca IG de um canal."
    help: "Retira a marca de Interesse Geral do canal indicado."
    done: "\x0303✔\x03 O canal \x02%channel%\x02 já não é de Interesse Geral."
    not_marked: "\x0304✗\x03 O canal \x02%channel%\x02 não é de Interesse Geral."
  list:
    syntax: "IG LIST"
    short: "Lista os canais IG."
    help: "Mostra todos os canais marcados como de Interesse Geral."
    channels: "\x02Canais de Interesse Geral:\x02 %channels%"
    empty: "Não há canais de Interesse Geral."

apodera:
  syntax: "APODERA [IG] <#canal> [nick]"
  short: "Toma um canal para a administração."
  help: "Muda o fundador do canal para o nick indicado ou, se não indicares nenhum, para ti, e retira +q, +a, +o e +h a todos menos aos bots. Usa APODERA para canais normais e APODERA IG para os de Interesse Geral (ver IG). Serve para intervir num canal ou para o recuperar quando o nick do fundador expira, e ignora o limite de canais por nick. Precisas da permissão \x02cregserv.apodera\x02."
  example: "/msg CReG APODERA IG #Madrid SitioChat"
  done: "\x0303✔\x03 O canal \x02%channel%\x02 tem agora como fundador \x02%nickname%\x02."
  already_founder: "\x0304✗\x03 \x02%nickname%\x02 já é o fundador de \x02%channel%\x02."
  not_registered: "\x0304✗\x03 O canal \x02%channel%\x02 não está registado."
  not_ig: "\x0304✗\x03 O canal \x02%channel%\x02 não é de Interesse Geral: usa APODERA %channel%."
  is_ig: "\x0304✗\x03 O canal \x02%channel%\x02 é de Interesse Geral: usa APODERA IG %channel%."
  founder_not_registered: "\x0304✗\x03 O nick \x02%nickname%\x02 não está registado."
  founder_suspended: "\x0304✗\x03 O nick \x02%nickname%\x02 está suspenso."
