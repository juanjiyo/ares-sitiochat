  ircop_header: "\x02 ■ Comandos dispoñibles para IRCops:\x02"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax:           "IRCOP {ADD|DEL|LIST} [alcume] [rol]"
  short:            "Xestionar os operadores de IRC da rede."
  help:             "Xestiona os operadores de IRC da rede. ADD engade un alcume rexistrado\ncomo operador co rol especificado.\nDEL elimina un operador. LIST mostra todos os operadores.\nUse ROLE LIST para ver os roles dispoñibles.\nEste comando está restrinxido aos usuarios Root configurados nos servizos."
  example:          "/msg %bot% IRCOP ADD Alice helper"

  unknown_sub:      "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL ou LIST."
  unknown_role:     "\x0304✗\x03 O rol \x02%role%\x02 non existe. Use \x0303/msg %bot% ROLE LIST\x03 para ver os roles dispoñibles."
  already_admin:    "\x0304✗\x03 \x02%nickname%\x02 xa é un operador de IRC (rol: %role%)."
  not_admin:       "\x0304✗\x03 \x02%nickname%\x02 non é un operador de IRC."
  role_changed:     "\x0303✓\x03 Rol cambiado para \x02%nickname%\x02 de %old% a %new%."

  add:
    syntax:         "IRCOP ADD <alcume> <rol>"
    short:          "Engadir un operador de IRC da rede."
    help:           "Engade un alcume rexistrado como operador de IRC da rede.\nUse ROLE LIST para ver os roles dispoñibles.\nEste comando está restrinxido aos usuarios Root."
    example:        "/msg %bot% IRCOP ADD Alice helper"
    done:           "\x0303✓\x03 Engadido \x02%nickname%\x02 como \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 O alcume \x02%nickname%\x02 non é un alcume rexistrado activo."

  del:
    syntax:         "IRCOP DEL <alcume>"
    short:          "Eliminar un operador de IRC da rede."
    help:            "Elimina un operador de IRC da rede da lista.\nEste comando está restrinxido aos usuarios Root."
    example:         "/msg %bot% IRCOP DEL Alice"
    done:           "\x0303✓\x03 Eliminado \x02%nickname%\x02 dos operadores de IRC."

  list:
    syntax:         "IRCOP LIST"
    short:          "Listar todos os operadores de IRC da rede."
    help:            "Lista todos os operadores de IRC da rede cos seus roles e data de rexistro.\nEste comando está restrinxido aos usuarios Root."
    example:         "/msg %bot% IRCOP LIST"
    header:         "\x0307---\x03 \x02Operadores de IRC da Rede\x02 \x0307---\x03"
    empty:          "Non hai operadores de IRC."

# --- ROLE --------------------------------------------------------------------
role:
  operclass:
    syntax: "ROLE OPERCLASS {LIST|<rol>} [{VIEW|SET}] [operclass]"
    short: "Xestiona a operclass Unreal dun rol."
    help: "LIST mostra as operclasses dispoñibles na rede.\nVIEW mostra a operclass do rol e as dispoñibles.\nSET asignaa aos IRCOP ao identificar (OFF para eliminar).\nDispoñible soamente en protocolos UnrealIRCd."
    example: "/msg %bot% ROLE OPERCLASS LIST"
    list:
      header: "\x0307---\x03 \x02Operclasses Dispoñibles na Rede\x02 \x0307---\x03"
      empty: "Non hai operclasses dispoñibles na rede."
      not_supported: "\x0304✗\x03 O protocolo actual non soporta listar operclasses dispoñibles."
    view:
      empty: "O rol %role% non ten operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Operclasses dispoñibles: \x0310%available%\x03"
    set:
      done: "Operclass configurada para %role%."
      cleared: "Operclass eliminada de %role%."
      not_available: "\x0304✗\x03 A operclass \x02%operclass%\x02 non esta dispoñible na rede. Operclasses dispoñibles: %available%."
  syntax:           "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <nome> ..."
  short:            "Xestionar os roles de operador."
  help:             "Xestiona os roles de operador. ADD crea un novo rol, DEL elimínao,\nLIST mostra todos os roles, PERMS xestiona os permisos dun rol, MODES xestiona os modos IRCOP,\nVHOST xestiona o patrón de vhost forzado para un rol.\nOs roles protexidos (ADMIN, OPER, PREOPER) non se poden eliminar.\nEste comando está restrinxido aos usuarios Root."
  example:          "/msg %bot% ROLE ADD helper"
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <nome> ..."
  help_operclass:   "Xestiona os roles de operador. ADD crea un novo rol, DEL elimínao,\nLIST mostra todos os roles, PERMS xestiona os permisos dun rol, MODES xestiona os modos IRCOP,\nVHOST xestiona o patrón de vhost forzado para un rol, OPERCLASS xestiona a operclass Unreal.\nOs roles protexidos (ADMIN, OPER, PREOPER) non se poden eliminar.\nEste comando está restrinxido aos usuarios Root."

  unknown_sub:      "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL, LIST, PERMS, MODES ou VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL, LIST, PERMS, MODES, VHOST ou OPERCLASS."
  not_found:        "\x0304✗\x03 O rol \x02%role%\x02 non existe."
  already_exists:   "\x0304✗\x03 O rol \x02%role%\x02 xa existe."
  protected:        "\x0304✗\x03 O rol \x02%role%\x02 está protexido e non se pode eliminar."

  add:
    syntax:         "ROLE ADD <nome> [descrición]"
    short:          "Crear un novo rol."
    help:            "Crea un novo rol personalizado. A descrición é opcional.\nEste comando está restrinxido aos usuarios Root."
    example:         "/msg %bot% ROLE ADD helper"
    done:           "\x0303✓\x03 Rol \x02%role%\x02 creado."

  del:
    syntax:         "ROLE DEL <nome>"
    short:          "Eliminar un rol."
    help:            "Elimina un rol personalizado. Os roles protexidos (ADMIN, OPER, PREOPER)\nnon se poden eliminar. Se o rol ten operadores asignados,\ndebe reasignalos primeiro.\nEste comando está restrinxido aos usuarios Root."
    example:         "/msg %bot% ROLE DEL helper"
    done:           "\x0303✓\x03 Rol \x02%role%\x02 eliminado."

  list:
    syntax:         "ROLE LIST"
    short:          "Listar todos os roles."
    help:            "Lista todos os roles. Os roles protexidos están marcados con [PROTEXIDO].\nEste comando está restrinxido aos usuarios Root."
    example:         "/msg %bot% ROLE LIST"
    header:         "\x0307---\x03 \x02Roles de Operador\x02 \x0307---\x03"
    empty:          "Non hai roles de operador."

  perms:
    syntax:         "ROLE PERMS <rol> {LIST|ADD|DEL|CLEAR} [permiso|ALL]"
    short:          "Xestionar os permisos do rol."
    help:            "Xestiona os permisos asignados a un rol.\nLIST mostra todos os permisos do rol.\nADD asigna un permiso ao rol.\nDEL elimina un permiso do rol (non para roles protexidos).\nCLEAR elimina todos os permisos do rol.\nUse ALL para engadir todos os permisos dispoñibles á vez.\nEste comando está restrinxido aos usuarios Root."
    example:         "/msg %bot% ROLE PERMS helper ADD operserv.kill"
    not_found:       "\x0304✗\x03 O permiso \x02%perm%\x02 non existe."
    already_has:     "\x0304✗\x03 O rol \x02%role%\x02 xa ten o permiso \x02%perm%\x02."
    does_not_have:   "\x0304✗\x03 O rol \x02%role%\x02 non ten o permiso \x02%perm%\x02."

    list:
      header:        "\x0307---\x03 \x02Permisos de %role%\x02 \x0307---\x03"

    add:
      done:         "\x0303✓\x03 Engadido o permiso \x02%perm%\x02 ao rol \x02%role%\x02."
      all_done:     "\x0303✓\x03 Engadidos \x02%count%\x02 permisos ao rol \x02%role%\x02."

    del:
      done:         "\x0303✓\x03 Eliminado o permiso \x02%perm%\x02 do rol \x02%role%\x02."

    clear:
      done:         "\x0303✓\x03 Eliminados \x02%count%\x02 permisos do rol \x02%role%\x02."
      empty:        "\x0304✗\x03 O rol \x02%role%\x02 non ten permisos asignados."

  modes:
    syntax:         "ROLE MODES <rol> {VIEW|SET} [modos]"
    short:          "Xestionar os modos de usuario IRCOP do rol."
    help:            "Xestiona os modos de usuario IRCOP asignados a un rol.\nVIEW mostra os modos actuais do rol.\nSET establece os modos IRCOP (p.ex., oH para +oH).\nOs usuarios con este rol recibirán estes modos ao identificarse.\nModos dispoñibles por IRCD: UnrealIRCd (H, q, s, W), InspIRCd (s).\nEste comando está restrinxido aos usuarios Root."
    example:         "/msg %bot% ROLE MODES helper SET oH"

    view:
      header:        "\x0307---\x03 \x02Modos de %role%\x02 \x0307---\x03"
      empty:        "O rol \x02%role%\x02 non ten modos asignados."
      line:         "  Modos: \x0303%modes%\x03"

    set:
      done:         "\x0303✓\x03 Establecidos os modos \x02%modes%\x02 para o rol \x02%role%\x02."
      cleared:      "\x0303✓\x03 Eliminados todos os modos do rol \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 O modo \x02%mode%\x02 non é un modo IRCOP válido."
      invalid_modes: "\x0304✗\x03 Modos non válidos: %invalid%. Modos válidos: %valid%."
      no_irc_user_modes: "\x0304✗\x03 O IRCD actual non ten modos IRCOP configurados."

  vhost:
    syntax:         "ROLE VHOST <rol> {VIEW|SET} [patrón]"
    short:          "Xestionar o patrón de vhost forzado para un rol."
    help:           "Xestiona o vhost forzado asignado a un rol.\nVIEW mostra o patrón de vhost forzado actual.\nSET asigna un patrón de vhost forzado (os usuarios con este rol\nrecibirán este vhost ao identificarse, anulando o vhost persoal).\nO patrón engádese despois do alcume limpo, p.ex.:\n  Alcume: _davidlig_ → Patrón: admin.ares → VHost: davidlig.admin.ares\nCaracteres válidos: a-z, A-Z, 0-9, guión (-) e punto (.).\nDebe ter polo menos un punto, non pode comezar/rematar con - ou . nin ter ..\nUse OFF para limpar o patrón de vhost forzado.\nEste comando está restrinxido aos usuarios Root."
    example:        "/msg %bot% ROLE VHOST helper SET staff.example.com"

    view:
      header:        "\x0307---\x03 \x02Vhost forzado de %role%\x02 \x0307---\x03"
      empty:        "O rol \x02%role%\x02 non ten un patrón de vhost forzado establecido."
      line:         "  Patrón: \x0303%pattern%\x03"
      example:      "  Exemplo: \x02alcume\x02.%pattern%"

    set:
      done:         "\x0303✓\x03 Patrón de vhost forzado establecido para o rol \x02%role%\x02."
      cleared:      "\x0303✓\x03 Eliminado o patrón de vhost forzado do rol \x02%role%\x02."
      invalid:      "\x0304✗\x03 Patrón de vhost non válido. Caracteres válidos: a-z, A-Z, 0-9, - e .. Debe ter polo menos un punto, non pode comezar/rematar con - ou . nin ter .."

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <alcume> <motivo>"
  short:            "Desconectar forzosamente un usuario da rede."
  help:             "Desconecta un usuario da rede de IRC.\nOs IRCops e usuarios Root non poden ser matados.\nEste comando require o permiso operserv.kill."
  example:          "/msg %bot% KILL MalUsuario Inundando canles"
  user_not_online:  "\x0304✗\x03 O alcume \x02%nickname%\x02 non está conectado."
  protected_root:   "\x0304✗\x03 Non se pode matar o usuario Root \x02%nickname%\x02."
  protected_ircop:  "\x0304✗\x03 Non se pode matar o operador de IRC \x02%nickname%\x02."
  done:             "\x0303✓\x03 O usuario \x02%nickname%\x02 foi matado (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST} [máscara] [caducidade] [motivo]"
  short:            "Xestionar G-lines de toda a rede."
  help:             "Xestiona G-lines de toda a rede (prohibicións globais).\nADD engade unha nova G-line con máscara, caducidade e motivo.\nDEL elimina unha G-line por máscara ou número de entrada.\nLIST mostra todas as G-lines, opcionalmente filtradas por máscara.\n\nFormato de caducidade: 0=permanente, ou use o sufixo d, h, m (p.ex., 7d, 12h, 30m).\nAs GLINEs que coinciden con usuarios Root ou IRCop son rexeitadas.\nEste comando require o permiso operserv.gline."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Publicidade masiva"
  unknown_sub:      "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL ou LIST."
  invalid_mask:     "\x0304✗\x03 Formato de máscara non válido. Debe estar no formato usuario@host (p.ex., *@192.168.*)."
  global_mask:      "\x0304✗\x03 A máscara de G-line \x02%mask%\x02 é demasiado ampla. Non se permiten máscaras globais."
  dangerous_mask:   "\x0304✗\x03 A máscara de G-line \x02%mask%\x02 é demasiado ampla. A parte do host necesita polo menos 4 caracteres alfanuméricos."
  protected_user:   "\x0304✗\x03 Non se pode poñer G-line ao usuario protexido \x02%nickname%\x02."
  invalid_expiry:   "\x0304✗\x03 Formato de caducidade non válido. Use 0 para permanente ou un valor como 7d, 12h, 30m."
  already_exists:   "\x0304✗\x03 A G-line para \x02%mask%\x02 xa existe."
  max_entries:      "\x0304✗\x03 Alcanzouse o número máximo de G-lines (%max%)."
  not_found:        "\x0304✗\x03 G-line \x02%mask%\x02 non atopada."
  user_not_found:   "\x0304✗\x03 O alcume \x02%nickname%\x02 non está en liña."
  permanent:        "permanente"

  add:
    syntax:         "GLINE ADD <máscara> <caducidade> <motivo>"
    short:          "Engadir unha G-line de toda a rede."
    help:           "Engade unha G-line de toda a rede (prohibición global).\nA máscara debe estar no formato usuario@host.\nCaducidade: 0=permanente, ou use o sufixo d, h, m (p.ex., 7d, 12h, 30m).\nAs GLINEs que coinciden con usuarios Root ou IRCop son rexeitadas.\nEste comando require o permiso operserv.gline."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Publicidade masiva"
    done:           "\x0303✓\x03 G-line engadida: \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <máscara|número>"
    short:          "Eliminar unha G-line."
    help:           "Elimina unha G-line da lista.\nPode especificar a máscara ou o número de entrada de LIST.\nEste comando require o permiso operserv.gline."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 G-line \x02%mask%\x02 eliminada."

  list:
    syntax:         "GLINE LIST [máscara]"
    short:          "Listar todas as G-lines."
    help:           "Lista todas as G-lines. Opcionalmente filtre por patrón de máscara.\nEste comando require o permiso operserv.gline."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-lines (%count%) \x0307---\x03"
    empty:          "Non hai G-lines."
    no_reason:      "Sen motivo"
    never_expires:  "Permanente"
    unknown_creator: "descoñecido"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, caduca: %expiration%)"

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [país] [motivo]"
  short:            "Xestiona a lista de países bloqueados."
  help:             "Xestiona os países bloqueados na porta da rede.\nO demonio IRC resolve o país de cada cliente que se conecta, polo que un país bloqueado é rexeitado no momento da conexión.\nADD rexistra un código de país co seu motivo.\nDEL elimina un país da lista.\nLIST mostra os países bloqueados co seu motivo e data de rexistro.\nEste comando require o permiso operserv.geoip."
  example:          "/msg %bot% GEOIP ADD ES Non se permite nesta rede"
  unknown_sub:      "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Usa ADD, DEL ou LIST."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 non é un código de país ISO 3166-1 alpha-2 válido."
  already_exists:   "\x0304✗\x03 O país \x02%country%\x03 xa está bloqueado."
  not_found:        "\x0304✗\x03 O país \x02%country%\x03 non está bloqueado."
  default_reason:   "País bloqueado pola política da rede"

  add:
    syntax:         "GEOIP ADD <país> [motivo]"
    short:          "Bloquea un país na porta da rede."
    help:           "Bloquea a todos os clientes que se conectan desde o país indicado.\nO código de país debe ser un código ISO 3166-1 alpha-2.\nO motivo amosase aos clientes rexeitados e pode omitirse.\nEste comando require o permiso operserv.geoip."
    example:        "/msg %bot% GEOIP ADD ES Non se permite nesta rede"
    done:           "\x0303✓\x03 País \x02%country%\x03 bloqueado - %reason%"

  del:
    syntax:         "GEOIP DEL <país>"
    short:          "Desbloquea un país."
    help:           "Elimina un país da lista de países bloqueados.\nEste comando require o permiso operserv.geoip."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 País \x02%country%\x03 desbloqueado."

  list:
    syntax:         "GEOIP LIST"
    short:          "Lista os países bloqueados."
    help:           "Muestra todos os países bloqueados co seu motivo e data de rexistro.\nEste comando require o permiso operserv.geoip."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Países bloqueados (%count%)\x02 \x0307---\x03"
    empty:          "Non hai países bloqueados."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, rexistrado: %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <liña>"
  short:            "Enviar unha liña de protocolo en bruto ao IRCd."
  help:             "Envía a liña indicada directamente ao socket do IRCd uplink.\nÚsea con extrema precaución. As liñas de protocolo non válidas poden colapsar a rede.\nEste comando require o permiso operserv.raw."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Debe especificar unha liña non baleira para enviar."
  too_long:         "\x0304✗\x03 A liña é demasiado longa. Máximo 510 caracteres."
  not_connected:    "\x0304✗\x03 Non conectado ao IRCd."
  done:             "\x0303✓\x03 Liña en bruto enviada."
  protocol:
    syntax: "\x0304✗\x03 O protocolo activo rexeitou a sintaxe do comando RAW."
    done: "\x0303✓\x03 Comando RAW xestionado polo protocolo executado."
    target: "\x0304✗\x03 O protocolo activo rexeitou o destino %target%."
    unsupported: "\x0304✗\x03 O protocolo activo non admite este comando RAW."
    invalid_resource_type: "\x0304✗\x03 Tipo de recurso de protocolo descoñecido: %resource_type%."
    invalid_resource: "\x0304✗\x03 Recurso de protocolo non válido: %resource%."
    invalid_value: "\x0304✗\x03 Valor non válido para o recurso de protocolo: %resource%."
    error: "\x0304✗\x03 O protocolo activo non puido executar o comando RAW."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator% executa o comando %command% sobre %target%. %reason%"
  actionWithDuration: "%operator% executa o comando %command% sobre %target%. Duración: %duration%. %reason%"
  prefix_reason:    "Motivo: %reason%"
  prefix_message:   "Mensaxe: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Xestionar as mensaxes MOTD de conexión enviadas aos usuarios ao conectarse."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [args]"
  help:             "Xestiona as entradas de Message Of The Day que se envían aos usuarios cando se conectan á rede.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Benvido á rede!"
  unknown_sub:      "\x0304✗\x03 Subcomando descoñecido. Use: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {servizo|alcume!ident@vhost} {PRIVMSG|NOTICE} <caducidade> <mensaxe>"
    syntax_hint:    "\x0304✗\x03 Uso: \x02%syntax%\x02"
    short:          "Engadir unha entrada MOTD."
    help:           "Engade unha nova mensaxe MOTD que se enviará a cada usuario cando se conecte á rede.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Benvido á rede!"
    done:           "\x0303✓\x03 Entrada MOTD nº%id% engadida."
    invalid_type:   "\x0304✗\x03 Tipo de mensaxe non válido. Debe ser \x02PRIVMSG\x02 ou \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Formato de caducidade non válido. Use: \x02<número><s|m|h|d>\x02 (p.ex., 30s, 5m, 24h, 7d)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Uso: \x02%syntax%\x02"
    short:          "Eliminar unha entrada MOTD."
    help:           "Elimina unha entrada MOTD polo seu ID.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 Entrada MOTD nº%id% eliminada."
    not_found:      "\x0304✗\x03 Entrada MOTD non atopada."
  list:
    syntax:         "MOTD LIST"
    short:          "Listar todas as entradas MOTD."
    help:           "Lista todas as entradas MOTD configuradas.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Non hai entradas MOTD configuradas."
    header:         "Entradas MOTD:"
    status_enabled: "\x0303activada\x03"
    status_disabled: "\x0304desactivada\x03"
    expired:        "\x0304caducada\x03"
    no_bot:         "(sen bot)"
    never:          "nunca"
    shown_count:    "amosado %count% veces"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Eliminar todas as entradas MOTD caducadas."
    help:           "Elimina todas as entradas MOTD cuxo tempo de caducidade pasou.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 Eliminadas %count% entradas MOTD caducadas."
    none:           "\x0303✓\x03 Non hai entradas MOTD caducadas que eliminar."
  debug:
    finalized:      "A mensaxe MOTD #%id% finalizou: [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 non é un nome de canle válido; debe comezar por \x02#\x02."
  not_found:            "\x0304✗\x03 A canle \x02%channel%\x02 non existe na rede."
  user_not_online:      "\x0304✗\x03 O nick \x02%nickname%\x02 non está conectado."
  user_not_on_channel:  "\x0304✗\x03 O nick \x02%nickname%\x02 non está na canle \x02%channel%\x02."
  protected_root:       "\x0304✗\x03 Permiso denegado: \x02%nickname%\x02 é un usuario Root."
  protected_ircop:      "\x0304✗\x03 Permiso denegado: \x02%nickname%\x02 é un operador de rede."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#canle> <nick> [motivo]"
  short:    "Expulsa un usuario dunha canle."
  help:     "Expulsa un usuario dunha canle como operador de rede.\nSe non se indica un motivo, úsase un por defecto.\nOs usuarios Root e os IRCops con rol non poden ser expulsados.\nEste comando require o permiso operserv.kick."
  example:  "/msg %bot% KICK #axuda BadUser Deixa de facer flood"
  done:     "\x0303✓\x03 \x02%nickname%\x02 foi expulsado de \x02%channel%\x02. Motivo: %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#canle> <nick>"
  short:    "Dá estado de operador a un usuario nunha canle."
  help:     "Dá OP (+o) a un usuario presente nunha canle, aínda que a canle non estea rexistrada.\nEste comando require o permiso operserv.op."
  example:  "/msg %bot% OP #axuda Usuario"
  done:     "\x0303✓\x03 Deuse OP a \x02%nickname%\x02 en \x02%channel%\x02."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#canle> <nick>"
  short:    "Quita o estado de operador a un usuario nunha canle."
  help:     "Quita o OP (-o) a un usuario presente nunha canle.\nAos usuarios Root e aos IRCops con rol non se lles pode quitar o OP.\nEste comando require o permiso operserv.op."
  example:  "/msg %bot% DEOP #axuda Usuario"
  done:     "\x0303✓\x03 Fíxose DEOP a \x02%nickname%\x02 en \x02%channel%\x02."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#canle> <+/-modos> [argumentos]"
  short:          "Establece modos nunha canle."
  help:           "Establece os modos indicados nunha canle, seguidos dos seus argumentos se os precisan.\nOs modos deben comezar por + ou -.\nEste comando require o permiso operserv.mode."
  example:        "/msg %bot% MODE #axuda +mk clave"
  done:           "\x0303✓\x03 Establecéronse os modos de \x02%channel%\x02 a \x02%modes%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 non é un cambio de modos válido. Usa +modos ou -modos."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#canle>"
  short:    "Quita os modos restritivos dunha canle."
  help:     "Quita os modos -imnpst dunha canle para desbloqueala.\nAs claves (+k) e os límites (+l) non se modifican.\nEste comando require o permiso operserv.mode."
  example:  "/msg %bot% LIMPIA #axuda"
  done:     "\x0303✓\x03 A canle \x02%channel%\x02 foi limpada (modos %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#canle>"
  short:               "Invítate a unha canle."
  help:                "Invítate á canle indicada, aínda que sexa só para convidados (+i).\nEste comando require o permiso operserv.invite."
  example:             "/msg %bot% INVITE #axuda"
  done:                "\x0303✓\x03 Convite á canle \x02%channel%\x02 enviado."
  already_on_channel:  "\x0304✗\x03 Xa estás na canle \x02%channel%\x02."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Amosa as estatísticas da rede."
  help:     "Amosa o número de usuarios conectados á rede neste momento.\nDispoñible para todos os operadores de rede."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Usuarios no IRC: \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Lista os operadores de rede conectados."
  help:     "Lista, por nick, os operadores de rede conectados neste momento.\nDispoñible para todos os operadores de rede."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Operadores conectados (%count%):\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Fin da lista."
  empty:    "\x0310ℹ\x03 Non hai operadores de rede conectados."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <nick>"
  short:    "Lista os clons dun nick."
  help:     "Amosa o host desde o que está conectado un nick e os demais nicks conectados desde o mesmo host.\nAs conexións agrúpanse pola IP real cando se coñece e, se non, polo host.\nEste comando require o permiso operserv.clones."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "Clons de \x02%nickname%\x02 (\x02%host%\x02), %count% conexións:"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Fin da lista."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 non ten clons (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <nick> [motivo]"
  short:    "Expulsa os clons dun nick cunha G-Line de 1 hora."
  help:     "Pon unha G-Line de 1 hora sobre *@host do nick indicado, o que desconecta todas as conexións dese host.\nA G-Line aparece en GLINE LIST e pódese quitar con GLINE DEL.\nNunca se aplica a localhost nin a hosts compartidos con usuarios Root ou IRCops con rol.\nEste comando require o permiso operserv.clones."
  example:  "/msg %bot% KILLCLONES Usuario Clons non permitidos"
  done:     "\x0303✓\x03 Os clons de \x02%nickname%\x02 foron expulsados: G-Line \x02%mask%\x02 durante %duration% (%count% conexións). Motivo: %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <nick> [motivo]"
  short:    "Bloquea o host dun nick cunha G-Line de 5 horas."
  help:     "Pon unha G-Line de 5 horas sobre *@host do nick indicado, o que desconecta todas as conexións dese host.\nA G-Line aparece en GLINE LIST e pódese quitar con GLINE DEL.\nNunca se aplica a localhost nin a hosts compartidos con usuarios Root ou IRCops con rol.\nEste comando require o permiso operserv.clones."
  example:  "/msg %bot% BLOCK Usuario Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 foi bloqueado: G-Line \x02%mask%\x02 durante %duration% (%count% conexións). Motivo: %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Permiso denegado: \x02%host%\x02 é un host local e nunca recibe unha G-Line."
  failed:         "\x0304✗\x03 Non se puido aplicar a G-Line \x02%mask%\x02."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <límite|IP>"
  short:    "Amosa as conexións simultáneas por IP."
  help:     "Amosa cantas conexións simultáneas hai activas desde cada IP (ou desde cada host se a IP non se coñece).\nEste comando require o permiso operserv.conexiones."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "Lista as IP con polo menos <límite> conexións."
    help:             "Lista as IP con polo menos <límite> conexións simultáneas activas, de máis a menos conexións.\nO límite debe ser un número enteiro maior ca 1."
    syntax:           "CONEXIONES LIST <límite>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "IP con polo menos \x02%minimum%\x02 conexións simultáneas activas:"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Fin da lista."
    empty:            "\x0310ℹ\x03 Non hai IP con polo menos \x02%minimum%\x02 conexións simultáneas."
    invalid_minimum:  "\x0304✗\x03 O límite indicado non é válido; debe ser un número enteiro maior ca 1."
  view:
    short:      "Amosa as conexións dunha IP."
    help:       "Amosa cantas conexións simultáneas hai activas desde unha IP ou un host."
    syntax:     "CONEXIONES VIEW <IP>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 Conexións simultáneas activas da IP \x02%host%\x02: \x02%count%\x02."
    not_found:  "\x0304✗\x03 Non se atoparon conexións para \x02%host%\x02."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <nick> <+/-modos>"
  short:          "Cambia os modos de usuario dun nick."
  help:           "Pon ou quita modos de usuario a un nick conectado.\nSó podes usar os modos do teu rango ou inferiores: calquera IRCop os de usuario, un Operador tamén s e W, un Administrador tamén H, q e o; Root, calquera.\nOs modos r e h non se poden poñer nin quitar.\nEste comando require o permiso operserv.umode."
  example:        "/msg %bot% UMODE Usuario +R"
  done:           "\x0303✓\x03 Modos \x02%modes%\x02 aplicados a \x02%nickname%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 non é un cambio de modos válido. Usa +modos ou -modos."
  forbidden:      "\x0304✗\x03 Non podes poñer nin quitar os modos r e h."
  above_rank:     "\x0304✗\x03 O teu rango non che permite usar os modos \x02%modes%\x02."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <nick>"
  short:    "Encarcera a un usuario na canle cárcere."
  help:     "Saca a un usuario de todas as súas canles e méteo na canle cárcere (%channel%).\nMentres estea encarcerado, se entra noutra canle sácaselle, e se sae do cárcere vólveselle meter.\nQueda libre con UNJAIL ou ao desconectarse.\nOs usuarios Root e os IRCops con rol non poden ser encarcerados.\nEste comando require o permiso operserv.jail."
  example:  "/msg %bot% JAIL Usuario"
  done:     "\x0303✓\x03 \x02%nickname%\x02 foi encarcerado en \x02%channel%\x02."
  already:  "\x0304✗\x03 \x02%nickname%\x02 xa está encarcerado."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <nick>"
  short:       "Libera a un usuario encarcerado."
  help:        "Libera a un usuario encarcerado con JAIL: pode volver entrar en calquera canle.\nEste comando require o permiso operserv.jail."
  example:     "/msg %bot% UNJAIL Usuario"
  done:        "\x0303✓\x03 \x02%nickname%\x02 foi liberado de \x02%channel%\x02."
  not_jailed:  "\x0304✗\x03 \x02%nickname%\x02 non está encarcerado."

# --- ELINE -----------------------------------------------------------------------
eline:
  syntax:          "ELINE {ADD|DEL|LIST|VIEW|COUNT} ..."
  short:           "Xestiona as excepcións de ban por IP (E-Lines)."
  help:            "As E-Lines eximen unha IP dos bans da rede (G-Lines, Z-Lines, shun, límite de conexións por IP, listas negras...). Útil para as VPS con ZNC dos IRCops.\nADD engade unha, DEL bórraas, LIST e VIEW móstranas e COUNT cóntaas.\nEste comando require o permiso operserv.eline."
  example:         "/msg %bot% ELINE ADD +30d *@203.0.113.10 ZNC IRCops"
  added:           "\x0303✓\x03 E-Line engadida para {B}%mask%{B} (caduca: %expiration%)."
  already_exists:  "\x0304✗\x03 Xa hai unha E-Line para {B}%mask%{B}."
  invalid_mask:    "\x0304✗\x03 {B}%mask%{B} non é válida: usa usuario@IP ou IP (a IP pode ser un rango CIDR)."
  invalid_expiry:  "\x0304✗\x03 {B}%expiry%{B} non é unha caducidade válida: usa +0 (permanente) ou un valor como +30d, +12h, +30m."
  deleted:         "\x0303✓\x03 E-Lines borradas: {B}%masks%{B}."
  not_found:       "\x0304✗\x03 Non hai ningunha E-Line {B}%item%{B}."
  never_expires:   "nunca"
  add:
    syntax:   "ELINE ADD [+caducidade] <usuario@IP|IP> <motivo>"
    short:    "Engade unha E-Line."
    help:     "Engade unha excepción de ban para unha IP ou un rango CIDR, opcionalmente con caducidade (+30d, +12h, +30m; sen ela é permanente). Se non indicas usuario úsase *."
    example:  "/msg %bot% ELINE ADD +30d 203.0.113.10 ZNC IRCops"
  del:
    syntax:   "ELINE DEL <máscara|número|lista>"
    short:    "Borra E-Lines."
    help:     "Borra unha E-Line pola súa máscara, polo seu número en LIST ou por unha lista de números e rangos (1,3-5)."
    example:  "/msg %bot% ELINE DEL 1,3-5"
  list:
    syntax:   "ELINE LIST"
    short:    "Lista as E-Lines."
    help:     "Mostra as E-Lines activas, numeradas, coa súa caducidade."
    example:  "/msg %bot% ELINE LIST"
    header:   "\x0307---\x03 \x02E-Lines (%count%)\x02 \x0307---\x03"
    entry:    "  \x02%number%.\x02 %mask% \x0314(caduca: %expiration%)\x03"
    empty:    "Non hai E-Lines activas."
  view:
    syntax:   "ELINE VIEW"
    short:    "Mostra as E-Lines con detalle."
    help:     "Mostra as E-Lines activas con quen as puxo, cando, a caducidade e o motivo."
    example:  "/msg %bot% ELINE VIEW"
    entry:    "  \x02%number%.\x02 %mask% \x0314posta por %setby% o %created%, caduca: %expiration% - %reason%\x03"
  count:
    syntax:   "ELINE COUNT"
    short:    "Conta as E-Lines."
    help:     "Mostra cantas E-Lines hai activas."
    example:  "/msg %bot% ELINE COUNT"
    result:   "Hai {B}%count%{B} E-Lines activas."
