  short: "Muestra los comandos disponibles."
  help: "Sin argumentos lista los comandos disponibles. Usa \x0303HELP <comando>\x03 para información sobre un comando concreto."
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: "Servicio de anuncios globales de la red."
  general_header: "\x02 ■ Comandos disponibles:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  ircop_header: "\x02 ■ Comandos de IRCop:\x02"
  general_footer: "\x0310ℹ\x03\x0F Usa /msg %bot% \x02\x0303HELP <comando>\x03\x0F para más información."
  footer: "\x0314─────────────────────────────\x03\x0F"
  unknown_command: "\x0307✗\x03 Comando desconocido \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."
