  ircop_header: "\x02 ■ Commandes disponibles pour les IRCops :\x02"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax:           "IRCOP {ADD|DEL|LIST} [surnom] [rôle]"
  short:            "Gérer les opérateurs IRC du réseau."
  help:             "Gère les opérateurs IRC du réseau. ADD ajoute un surnom enregistré\ncomme opérateur avec le rôle spécifié.\nDEL retire un opérateur. LIST affiche tous les opérateurs.\nUtilisez ROLE LIST pour voir les rôles disponibles.\nCette commande est réservée aux utilisateurs Root configurés dans les services."
  example:          "/msg %bot% IRCOP ADD Alice helper"

  unknown_sub:      "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL ou LIST."
  unknown_role:     "\x0304✗\x03 Le rôle \x02%role%\x02 n'existe pas. Utilisez \x0303/msg %bot% ROLE LIST\x03 pour voir les rôles disponibles."
  already_admin:    "\x0304✗\x03 \x02%nickname%\x02 est déjà un opérateur IRC (rôle : %role%)."
  not_admin:       "\x0304✗\x03 \x02%nickname%\x02 n'est pas un opérateur IRC."
  role_changed:     "\x0303✓\x03 Rôle changé pour \x02%nickname%\x02 de %old% à %new%."

  add:
    syntax:         "IRCOP ADD <surnom> <rôle>"
    short:          "Ajouter un opérateur IRC du réseau."
    help:           "Ajoute un surnom enregistré comme opérateur IRC du réseau.\nUtilisez ROLE LIST pour voir les rôles disponibles.\nCette commande est réservée aux utilisateurs Root."
    example:        "/msg %bot% IRCOP ADD Alice helper"
    done:           "\x0303✓\x03 Ajouté \x02%nickname%\x02 en tant que \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 Le surnom \x02%nickname%\x02 n'est pas un surnom enregistré actif."

  del:
    syntax:         "IRCOP DEL <surnom>"
    short:          "Retirer un opérateur IRC du réseau."
    help:            "Retire un opérateur IRC du réseau de la liste.\nCette commande est réservée aux utilisateurs Root."
    example:         "/msg %bot% IRCOP DEL Alice"
    done:           "\x0303✓\x03 \x02%nickname%\x02 retiré des opérateurs IRC."

  list:
    syntax:         "IRCOP LIST"
    short:          "Lister tous les opérateurs IRC du réseau."
    help:            "Liste tous les opérateurs IRC du réseau avec leurs rôles et leur date d'enregistrement.\nCette commande est réservée aux utilisateurs Root."
    example:         "/msg %bot% IRCOP LIST"
    header:         "\x0307---\x03 \x02Opérateurs IRC du réseau\x02 \x0307---\x03"
    empty:          "Il n'y a aucun opérateur IRC."

# --- ROLE --------------------------------------------------------------------
role:
  operclass:
    syntax: "ROLE OPERCLASS {LIST|<role>} [{VIEW|SET}] [operclass]"
    short: "Gere l'operclass Unreal d'un role."
    help: "LIST affiche les operclasses disponibles sur le reseau.\nVIEW affiche l'operclass du role et celles disponibles.\nSET l'assigne aux IRCOP a l'identification (OFF pour supprimer).\nDisponible uniquement sur les protocoles UnrealIRCd."
    example: "/msg %bot% ROLE OPERCLASS LIST"
    list:
      header: "\x0307---\x03 \x02Operclasses Disponibles sur le Reseau\x02 \x0307---\x03"
      empty: "Aucune operclass disponible sur le reseau."
      not_supported: "\x0304✗\x03 Le protocole actuel ne prend pas en charge la liste des operclasses disponibles."
    view:
      empty: "Le role %role% n'a pas d'operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Operclasses disponibles: \x0310%available%\x03"
    set:
      done: "Operclass definie pour %role%."
      cleared: "Operclass supprimee de %role%."
      not_available: "\x0304✗\x03 L'operclass \x02%operclass%\x02 n'est pas disponible sur le reseau. Operclasses disponibles: %available%."
  syntax:           "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <nom> ..."
  short:            "Gérer les rôles d'opérateur."
  help:             "Gère les rôles d'opérateur. ADD crée un nouveau rôle, DEL le supprime,\nLIST affiche tous les rôles, PERMS gère les permissions d'un rôle, MODES gère les modes IRCOP,\nVHOST gère le motif vhost forcé pour un rôle.\nLes rôles protégés (ADMIN, OPER, PREOPER) ne peuvent pas être supprimés.\nCette commande est réservée aux utilisateurs Root."
  example:          "/msg %bot% ROLE ADD helper"
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <nom> ..."
  help_operclass:   "Gère les rôles d'opérateur. ADD crée un nouveau rôle, DEL le supprime,\nLIST affiche tous les rôles, PERMS gère les permissions d'un rôle, MODES gère les modes IRCOP,\nVHOST gère le motif vhost forcé pour un rôle, OPERCLASS gère l'operclass Unreal.\nLes rôles protégés (ADMIN, OPER, PREOPER) ne peuvent pas être supprimés.\nCette commande est réservée aux utilisateurs Root."

  unknown_sub:      "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL, LIST, PERMS, MODES ou VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL, LIST, PERMS, MODES, VHOST ou OPERCLASS."
  not_found:        "\x0304✗\x03 Le rôle \x02%role%\x02 n'existe pas."
  already_exists:   "\x0304✗\x03 Le rôle \x02%role%\x02 existe déjà."
  protected:        "\x0304✗\x03 Le rôle \x02%role%\x02 est protégé et ne peut pas être supprimé."

  add:
    syntax:         "ROLE ADD <nom> [description]"
    short:          "Créer un nouveau rôle."
    help:            "Crée un nouveau rôle personnalisé. La description est optionnelle.\nCette commande est réservée aux utilisateurs Root."
    example:         "/msg %bot% ROLE ADD helper"
    done:           "\x0303✓\x03 Rôle créé \x02%role%\x02."

  del:
    syntax:         "ROLE DEL <nom>"
    short:          "Supprimer un rôle."
    help:            "Supprime un rôle personnalisé. Les rôles protégés (ADMIN, OPER, PREOPER)\nne peuvent pas être supprimés. Si le rôle a des opérateurs assignés,\nvous devez d'abord les réassigner.\nCette commande est réservée aux utilisateurs Root."
    example:         "/msg %bot% ROLE DEL helper"
    done:           "\x0303✓\x03 Rôle supprimé \x02%role%\x02."

  list:
    syntax:         "ROLE LIST"
    short:          "Lister tous les rôles."
    help:            "Liste tous les rôles. Les rôles protégés sont marqués [PROTÉGÉ].\nCette commande est réservée aux utilisateurs Root."
    example:         "/msg %bot% ROLE LIST"
    header:         "\x0307---\x03 \x02Rôles d'opérateur\x02 \x0307---\x03"
    empty:          "Il n'y a aucun rôle d'opérateur."

  perms:
    syntax:         "ROLE PERMS <rôle> {LIST|ADD|DEL|CLEAR} [permission|ALL]"
    short:          "Gérer les permissions du rôle."
    help:            "Gère les permissions assignées à un rôle.\nLIST affiche toutes les permissions du rôle.\nADD assigne une permission au rôle.\nDEL retire une permission du rôle (pas pour les rôles protégés).\nCLEAR retire toutes les permissions du rôle.\nUtilisez ALL pour ajouter toutes les permissions disponibles à la fois.\nCette commande est réservée aux utilisateurs Root."
    example:         "/msg %bot% ROLE PERMS helper ADD operserv.kill"
    not_found:       "\x0304✗\x03 La permission \x02%perm%\x02 n'existe pas."
    already_has:     "\x0304✗\x03 Le rôle \x02%role%\x02 a déjà la permission \x02%perm%\x02."
    does_not_have:   "\x0304✗\x03 Le rôle \x02%role%\x02 n'a pas la permission \x02%perm%\x02."

    list:
      header:        "\x0307---\x03 \x02Permissions pour %role%\x02 \x0307---\x03"

    add:
      done:         "\x0303✓\x03 Permission \x02%perm%\x02 ajoutée au rôle \x02%role%\x02."
      all_done:     "\x0303✓\x03 \x02%count%\x02 permissions ajoutées au rôle \x02%role%\x02."

    del:
      done:         "\x0303✓\x03 Permission \x02%perm%\x02 retirée du rôle \x02%role%\x02."

    clear:
      done:         "\x0303✓\x03 \x02%count%\x02 permissions retirées du rôle \x02%role%\x02."
      empty:        "\x0304✗\x03 Le rôle \x02%role%\x02 n'a aucune permission assignée."

  modes:
    syntax:         "ROLE MODES <rôle> {VIEW|SET} [modes]"
    short:          "Gérer les modes utilisateur IRCOP pour le rôle."
    help:            "Gère les modes utilisateur IRCOP assignés à un rôle.\nVIEW affiche les modes actuels du rôle.\nSET définit les modes IRCOP (ex., oH pour +oH).\nLes utilisateurs avec ce rôle recevront ces modes lors de l'identification.\nModes disponibles par IRCD : UnrealIRCd (H, q, s, W), InspIRCd (s).\nCette commande est réservée aux utilisateurs Root."
    example:         "/msg %bot% ROLE MODES helper SET oH"

    view:
      header:        "\x0307---\x03 \x02Modes pour %role%\x02 \x0307---\x03"
      empty:        "Le rôle \x02%role%\x02 n'a aucun mode assigné."
      line:         "  Modes : \x0303%modes%\x03"

    set:
      done:         "\x0303✓\x03 Modes \x02%modes%\x02 définis pour le rôle \x02%role%\x02."
      cleared:      "\x0303✓\x03 Tous les modes retirés du rôle \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 Le mode \x02%mode%\x02 n'est pas un mode IRCOP valide."
      invalid_modes: "\x0304✗\x03 Modes invalides : %invalid%. Modes valides : %valid%."
      no_irc_user_modes: "\x0304✗\x03 L'IRCd actuel n'a aucun mode IRCOP configuré."

  vhost:
    syntax:         "ROLE VHOST <rôle> {VIEW|SET} [motif]"
    short:          "Gérer le motif vhost forcé pour un rôle."
    help:           "Gère le vhost forcé assigné à un rôle.\nVIEW affiche le motif vhost forcé actuel.\nSET assigne un motif vhost forcé (les utilisateurs avec ce rôle\nrecevront ce vhost lors de l'identification, prioritaire sur le vhost personnel).\nLe motif est ajouté après le surnom nettoyé, ex. :\n  Surnom : _davidlig_ → Motif : admin.ares → VHost : davidlig.admin.ares\nCaractères valides : a-z, A-Z, 0-9, trait d'union (-) et point (.).\nDoit avoir au moins un point, ne peut pas commencer/finir par - ou . ni avoir ..\nUtilisez OFF pour effacer le motif vhost forcé.\nCette commande est réservée aux utilisateurs Root."
    example:        "/msg %bot% ROLE VHOST helper SET staff.example.com"

    view:
      header:        "\x0307---\x03 \x02Vhost forcé pour %role%\x02 \x0307---\x03"
      empty:        "Le rôle \x02%role%\x02 n'a aucun motif vhost forcé défini."
      line:         "  Motif : \x0303%pattern%\x03"
      example:      "  Exemple : \x02surnom\x02.%pattern%"

    set:
      done:         "\x0303✓\x03 Motif vhost forcé défini pour le rôle \x02%role%\x02."
      cleared:      "\x0303✓\x03 Motif vhost forcé retiré du rôle \x02%role%\x02."
      invalid:      "\x0304✗\x03 Motif vhost invalide. Caractères valides : a-z, A-Z, 0-9, - et .. Doit avoir au moins un point, ne peut pas commencer/finir par - ou . ou avoir .."

# --- KILL --------------------------------------------------------------------
kill:
  syntax:           "KILL <surnom> <raison>"
  short:            "Déconnecter de force un utilisateur du réseau."
  help:             "Déconnecte un utilisateur du réseau IRC.\nLes IRCops et les utilisateurs Root ne peuvent pas être killés.\nCette commande nécessite la permission operserv.kill."
  example:          "/msg %bot% KILL MauvaisUtil Flood des canaux"
  user_not_online:  "\x0304✗\x03 Le surnom \x02%nickname%\x02 n'est pas connecté."
  protected_root:   "\x0304✗\x03 Impossible de killer l'utilisateur Root \x02%nickname%\x02."
  protected_ircop:  "\x0304✗\x03 Impossible de killer l'opérateur IRC \x02%nickname%\x02."
  done:             "\x0303✓\x03 Utilisateur \x02%nickname%\x02 a été killé (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax:           "GLINE {ADD|DEL|LIST} [masque] [expiration] [raison]"
  short:            "Gérer les G-lines du réseau."
  help:             "Gère les G-lines du réseau (bannissements globaux).\nADD ajoute une nouvelle G-line avec masque, expiration et raison.\nDEL supprime une G-line par masque ou numéro d'entrée.\nLIST affiche toutes les G-lines, optionnellement filtrées par masque.\n\nFormat d'expiration : 0=permanent, ou utilisez le suffixe j, h, m (ex., 7j, 12h, 30m).\nLes GLINEs correspondant aux utilisateurs Root ou IRCop sont rejetées.\nCette commande nécessite la permission operserv.gline."
  example:          "/msg %bot% GLINE ADD spammer@spam.example 7d Publicité de masse"
  unknown_sub:      "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL ou LIST."
  invalid_mask:     "\x0304✗\x03 Format de masque invalide. Doit être au format utilisateur@hôte (ex., *@192.168.*)."
  global_mask:      "\x0304✗\x03 Le masque G-line \x02%mask%\x02 est trop large. Les masques globaux ne sont pas autorisés."
  dangerous_mask:   "\x0304✗\x03 Le masque G-line \x02%mask%\x02 est trop large. La partie hôte nécessite au moins 4 caractères alphanumériques."
  protected_user:   "\x0304✗\x03 Impossible de G-liner l'utilisateur protégé \x02%nickname%\x02."
  invalid_expiry:   "\x0304✗\x03 Format d'expiration invalide. Utilisez 0 pour permanent, ou une valeur comme 7j, 12h, 30m."
  already_exists:   "\x0304✗\x03 G-line pour \x02%mask%\x02 existe déjà."
  max_entries:      "\x0304✗\x03 Nombre maximum de G-lines (%max%) atteint."
  not_found:        "\x0304✗\x03 G-line \x02%mask%\x02 introuvable."
  user_not_found:   "\x0304✗\x03 Le surnom \x02%nickname%\x02 n'est pas en ligne."
  permanent:        "permanent"

  add:
    syntax:         "GLINE ADD <masque> <expiration> <raison>"
    short:          "Ajouter une G-line du réseau."
    help:           "Ajoute une G-line du réseau (bannissement global).\nLe masque doit être au format utilisateur@hôte.\nExpiration : 0=permanent, ou utilisez le suffixe j, h, m (ex., 7j, 12h, 30m).\nLes GLINEs correspondant aux utilisateurs Root ou IRCop sont rejetées.\nCette commande nécessite la permission operserv.gline."
    example:        "/msg %bot% GLINE ADD spammer@spam.example 7d Publicité de masse"
    done:           "\x0303✓\x03 G-line ajoutée : \x02%mask%\x02 (%duration%) - %reason%"

  del:
    syntax:         "GLINE DEL <masque|numéro>"
    short:          "Supprimer une G-line."
    help:           "Supprime une G-line de la liste.\nVous pouvez spécifier le masque ou le numéro d'entrée de LIST.\nCette commande nécessite la permission operserv.gline."
    example:        "/msg %bot% GLINE DEL spammer@spam.example"
    done:           "\x0303✓\x03 G-line \x02%mask%\x02 supprimée."

  list:
    syntax:         "GLINE LIST [masque]"
    short:          "Lister toutes les G-lines."
    help:           "Liste toutes les G-lines. Optionnellement filtrer par motif de masque.\nCette commande nécessite la permission operserv.gline."
    example:        "/msg %bot% GLINE LIST"
    header:         "\x0307---\x03 \x02G-lines (%count%) \x0307---\x03"
    empty:          "Il n'y a aucune G-line."
    no_reason:      "Aucune raison"
    never_expires:  "Permanent"
    unknown_creator: "inconnu"
    entry:          "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, expire : %expiration%)"

# --- GEOIP --------------------------------------------------------------------
geoip:
  syntax:           "GEOIP {ADD|DEL|LIST} [pays] [raison]"
  short:            "Gérer la liste des pays bloqués."
  help:             "Gère les pays bloqués à la porte du réseau.\nLe démon IRC détermine le pays de chaque client qui se connecte, un pays bloqué est donc refusé dès la connexion.\nADD enregistre un code de pays avec sa raison.\nDEL supprime un pays de la liste.\nLIST affiche les pays bloqués avec leur raison et leur date d'enregistrement.\nCette commande nécessite la permission operserv.geoip."
  example:          "/msg %bot% GEOIP ADD ES Non autorisé sur ce réseau"
  unknown_sub:      "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL ou LIST."
  unknown_country:  "\x0304✗\x03 \x02%country%\x03 n'est pas un code pays ISO 3166-1 alpha-2 valide."
  already_exists:   "\x0304✗\x03 Le pays \x02%country%\x03 est déjà bloqué."
  not_found:        "\x0304✗\x03 Le pays \x02%country%\x03 n'est pas bloqué."
  default_reason:   "Pays bloqué par la politique du réseau"

  add:
    syntax:         "GEOIP ADD <pays> [raison]"
    short:          "Bloquer un pays à la porte du réseau."
    help:           "Bloque tous les clients qui se connectent depuis le pays indiqué.\nLe code pays doit être un code ISO 3166-1 alpha-2.\nLa raison est affichée aux clients refusés et peut être omise.\nCette commande nécessite la permission operserv.geoip."
    example:        "/msg %bot% GEOIP ADD ES Non autorisé sur ce réseau"
    done:           "\x0303✓\x03 Pays \x02%country%\x03 bloqué - %reason%"

  del:
    syntax:         "GEOIP DEL <pays>"
    short:          "Débloquer un pays."
    help:           "Supprime un pays de la liste des pays bloqués.\nCette commande nécessite la permission operserv.geoip."
    example:        "/msg %bot% GEOIP DEL ES"
    done:           "\x0303✓\x03 Pays \x02%country%\x03 débloqué."

  list:
    syntax:         "GEOIP LIST"
    short:          "Lister les pays bloqués."
    help:           "Affiche tous les pays bloqués avec leur raison et leur date d'enregistrement.\nCette commande nécessite la permission operserv.geoip."
    example:        "/msg %bot% GEOIP LIST"
    header:         "\x0307---\x03 \x02Pays bloqués (%count%)\x02 \x0307---\x03"
    empty:          "Aucun pays n'est bloqué."
    entry:          "\x0310%index%.\x03 \x02%country%\x02 - %reason% (\x0314%nickname%\x03, enregistré : %registered%)"

# --- RAW ---------------------------------------------------------------------
raw:
  syntax:           "RAW <ligne>"
  short:            "Envoyer une ligne de protocole brute à l'IRCd."
  help:             "Envoie la ligne donnée directement au socket uplink IRCd.\nÀ utiliser avec une extrême prudence. Des lignes de protocole invalides\npeuvent faire planter le réseau.\nCette commande nécessite la permission operserv.raw."
  example:          "/msg %bot% RAW WHOIS Alice"
  empty:            "\x0304✗\x03 Vous devez spécifier une ligne non vide à envoyer."
  too_long:         "\x0304✗\x03 Ligne trop longue. Maximum 510 caractères."
  not_connected:    "\x0304✗\x03 Non connecté à l'IRCd."
  done:             "\x0303✓\x03 Ligne brute envoyée."
  protocol:
    syntax: "\x0304✗\x03 Le protocole actif a rejeté la syntaxe de la commande RAW."
    done: "\x0303✓\x03 Commande RAW gérée par le protocole exécutée."
    target: "\x0304✗\x03 Le protocole actif a rejeté la cible %target%."
    unsupported: "\x0304✗\x03 Le protocole actif ne prend pas en charge cette commande RAW."
    invalid_resource_type: "\x0304✗\x03 Type de ressource de protocole inconnu : %resource_type%."
    invalid_resource: "\x0304✗\x03 Ressource de protocole invalide : %resource%."
    invalid_value: "\x0304✗\x03 Valeur invalide pour la ressource de protocole : %resource%."
    error: "\x0304✗\x03 Le protocole actif n’a pas pu exécuter la commande RAW."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_message:   "%operator% exécute la commande %command% sur %target%. %reason%"
  actionWithDuration: "%operator% exécute la commande %command% sur %target%. Durée : %duration%. %reason%"
  prefix_reason:    "Raison : %reason%"
  prefix_message:   "Message : %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short:            "Gérer les messages MOTD envoyés aux utilisateurs lors de la connexion."
  syntax:           "MOTD {ADD|DEL|LIST|CLEAN} [args]"
  help:             "Gère les entrées Message Of The Day envoyées aux utilisateurs lors de leur connexion au réseau.\n\n"
  example:          "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Bienvenue sur le réseau !"
  unknown_sub:      "\x0304✗\x03 Sous-commande inconnue. Utilisez : \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"
  add:
    syntax:         "MOTD ADD {service|surnom!ident@vhôte} {PRIVMSG|NOTICE} <expiration> <message>"
    syntax_hint:    "\x0304✗\x03 Usage : \x02%syntax%\x02"
    short:          "Ajouter une entrée MOTD."
    help:           "Ajoute un nouveau message MOTD qui sera envoyé à chaque utilisateur lors de sa connexion au réseau.\n\n"
    example:        "/msg %bot% MOTD ADD Network!staff@staff.example.com NOTICE 7d Bienvenue sur le réseau !"
    done:           "\x0303✓\x03 Entrée MOTD n°%id% ajoutée."
    invalid_type:   "\x0304✗\x03 Type de message invalide. Doit être \x02PRIVMSG\x02 ou \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Format d'expiration invalide. Utilisez : \x02<nombre><s|m|h|j>\x02 (ex., 30s, 5m, 24h, 7j)."
  del:
    syntax:         "MOTD DEL <id>"
    syntax_hint:    "\x0304✗\x03 Usage : \x02%syntax%\x02"
    short:          "Supprimer une entrée MOTD."
    help:           "Supprime une entrée MOTD par son ID.\n\n"
    example:        "/msg %bot% MOTD DEL 1"
    done:           "\x0303✓\x03 Entrée MOTD n°%id% supprimée."
    not_found:      "\x0304✗\x03 Entrée MOTD introuvable."
  list:
    syntax:         "MOTD LIST"
    short:          "Lister toutes les entrées MOTD."
    help:           "Liste toutes les entrées MOTD configurées.\n\n"
    example:        "/msg %bot% MOTD LIST"
    empty:          "Aucune entrée MOTD configurée."
    header:         "Entrées MOTD :"
    status_enabled: "\x0303activée\x03"
    status_disabled: "\x0304désactivée\x03"
    expired:        "\x0304expirée\x03"
    no_bot:         "(aucun bot)"
    never:          "jamais"
    shown_count:    "affiché %count% fois"
  clean:
    syntax:         "MOTD CLEAN"
    short:          "Supprimer toutes les entrées MOTD expirées."
    help:           "Supprime toutes les entrées MOTD dont le délai d'expiration est dépassé.\n\n"
    example:        "/msg %bot% MOTD CLEAN"
    done:           "\x0303✓\x03 %count% entrées MOTD expirées supprimées."
    none:           "\x0303✓\x03 Aucune entrée MOTD expirée à supprimer."
  debug:
    finalized:      "Le message MOTD #%id% est terminé : [%type%] %message% | %date% | %shown_count%"

# --- CHANNEL OVERRIDES (shared replies) ------------------------------------------
channel:
  invalid_name:         "\x0304✗\x03 \x02%channel%\x02 n'est pas un nom de salon valide ; il doit commencer par \x02#\x02."
  not_found:            "\x0304✗\x03 Le salon \x02%channel%\x02 n'existe pas sur le réseau."
  user_not_online:      "\x0304✗\x03 Le pseudo \x02%nickname%\x02 n'est pas connecté."
  user_not_on_channel:  "\x0304✗\x03 Le pseudo \x02%nickname%\x02 n'est pas sur \x02%channel%\x02."
  protected_root:       "\x0304✗\x03 Permission refusée : \x02%nickname%\x02 est un utilisateur Root."
  protected_ircop:      "\x0304✗\x03 Permission refusée : \x02%nickname%\x02 est un opérateur IRC."

# --- KICK ------------------------------------------------------------------------
kick:
  syntax:   "KICK <#salon> <pseudo> [raison]"
  short:    "Expulse un utilisateur d'un salon."
  help:     "Expulse un utilisateur d'un salon en tant qu'opérateur réseau.\nUne raison par défaut est utilisée si aucune n'est donnée.\nLes utilisateurs Root et les IRCops ayant un rôle ne peuvent pas être expulsés.\nCette commande nécessite la permission operserv.kick."
  example:  "/msg %bot% KICK #aide BadUser Arrête de flooder"
  done:     "\x0303✓\x03 \x02%nickname%\x02 a été expulsé de \x02%channel%\x02. Raison : %reason%"

# --- OP --------------------------------------------------------------------------
op:
  syntax:   "OP <#salon> <pseudo>"
  short:    "Donne le statut d'opérateur de salon à un utilisateur."
  help:     "Donne le statut d'opérateur (+o) à un utilisateur d'un salon, même si le salon n'est pas enregistré.\nCette commande nécessite la permission operserv.op."
  example:  "/msg %bot% OP #aide Utilisateur"
  done:     "\x0303✓\x03 \x02%nickname%\x02 est maintenant opérateur sur \x02%channel%\x02."

# --- DEOP ------------------------------------------------------------------------
deop:
  syntax:   "DEOP <#salon> <pseudo>"
  short:    "Retire le statut d'opérateur de salon à un utilisateur."
  help:     "Retire le statut d'opérateur (-o) à un utilisateur d'un salon.\nLes utilisateurs Root et les IRCops ayant un rôle ne peuvent pas le perdre.\nCette commande nécessite la permission operserv.op."
  example:  "/msg %bot% DEOP #aide Utilisateur"
  done:     "\x0303✓\x03 \x02%nickname%\x02 n'est plus opérateur sur \x02%channel%\x02."

# --- MODE ------------------------------------------------------------------------
mode:
  syntax:         "MODE <#salon> <modes> [arguments]"
  short:          "Définit des modes sur un salon."
  help:           "Définit les modes indiqués sur un salon, suivis de leurs arguments si nécessaire.\nLes modes doivent commencer par + ou -.\nCette commande nécessite la permission operserv.mode."
  example:        "/msg %bot% MODE #aide +mk secret"
  done:           "\x0303✓\x03 Les modes de \x02%channel%\x02 sont définis à \x02%modes%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 n'est pas un changement de modes valide. Utilisez +modes ou -modes."

# --- LIMPIA ----------------------------------------------------------------------
limpia:
  syntax:   "LIMPIA <#salon>"
  short:    "Retire les modes restrictifs d'un salon."
  help:     "Retire les modes -imnpst d'un salon pour le débloquer.\nLes clés (+k) et les limites (+l) ne sont pas modifiées.\nCette commande nécessite la permission operserv.mode."
  example:  "/msg %bot% LIMPIA #aide"
  done:     "\x0303✓\x03 Le salon \x02%channel%\x02 a été nettoyé (modes %modes%)."

# --- INVITE ----------------------------------------------------------------------
invite:
  syntax:              "INVITE <#salon>"
  short:               "Vous invite sur un salon."
  help:                "Vous invite sur le salon indiqué, même s'il est sur invitation uniquement (+i).\nCette commande nécessite la permission operserv.invite."
  example:             "/msg %bot% INVITE #aide"
  done:                "\x0303✓\x03 Invitation pour \x02%channel%\x02 envoyée."
  already_on_channel:  "\x0304✗\x03 Vous êtes déjà sur \x02%channel%\x02."

# --- STATS -----------------------------------------------------------------------
stats:
  syntax:   "STATS"
  short:    "Afficher les statistiques du réseau."
  help:     "Affiche le nombre d'utilisateurs actuellement connectés au réseau.\nDisponible pour tous les opérateurs IRC."
  example:  "/msg %bot% STATS"
  users:    "\x0310ℹ\x03 Utilisateurs en ligne : \x02%count%\x02"

# --- IRCOPS ----------------------------------------------------------------------
ircops:
  syntax:   "IRCOPS"
  short:    "Lister les opérateurs IRC connectés."
  help:     "Liste, par pseudo, les opérateurs IRC actuellement connectés au réseau.\nDisponible pour tous les opérateurs IRC."
  example:  "/msg %bot% IRCOPS"
  header:   "\x02Opérateurs IRC connectés (%count%) :\x02"
  entry:    "  \x0310›\x03 \x02%nickname%\x02"
  footer:   "Fin de la liste."
  empty:    "\x0310ℹ\x03 Aucun opérateur IRC n'est connecté."

# --- LISTCLONES ------------------------------------------------------------------
listclones:
  syntax:   "LISTCLONES <pseudo>"
  short:    "Lister les clones d'un pseudo."
  help:     "Affiche l'hôte depuis lequel un pseudo est connecté et les autres pseudos connectés depuis le même hôte.\nLes connexions sont regroupées par IP réelle lorsqu'elle est connue, sinon par nom d'hôte.\nCette commande requiert la permission operserv.clones."
  example:  "/msg %bot% LISTCLONES BadUser"
  header:   "Clones de \x02%nickname%\x02 (\x02%host%\x02), %count% connexions :"
  entry:    "  \x0310›\x03 \x02%nickname%\x02 (%ident%)"
  footer:   "Fin de la liste."
  none:     "\x0310ℹ\x03 \x02%nickname%\x02 n'a pas de clones (%host%)."

# --- KILLCLONES ------------------------------------------------------------------
killclones:
  syntax:   "KILLCLONES <pseudo> [raison]"
  short:    "Supprimer les clones d'un pseudo avec une G-Line d'1 heure."
  help:     "Pose une G-Line d'1 heure sur *@hôte du pseudo indiqué, ce qui déconnecte toutes les connexions de cet hôte.\nLa G-Line apparaît dans GLINE LIST et peut être retirée avec GLINE DEL.\nLocalhost et les hôtes partagés avec des utilisateurs Root ou des IRCops ayant un rôle ne reçoivent jamais de G-Line.\nCette commande requiert la permission operserv.clones."
  example:  "/msg %bot% KILLCLONES BadUser Les clones ne sont pas autorisés"
  done:     "\x0303✓\x03 Les clones de \x02%nickname%\x02 ont été supprimés : G-Line \x02%mask%\x02 pour %duration% (%count% connexions). Raison : %reason%"

# --- BLOCK -----------------------------------------------------------------------
block:
  syntax:   "BLOCK <pseudo> [raison]"
  short:    "Bloquer l'hôte d'un pseudo avec une G-Line de 5 heures."
  help:     "Pose une G-Line de 5 heures sur *@hôte du pseudo indiqué, ce qui déconnecte toutes les connexions de cet hôte.\nLa G-Line apparaît dans GLINE LIST et peut être retirée avec GLINE DEL.\nLocalhost et les hôtes partagés avec des utilisateurs Root ou des IRCops ayant un rôle ne reçoivent jamais de G-Line.\nCette commande requiert la permission operserv.clones."
  example:  "/msg %bot% BLOCK BadUser Spam"
  done:     "\x0303✓\x03 \x02%nickname%\x02 a été bloqué : G-Line \x02%mask%\x02 pour %duration% (%count% connexions). Raison : %reason%"

# --- CLONE BANS (shared replies) -------------------------------------------------
clones:
  loopback_host:  "\x0304✗\x03 Permission refusée : \x02%host%\x02 est un hôte local et ne reçoit jamais de G-Line."
  failed:         "\x0304✗\x03 La G-Line \x02%mask%\x02 n'a pas pu être appliquée."

# --- CONEXIONES ------------------------------------------------------------------
conexiones:
  syntax:   "CONEXIONES {LIST|VIEW} <minimum|hôte>"
  short:    "Afficher les connexions simultanées par IP."
  help:     "Affiche combien de connexions simultanées sont actives depuis chaque IP (ou nom d'hôte si l'IP est inconnue).\nCette commande requiert la permission operserv.conexiones."
  example:  "/msg %bot% CONEXIONES LIST 3"
  list:
    short:            "Lister les IP ayant au moins <minimum> connexions."
    help:             "Liste les IP ayant au moins <minimum> connexions simultanées actives, de la plus chargée à la moins chargée.\nLe minimum doit être un entier supérieur à 1."
    syntax:           "CONEXIONES LIST <minimum>"
    example:          "/msg %bot% CONEXIONES LIST 3"
    header:           "IP ayant au moins \x02%minimum%\x02 connexions simultanées actives :"
    entry:            "  \x0310›\x03 \x02%count%\x02 — %host%"
    footer:           "Fin de la liste."
    empty:            "\x0310ℹ\x03 Aucune IP n'a au moins \x02%minimum%\x02 connexions simultanées."
    invalid_minimum:  "\x0304✗\x03 Minimum invalide : il doit être un entier supérieur à 1."
  view:
    short:      "Afficher les connexions d'une IP."
    help:       "Affiche combien de connexions simultanées sont actives depuis une IP ou un nom d'hôte."
    syntax:     "CONEXIONES VIEW <hôte>"
    example:    "/msg %bot% CONEXIONES VIEW 192.0.2.10"
    result:     "\x0310ℹ\x03 Connexions simultanées actives de \x02%host%\x02 : \x02%count%\x02."
    not_found:  "\x0304✗\x03 Aucune connexion trouvée pour \x02%host%\x02."

# --- UMODE -----------------------------------------------------------------------
umode:
  syntax:         "UMODE <pseudo> <+/-modes>"
  short:          "Modifie les modes utilisateur d'un pseudo."
  help:           "Ajoute ou retire des modes utilisateur à un pseudo connecté.\nTu ne peux utiliser que les modes de ton rang ou inférieurs : tout IRCop les modes utilisateur, un Opérateur aussi s et W, un Administrateur aussi H, q et o ; Root, n'importe lequel.\nLes modes r et h ne peuvent être ni ajoutés ni retirés.\nCette commande nécessite la permission operserv.umode."
  example:        "/msg %bot% UMODE Utilisateur +R"
  done:           "\x0303✓\x03 Modes \x02%modes%\x02 appliqués à \x02%nickname%\x02."
  invalid_modes:  "\x0304✗\x03 \x02%modes%\x02 n'est pas un changement de modes valide. Utilise +modes ou -modes."
  forbidden:      "\x0304✗\x03 Tu ne peux ni ajouter ni retirer les modes r et h."
  above_rank:     "\x0304✗\x03 Ton rang ne te permet pas d'utiliser les modes \x02%modes%\x02."

# --- JAIL ------------------------------------------------------------------------
jail:
  syntax:   "JAIL <pseudo>"
  short:    "Emprisonne un utilisateur dans le salon prison."
  help:     "Retire un utilisateur de tous ses salons et le place dans le salon prison (%channel%).\nTant qu'il est emprisonné, il est retiré de tout autre salon et remis en prison s'il en sort.\nIl est libéré avec UNJAIL ou à sa déconnexion.\nLes utilisateurs Root et les IRCops avec rôle ne peuvent pas être emprisonnés.\nCette commande nécessite la permission operserv.jail."
  example:  "/msg %bot% JAIL Utilisateur"
  done:     "\x0303✓\x03 \x02%nickname%\x02 a été emprisonné dans \x02%channel%\x02."
  already:  "\x0304✗\x03 \x02%nickname%\x02 est déjà emprisonné."

# --- UNJAIL ----------------------------------------------------------------------
unjail:
  syntax:      "UNJAIL <pseudo>"
  short:       "Libère un utilisateur emprisonné."
  help:        "Libère un utilisateur emprisonné avec JAIL : il peut de nouveau rejoindre n'importe quel salon.\nCette commande nécessite la permission operserv.jail."
  example:     "/msg %bot% UNJAIL Utilisateur"
  done:        "\x0303✓\x03 \x02%nickname%\x02 a été libéré de \x02%channel%\x02."
  not_jailed:  "\x0304✗\x03 \x02%nickname%\x02 n'est pas emprisonné."

# --- ELINE -----------------------------------------------------------------------
eline:
  syntax:          "ELINE {ADD|DEL|LIST|VIEW|COUNT|CLEAR} ..."
  short:           "Gère les exceptions de ban par IP (E-Lines)."
  help:            "Les E-Lines exemptent une IP des bans du réseau (G-Lines, Z-Lines, shun, limite de connexions par IP, listes noires...). Utile pour les VPS avec ZNC des IRCops.\nADD en ajoute une, DEL les supprime, LIST et VIEW les affichent et COUNT les compte.\nCette commande nécessite la permission operserv.eline."
  example:         "/msg %bot% ELINE ADD +30d *@203.0.113.10 ZNC IRCops"
  added:           "\x0303✓\x03 E-Line ajoutée pour {B}%mask%{B} (expire : %expiration%)."
  already_exists:  "\x0304✗\x03 Il existe déjà une E-Line pour {B}%mask%{B}."
  invalid_mask:    "\x0304✗\x03 {B}%mask%{B} n'est pas valide : utilise utilisateur@IP ou IP (l'IP peut être une plage CIDR)."
  invalid_expiry:  "\x0304✗\x03 {B}%expiry%{B} n'est pas une expiration valide : utilise +0 (permanente) ou une valeur comme +30d, +12h, +30m."
  deleted:         "\x0303✓\x03 E-Lines supprimées : {B}%masks%{B}."
  not_found:       "\x0304✗\x03 Il n'y a aucune E-Line {B}%item%{B}."
  never_expires:   "jamais"
  add:
    syntax:   "ELINE ADD [+expiration] <utilisateur@IP|IP> <raison>"
    short:    "Ajoute une E-Line."
    help:     "Ajoute une exception de ban pour une IP ou une plage CIDR, éventuellement avec une expiration (+30d, +12h, +30m ; sans, elle est permanente). Sans utilisateur, * est utilisé."
    example:  "/msg %bot% ELINE ADD +30d 203.0.113.10 ZNC IRCops"
  del:
    syntax:   "ELINE DEL <masque|numéro|liste>"
    short:    "Supprime des E-Lines."
    help:     "Supprime une E-Line par son masque, par son numéro dans LIST ou par une liste de numéros et de plages (1,3-5)."
    example:  "/msg %bot% ELINE DEL 1,3-5"
  list:
    syntax:   "ELINE LIST"
    short:    "Liste les E-Lines."
    help:     "Affiche les E-Lines actives, numérotées, avec leur expiration."
    example:  "/msg %bot% ELINE LIST"
    header:   "\x0307---\x03 \x02E-Lines (%count%)\x02 \x0307---\x03"
    entry:    "  \x02%number%.\x02 %mask% \x0314(expire : %expiration%)\x03"
    empty:    "Il n'y a aucune E-Line active."
  view:
    syntax:   "ELINE VIEW"
    short:    "Affiche les E-Lines en détail."
    help:     "Affiche les E-Lines actives avec qui les a posées, quand, leur expiration et la raison."
    example:  "/msg %bot% ELINE VIEW"
    entry:    "  \x02%number%.\x02 %mask% \x0314posée par %setby% le %created%, expire : %expiration% - %reason%\x03"
  count:
    syntax:   "ELINE COUNT"
    short:    "Compte les E-Lines."
    help:     "Indique combien d'E-Lines sont actives."
    example:  "/msg %bot% ELINE COUNT"
    result:   "Il y a {B}%count%{B} E-Lines actives."
  clear:
    syntax:   "ELINE CLEAR"
    short:    "Supprime toutes les E-Lines."
    help:     "Supprime d'un coup toutes les E-Lines actives, des services et de l'IRCd."
    example:  "/msg %bot% ELINE CLEAR"
    done:     "\x0303✓\x03 \x02%count%\x02 E-Lines supprimées."
