# NickServ translations — Español
# Domain: nickserv
#
# IRC formatting codes (inside double-quoted strings, use \x## hex escapes):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=verde, 04=rojo, 07=naranja, 14=gris oscuro)
#   \x03        reset color
#   \x0F        reset all formatting
#
# NOTA: Los colores IRC usan números DECIMALES (0-15), no hexadecimales.
#   \x0314 = gris oscuro (14 decimal)  ← CORRECTO
#   \x030F = color 0 + letra "F"       ← ERROR (0F es hex, no decimal)

unknown_command: "\x0304✗\x03 Comando desconocido \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."

error:
  syntax:            "\x0304✗\x03 Sintaxis incorrecta. Uso: \x02%syntax%\x02"
  oper_only:         "\x0304✗\x03 Este comando está restringido a Operadores IRC."
  not_identified:    "\x0304✗\x03 No estás identificado. Usa \x0303/msg %bot% IDENTIFY <nick> <contraseña>\x03"
  permission_denied: "\x0304✗\x03 Permiso denegado. No tienes acceso a este comando."
  mail_failed:       "\x0304✗\x03 No se pudo enviar el correo. Comprueba tu dirección o inténtalo más tarde."

# --- REGISTER ---------------------------------------------------------------
register:
  syntax:           "REGISTER <contraseña> <email>"
  short:            "Registra tu nick en los servicios."
  help:             "Inicia el registro de tu nick actual. Se enviará un token de verificación\nal correo indicado. El registro se completará cuando ejecutes\n\x0303/msg %bot% VERIFY <token>\x03. El token expira en 1 hora.\nSi no te llega, revisa la carpeta de spam o usa \x0303RESEND\x03."
  example:          "/msg %bot% REGISTER s3cret ana@example.com"
  pending:          "\x0307→\x03 Se ha enviado un token de verificación a \x02%email%\x02.\n  Ejecuta \x0303/msg %bot% VERIFY <token>\x03 para completar el registro.\n  ¿No te llega? Revisa spam o usa \x0303/msg %bot% RESEND\x03\n  El token expirará en \x021 hora\x02."
  registered:       "\x0303✔\x03 El nick \x02%nickname%\x02 ha sido registrado."
  already_registered: "\x0304✗\x03 El nick \x02%nickname%\x02 ya está registrado."
  already_pending:  "\x0304✗\x03 El nick \x02%nickname%\x02 ya tiene un registro pendiente de verificación.\n  Usa \x0303/msg %bot% VERIFY <token>\x03 o \x0303/msg %bot% RESEND\x03."
  forbidden:        "\x0304✗\x03 El nick \x02%nickname%\x02 no puede ser registrado en esta red."
  pending_deletion: "\x0304✗\x03 El nick \x02%nickname%\x02 está pendiente de eliminación y no puede ser registrado."
  invalid_email:    "\x0304✗\x03 La dirección de correo electrónico no es válida."
  email_domain_blocked: "\x0304✗\x03 El dominio de correo \x02%domain%\x02 no está permitido para el registro."
  email_already_used: "\x0304✗\x03 El correo \x02%email%\x02 ya está en uso por el máximo de \x02%max%\x02 nicks. Usa otra dirección."
  throttled:          "\x0304✗\x03 Debes esperar \x02%minutes%\x02 minuto(s) antes de intentar registrar de nuevo."
  guest_prefix_forbidden: "\x0304✗\x03 No puedes registrar un nick que empiece por \x02%prefix%\x02."

# --- VERIFY -----------------------------------------------------------------
verify:
  syntax:           "VERIFY <token>"
  short:            "Confirma tu dirección de email y activa tu nick."
  help:             "Completa el registro verificando el token enviado a tu correo.\nEl token tiene una validez de 1 hora desde el momento del registro."
  example:          "/msg %bot% VERIFY 4XZ9KQ2M"
  success:          "\x0303✔\x03 El nick \x02%nickname%\x02 ha sido registrado y ya estás identificado."
  success_native:   "\x0303✔\x03 El nick \x02%nickname%\x02 ha sido registrado correctamente. Usa la autenticación nativa que se muestra a continuación."
  invalid_token:    "\x0304✗\x03 El token no es válido o ha expirado. Usa \x0303/msg %bot% REGISTER\x03 para iniciar el proceso de nuevo."
  no_pending:       "\x0304✗\x03 No tienes ningún registro pendiente de verificación."

# --- RESEND -----------------------------------------------------------------
resend:
  syntax:           "RESEND"
  short:            "Reenvía el token de verificación a tu correo."
  help:             "Reenvía el token de verificación a la dirección de correo indicada\ndurante el registro. Solo funciona si tienes un registro pendiente."
  example:          "/msg %bot% RESEND"
  success:          "\x0307→\x03 Token de verificación reenviado a \x02%email%\x02."
  no_pending:       "\x0304✗\x03 No tienes ningún registro pendiente de verificación."
  throttled:        "\x0304✗\x03 Debes esperar \x02%minutes%\x02 minuto(s) antes de solicitar otro correo de verificación."

# --- RECOVER -----------------------------------------------------------------
recover:
  syntax:           "RECOVER <nick> [token]"
  short:            "Recupera tu nick si has perdido la contraseña."
  help:             "Recupera el acceso a un nick registrado cuando has perdido la contraseña.\n1) \x0303RECOVER <nick>\x03 — se envía un token al correo del nick.\n2) \x0303RECOVER <nick> <token>\x03 — introduce el token del correo para restablecer la contraseña.\nRecibirás una contraseña temporal y el comando para cambiarla."
  example:          "/msg %bot% RECOVER nick"
  email_sent:       "\x0307→\x03 Se ha enviado un token de recuperación a \x02%email_hint%\x02. Revisa tu bandeja (y la de spam)."
  not_registered:   "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  pending:          "\x0304✗\x03 El nick \x02%nickname%\x02 está pendiente de verificación de email."
  suspended:        "\x0304✗\x03 El nick \x02%nickname%\x02 está suspendido. Razón: %reason%"
  forbidden:        "\x0304✗\x03 El nick \x02%nickname%\x02 no puede usarse en esta red."
  no_email:         "\x0304✗\x03 No hay email configurado para el nick \x02%nickname%\x02. La recuperación no está disponible."
  throttled:        "\x0304✗\x03 Debes esperar \x02%minutes%\x02 minuto(s) antes de solicitar otro correo de recuperación."
  invalid_token:    "\x0304✗\x03 El token no es válido o ha expirado. Solicita uno nuevo con \x0303RECOVER %nickname%\x03."
  success_identify: "\x0303✔\x03 Contraseña restablecida. Identifícate ahora: \x0303%identify_cmd%\x03"
  success_then_change: "Luego cambia tu contraseña: \x0303/msg %bot% SET PASSWORD <nueva_contraseña>\x03"

# --- IDENTIFY ---------------------------------------------------------------
identify:
  syntax:           "IDENTIFY <nick> <contraseña>"
  short:            "Acredita tu identidad como dueño de un nick."
  help:             "Autentica tu sesión con %nickserv% indicando tu nick y contraseña.\nTras identificarte recibirás el modo registrado \x02+r\x02 y, si estabas usando\nun nick de invitado, recuperarás tu nick registrado automáticamente."
  example:          "/msg %bot% IDENTIFY nick s3cret"
  native_syntax:    "/NICK <nick>:<contraseña> | /NICK <nick>!<contraseña>"
  native_short:     "Muestra la sintaxis de autenticación nativa por cambio de nick."
  native_help:      "Este protocolo autentica las cuentas mediante cambios de nick.\nUsa /NICK <nick>:<contraseña> o, si el nick está ocupado, /NICK <nick>!<contraseña>."
  native_authentication: "\x0307ℹ\x03 Este protocolo gestiona la autenticación mediante cambios de nick. Usa \x0303/NICK <nick>:<contraseña>\x03 o, si el nick está ocupado, \x0303/NICK <nick>!<contraseña>\x03."
  success:          "\x0303✔\x03 Ahora estás identificado como \x02%nickname%\x02."
  already_identified: "\x0307ℹ\x03 Ya estás identificado como \x02%nickname%\x02."
  not_registered:   "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  invalid_credentials: "\x0304✗\x03 Contraseña incorrecta. Inténtalo de nuevo."
  locked_out:         "\x0304✗\x03 Demasiados intentos fallidos. Intenta de nuevo en \x02%minutes%\x02 minuto(s)."
  ghost_released:   "\x0307⚡\x03 La sesión fantasma que ocupaba \x02%nickname%\x02 ha sido desconectada."
  kill_reason:      "Nick %nickname% reclamado por %source% (el propietario registrado se ha identificado)"
  pending:          "\x0304✗\x03 El nick \x02%nickname%\x02 está pendiente de verificación de email.\n  Ejecuta \x0303/msg %bot% VERIFY <token>\x03 o \x0303/msg %bot% RESEND\x03."
  suspended:        "\x0304✗\x03 El nick \x02%nickname%\x02 está suspendido. Razón: %reason%"
  forbidden:        "\x0304✗\x03 El nick \x02%nickname%\x02 no puede ser utilizado en esta red."
  pending_deletion: "\x0304✗\x03 El nick \x02%nickname%\x02 está pendiente de eliminación y no puede ser usado."

# --- STATUS -----------------------------------------------------------------
status:
  syntax:           "STATUS <nick>"
  short:            "Muestra el estado de registro de un nick."
  help:             "Muestra el estado actual de un nick: si está registrado,\npendiente de verificación, suspendido o prohibido."
  example:          "/msg %bot% STATUS nick"
  header:           "\x02Estado del nick \x0307%nickname%\x03\x02"
  unregistered:     "  Estado          : Sin registrar"
  not_registered_offline: "  Estado          : \x0315No registrado\x03"
  pending:          "  Estado          : \x0307Pendiente de validación\x03"
  pending_expires:  "  Expira en       : %minutes% minuto(s)"
  pending_expires_at: "  Expira a las    : %date%"
  not_connected:    "  Estado          : \x0315No conectado\x03"
  not_identified:   "  Estado          : \x0307No identificado\x03"
  identified:       "  Estado          : \x0303Identificado\x03"
  suspended:        "  Estado          : \x0304Suspendido\x03"
  suspended_reason: "  Razón           : %reason%"
  suspended_until:  "  Fecha fin       : %date%"
  suspended_permanent: "  Fecha fin       : Permanente"
  forbidden:        "  Estado          : \x0304Prohibido\x03"
  forbidden_reason: "  Razón           : %reason%"
  pending_deletion:   "  \x0314Estado\x03          : \x0307Pendiente de eliminación\x03"
  pending_deletion_at: "  \x0314Eliminado\x03       : %date%"
  footer:           "\x0314─────────────────────────────\x03"

# --- INFO -------------------------------------------------------------------
info:
  syntax:           "INFO <nick>"
  short:            "Muestra la información de un nick registrado."
  help:             "Muestra los datos de registro de un nick: fecha de alta, estado de\nconexión, último mensaje de salida y correo electrónico. El correo solo es\nvisible para el propietario identificado. Con PRIVATE ON solo el dueño y\nlos Operadores IRC pueden ver la información."
  example:          "/msg %bot% INFO nick"
  not_registered:   "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  private:          "\x0304✗\x03 La información del nick \x02%nickname%\x02 es privada."
  header:           "\x02Información del nick \x0307%nickname%\x03\x02"
  status:           "  \x0314Estado\x03                 : %status%"
  status_registered:  "\x0303Registrado\x03"
  status_suspended:   "\x0304Suspendido\x03"
  status_forbidden:   "\x0304Prohibido\x03"
  status_pending_deletion: "\x0307Pendiente de eliminación\x03"
  reason:           "  \x0314Razón\x03                  : %reason%"
  suspended_until:  "  \x0314Fecha fin\x03              : %date%"
  suspended_permanent: "  \x0314Fecha fin\x03              : Permanente"
  registered_at:    "  \x0314Fecha registro\x03         : %date%"
  last_seen_online: "  \x0314Última conexión\x03        : \x0303● CONECTADO AHORA\x03"
  last_seen_at:     "  \x0314Última conexión\x03        : %date%"
  last_seen_never:  "  \x0314Última conexión\x03        : Nunca"
  last_quit:        "  \x0314Último mensaje\x03         : %message%"
  last_connect:     "  \x0314Última conexión desde\x03  : %ip% (%host%)"
  language:         "  \x0314Idioma\x03                 : %language%"
  email:            "  \x0314Correo\x03                 : %email%"
  vhost:            "  \x0314VHost\x03                  : %vhost%"
  no_expire:        "  \x0314Nunca expira\x03           : Sí"
  pending_deletion_at: "  \x0314Eliminado\x03              : %date%"
  pending_deletion_until: "  \x0314Elim. definitiva\x03       : %date%"
  pending_deletion_notice: "  \x0307Este nick está pendiente de eliminación y no puede ser registrado.\x03"
  footer:           "\x0314─────────────────────────────\x03"
  channels_header:  "\x0314\x0ACanales con acceso:\x03"
  channels_entry_founder:   "  %channel% (\x0303Fundador\x03)"
  channels_entry_successor: "  %channel% (\x0303Sucesor\x03)"
  channels_entry_access:    "  %channel% (%level%)"

# --- SET --------------------------------------------------------------------
set:
  syntax:           "SET <opción> <valor>"
  short:            "Cambiar opciones de tu nick."
  help:             "Modifica la configuración de tu nick de %nickserv%.\nDebes estar identificado para usar este comando."
  example:          "/msg %bot% SET PASSWORD n3wpass"
  unknown_option:   "\x0304✗\x03 Opción desconocida \x02%option%\x02. Opciones disponibles: %options%."

  password:
    syntax:         "SET PASSWORD <nueva_contraseña>"
    short:          "Cambia la contraseña de tu nick."
    help:           "Cambia la contraseña de acceso a tu nick. La nueva contraseña entra en\nvigor de inmediato. Elige una contraseña segura de al menos 6 caracteres\nque no uses en otros servicios."
    example:        "/msg %bot% SET PASSWORD nuevopass123"
    success:        "\x0303✔\x03 Tu contraseña ha sido actualizada correctamente."

  email:
    syntax:         "SET EMAIL <nuevo_email> [token]"
    short:          "Cambia el correo electrónico de tu nick (confirmación en dos pasos)."
    help:           "Cambio de correo en dos pasos por seguridad.\n1) \x0303SET EMAIL <nuevo_email>\x03 — se envía un token a tu correo actual.\n2) \x0303SET EMAIL <nuevo_email> <token>\x03 — confirmas con el token recibido.\nEl token expira en 1 hora."
    example:        "/msg %bot% SET EMAIL usuario@ejemplo.com"
    success:        "\x0303✔\x03 Tu correo ha sido actualizado a \x02%email%\x02."
    pending_sent:   "\x0307→\x03 Se ha enviado un token de confirmación a \x02%current_email%\x02.\n  Para confirmar el cambio a \x02%new_email%\x02 ejecuta:\n  \x0303/msg %bot% SET EMAIL %new_email% <token>\x03\n  El token expira en 1 hora."
    invalid_token:  "\x0304✗\x03 El token no es válido o ha expirado. Solicita uno nuevo con \x0303SET EMAIL <nuevo_email>\x03."

  language:
    syntax:         "SET LANGUAGE <código>"
    short:          "Cambia el idioma en el que los servicios se comunican contigo."
    help:           "Cambia el idioma en el que %nickserv% y el resto de servicios se dirigen\na ti. Idiomas disponibles:\n  \x02ca\x02 (catalán)\n  \x02de\x02 (alemán)\n  \x02el\x02 (griego)\n  \x02en\x02 (inglés)\n  \x02es\x02 (español)\n  \x02eu\x02 (euskera)\n  \x02fr\x02 (francés)\n  \x02gl\x02 (gallego)\n  \x02it\x02 (italiano)\n  \x02nl\x02 (holandés)\n  \x02pl\x02 (polaco)\n  \x02pt\x02 (portugués)\n  \x02ro\x02 (rumano)\n  \x02tr\x02 (turco)"
    example:        "/msg %bot% SET LANGUAGE es"
    success:        "\x0303✔\x03 Idioma cambiado a \x02%language%\x02."
    invalid:        "\x0304✗\x03 Idioma no soportado. Idiomas disponibles: %languages%."

  timezone:
    syntax:         "SET TIMEZONE <zona>"
    short:          "Establece la zona horaria para mostrar fechas."
    help:           "Establece la zona horaria con la que %nickserv% muestra las fechas.\nUsa \x02HELP SET TIMEZONE\x02 para el índice de regiones; \x02HELP SET TIMEZONE <región>\x02 (ej. Europe) para las zonas de esa región. Usa \x02OFF\x02 para quitarla."
    example:        "/msg %bot% SET TIMEZONE Europe/Madrid"
    success:        "\x0303✔\x03 Zona horaria establecida en \x02%timezone%\x02. Las fechas se mostrarán en esta zona."
    cleared:        "\x0303✔\x03 Zona horaria quitada. Las fechas usarán la predeterminada de la red."
    invalid:        "\x0304✗\x03 Zona horaria no válida \x02%timezone%\x02. Usa un identificador válido (ej. UTC, Europe/Madrid)."

  private:
    syntax:         "SET PRIVATE {ON|OFF}"
    short:          "Activa o desactiva la privacidad de tu información."
    help:           "Controla la visibilidad de tu información en el comando INFO.\nCon \x02PRIVATE ON\x02 solo tú y los Operadores IRC podrán ver tus datos.\nCon \x02PRIVATE OFF\x02 la información es pública para todos."
    example:        "/msg %bot% SET PRIVATE ON"
    on:             "\x0303✔\x03 La información de tu nick es ahora \x02privada\x02."
    off:            "\x0303✔\x03 La información de tu nick es ahora \x02pública\x02."

  msg:
    syntax:         "SET MSG {ON|OFF}"
    short:          "Usar PRIVMSG (ON) o NOTICE (OFF) para las respuestas de los servicios."
    help:           "Controla cómo %nickserv% y el resto de servicios te envían mensajes.\nCon \x02MSG ON\x02 las respuestas se envían como \x02PRIVMSG\x02 (algunos clientes pueden mostrar notificaciones o respuestas automáticas).\nCon \x02MSG OFF\x02 las respuestas se envían como \x02NOTICE\x02 (por defecto; normalmente sin auto-respuesta)."
    example:        "/msg %bot% SET MSG ON"
    on:             "\x0303✔\x03 Los mensajes de los servicios se enviarán ahora como \x02PRIVMSG\x02."
    off:             "\x0303✔\x03 Los mensajes de los servicios se enviarán ahora como \x02NOTICE\x02."

  vhost:
    syntax:         "SET VHOST [vhost]"
    short:          "Establece o quita tu host virtual (hostname visible)."
    help:           "Establece un hostname personalizado que otros ven cuando estás identificado.\nEjecuta \x02SET VHOST\x02 sin valor para quitarlo. Solo letras (a-z, A-Z), dígitos, guion, guion bajo y punto;\nni guion, guion bajo ni punto al inicio/final de cada bloque; máximo 55 caracteres. Es único por nick."
    example:        "/msg %bot% SET VHOST usuarios.ejemplo.com"
    success:        "\x0303✔\x03 Tu host virtual se ha establecido a \x02%vhost%\x02."
    cleared:        "\x0303✔\x03 Tu host virtual ha sido eliminado."
    invalid:        "\x0304✗\x03 Vhost no válido. Solo letras, dígitos, guion, guion bajo y punto (no al inicio/fin de bloque); máx. 55 caracteres."
    taken:          "\x0304✗\x03 Ese vhost ya está en uso por otro nick."
    forced:         "\x0304✗\x03 Tu vhost está configurado automáticamente y no puede cambiarse con SET VHOST."

# --- SASET (IRCop) --------------------------------------------------------------
saset:
  syntax:           "SASET <nick> <opción> <valor>"
  short:            "Modifica la configuración de otro nick."
  help:             |
    Permite a un IRCop modificar la configuración de un nick registrado.
    El nick objetivo no puede ser un usuario Root, IRCop ni un servicio.

    Opciones disponibles: PASSWORD, EMAIL, LANGUAGE, TIMEZONE, PRIVATE, MSG, VHOST

    SASET PASSWORD: Cambia la contraseña directamente (sin confirmación por email).
    SASET EMAIL: Cambia el correo directamente (sin validación de token).

    Este comando requiere permiso IRCop: nickserv.saset
  example:          "/msg %bot% SASET Usuario PASSWORD nuevopass"
  unknown_option:   "\x0304✗\x03 Opción desconocida \x02%option%\x02. Opciones disponibles: %options%."
  cannot_modify_oper: "\x0304✗\x03 No puedes modificar un nick de Operador IRC."
  changed:          "\x0303✔\x03 %option% de \x02%nickname%\x02 cambiado a \x02%value%\x02."
  changed_hidden:   "\x0303✔\x03 %option% de \x02%nickname%\x02 cambiado."
  cleared:          "\x0303✔\x03 %option% de \x02%nickname%\x02 eliminado."

  password:
    syntax:         "SASET <nick> PASSWORD <nueva_contraseña>"
    short:          "Cambia la contraseña de un nick."
    help:           "Cambia la contraseña de otro nick.\nEl cambio es inmediato."
    example:        "/msg %bot% SASET Usuario PASSWORD nuevopass123"

  email:
    syntax:         "SASET <nick> EMAIL <nuevo_email>"
    short:          "Cambia el correo de un nick."
    help:           "Cambia el correo electrónico de otro nick.\nNo se envía confirmación—el cambio es inmediato."
    example:        "/msg %bot% SASET Usuario EMAIL usuario@ejemplo.com"

  language:
    syntax:         "SASET <nick> LANGUAGE <código>"
    short:          "Cambia el idioma de un nick."
    help:           "Cambia el idioma de otro nick.\nIdiomas disponibles: en (inglés), es (español)."
    example:        "/msg %bot% SASET Usuario LANGUAGE es"

  timezone:
    syntax:         "SASET <nick> TIMEZONE <zona|OFF>"
    short:          "Cambia la zona horaria de un nick."
    help:           "Establece o quita la zona horaria de otro nick.\nUsa OFF para quitarla."
    example:        "/msg %bot% SASET Usuario TIMEZONE Europe/Madrid"

  private:
    syntax:         "SASET <nick> PRIVATE {ON|OFF}"
    short:          "Cambia la privacidad de un nick."
    help:           "Activa o desactiva la privacidad de la información de otro nick."
    example:        "/msg %bot% SASET Usuario PRIVATE ON"

  msg:
    syntax:         "SASET <nick> MSG {ON|OFF}"
    short:          "Cambia la preferencia de mensajes de un nick."
    help:           "Establece si otro nick recibe respuestas como PRIVMSG (ON) o NOTICE (OFF)."
    example:        "/msg %bot% SASET Usuario MSG ON"

  vhost:
    syntax:         "SASET <nick> VHOST [vhost]"
    short:          "Cambia el host virtual de un nick."
    help:           "Establece o quita el host virtual de otro nick.\nEjecuta \x02SASET <nick> VHOST\x02 sin valor para quitarlo."
    example:        "/msg %bot% SASET Usuario VHOST usuarios.ejemplo.com"

# --- HELP -------------------------------------------------------------------
help:
  syntax:           "HELP [comando]"
  short:            "Muestra la ayuda de los comandos de %nickserv%."
  help:             "Muestra la ayuda general de %nickserv% o la información detallada\nde un comando concreto."
  header_title:     "%bot%"
  header:           "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  navigation_marker: "\x0310›\x03\x0F"
  info_marker:       "\x0310ℹ\x03\x0F"
  error_marker:      "\x0307✗\x03\x0F"
  warning_marker:    "\x0304⚠\x03\x0F"
  intro:            "Gestión y protección de nicks."
  intro_expiration: "%marker% %label%: Los nicks que no se utilicen durante más de \x1F\x0304%days% días\x03\x1F se eliminarán automáticamente."
  intro_expiration_label: "NOTA"
