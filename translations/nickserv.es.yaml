# --- Nick Protection --------------------------------------------------------
protection:
  nick_in_use:      "\x0304⚠\x03 El nick \x02%nickname%\x02 está registrado. Serás renombrado si no te identificas."
  renamed_to:       "\x0307→\x03 Has sido renombrado a \x02%guest_nick%\x02. Para recuperar tu nick:\n\x0303/msg %bot% IDENTIFY %nickname% <contraseña>\x03"
  nick_forbidden:   "\x0304✗\x03 El nick \x02%nickname%\x02 está prohibido: %reason%"

# --- IRCop Commands ---------------------------------------------------------
userip:
  syntax:           "USERIP <nick>"
  short:            "Obtiene la dirección IP/Host real del nick."
  help:             |
    Muestra la dirección IP real y el hostname del nick especificado.
    Solo disponible para IRCops con permiso 'nickserv.userip'.

    Este comando muestra información sensible del nick.
    Úsalo con responsabilidad.
  example:          "/msg %bot% USERIP SomeUser"
  not_online:       "\x0304✗\x03 El nick \x02%nickname%\x02 no está conectado."
  result:           "\x0307ℹ\x03 Nick: \x02%nickname%\x02 | IP: \x0307%ip%\x03 | Host: \x0307%host%\x03"

whoip:
  syntax:           "WHOIP <ip>"
  short:            "Busca nicks por la IP de su última conexión identificada."
  help:             |
    Muestra los nicks registrados cuya última conexión identificada utilizó esta dirección IP.
    La dirección guardada puede estar desactualizada.
  example:          "/msg %bot% WHOIP 203.0.113.42"
  empty:            "No hay nicks registrados que coincidan con esta dirección IP."
  header:           "Nicks coincidentes:"

# --- SUSPEND (IRCop) ---------------------------------------------------------
suspend:
  syntax:           "SUSPEND <nick> <duración> <razón>"
  short:            "Suspende un nick."
  help:             |
    Suspende un nick, impidiendo que el propietario se identifique.
    La suspensión puede ser temporal o permanente.

    Formatos de duración: \x0303%d\x03 (días), \x0303%h\x03 (horas), \x0303%m\x03 (minutos) o \x03030\x03 (permanente).

    Los usuarios suspendidos no pueden identificarse con su nick.
    Los operadores IRC y usuarios root no pueden ser suspendidos.
  example:          "/msg %bot% SUSPEND MalUsuario 7d Spam en #ayuda"
  success:            "\x0303✔\x03 El nick \x02%nickname%\x02 ha sido suspendido hasta \x02%duration%\x02."
  already_suspended:  "\x0304✗\x03 El nick \x02%nickname%\x02 ya está suspendido."
  not_registered:     "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  forbidden:          "\x0304✗\x03 El nick \x02%nickname%\x02 está prohibido y no puede suspenderse."
  cannot_suspend_oper: "\x0304✗\x03 No se puede suspender al operador IRC \x02%nickname%\x02."
  cannot_suspend_root: "\x0304✗\x03 No se puede suspender al usuario root \x02%nickname%\x02."
  cannot_suspend_service: "\x0304✗\x03 No se puede suspender el nick de servicio \x02%nickname%\x02."
  invalid_duration:   "\x0304✗\x03 Duración inválida. Usa: \x0303<d><h><m>\x03 (ej: 7d, 12h, 30m) o \x03030\x03 para permanente."
  permanent:          "permanente"

# --- UNSUSPEND (IRCop) -------------------------------------------------------
unsuspend:
  syntax:           "UNSUSPEND <nick>"
  short:            "Quita la suspensión de un nick."
  help:             |
    Quita una suspensión activa de un nick, permitiendo que el propietario se identifique de nuevo.
  example:          "/msg %bot% UNSUSPEND AlgunUsuario"
  success:          "\x0303✔\x03 Se ha levantado la suspensión de \x02%nickname%\x02."
  not_registered:   "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  not_suspended:    "\x0304✗\x03 El nick \x02%nickname%\x02 no está suspendido."

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax:           "RENAME <nick>"
  short:            "Fuerza el cambio de nick de un nick conectado a uno aleatorio."
  help:             |
    Fuerza a un nick conectado a cambiar su nick a uno generado aleatoriamente.
    Útil para hacer cumplir las políticas de la red sin desconectar al usuario.

    El formato del nuevo nick usa el prefijo configurado (%prefix%).

    Este comando requiere permiso de IRCop: nickserv.rename
  example:          "/msg %bot% RENAME Guest-4F21AB"
  not_online:        "\x0304✗\x03 El nick \x02%nickname%\x02 no está conectado."
  cannot_rename_root: "\x0304✗\x03 No se puede renombrar al usuario root \x02%nickname%\x02."
  cannot_rename_oper: "\x0304✗\x03 No se puede renombrar al IRC operator \x02%nickname%\x02."
  cannot_rename_service: "\x0304✗\x03 No se puede renombrar el nick de servicio \x02%nickname%\x02."
  success:           "\x0303✓\x03 El nick \x02%nickname%\x02 ha sido nombrado a \x02%new_nick%\x02."

# --- DROP (IRCop) --------------------------------------------------------------
drop:
  syntax:           "DROP <nick> [FORCE]"
  short:            "Elimina un nick registrado."
  help:             |
    Elimina un nick registrado de la base de datos.
    Esta acción no se puede deshacer.

    Si el usuario está conectado, será renombrado a un nick Guest-.
    Los usuarios root y operadores IRC no pueden ser eliminados.
    No puedes eliminar tu propio nick.

    Este comando requiere permiso de IRCop: nickserv.drop
  example:          "/msg %bot% DROP CuentaAntigua"
  not_registered:     "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  suspended:         "\x0304✗\x03 El nick \x02%nickname%\x02 está suspendido. Desuspende primero."
  forbidden:         "\x0304✗\x03 El nick \x02%nickname%\x02 está prohibido."
  cannot_drop_root:   "\x0304✗\x03 No se puede eliminar al usuario root \x02%nickname%\x02."
  cannot_drop_oper:   "\x0304✗\x03 No se puede eliminar al IRC operator \x02%nickname%\x02."
  cannot_drop_self:    "\x0304✗\x03 No puedes eliminar tu propio nick."
  success:            "\x0303✓\x03 El nick \x02%nickname%\x02 ha sido marcado para eliminación y puede ser restaurado durante el periodo de gracia."
  force_success:      "\x0303✓\x03 El nick \x02%nickname%\x02 ha sido eliminado permanentemente."
  pending_deletion:   "\x0304✗\x03 El nick \x02%nickname%\x02 ya está pendiente de eliminación. Usa DROP <nick> FORCE para eliminarlo permanentemente."
  cannot_drop_service: "\x0304✗\x03 No se puede eliminar el nick de servicio \x02%nickname%\x02."

# --- RESTORE (IRCop) -----------------------------------------------------------
restore:
  syntax:           "RESTORE <nick>"
  short:            "Restaurar un nick pendiente de eliminación."
  help:             "Restaura un nick que fue eliminado manualmente y aún está dentro del periodo de gracia. Requiere permiso IRCop: nickserv.restore."
  example:          "/msg %bot% RESTORE nick"
  success:          "\x0303✓\x03 El nick \x02%nickname%\x02 ha sido restaurado."
  not_registered:   "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  not_pending_deletion: "\x0304✗\x03 El nick \x02%nickname%\x02 no está pendiente de eliminación."

# --- FORBID (IRCop) --------------------------------------------------------------
forbid:
  syntax:           "FORBID <nick> <razón>"
  short:            "Prohíbe permanentemente el uso de un nick."
  help:             |
    Prohíbe el uso de un nick en la red.
    El nick no podrá ser registrado ni usado por nadie.

    Si el nick está registrado, será eliminado primero.
    Si alguien lo está usando, será forzado a cambiar a un nick Guest-.

    Los usuarios root, operadores IRC y nicks de servicio no pueden ser prohibidos.

    Este comando requiere permiso de IRCop: nickserv.forbid
  example:          "/msg %bot% FORBID MalUsuario Violaciones repetidas de política"
  success:            "\x0303✔\x03 El nick \x02%nickname%\x02 ha sido prohibido."
  updated:            "\x0303✔\x03 Se ha actualizado la razón de prohibición para \x02%nickname%\x02."
  reason_required:    "\x0304✗\x03 Debes proporcionar una razón para la prohibición."
  cannot_forbid_root:  "\x0304✗\x03 No se puede prohibir al usuario root \x02%nickname%\x02."
  cannot_forbid_oper:  "\x0304✗\x03 No se puede prohibir al IRC operator \x02%nickname%\x02."
  cannot_forbid_service: "\x0304✗\x03 No se puede prohibir el nick de servicio \x02%nickname%\x02."

# --- UNFORBID (IRCop) ------------------------------------------------------------
unforbid:
  syntax:           "UNFORBID <nick>"
  short:            "Elimina la prohibición de un nick."
  help:             |
    Elimina la prohibición de un nick, permitiendo que pueda usarse nuevamente.

    Este comando requiere permiso de IRCop: nickserv.forbid
  example:          "/msg %bot% UNFORBID AlgunNick"
  success:          "\x0303✔\x03 El nick \x02%nickname%\x02 ya no está prohibido."
  not_forbidden:    "\x0304✗\x03 El nick \x02%nickname%\x02 no está prohibido."

# --- FORBIDVHOST (IRCop) ---------------------------------------------------------
forbidvhost:
  syntax:           "FORBIDVHOST {ADD|DEL|LIST} [patrón]"
  short:            "Gestiona vhosts prohibidos."
  help:             |
    Gestiona patrones que impiden a los usuarios establecer vhosts
    coincidentes vía %bot% SET VHOST.

    Comodines: * coincide con cualquier secuencia, ? coincide con un caracter.
    Un patrón como *.pirata.com bloquea cualquier vhost que termine en .pirata.com

    Este comando requiere permiso de IRCop: nickserv.forbidvhost

    Subcomandos:
      ADD <patrón>    Agregar un patrón prohibido
      DEL <patrón>    Eliminar un patrón prohibido
      LIST            Mostrar todos los patrones prohibidos
  example:          "/msg %bot% FORBIDVHOST ADD *.pirata.com"

  unknown_sub: "\x0304✗\x03 Subcomando desconocido \x02%sub%\x02. Usa ADD, DEL o LIST."

  add:
    syntax:      "FORBIDVHOST ADD <patrón>"
    short:       "Agregar un patrón de vhost prohibido."
    help:        |
      Agrega un patrón a la lista de vhosts prohibidos. Los usuarios no podrán
      establecer vhosts que coincidan con este patrón vía SET VHOST.

      Comodines: * coincide con cualquier secuencia, ? coincide con un caracter.
    example:     "/msg %bot% FORBIDVHOST ADD *.pirata.com"
    done:            "\x0303✓\x03 Patrón de vhost prohibido agregado: \x02%pattern%\x02"
    already_exists:  "\x0304✗\x03 El patrón \x02%pattern%\x02 ya existe."
    invalid:          "\x0304✗\x03 Formato de patrón de vhost inválido."

  del:
    syntax:      "FORBIDVHOST DEL <patrón>"
    short:       "Eliminar un patrón de vhost prohibido."
    help:        |
      Elimina un patrón de la lista de vhosts prohibidos.
    example:     "/msg %bot% FORBIDVHOST DEL *.pirata.com"
    done:        "\x0303✓\x03 Patrón de vhost prohibido eliminado: \x02%pattern%\x02"
    not_found:   "\x0304✗\x03 Patrón \x02%pattern%\x02 no encontrado."

  list:
    short:       "Listar todos los patrones de vhost prohibidos."
    syntax:      "FORBIDVHOST LIST"
    help:        |
      Muestra todos los patrones de vhost prohibidos.
    example:     "/msg %bot% FORBIDVHOST LIST"
    header:      "\x0307ℹ\x03 Patrones de vhost prohibidos (\x02%count%\x02):"
    entry:       "  %index%. \x0304%pattern%\x03 — por %nickname% (%date%)"
    empty:       "\x0307ℹ\x03 No hay patrones de vhost prohibidos."
    unknown_creator: "desconocido"

# --- HISTORY (IRCop) ---------------------------------------------------------
history:
  syntax:           "HISTORY <nick> {ADD|DEL|VIEW|CLEAR}"
  short:            "Ver o gestionar el historial de acciones de un nick."
  help:             |
    Gestiona el historial de acciones de un nick.
    Solo IRCops con permiso 'nickserv.history' pueden usar este comando.

    Acciones registradas automáticamente:
      SUSPEND, UNSUSPEND, SET PASSWORD, SET EMAIL, SASET PASSWORD,
      SASET EMAIL, RECOVER

    Usa VIEW para ver el historial (muestra 3 entradas por defecto).
    Usa VIEW 2 para ver la segunda página.
    Usa VIEW ALL para ver el historial completo.
    Usa ADD para añadir una entrada manual.
    Usa DEL para eliminar una entrada específica por ID.
    Usa CLEAR para eliminar todo el historial.
  example:          "/msg %bot% HISTORY UnNick VIEW"
  not_registered:   "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  unknown_operator: "(desconocido)"

  add:
    syntax:     "HISTORY <nick> ADD <mensaje>"
    short:      "Añadir una entrada manual al historial."
    help:        |
      Añade una entrada manual al historial del nick.
    example:     "/msg %bot% HISTORY UnNick ADD Usuario reportado por spam"
    success:    "\x0303✔\x03 Entrada de historial añadida para \x02%nickname%\x02."

  del:
    syntax:     "HISTORY <nick> DEL <id>"
    short:      "Eliminar una entrada del historial por ID."
    help:        |
      Elimina una entrada específica del historial por su ID.
    example:     "/msg %bot% HISTORY UnNick DEL 42"
    success:    "\x0303✔\x03 Entrada de historial \x02%id%\x02 eliminada."
    not_found:  "\x0304✗\x03 Entrada de historial \x02%id%\x02 no encontrada."
    invalid_id: "\x0304✗\x03 ID de entrada inválido: \x02%id%\x02."

  view:
    syntax:     "HISTORY <nick> VIEW [PÁGINA|ALL]"
    short:      "Ver historial de acciones del nick."
    help:        |
      Muestra el historial de acciones del nick.

      Por defecto muestra 3 entradas a la vez.
      Usa VIEW 2 para ver la segunda página.
      Usa VIEW ALL para ver el historial completo.
    example:     "/msg %bot% HISTORY UnNick VIEW"
    header:     "\x02Historial de \x0307%nickname%\x03\x02 (mostrando %start%-%end% de %total%):"
    entry:       "#%id% [%date%] \x0303%action%\x03 por %operator% — %message%"
    extra:       "  Extra \x0307→\x03 %extra%"
    no_entries:  "\x0307ℹ\x03 No hay entradas de historial para \x02%nickname%\x02."
    page_hint:   "Usa \x0303HISTORY %nickname% VIEW %next_page%\x03 para más entradas."

  clear:
    syntax:     "HISTORY <nick> CLEAR"
    short:      "Eliminar todo el historial de un nick."
    help:        |
      Elimina todas las entradas de historial del nick especificado.
      Esta acción no se puede deshacer.
    example:     "/msg %bot% HISTORY UnNick CLEAR"
    success:    "\x0303✔\x03 Eliminadas \x02%count%\x02 entradas de historial para \x02%nickname%\x02."

# --- Mensajes de historial (usados al ver el historial) ---
history.message:
  unsuspend:                  "Levantada la suspensión"
  password_changed_owner:     "Contraseña cambiada por el propietario"
  password_changed_operator:   "Contraseña cambiada por un operador"
  email_changed_owner:        "Email cambiado de %old_email% a %new_email%"
  email_changed_operator:     "Email cambiado a %new_email% por un operador"
  recover:                    "Contraseña restablecida vía token de email"

# --- Traducciones de campos extra del historial ---
history.extra:
  duration:      "Duración: %value%"
  expires_at:    "Expira: %value%"
  old_email:     "Email anterior: %value%"
  new_email:     "Email nuevo: %value%"
  method:        "Método: %value%"
  ip:            "IP: %value%"
  host:          "Host: %value%"

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax:           "NOEXPIRE <nick> {ON|OFF}"
  short:            "Activa o desactiva la protección de expiración para un nick."
  help:             |
    Controla si un nick expirará por inactividad.
    Con ON, el nick nunca expira independientemente de su última actividad.
    Con OFF, se aplican las reglas normales de expiración.

    Solo los IRCops con permiso 'nickserv.noexpire' pueden usar este comando.
  example:          "/msg %bot% NOEXPIRE UsuarioImportante ON"
  success_on:       "\x0303✔\x03 El nick \x02%nickname%\x02 está ahora protegido contra expiración."
  success_off:      "\x0303✔\x03 El nick \x02%nickname%\x02 expirará normalmente."
  not_registered:   "\x0304✗\x03 El nick \x02%nickname%\x02 no está registrado."
  forbidden:         "\x0304✗\x03 El nick \x02%nickname%\x02 está prohibido."
  suspended:         "\x0304✗\x03 El nick \x02%nickname%\x02 está suspendido."

# --- LIST (IRCOP) ------------------------------------------------------------
list:
  syntax: "LIST <patrón> [página]"
  short: "Lista nicks registrados que coinciden con un patrón."
  help: "Lista los nicks registrados que coinciden con el patrón indicado. El comodín * coincide con cualquier secuencia de caracteres. La página es opcional y empieza en 1."
  example: "/msg %bot% LIST nick*"
  header: "Nick | Registro | Última conexión | IP | Estado"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  page: "Página %page%/%pages% — %total% coincidencias"
  empty: "Ningún nick coincide con el patrón %pattern%."
  status_pending: "Pendiente"
  status_registered: "Registrado"
  status_suspended: "Suspendido"
  status_pending_deletion: "Pendiente de eliminación"
  status_forbidden: "Prohibido"
# --- DEBUG -------------------------------------------------------------------
debug:
  action_message: "%operator% ejecuta el comando %command% sobre %target%. %reason%"
  action_with_option: "%operator% ejecuta el comando %command% sobre %target%. Opción: %option%. %reason%"
  action_with_value: "%operator% ejecuta el comando %command% sobre %target%. Opción: %option%=%value%. %reason%"
  action_duration: "%operator% ejecuta el comando %command% sobre %target%. Duración: %duration%. %reason%"
  prefix_reason: "Razón: %reason%"

saregister:
  syntax:           "SAREGISTER <nick> <contraseña> <email>"
  short:            "Registra un nick en nombre de otro usuario."
  help:             "Registra un nick en nombre de otro usuario. La cuenta se crea ya activa:\nse saltan la verificación por correo y el límite de frecuencia.\nLa dirección sigue validándose y debe estar libre.\nEste comando requiere permiso de operador."
  example:          "/msg %bot% SAREGISTER nick s3cret ana@example.com"
  done:             "\x0303✔\x03 El nick \x02%nickname%\x02 ha sido registrado."

vreg:
  syntax:           "VREG {ON|OFF|STATUS}"
  short:            "Define la política de verificación de correo para el registro de nicks en toda la red."
  help:             "Define la política de toda la red para el registro de nicks.\nON deja cada nick nuevo pendiente hasta que se confirma su token de correo.\nOFF registra los nicks nuevos de inmediato; la dirección se sigue guardando para recuperar la cuenta.\nSTATUS muestra la política actual.\nEste comando requiere el permiso de IRCop nickserv.vreg."
  example:          "/msg %bot% VREG STATUS"
  on:               "\x0303✔\x03 La verificación de correo ahora es \x02obligatoria\x02 para registrarse."
  off:              "\x0303✔\x03 La verificación de correo está ahora \x02desactivada\x02; los nicks se registran de inmediato."
  status_on:        "La verificación de correo está actualmente \x0303activada\x03 para registrarse."
  status_off:       "La verificación de correo está actualmente \x0304desactivada\x03; los nicks se registran de inmediato."
  usage:            "\x0304✗\x03 Acción desconocida. Uso: \x02%syntax%\x02"

blackmail:
  syntax:           "BLACKMAIL {ADD|DEL|LIST} [argument]"
  short:            "Gestiona los dominios de correo bloqueados para el registro de usuarios."
  help:             "Gestiona los dominios de correo en los que se rechaza el registro de nicks de usuario.\nADD añade un dominio, DEL elimina uno por su posición en la lista o vacía toda la lista,\ny LIST muestra las entradas actuales.\nUn dominio bloquea también sus subdominios (ejemplo.com cubre mail.ejemplo.com).\nLa lista solo afecta al registro de usuarios; SAREGISTER (registro forzado por el personal) no se ve afectado.\nEste comando requiere el permiso de IRCop nickserv.blackmail."
  example:          "/msg %bot% BLACKMAIL LIST"
  added:            "\x0303✔\x03 El dominio de correo \x02%domain%\x02 ahora está bloqueado para el registro."
  already_listed:   "\x0307ℹ\x03 El dominio de correo \x02%domain%\x02 ya está bloqueado."
  invalid_domain:   "\x0304✗\x03 Dominio de correo no válido: \x02%domain%\x02."
  removed:          "\x0303✔\x03 El dominio de correo \x02%domain%\x02 se eliminó de la lista de bloqueo."
  removed_all:      "\x0303✔\x03 Se eliminaron \x02%count%\x02 dominios de correo bloqueados."
  not_found:        "\x0304✗\x03 No hay ningún dominio de correo bloqueado en la posición \x02%position%\x02."
  invalid_number:   "\x0304✗\x03 Posición no válida \x02%value%\x02. Usa un número de la lista o ALL."
  list_header:      "\x0307ℹ\x03 Dominios de correo bloqueados (\x02%count%\x02):"
  list_line:        "  \x02%index%.\x02 %domain%"
  list_empty:       "\x0307ℹ\x03 No hay dominios de correo bloqueados."
  list_total:       "\x0307ℹ\x03 Hay \x02%count%\x02 dominios de correo bloqueados. Usa \x02LIST <patrón>\x02 para verlos, por ejemplo \x02LIST *chat*\x02."
  list_no_matches:  "\x0307ℹ\x03 Ningún dominio de correo bloqueado coincide con \x02%pattern%\x02."
  usage:            "\x0304✗\x03 Subcomando desconocido. Uso: \x02%syntax%\x02"
  add:
    syntax:         "BLACKMAIL ADD <dominio>"
    short:          "Bloquea los registros desde un dominio de correo."
    help:           "Añade un dominio de correo a la lista de bloqueo. Se rechaza el registro\nde nicks que usen una dirección de ese dominio.\nEl dominio se recorta y se convierte a minúsculas antes de guardarlo.\nSAREGISTER no se ve afectado."
    example:        "/msg %bot% BLACKMAIL ADD example.com"
  del:
    syntax:         "BLACKMAIL DEL <número|all>"
    short:          "Elimina un dominio de correo bloqueado."
    help:           "Elimina un dominio de la lista de bloqueo por su posición en LIST,\no vacía toda la lista con ALL."
    example:        "/msg %bot% BLACKMAIL DEL 1"
  list:
    syntax:         "BLACKMAIL LIST [patrón]"
    short:          "Lista los dominios de correo bloqueados."
    help:           "Sin patrón muestra cuántos dominios hay bloqueados. Con un patrón (admite * y ?)\nmuestra los dominios que coinciden. Los números mostrados se pueden usar con BLACKMAIL DEL."
    example:        "/msg %bot% BLACKMAIL LIST *chat*"
